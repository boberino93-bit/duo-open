name: Apply Fold7 Gen2 Ownership Batch D

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-gen2-ownership-batch-d.yml"
      - "tools/apply_gen2_ownership_batch_d.py"
      - "GEN2_IMPORT_SUPPORT/APPLY_GEN2_OWNERSHIP_BATCH_D_NOW.txt"

permissions:
  contents: write

concurrency:
  group: apply-fold7-gen2-ownership-batch-d
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tested Batch B production base
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'fun startAnglesSequenced(' app/src/full/java/com/duoopen/shell/ShizukuBridge.kt
          grep -F 'p.writeLong(parsedLine.pollSequence)' app/src/full/java/com/duoopen/shell/DuoShellService.kt
          grep -F 'versionCode = 30' app/build.gradle.kts
          ! grep -Fq 'MIRROR_DISPLAY_V2' app/src/full/java/com/duoopen/shell/ShellProtocol.kt
          ! grep -Fq 'Fold7CoverPanelLease' app/src/full/java/com/duoopen/shell/DuoShellService.kt

      - name: Apply Gen2 ownership integration
        run: python3 tools/apply_gen2_ownership_batch_d.py

      - name: Validate generated ownership diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'MIRROR_DISPLAY_V2 = 14' app/src/full/java/com/duoopen/shell/ShellProtocol.kt
          grep -F 'COVER_PANEL_LEASE_V2 = 15' app/src/full/java/com/duoopen/shell/ShellProtocol.kt
          grep -F 'candidate-failed-preserved-current' app/src/full/java/com/duoopen/shell/DuoShellService.kt
          grep -F 'legacy mirror mutation rejected while V2 session is active' app/src/full/java/com/duoopen/shell/DuoShellService.kt
          grep -F 'stopDisplayMirrorV2(' app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt
          grep -F 'mirrorLeaseCounter.incrementAndGet()' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          grep -F 'prewarmSecondaryDisplayV2' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          grep -F 'requestDisplayPowerInternal' app/src/full/java/com/duoopen/shell/DuoShellService.kt
          grep -F 'versionCode = 31' app/build.gradle.kts
          grep -F 'versionName = "1.3.26-zfold7-gen2-ownership"' app/build.gradle.kts
          ! grep -Fq 'setDisplayPowerMode.*OFF' app/src/full/java/com/duoopen/shell/DuoShellService.kt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build and test ownership integration
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

      - name: Commit tested ownership integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/build.gradle.kts \
            .github/workflows/build-direct-fold7.yml \
            app/src/full/java/com/duoopen/shell/ShellProtocol.kt \
            app/src/full/java/com/duoopen/shell/ShizukuBridge.kt \
            app/src/full/java/com/duoopen/shell/DuoShellService.kt \
            app/src/full/java/com/duoopen/shell/Fold7MirrorLeaseArbiter.kt \
            app/src/full/java/com/duoopen/shell/Fold7CoverPanelLease.kt \
            app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt \
            app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt \
            app/src/test/java/com/duoopen/shell/Fold7MirrorLeaseArbiterTest.kt \
            app/src/test/java/com/duoopen/shell/Fold7CoverPanelLeaseTest.kt
          git diff --cached --quiet && { echo 'No generated changes to commit.'; exit 0; }
          git commit -m "Fold7 1.3.26 Gen2: lease mirror and cover panel ownership"
          git push origin HEAD:main

      - name: Prepare tested APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ownership-build
          APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" ownership-build/DuoOpen-ZFold7-1.3.26-gen2-ownership-debug.apk
          sha256sum ownership-build/DuoOpen-ZFold7-1.3.26-gen2-ownership-debug.apk > ownership-build/APK-SHA256.txt
          {
            echo "version=1.3.26-zfold7-gen2-ownership"
            echo "versionCode=31"
            echo "sourceHead=$(git rev-parse HEAD)"
            echo "mirrorOwnership=session+sequence+lease"
            echo "coverOwnership=shell-lease+pending-release+direct-reset-with-fallback"
          } > ownership-build/BUILD-INFO.txt

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-1.3.26-gen2-ownership
          path: |
            ownership-build/DuoOpen-ZFold7-1.3.26-gen2-ownership-debug.apk
            ownership-build/APK-SHA256.txt
            ownership-build/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
