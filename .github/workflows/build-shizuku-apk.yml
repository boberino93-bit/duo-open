name: Build Z Fold 7 Motion-Gated Cover Power 1.3.16

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Replay last successful Fold7 geometry build
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          previous_commit = "fc41750970a5270274ea1f9ce6502921d40c2581"

          previous_workflow = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{previous_commit}:.github/workflows/build-shizuku-apk.yml",
              ],
              text=True,
          )

          lines = previous_workflow.splitlines()

          wanted_steps = [
              "Replay proven 1.3.11 continuity build",
              "Replace mirror crop with owned pane container",
              "Validate pane-container pass",
              "Switch to AOSP setGeometry and restore bidirectional fold animation",
              "Validate 1.3.13 geometry continuity pass",
              "Graft zfoldduo glass and bidirectional motion behavior",
              "Validate revised 1.3.13 graft",
          ]

          def extract_run_block(step_name: str) -> str:
              step_start = None

              for index, line in enumerate(lines):
                  if line.strip() == f"- name: {step_name}":
                      step_start = index
                      break

              if step_start is None:
                  raise SystemExit(
                      f"Previous workflow step not found: {step_name}"
                  )

              run_line = None

              for index in range(step_start + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  if line.strip() == "run: |":
                      run_line = index
                      break

              if run_line is None:
                  raise SystemExit(
                      f"run: | block not found for: {step_name}"
                  )

              block = []

              for index in range(run_line + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  block.append(line)

              return textwrap.dedent(
                  "\n".join(block)
              )

          for step_name in wanted_steps:
              script = extract_run_block(
                  step_name
              )

              script_path = Path(
                  "/tmp/" +
                  re.sub(
                      r"[^A-Za-z0-9]+",
                      "-",
                      step_name,
                  ).strip("-") +
                  ".sh"
              )

              script_path.write_text(
                  "set -euo pipefail\n" +
                  script +
                  "\n"
              )

              print(
                  f"Replaying proven step: {step_name}"
              )

              subprocess.run(
                  [
                      "bash",
                      str(script_path),
                  ],
                  check=True,
              )
          PY

      - name: Fix Fold7 physical panel handoff
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text()

          def save(path, text):
              Path(path).write_text(text)

          def regex_replace_once(
              path,
              pattern,
              replacement,
              label,
          ):
              text = load(path)

              updated, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=re.S,
              )

              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one match "
                      f"in {path}; got {count}"
                  )

              save(
                  path,
                  updated,
              )

          service_path = (
              "app/src/full/java/com/duoopen/overlay/"
              "FoldOverlayService.kt"
          )

          regex_replace_once(
              service_path,
              r'''    private fun syncMirrorHost\(
                  reason: String,
              \) \{
          .*?
              \}

              private fun safeToReleaseSecondaryPanel\(\): Boolean \{''',
              '''    private fun syncMirrorHost(
                  reason: String,
              ) {
                  if (!mirrorRequested) {
                      return
                  }

                  val displays =
                      displayManager.displays.toList()

                  fun isActive(
                      candidate: Display,
                  ): Boolean =
                      candidate.state != Display.STATE_OFF &&
                          candidate.state != Display.STATE_UNKNOWN

                  fun isInnerPanel(
                      candidate: Display,
                  ): Boolean {
                      val mode =
                          candidate.mode

                      return mode.physicalWidth == 1968 &&
                          mode.physicalHeight == 2184
                  }

                  fun isCoverPanel(
                      candidate: Display,
                  ): Boolean {
                      val mode =
                          candidate.mode

                      return mode.physicalWidth == 1080 &&
                          mode.physicalHeight == 2520
                  }

                  val inner =
                      displays.firstOrNull(
                          ::isInnerPanel
                      )

                  val cover =
                      displays.firstOrNull(
                          ::isCoverPanel
                      )

                  val activeInner =
                      inner?.takeIf(
                          ::isActive
                      )

                  val activeCover =
                      cover?.takeIf(
                          ::isActive
                      )

                  com.duoopen.debug.DuoDiagnostics.event(
                      "live-mirror",
                      "physical-resolve reason=$reason " +
                          "innerLogical=${inner?.displayId} " +
                          "innerMode=${inner?.mode?.physicalWidth}x" +
                          "${inner?.mode?.physicalHeight} " +
                          "innerState=${inner?.state} " +
                          "coverLogical=${cover?.displayId} " +
                          "coverMode=${cover?.mode?.physicalWidth}x" +
                          "${cover?.mode?.physicalHeight} " +
                          "coverState=${cover?.state} " +
                          "defaultLogical=${Display.DEFAULT_DISPLAY} " +
                          "hostLogical=${mirrorHost?.displayId} " +
                          "hostUsable=${mirrorHost?.isUsable == true}",
                  )

                  if (activeCover == null) {
                      _secondaryDisplayStatus.value =
                          "Physical cover is transitioning; " +
                              "retaining the continuity host."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "cover transition; host retained " +
                              "reason=$reason " +
                              "coverLogical=${cover?.displayId}",
                      )

                      return
                  }

                  if (activeInner == null) {
                      _secondaryDisplayStatus.value =
                          "Physical inner display is transitioning; " +
                              "retaining the continuity host."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "inner transition; host retained " +
                              "reason=$reason " +
                              "innerLogical=${inner?.displayId}",
                      )

                      return
                  }

                  if (
                      activeInner.displayId ==
                          activeCover.displayId
                  ) {
                      _secondaryDisplayStatus.value =
                          "Fold7 topology is remapping; " +
                              "waiting for distinct panel routes."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "same-logical-id-after-physical-resolve " +
                              "reason=$reason " +
                              "logical=${activeCover.displayId}",
                      )

                      return
                  }

                  val current =
                      mirrorHost

                  if (
                      current == null ||
                      current.displayId != activeCover.displayId ||
                      !current.isUsable
                  ) {
                      current?.detach()

                      mirrorHost =
                          DisplayMirrorHost(
                              service = this,
                              display = activeCover,
                              scope = scope,
                              onStatus = { message ->
                                  _secondaryDisplayStatus.value =
                                      message
                              },
                          ).also {
                              it.attach()
                          }

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "physical cover host rebound " +
                              "reason=$reason " +
                              "innerLogical=${activeInner.displayId} " +
                              "coverLogical=${activeCover.displayId} " +
                              "coverIsDefault=" +
                              (
                                  activeCover.displayId ==
                                      Display.DEFAULT_DISPLAY
                              ),
                      )

                      return
                  }

                  current.refresh(
                      "physical-stable:$reason"
                  )
              }

              private fun safeToReleaseSecondaryPanel(): Boolean {''',
              "FoldOverlayService physical Fold7 handoff",
          )

          gradle_path = Path(
              "app/build.gradle.kts"
          )

          gradle = gradle_path.read_text()

          if "versionCode = 18" not in gradle:
              raise SystemExit(
                  "Expected geometry-glass versionCode 18 was not found."
              )

          if (
              'versionName = "1.3.13r-zfold7-geometry-glass"'
              not in gradle
          ):
              raise SystemExit(
                  "Expected geometry-glass versionName was not found."
              )

          gradle = gradle.replace(
              "versionCode = 18",
              "versionCode = 19",
              1,
          )

          gradle = gradle.replace(
              'versionName = "1.3.13r-zfold7-geometry-glass"',
              'versionName = "1.3.15-zfold7-physical-handoff"',
              1,
          )

          gradle_path.write_text(
              gradle
          )
          PY

      - name: Validate Fold7 physical handoff source
        run: |
          set -euo pipefail

          SERVICE="app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt"
          HOST="app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt"
          GRADLE="app/build.gradle.kts"

          git diff --check

          grep -F \
            'physical-resolve reason=' \
            "$SERVICE"

          grep -F \
            'physical cover host rebound' \
            "$SERVICE"

          grep -F \
            'coverIsDefault=' \
            "$SERVICE"

          grep -F \
            'mode.physicalWidth == INNER_WIDTH' \
            "$HOST"

          grep -F \
            'mode.physicalHeight == INNER_HEIGHT' \
            "$HOST"

          grep -F \
            '1.3.15-zfold7-physical-handoff' \
            "$GRADLE"

          if grep -F \
            'coverIsNativePrimary' \
            "$SERVICE"
          then
            echo \
              "ERROR: old logical-default-display teardown path remains."
            exit 1
          fi

          if grep -F \
            'Native cover is primary; temporary geometry mirror released.' \
            "$SERVICE"
          then
            echo \
              "ERROR: old native-cover mirror teardown remains."
            exit 1
          fi

          mkdir -p \
            zfold7-artifacts

          git diff > \
            zfold7-artifacts/zfold7-physical-handoff.patch

          git diff --stat


      - name: Add motion-gated cover power hold
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          def load(path):
              return Path(path).read_text()

          def save(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new, label):
              text = load(path)
              if old not in text:
                  raise SystemExit(
                      f"{label}: expected source not found in {path}"
                  )
              save(path, text.replace(old, new, 1))

          def insert_before_once(path, marker, addition, label):
              text = load(path)
              if marker not in text:
                  raise SystemExit(
                      f"{label}: marker not found in {path}"
                  )
              save(path, text.replace(marker, addition + marker, 1))

          protocol_path = (
              "app/src/full/java/com/duoopen/shell/"
              "ShellProtocol.kt"
          )

          replace_once(
              protocol_path,
              """    const val MIRROR_DISPLAY = 9
          """,
              """    const val MIRROR_DISPLAY = 9

              /**
               * Request an explicit power state for the current logical route
               * to a physical display. Kept behind the Shizuku shell service
               * because MANAGE_DISPLAYS is privileged.
               */
              const val REQUEST_DISPLAY_POWER = 10
          """,
              "ShellProtocol display power command",
          )

          shell_path = (
              "app/src/full/java/com/duoopen/shell/"
              "DuoShellService.kt"
          )

          insert_before_once(
              shell_path,
              """            else -> return super.onTransact(code, data, reply, flags)""",
              """            ShellProtocol.REQUEST_DISPLAY_POWER -> {
                          val displayId =
                              data.readInt()

                          val requestedState =
                              data.readInt()

                          val identity =
                              clearCallingIdentity()

                          val result =
                              try {
                                  val routeEnabled =
                                      if (
                                          requestedState ==
                                              android.view.Display.STATE_ON
                                      ) {
                                          runCatching {
                                              enableConnectedDisplayInternal(
                                                  displayId
                                              )
                                          }.isSuccess
                                      } else {
                                          false
                                      }

                                  val powered =
                                      requestDisplayPowerInternal(
                                          displayId,
                                          requestedState,
                                      )

                                  Bundle().apply {
                                      putBoolean(
                                          "ok",
                                          powered,
                                      )
                                      putBoolean(
                                          "routeEnabled",
                                          routeEnabled,
                                      )
                                      putInt(
                                          "displayId",
                                          displayId,
                                      )
                                      putInt(
                                          "requestedState",
                                          requestedState,
                                      )
                                  }
                              } catch (t: Throwable) {
                                  var root: Throwable = t

                                  while (root.cause != null) {
                                      root =
                                          root.cause!!
                                  }

                                  Bundle().apply {
                                      putBoolean(
                                          "ok",
                                          false,
                                      )
                                      putInt(
                                          "displayId",
                                          displayId,
                                      )
                                      putInt(
                                          "requestedState",
                                          requestedState,
                                      )
                                      putString(
                                          "error",
                                          "${root.javaClass.simpleName}: ${root.message}",
                                      )
                                  }
                              } finally {
                                  restoreCallingIdentity(
                                      identity
                                  )
                              }

                          out.writeNoException()
                          out.writeBundle(result)
                      }

          """,
              "DuoShellService display power transaction",
          )

          insert_before_once(
              shell_path,
              """    // ---- capture -----------------------------------------------------------
          """,
              """    private fun displayManagerService(): Any =
                  systemService(
                      "display",
                      "android.hardware.display.IDisplayManager\\$Stub",
                  )

              private fun enableConnectedDisplayInternal(
                  displayId: Int,
              ) {
                  val dm =
                      displayManagerService()

                  Class.forName(
                      "android.hardware.display.IDisplayManager"
                  ).getMethod(
                      "enableConnectedDisplay",
                      Integer.TYPE,
                  ).invoke(
                      dm,
                      displayId,
                  )
              }

              private fun requestDisplayPowerInternal(
                  displayId: Int,
                  requestedState: Int,
              ): Boolean {
                  val dm =
                      displayManagerService()

                  val method =
                      Class.forName(
                          "android.hardware.display.IDisplayManager"
                      ).getMethod(
                          "requestDisplayPower",
                          Integer.TYPE,
                          Integer.TYPE,
                      )

                  return (
                      method.invoke(
                          dm,
                          displayId,
                          requestedState,
                      ) as? Boolean
                      ) == true
              }

          """,
              "DuoShellService requestDisplayPower helper",
          )

          replace_once(
              shell_path,
              '        val target =\n            foldDisplays.firstOrNull { (id, _, _) ->\n                id != 0\n            }\n\n        if (target == null) {\n            return Bundle().apply {\n                putBoolean("ok", false)\n                putInt("targetDisplayId", -1)\n                putString(\n                    "error",\n                    "No non-zero Fold7 internal display was found.",\n                )\n',
              """                  val target =
                      foldDisplays.firstOrNull { (_, width, height) ->
                          width == 1080 &&
                              height == 2520
                      }

                  if (target == null) {
                      return Bundle().apply {
                          putBoolean("ok", false)
                          putInt("targetDisplayId", -1)
                          putString(
                              "error",
                              "The physical Fold7 cover route (1080x2520) was not found.",
                          )
          """,
              "DuoShellService physical cover target",
          )

          replace_once(
              shell_path,
              '"cmd display disable-display $targetId"',
              '"cmd display power-reset $targetId"',
              "DuoShellService safe cover release",
          )

          replace_once(
              shell_path,
              '        val commandOutput =\n            runProbe(command)\n\n        Thread.sleep(600L)\n',
              """                  val commandOutput =
                      runProbe(command)

                  val immediatePowerOn =
                      if (enable) {
                          Thread.sleep(40L)

                          runCatching {
                              requestDisplayPowerInternal(
                                  targetId,
                                  android.view.Display.STATE_ON,
                              )
                          }.getOrDefault(false)
                      } else {
                          false
                      }

                  Thread.sleep(600L)
          """,
              "DuoShellService immediate cover power assertion",
          )

          replace_once(
              shell_path,
              '            putBoolean("visibleAfter", visibleAfter)\n            putString("command", command)\n',
              """                      putBoolean("visibleAfter", visibleAfter)
                      putBoolean("immediatePowerOn", immediatePowerOn)
                      putString("command", command)
          """,
              "DuoShellService immediate power telemetry",
          )

          bridge_path = (
              "app/src/full/java/com/duoopen/shell/"
              "ShizukuBridge.kt"
          )

          replace_once(
              bridge_path,
              """    fun stopDisplayMirror(): Bundle? =
                  call(
                      ShellProtocol.MIRROR_DISPLAY
                  ) { parcel ->
                      parcel.writeInt(0)
                  }
          """,
              """    fun stopDisplayMirror(): Bundle? =
                  call(
                      ShellProtocol.MIRROR_DISPLAY
                  ) { parcel ->
                      parcel.writeInt(0)
                  }

              fun requestDisplayPower(
                  displayId: Int,
                  requestedState: Int,
              ): Bundle? =
                  call(
                      ShellProtocol.REQUEST_DISPLAY_POWER
                  ) { parcel ->
                      parcel.writeInt(
                          displayId
                      )
                      parcel.writeInt(
                          requestedState
                      )
                  }
          """,
              "ShizukuBridge display power call",
          )

          service_path = (
              "app/src/full/java/com/duoopen/overlay/"
              "FoldOverlayService.kt"
          )

          replace_once(
              service_path,
              """    private var mirrorRequested =
                  false

              private var mirrorHost:
                  DisplayMirrorHost? =
                  null
          """,
              """    private var mirrorRequested =
                  false

              private var mirrorHost:
                  DisplayMirrorHost? =
                  null

              private var continuityArmed =
                  false

              private var coverPowerHold =
                  false

              private var openReferenceAngle =
                  Float.NaN

              private var lastContinuityAngle =
                  Float.NaN

              private var lastPowerAssertMs =
                  0L

              private var powerAssertInFlight =
                  false

              private var lastCoverLogicalId =
                  -1

              private val coverPowerWatchdog =
                  object : Runnable {
                      override fun run() {
                          if (!coverPowerHold) {
                              return
                          }

                          assertCoverPower(
                              reason =
                                  "watchdog",
                              force =
                                  true,
                          )

                          handler.postDelayed(
                              this,
                              COVER_POWER_ASSERT_INTERVAL_MS,
                          )
                      }
                  }
          """,
              "FoldOverlayService motion gate state",
          )

          insert_before_once(
              service_path,
              """    fun runSecondaryDisplayExperiment(
          """,
              """    private fun resolveCoverLogicalId(): Int {
                  val cover =
                      displayManager.displays
                          .firstOrNull { candidate ->
                              val mode =
                                  candidate.mode

                              mode.physicalWidth == 1080 &&
                                  mode.physicalHeight == 2520
                          }

                  if (cover != null) {
                      lastCoverLogicalId =
                          cover.displayId
                  }

                  return lastCoverLogicalId
              }

              private fun assertCoverPower(
                  reason: String,
                  force: Boolean = false,
              ) {
                  if (!coverPowerHold) {
                      return
                  }

                  val now =
                      android.os.SystemClock.uptimeMillis()

                  if (
                      !force &&
                      now - lastPowerAssertMs <
                          COVER_POWER_ASSERT_INTERVAL_MS
                  ) {
                      return
                  }

                  if (powerAssertInFlight) {
                      return
                  }

                  val target =
                      resolveCoverLogicalId()

                  if (target < 0) {
                      com.duoopen.debug.DuoDiagnostics.event(
                          "cover-power",
                          "assert skipped reason=$reason; no cover logical route",
                      )
                      return
                  }

                  lastPowerAssertMs =
                      now

                  powerAssertInFlight =
                      true

                  scope.launch(
                      Dispatchers.IO
                  ) {
                      val result =
                          ShizukuBridge.requestDisplayPower(
                              displayId =
                                  target,
                              requestedState =
                                  Display.STATE_ON,
                          )

                      val ok =
                          result?.getBoolean(
                              "ok",
                              false,
                          ) == true

                      val error =
                          result?.getString(
                              "error"
                          )

                      com.duoopen.debug.DuoDiagnostics.event(
                          "cover-power",
                          "assert-on reason=$reason target=$target " +
                              "ok=$ok error=$error",
                      )

                      handler.post {
                          powerAssertInFlight =
                              false

                          if (coverPowerHold) {
                              scheduleMirrorRefresh(
                                  "cover-power:$reason"
                              )
                          }
                      }
                  }
              }

              private fun releaseCoverPowerHold(
                  reason: String,
              ) {
                  if (
                      !coverPowerHold &&
                      !mirrorRequested
                  ) {
                      openReferenceAngle =
                          Float.NaN

                      return
                  }

                  coverPowerHold =
                      false

                  mirrorRequested =
                      false

                  lastPowerAssertMs =
                      0L

                  handler.removeCallbacks(
                      mirrorRefreshRunnable
                  )

                  handler.removeCallbacks(
                      coverPowerWatchdog
                  )

                  mirrorHost?.detach()
                  mirrorHost =
                      null

                  val releaseTarget =
                      resolveCoverLogicalId()

                  scope.launch(
                      Dispatchers.IO
                  ) {
                      ShizukuBridge.stopDisplayMirror()

                      if (releaseTarget >= 0) {
                          ShizukuBridge.requestDisplayPower(
                              displayId =
                                  releaseTarget,
                              requestedState =
                                  Display.STATE_UNKNOWN,
                          )
                      }

                      ShizukuBridge.resetSecondaryDisplay()
                  }

                  openReferenceAngle =
                      Float.NaN

                  _secondaryDisplayStatus.value =
                      "Geometry continuity armed; cover returned to Samsung."

                  com.duoopen.debug.DuoDiagnostics.event(
                      "cover-power",
                      "released reason=$reason target=$releaseTarget",
                  )
              }

              private fun armGeometryContinuity() {
                  continuityArmed =
                      true

                  coverPowerHold =
                      false

                  mirrorRequested =
                      false

                  openReferenceAngle =
                      Float.NaN

                  lastPowerAssertMs =
                      0L

                  powerAssertInFlight =
                      false

                  lastCoverLogicalId =
                      -1

                  handler.removeCallbacks(
                      mirrorRefreshRunnable
                  )

                  handler.removeCallbacks(
                      coverPowerWatchdog
                  )

                  handler.removeCallbacks(
                      secondaryDisplaySafetyReset
                  )

                  mirrorHost?.detach()
                  mirrorHost =
                      null

                  _secondaryDisplayStatus.value =
                      "ARMED: cover stays off until 4° of deliberate closing travel."

                  com.duoopen.debug.DuoDiagnostics.event(
                      "cover-power",
                      "armed triggerDeg=$COVER_WAKE_TRAVEL_DEG " +
                          "releaseOpenDeg=$COVER_RELEASE_OPEN_DEG",
                  )

                  scope.launch(
                      Dispatchers.IO
                  ) {
                      ShizukuBridge.stopDisplayMirror()
                      ShizukuBridge.resetSecondaryDisplay()
                  }
              }

              private fun handleContinuityHinge(
                  angle: Float,
              ) {
                  val previous =
                      lastContinuityAngle

                  lastContinuityAngle =
                      angle

                  if (!continuityArmed) {
                      return
                  }

                  if (openReferenceAngle.isNaN()) {
                      openReferenceAngle =
                          angle

                      com.duoopen.debug.DuoDiagnostics.event(
                          "cover-power",
                          "open baseline=$angle",
                      )
                      return
                  }

                  if (!coverPowerHold) {
                      if (
                          angle >
                          openReferenceAngle
                      ) {
                          openReferenceAngle =
                              angle
                      }

                      val travel =
                          openReferenceAngle -
                              angle

                      val closingSample =
                          !previous.isNaN() &&
                              previous - angle >=
                                  COVER_SAMPLE_EPSILON_DEG

                      if (
                          travel >=
                              COVER_WAKE_TRAVEL_DEG &&
                          closingSample
                      ) {
                          coverPowerHold =
                              true

                          mirrorRequested =
                              true

                          _secondaryDisplayStatus.value =
                              "4° fold detected: waking and holding the physical cover ON."

                          com.duoopen.debug.DuoDiagnostics.event(
                              "cover-power",
                              "wake-trigger angle=$angle " +
                                  "baseline=$openReferenceAngle " +
                                  "travel=$travel",
                          )

                          runSecondaryDisplayExperiment(
                              enable =
                                  true,
                              reason =
                                  "4-degree-motion-trigger",
                          )

                          handler.removeCallbacks(
                              coverPowerWatchdog
                          )

                          handler.postDelayed(
                              coverPowerWatchdog,
                              COVER_POWER_ASSERT_INTERVAL_MS,
                          )

                          scheduleMirrorRefresh(
                              "4-degree-motion-trigger"
                          )
                      }

                      return
                  }

                  assertCoverPower(
                      reason =
                          "hinge-${angle.toInt()}",
                  )

                  if (
                      angle >=
                          openReferenceAngle -
                              COVER_RELEASE_OPEN_DEG
                  ) {
                      releaseCoverPowerHold(
                          "returned-open"
                      )
                      return
                  }

                  val cover =
                      displayManager.displays
                          .firstOrNull { candidate ->
                              val mode =
                                  candidate.mode

                              mode.physicalWidth == 1080 &&
                                  mode.physicalHeight == 2520
                          }

                  val inner =
                      displayManager.displays
                          .firstOrNull { candidate ->
                              val mode =
                                  candidate.mode

                              mode.physicalWidth == 1968 &&
                                  mode.physicalHeight == 2184
                          }

                  val nativeCover =
                      cover?.displayId ==
                          Display.DEFAULT_DISPLAY &&
                          cover.state !=
                              Display.STATE_OFF &&
                          cover.state !=
                              Display.STATE_UNKNOWN &&
                          (
                              inner == null ||
                                  inner.state ==
                                      Display.STATE_OFF ||
                                  inner.state ==
                                      Display.STATE_UNKNOWN
                              )

                  if (
                      nativeCover &&
                      angle <=
                          COVER_NATIVE_HANDOFF_MAX_DEG
                  ) {
                      releaseCoverPowerHold(
                          "native-cover-handoff"
                      )
                  }
              }

          """,
              "FoldOverlayService motion power controller",
          )

          replace_once(
              service_path,
              """    private fun onHinge(angle: Float) {
                  // Mirror continuity and the original PanelEngine animations share the
                  // same hinge clock. Mirroring must not suppress the inner/cover effect.
                  if (mirrorRequested) {
                      mirrorHost?.onHinge(
                          angle
                      )
                  }

                  for (e in engines.values.toList()) {
                      e.onHinge(angle)
                  }
              }
          """,
              """    private fun onHinge(angle: Float) {
                  handleContinuityHinge(
