                      }

                      return true
          """,
              "FoldOverlayService UI arms instead of waking cover",
          )

          replace_once(
              service_path,
              """        private const val MIRROR_REBIND_DEBOUNCE_MS =
                      80L
          """,
              """        private const val MIRROR_REBIND_DEBOUNCE_MS =
