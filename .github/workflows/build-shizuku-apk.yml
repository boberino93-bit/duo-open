name: Build Z Fold 7 Pane Container Continuity Fix 2

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Replay proven 1.3.11 continuity build
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          previous_commit = "c9721560c1b6da09e5608e82beeb0e4ed91edbd8"

          previous_workflow = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{previous_commit}:.github/workflows/build-shizuku-apk.yml",
              ],
              text=True,
          )

          lines = previous_workflow.splitlines()

          wanted_steps = [
              "Replay proven 1.3.10 root-mirror build",
              "Consolidate left-pane continuity and topology handling",
          ]

          def extract_run_block(step_name: str) -> str:
              step_start = None

              for index, line in enumerate(lines):
                  if line.strip() == f"- name: {step_name}":
                      step_start = index
                      break

              if step_start is None:
                  raise SystemExit(
                      f"Previous workflow step not found: {step_name}"
                  )

              run_line = None

              for index in range(step_start + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  if line.strip() == "run: |":
                      run_line = index
                      break

              if run_line is None:
                  raise SystemExit(
                      f"Run block not found for: {step_name}"
                  )

              block = []

              for index in range(run_line + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  block.append(line)

              return textwrap.dedent(
                  "\n".join(block)
              )

          for step_name in wanted_steps:
              script = extract_run_block(
                  step_name
              )

              script_path = Path(
                  "/tmp/" +
                  re.sub(
                      r"[^A-Za-z0-9]+",
                      "-",
                      step_name,
                  ).strip("-") +
                  ".sh"
              )

              script_path.write_text(
                  "set -euo pipefail\n" +
                  script +
                  "\n"
              )

              print(
                  f"Replaying proven step: {step_name}"
              )

              subprocess.run(
                  [
                      "bash",
                      str(script_path),
                  ],
                  check=True,
              )
          PY

      - name: Replace mirror crop with owned pane container
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text()

          def save(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new, label):
              text = load(path)

              if old not in text:
                  raise SystemExit(
                      f"{label}: expected source not found in {path}"
                  )

              save(
                  path,
                  text.replace(
                      old,
                      new,
                      1,
                  ),
              )

          mirror_host_path = Path(
              "app/src/full/java/com/duoopen/overlay/"
              "DisplayMirrorHost.kt"
          )

          mirror_host_path.write_text(
              r'''package com.duoopen.overlay

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.hardware.display.DisplayManager
          import android.view.Display
          import android.view.Gravity
          import android.view.SurfaceControl
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout
          import com.duoopen.shell.ShizukuBridge
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch

          /**
           * Fold7 continuity host.
           *
           * ViewRoot
           *   └── cropContainer
           *         └── live WindowManager display mirror
           *
           * Cropping is applied to an app-owned parent container. SurfaceControl
           * children inherit parent crop and transforms, so the right half of the
           * full WMS display mirror is clipped out before the pane is scaled to cover.
           */
          class DisplayMirrorHost(
              private val service: AccessibilityService,
              val display: Display,
              private val scope: CoroutineScope,
              private val onStatus: (String) -> Unit,
          ) {
              val displayId: Int =
                  display.displayId

              private val displayManager =
                  service.getSystemService(
                      DisplayManager::class.java
                  )

              private val context =
                  service
                      .createDisplayContext(
                          display
                      )
                      .createWindowContext(
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          null,
                      )

              private val windowManager =
                  context.getSystemService(
                      WindowManager::class.java
                  )

              private var attached =
                  false

              private var generation =
                  0

              private var mirrorSourceKey:
                  String? =
                  null

              private var appMirror:
                  SurfaceControl? =
                  null

              private var cropContainer:
                  SurfaceControl? =
                  null

              private var latestHingeAngle =
                  Float.NaN

              private var lastLoggedAngleBucket =
                  Int.MIN_VALUE

              private val hostView =
                  FrameLayout(
                      context
                  ).apply {
                      setBackgroundColor(
                          Color.TRANSPARENT
                      )

                      importantForAccessibility =
                          View.IMPORTANT_FOR_ACCESSIBILITY_NO

                      addOnAttachStateChangeListener(
                          object :
                              View.OnAttachStateChangeListener {

                              override fun onViewAttachedToWindow(
                                  v: View,
                              ) {
                                  v.post {
                                      bind(
                                          "window-attached"
                                      )
                                  }
                              }

                              override fun onViewDetachedFromWindow(
                                  v: View,
                              ) {
                                  generation++

                                  mirrorSourceKey =
                                      null

                                  releaseSurfaceTree()

                                  com.duoopen.debug.DuoDiagnostics.event(
                                      "live-mirror",
                                      "pane-container host detached display=$displayId",
                                  )
                              }
                          }
                      )

                      addOnLayoutChangeListener {
                              _,
                              left,
                              top,
                              right,
                              bottom,
                              oldLeft,
                              oldTop,
                              oldRight,
                              oldBottom,
                          ->

                          val width =
                              right -
                                  left

                          val height =
                              bottom -
                                  top

                          val oldWidth =
                              oldRight -
                                  oldLeft

                          val oldHeight =
                              oldBottom -
                                  oldTop

                          if (
                              width > 0 &&
                              height > 0 &&
                              (
                                  width != oldWidth ||
                                      height != oldHeight
                              )
                          ) {
                              post {
                                  refresh(
                                      "host-layout ${width}x$height"
                                  )
                              }
                          }
                      }
                  }

              fun attach() {
                  if (attached) {
                      refresh(
                          "already-attached"
                      )

                      return
                  }

                  val params =
                      WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                              WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                          PixelFormat.TRANSLUCENT,
                      ).apply {
                          gravity =
                              Gravity.TOP or
                                  Gravity.START

                          layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams
                                  .LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS

                          fitInsetsTypes =
                              0

                          title =
                              "DuoOpenLeftPaneContainer"
                      }

                  attached =
                      runCatching {
                          windowManager.addView(
                              hostView,
                              params,
                          )
                      }.onFailure { error ->

                          onStatus(
                              "Could not attach left-pane container: ${error.message}"
                          )

                          com.duoopen.debug.DuoDiagnostics.event(
                              "live-mirror",
                              "pane-container host add failed display=$displayId " +
                                  "error=${error.javaClass.simpleName}:${error.message}",
                          )
                      }.isSuccess
              }

              fun refresh(
                  reason: String,
              ) {
                  if (
                      !attached ||
                      !hostView.isAttachedToWindow
                  ) {
                      return
                  }

                  bind(
                      reason
                  )
              }

              fun onHinge(
                  angle: Float,
              ) {
                  latestHingeAngle =
                      angle

                  val bucket =
                      (
                          angle /
                              10f
                          ).toInt()

                  if (
                      bucket !=
                      lastLoggedAngleBucket
                  ) {
                      lastLoggedAngleBucket =
                          bucket

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "hinge angle=$angle display=$displayId " +
                              "mirrorValid=${appMirror?.isValid == true} " +
                              "containerValid=${cropContainer?.isValid == true}",
                      )
                  }
              }

              private fun findInnerDisplay():
                  Display? =
                  displayManager.displays
                      .firstOrNull { candidate ->

                          val mode =
                              candidate.mode

                          mode.physicalWidth ==
                              INNER_WIDTH &&
                              mode.physicalHeight ==
                                  INNER_HEIGHT
                      }

              private fun bind(
                  reason: String,
              ) {
                  val root =
                      hostView.rootSurfaceControl

                  if (root == null) {
                      onStatus(
                          "Left-pane window is attached, but its root SurfaceControl is not ready."
                      )

                      return
                  }

                  val source =
                      findInnerDisplay()

                  if (source == null) {
                      onStatus(
                          "Waiting for the Fold7 inner display."
                      )

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "inner source missing reason=$reason " +
                              "destination=$displayId hinge=$latestHingeAngle",
                      )

                      return
                  }

                  if (
                      source.displayId ==
                      displayId
                  ) {
                      onStatus(
                          "Mirror source and cover destination resolved to the same logical display; refusing to bind."
                      )

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "same-display guard source=${source.displayId} " +
                              "destination=$displayId reason=$reason",
                      )

                      return
                  }

                  val sourceMode =
                      source.mode

                  val sourceWidth =
                      sourceMode.physicalWidth

                  val sourceHeight =
                      sourceMode.physicalHeight

                  val sourceKey =
                      "inner=${source.displayId}:${sourceWidth}x$sourceHeight;" +
                          "cover=$displayId"

                  val currentMirror =
                      appMirror

                  val currentContainer =
                      cropContainer

                  if (
                      mirrorSourceKey ==
                          sourceKey &&
                      currentMirror !=
                          null &&
                      currentMirror.isValid &&
                      currentContainer !=
                          null &&
                      currentContainer.isValid
                  ) {
                      applyGeometry(
                          mirror =
                              currentMirror,
                          container =
                              currentContainer,
                          sourceWidth =
                              sourceWidth,
                          sourceHeight =
                              sourceHeight,
                          reason =
                              "reuse:$reason",
                          initialAttach =
                              false,
                      )

                      return
                  }

                  val localGeneration =
                      ++generation

                  mirrorSourceKey =
                      null

                  onStatus(
                      "Creating live left-pane container: " +
                          "inner ${source.displayId} " +
                          "${sourceWidth}×$sourceHeight → " +
                          "cover $displayId…"
                  )

                  scope.launch(
                      Dispatchers.IO
                  ) {
                      val result =
                          ShizukuBridge.startDisplayMirror(
                              sourceDisplayId =
                                  source.displayId,
                          )

                      val ok =
                          result?.getBoolean(
                              "ok",
                              false,
                          ) == true

                      val error =
                          result?.getString(
                              "error"
                          )

                      val mirror =
                          if (ok) {
                              result?.getParcelable(
                                  "mirrorSurface",
                                  SurfaceControl::class.java,
                              )
                          } else {
                              null
                          }

                      hostView.post {
                          if (
                              localGeneration !=
                              generation
                          ) {
                              mirror?.release()

                              return@post
                          }

                          if (
                              !ok ||
                              mirror == null ||
                              !mirror.isValid
                          ) {
                              mirror?.release()

                              mirrorSourceKey =
                                  null

                              val detail =
                                  error
                                      ?: "shell returned no valid mirror SurfaceControl"

                              onStatus(
                                  "Left-pane mirror failed: $detail"
                              )

                              com.duoopen.debug.DuoDiagnostics.event(
                                  "live-mirror",
                                  "pane-container bind failed reason=$reason " +
                                      "source=${source.displayId} " +
                                      "destination=$displayId error=$detail",
                              )

                              return@post
                          }

                          val container =
                              ensureCropContainer()

                          if (
                              container == null ||
                              !container.isValid
                          ) {
                              mirror.release()

                              onStatus(
                                  "Could not create the left-pane crop container."
                              )

                              com.duoopen.debug.DuoDiagnostics.event(
                                  "live-mirror",
                                  "pane-container create failed reason=$reason",
                              )

                              return@post
                          }

                          releaseAppMirrorOnly()

                          appMirror =
                              mirror

                          mirrorSourceKey =
                              sourceKey

                          val applied =
                              applyGeometry(
                                  mirror =
                                      mirror,
                                  container =
                                      container,
                                  sourceWidth =
                                      sourceWidth,
                                  sourceHeight =
                                      sourceHeight,
                                  reason =
                                      "new:$reason",
                                  initialAttach =
                                      true,
                              )

                          if (!applied) {
                              releaseAppMirrorOnly()

                              mirrorSourceKey =
                                  null

                              return@post
                          }

                          onStatus(
                              "LEFT PANE CONTAINER LIVE: inner ${source.displayId} → cover $displayId."
                          )
                      }
                  }
              }

              private fun ensureCropContainer():
                  SurfaceControl? {

                  val existing =
                      cropContainer

                  if (
                      existing != null &&
                      existing.isValid
                  ) {
                      return existing
                  }

                  val created =
                      runCatching {

                          runCatching {
                              org.lsposed.hiddenapibypass.HiddenApiBypass
                                  .addHiddenApiExemptions(
                                      "Landroid/view/SurfaceControl\$Builder;"
                                  )
                          }

                          val builder =
                              SurfaceControl.Builder()
                                  .setName(
                                      "DuoOpenLeftPaneCrop"
                                  )

                          val method =
                              builder.javaClass
                                  .getDeclaredMethod(
                                      "setContainerLayer"
                                  )
                                  .apply {
                                      isAccessible =
                                          true
                                  }

                          method.invoke(
                              builder
                          )

                          builder.build()

                      }.getOrElse { error ->

                          com.duoopen.debug.DuoDiagnostics.event(
                              "live-mirror",
                              "pane-container builder failed " +
                                  "error=${error.javaClass.simpleName}:${error.message}",
                          )

                          return null
                      }

                  cropContainer =
                      created

                  return created
              }

              private fun applyGeometry(
                  mirror: SurfaceControl,
                  container: SurfaceControl,
                  sourceWidth: Int,
                  sourceHeight: Int,
                  reason: String,
                  initialAttach: Boolean,
              ): Boolean {

                  val root =
                      hostView.rootSurfaceControl
                          ?: return false

                  val destinationMode =
                      display.mode

                  val destinationWidth =
                      hostView.width
                          .takeIf {
                              it > 0
                          }
                          ?: destinationMode.physicalWidth

                  val destinationHeight =
                      hostView.height
                          .takeIf {
                              it > 0
                          }
                          ?: destinationMode.physicalHeight

                  if (
                      destinationWidth <= 0 ||
                      destinationHeight <= 0
                  ) {
                      onStatus(
                          "Waiting for non-zero cover bounds."
                      )

                      return false
                  }

                  val paneWidth =
                      (
                          sourceWidth /
                              2
                          )
                          .coerceAtLeast(
                              1
                          )

                  val paneHeight =
                      sourceHeight

                  val containerCrop =
                      Rect(
                          0,
                          0,
                          paneWidth,
                          paneHeight,
                      )

                  val scale =
                      maxOf(
                          destinationWidth.toFloat() /
                              paneWidth.toFloat(),
                          destinationHeight.toFloat() /
                              paneHeight.toFloat(),
                      )

                  val drawnWidth =
                      paneWidth *
                          scale

                  val drawnHeight =
                      paneHeight *
                          scale

                  val x =
                      (
                          destinationWidth -
                              drawnWidth
                          ) * 0.5f

                  val y =
                      (
                          destinationHeight -
                              drawnHeight
                          ) * 0.5f

                  val transaction =
                      if (initialAttach) {
                          root.buildReparentTransaction(
                              container
                          )
                      } else {
                          SurfaceControl.Transaction()
                      }

                  if (transaction == null) {
                      onStatus(
                          "Android could not create the pane-container transaction."
                      )

                      return false
                  }

                  return try {
                      if (initialAttach) {
                          transaction
                              .reparent(
                                  mirror,
                                  container,
                              )
                              .setPosition(
                                  mirror,
                                  0f,
                                  0f,
                              )
                              .setLayer(
                                  mirror,
                                  0,
                              )
                              .setAlpha(
                                  mirror,
                                  1f,
                              )
                              .setVisibility(
                                  mirror,
                                  true,
                              )
                      }

                      transaction
                          .setCrop(
                              container,
                              containerCrop,
                          )
                          .setScale(
                              container,
                              scale,
                              scale,
                          )
                          .setPosition(
                              container,
                              x,
                              y,
                          )
                          .setLayer(
                              container,
                              10_000,
                          )
                          .setAlpha(
                              container,
                              1f,
                          )
                          .setVisibility(
                              container,
                              true,
                          )

                      val queued =
                          root.applyTransactionOnDraw(
                              transaction
                          )

                      hostView.invalidate()

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "pane-container geometry ok reason=$reason " +
                              "source=${sourceWidth}x$sourceHeight " +
                              "containerCrop=0,0-${paneWidth},${paneHeight} " +
                              "destination=${destinationWidth}x$destinationHeight " +
                              "scale=$scale x=$x y=$y " +
                              "mirrorChild=true queuedOnDraw=$queued " +
                              "hinge=$latestHingeAngle",
                      )

                      true

                  } catch (t: Throwable) {

                      runCatching {
                          transaction.close()
                      }

                      val detail =
                          "${t.javaClass.simpleName}: ${t.message}"

                      onStatus(
                          "Pane-container geometry failed: $detail"
                      )

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "pane-container geometry exception " +
                              "reason=$reason error=$detail",
                      )

                      false
                  }
              }

              private fun releaseAppMirrorOnly() {
                  val current =
                      appMirror
                          ?: return

                  appMirror =
                      null

                  runCatching {
                      current.release()
                  }
              }

              private fun releaseSurfaceTree() {
                  releaseAppMirrorOnly()

                  val container =
                      cropContainer

                  cropContainer =
                      null

                  if (
                      container != null
                  ) {
                      runCatching {
                          SurfaceControl.Transaction()
                              .reparent(
                                  container,
                                  null,
                              )
                              .apply()
                      }

                      runCatching {
                          container.release()
                      }
                  }
              }

              fun detach() {
                  generation++

                  mirrorSourceKey =
                      null

                  releaseSurfaceTree()

                  if (!attached) {
                      return
                  }

                  attached =
                      false

                  runCatching {
                      windowManager.removeViewImmediate(
                          hostView
                      )
                  }

                  com.duoopen.debug.DuoDiagnostics.event(
                      "live-mirror",
                      "pane-container host removed display=$displayId",
                  )
              }

              private companion object {
                  const val INNER_WIDTH =
                      1968

                  const val INNER_HEIGHT =
                      2184
              }
          }
          '''
          )

          service_path = (
              "app/src/full/java/com/duoopen/overlay/"
              "FoldOverlayService.kt"
          )

          service =
              load(
                  service_path
              )

          old_primary = '''        val coverIsNativePrimary =
                      (
                          primaryMode.physicalWidth == 1080 &&
                              primaryMode.physicalHeight == 2520
                      ) ||
                          (
                              primaryMode.physicalWidth == 822 &&
                                  primaryMode.physicalHeight == 1918
                          )
          '''

          new_primary = '''        val coverIsNativePrimary =
                      primaryMode.physicalWidth == 1080 &&
                          primaryMode.physicalHeight == 2520
          '''

          if (
              old_primary not in
              service
          ):
              raise SystemExit(
                  "Expected speculative native-cover geometry block was not found."
              )

          service =
              service.replace(
                  old_primary,
                  new_primary,
                  1,
              )

          old_cover = '''                        (
                                      mode.physicalWidth == 1080 &&
                                          mode.physicalHeight == 2520
                                  ) ||
                                      (
                                          mode.physicalWidth == 822 &&
                                              mode.physicalHeight == 1918
                                      )
          '''

          new_cover = '''                        mode.physicalWidth == 1080 &&
                                      mode.physicalHeight == 2520
          '''

          if (
              old_cover not in
              service
          ):
              raise SystemExit(
                  "Expected speculative cover lookup geometry block was not found."
              )

          service =
              service.replace(
                  old_cover,
                  new_cover,
                  1,
              )

          save(
              service_path,
              service,
          )

          sheet_path = (
              "app/src/main/java/com/duoopen/ui/"
              "ControlSheet.kt"
          )

          replace_once(
              sheet_path,
              '"Start left-pane continuity"',
              '"Start pane-container continuity"',
              "ControlSheet pane-container label",
          )

          replace_once(
              sheet_path,
              '''"Fold7 continuity probe: only the LEFT half of the live inner display is " +
                              "carried onto the cover, matching the pane that physically moves across the crease. " +
                              "The mirror fills the cover with a small centered overscan, updates geometry without " +
                              "recreating the mirror, tracks Samsung topology changes, and releases itself when the " +
                              "cover becomes Android's native primary display."''',
              '''"Fold7 pane-container probe: the full live display mirror is parented inside " +
                              "an owned SurfaceControl container whose bounds clip it to the LEFT half of the inner " +
                              "display. The cropped parent then fills the cover. This avoids relying on crop semantics " +
                              "of the special WindowManager display-mirror layer while preserving live launcher and app content."''',
              "ControlSheet pane-container explanation",
          )

          gradle_path = Path(
              "app/build.gradle.kts"
          )

          gradle =
              gradle_path.read_text()

          if (
              "versionCode = 15"
              not in gradle
          ):
              raise SystemExit(
                  "Expected left-pane versionCode 15 was not found."
              )

          if (
              'versionName = "1.3.11-zfold7-left-pane-continuity"'
              not in gradle
          ):
              raise SystemExit(
                  "Expected left-pane versionName was not found."
              )

          gradle =
              gradle.replace(
                  "versionCode = 15",
                  "versionCode = 16",
                  1,
              )

          gradle =
              gradle.replace(
                  'versionName = "1.3.11-zfold7-left-pane-continuity"',
                  'versionName = "1.3.12-zfold7-pane-container"',
                  1,
              )

          gradle_path.write_text(
              gradle
          )
          PY

      - name: Validate pane-container pass
        run: |
          git diff --check
          git diff --stat

          grep -R "setContainerLayer" \
            app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt

          grep -R "pane-container geometry ok" \
            app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt

          grep -R "same-display guard" \
            app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt

          grep -R "Start pane-container continuity" \
            app/src/main/java/com/duoopen/ui/ControlSheet.kt

          grep -R "1.3.12-zfold7-pane-container" \
            app/build.gradle.kts

          if grep -R "822" \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt
          then
            echo "Unexpected speculative cover geometry remains."
            exit 1
          fi

          mkdir -p zfold7-artifacts

          git diff \
            > zfold7-artifacts/zfold7-pane-container.patch

      - name: Compile, unit test, and build
        run: |
          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

      - name: Prepare APK
        run: |
          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "Debug APK not found."
            exit 1
          fi

          cp \
            "$APK" \
            zfold7-artifacts/DuoOpen-ZFold7-pane-container-debug.apk

          {
            echo "commit=${GITHUB_SHA}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "pass=root-mirror+owned-crop-container+left-pane-clip+cover-fill+mirror-reuse+topology-guard"
            echo

            sha256sum \
              zfold7-artifacts/DuoOpen-ZFold7-pane-container-debug.apk

          } > zfold7-artifacts/BUILD-INFO.txt

          cat \
            zfold7-artifacts/BUILD-INFO.txt

      - name: Upload field-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-pane-container
          path: |
            zfold7-artifacts/DuoOpen-ZFold7-pane-container-debug.apk
            zfold7-artifacts/zfold7-pane-container.patch
            zfold7-artifacts/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30