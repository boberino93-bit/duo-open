name: Build Z Fold 7 Dual Screen Stable Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Conflict guard
        run: |
          check_blob() {
            path="$1"
            expected="$2"
            actual="$(git hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Source changed since this pass was designed. Expected $expected but found $actual. Stopping instead of overwriting a newer commit."
              exit 1
            fi
          }

          check_blob "app/src/main/java/com/duoopen/fold/HingeAngleSource.kt" "da3fe9abda7795bfd714d4b5074acf90a1b91c48"
          check_blob "app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt" "7610633d11dc8bdb3667e2670cace595305f853e"
          check_blob "app/src/full/java/com/duoopen/shell/ShizukuBridge.kt" "4600ea293222c94cca02310734850a78e6cc62bd"
          check_blob "app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt" "fdc4f607ed8e8e7d03df4223bd79dac36be93952"
          check_blob "app/src/full/java/com/duoopen/overlay/PanelEngine.kt" "a1285f81ffe5e1f7d7e0f46e86b4e7bef747e5ae"
          check_blob "app/build.gradle.kts" "dcbfbaf660fd2efd4f625569affc1db738e52ec8"
          check_blob "app/src/main/java/com/duoopen/DualScreen.kt" "5c89b33a4970ee87a08671f47b1edebaf57c5d90"
          check_blob "app/src/main/java/com/duoopen/DuoApplication.kt" "e07dc81c3479afe0a1f493b53ae92d7b96d692cd"
          check_blob "app/src/main/java/com/duoopen/ui/ControlSheet.kt" "7f88ae6a7f6ce8452c8c8f17d1b2627442eaea6f"

          echo "Conflict guard passed."

      - name: Reapply proven Fold 7 smoothness pass
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/zfold7-smoothness.patch
          git apply --check /tmp/zfold7-smoothness.patch
          git apply /tmp/zfold7-smoothness.patch

      - name: Install persistent dual-screen lifecycle
        run: |
          cat > app/src/main/java/com/duoopen/DualScreen.kt <<'KOTLIN'
          package com.duoopen

          import android.content.Context
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.util.Log
          import android.view.Gravity
          import android.view.View
          import android.widget.FrameLayout
          import android.widget.TextView
          import androidx.activity.ComponentActivity
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.DefaultLifecycleObserver
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.LifecycleOwner
          import androidx.lifecycle.lifecycleScope
          import androidx.lifecycle.repeatOnLifecycle
          import androidx.window.area.WindowAreaCapability
          import androidx.window.area.WindowAreaController
          import androidx.window.area.WindowAreaInfo
          import androidx.window.area.WindowAreaPresentationSessionCallback
          import androidx.window.area.WindowAreaSessionPresenter
          import androidx.window.core.ExperimentalWindowApi
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.launch

          @OptIn(ExperimentalWindowApi::class)
          class DualScreen(private val activity: ComponentActivity) : DefaultLifecycleObserver {

              private val controller = WindowAreaController.getOrCreate()
              private val prefs = activity.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)

              private val _status = MutableStateFlow("Checking…")
              val status: StateFlow<String> = _status

              private val _active = MutableStateFlow(prefs.getBoolean(PREF_ENABLED, false))
              val active: StateFlow<Boolean> = _active

              val supported: Boolean get() = rearInfo != null

              private var desired = _active.value
              private var rearInfo: WindowAreaInfo? = null
              private var presenter: WindowAreaSessionPresenter? = null
              private var requestInFlight = false
              private var generation = 0L
              private var retryJob: Job? = null
              private var timeoutJob: Job? = null

              init {
                  activity.lifecycle.addObserver(this)

                  activity.lifecycleScope.launch {
                      activity.repeatOnLifecycle(Lifecycle.State.STARTED) {
                          controller.windowAreaInfos.collect { infos ->
                              Log.i(TAG, "window areas: " + infos.joinToString { info ->
                                  val present = info.getCapability(
                                      WindowAreaCapability.Operation.OPERATION_PRESENT_ON_AREA,
                                  )?.status
                                  val transfer = info.getCapability(
                                      WindowAreaCapability.Operation.OPERATION_TRANSFER_ACTIVITY_TO_AREA,
                                  )?.status
                                  "${info.type} ${info.metrics.bounds} present=$present transfer=$transfer"
                              }.ifEmpty { "(none)" })

                              rearInfo = infos.firstOrNull {
                                  it.type == WindowAreaInfo.Type.TYPE_REAR_FACING
                              }

                              refreshStatus()
                              if (desired) maybeStart("window-area update")
                          }
                      }
                  }
              }

              override fun onStart(owner: LifecycleOwner) {
                  if (desired) scheduleRetry(0L, "activity started")
              }

              override fun onResume(owner: LifecycleOwner) {
                  if (desired) scheduleRetry(120L, "activity resumed")
              }

              override fun onDestroy(owner: LifecycleOwner) {
                  retryJob?.cancel()
                  timeoutJob?.cancel()
                  generation++
                  requestInFlight = false
                  val old = presenter
                  presenter = null
                  runCatching { old?.close() }
                  activity.lifecycle.removeObserver(this)
              }

              fun start() {
                  desired = true
                  _active.value = true
                  prefs.edit().putBoolean(PREF_ENABLED, true).apply()
                  _status.value = "Both screens armed — starting when Samsung exposes the cover display."
                  scheduleRetry(0L, "user enabled")
              }

              fun stop() {
                  desired = false
                  _active.value = false
                  prefs.edit().putBoolean(PREF_ENABLED, false).apply()
                  retryJob?.cancel()
                  timeoutJob?.cancel()
                  generation++
                  requestInFlight = false
                  val old = presenter
                  presenter = null
                  runCatching { old?.close() }
                      .onFailure { Log.w(TAG, "closing dual-screen session failed", it) }
                  refreshStatus()
              }

              private fun maybeStart(reason: String) {
                  if (!desired || presenter != null || requestInFlight) return

                  if (!activity.lifecycle.currentState.isAtLeast(Lifecycle.State.STARTED)) {
                      _status.value = "Both screens armed — waiting for Duo Open to return to the foreground."
                      return
                  }

                  val info = rearInfo ?: run {
                      _status.value = "Both screens armed — waiting for Samsung's second-screen capability."
                      return
                  }

                  val cap = info.getCapability(
                      WindowAreaCapability.Operation.OPERATION_PRESENT_ON_AREA,
                  )

                  when (cap?.status) {
                      WindowAreaCapability.Status.WINDOW_AREA_STATUS_AVAILABLE -> beginSession(info, reason)
                      WindowAreaCapability.Status.WINDOW_AREA_STATUS_ACTIVE ->
                          _status.value = "Both screens armed — Samsung reports the second screen active."
                      WindowAreaCapability.Status.WINDOW_AREA_STATUS_UNAVAILABLE ->
                          _status.value = "Both screens armed — temporarily unavailable while the phone changes display state."
                      else ->
                          _status.value = "Both screens armed — waiting for a usable second-screen session."
                  }
              }

              private fun beginSession(info: WindowAreaInfo, reason: String) {
                  if (!desired || requestInFlight || presenter != null) return

                  requestInFlight = true
                  val myGeneration = ++generation
                  _status.value = "Starting both screens…"
                  Log.i(TAG, "request dual screen gen=$myGeneration reason=$reason")

                  val callback = object : WindowAreaPresentationSessionCallback {
                      override fun onSessionStarted(session: WindowAreaSessionPresenter) {
                          if (myGeneration != generation || !desired) {
                              runCatching { session.close() }
                              return
                          }

                          timeoutJob?.cancel()
                          requestInFlight = false
                          presenter = session

                          val attached = runCatching {
                              session.setContentView(placeholder(session.context))
                          }

                          if (attached.isFailure) {
                              Log.w(TAG, "dual-screen content attach failed", attached.exceptionOrNull())
                              presenter = null
                              runCatching { session.close() }
                              _status.value = "Dual screen couldn't attach content — retrying."
                              scheduleRetry(500L, "content attach failed")
                              return
                          }

                          Log.i(TAG, "dual-screen session started gen=$myGeneration")
                          _status.value = "Both screens are on."
                      }

                      override fun onSessionEnded(t: Throwable?) {
                          if (myGeneration != generation) return

                          timeoutJob?.cancel()
                          requestInFlight = false
                          presenter = null
                          Log.i(TAG, "dual-screen session ended gen=$myGeneration reason=${t?.message}")

                          if (!desired) {
                              refreshStatus()
                              return
                          }

                          _status.value = "Dual screen paused during the fold transition — waiting to restore."
                          scheduleRetry(300L, "session ended")
                      }

                      override fun onContainerVisibilityChanged(isVisible: Boolean) {
                          if (myGeneration != generation || !desired || presenter == null) return
                          _status.value = if (isVisible) {
                              "Both screens are on."
                          } else {
                              "Both screens armed — cover presentation is temporarily hidden."
                          }
                      }
                  }

                  val result = runCatching {
                      controller.presentContentOnWindowArea(
                          info.token,
                          activity,
                          ContextCompat.getMainExecutor(activity),
                          callback,
                      )
                  }

                  if (result.isFailure) {
                      requestInFlight = false
                      Log.w(TAG, "presentContentOnWindowArea failed", result.exceptionOrNull())
                      _status.value = "Couldn't start dual screen — retrying when the display is ready."
                      scheduleRetry(500L, "request failed")
                      return
                  }

                  timeoutJob?.cancel()
                  timeoutJob = activity.lifecycleScope.launch {
                      delay(2_500L)
                      if (desired && myGeneration == generation && requestInFlight && presenter == null) {
                          Log.w(TAG, "dual-screen request timed out gen=$myGeneration")
                          requestInFlight = false
                          _status.value = "Dual-screen start timed out — waiting to retry."
                          scheduleRetry(500L, "request timeout")
                      }
                  }
              }

              private fun scheduleRetry(delayMs: Long, reason: String) {
                  if (!desired) return
                  retryJob?.cancel()
                  retryJob = activity.lifecycleScope.launch {
                      if (delayMs > 0L) delay(delayMs)
                      if (desired) maybeStart(reason)
                  }
              }

              private fun refreshStatus() {
                  if (presenter != null) {
                      _status.value = "Both screens are on."
                      return
                  }

                  val info = rearInfo
                  val cap = info?.getCapability(
                      WindowAreaCapability.Operation.OPERATION_PRESENT_ON_AREA,
                  )

                  _status.value = if (desired) {
                      when {
                          info == null -> "Both screens armed — waiting for Samsung's second-screen capability."
                          cap?.status == WindowAreaCapability.Status.WINDOW_AREA_STATUS_AVAILABLE ->
                              "Both screens armed — cover display available."
                          cap?.status == WindowAreaCapability.Status.WINDOW_AREA_STATUS_ACTIVE ->
                              "Both screens armed — Samsung reports the second screen active."
                          cap?.status == WindowAreaCapability.Status.WINDOW_AREA_STATUS_UNAVAILABLE ->
                              "Both screens armed — temporarily unavailable while the phone changes display state."
                          else -> "Both screens armed — waiting for the second display."
                      }
                  } else {
                      when {
                          info == null -> "This phone doesn't offer its second screen to apps."
                          cap?.status == WindowAreaCapability.Status.WINDOW_AREA_STATUS_ACTIVE ->
                              "Both screens are already active."
                          cap?.status == WindowAreaCapability.Status.WINDOW_AREA_STATUS_AVAILABLE ->
                              "Available: the cover screen can be lit while the inner screen is in use."
                          cap?.status == WindowAreaCapability.Status.WINDOW_AREA_STATUS_UNAVAILABLE ->
                              "Not available right now — open the phone fully and try again."
                          else -> "This phone doesn't support lighting both screens for apps."
                      }
                  }
              }

              private fun placeholder(context: Context): View = FrameLayout(context).apply {
                  background = GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      intArrayOf(
                          0xFF7B5CFF.toInt(),
                          0xFFC44EDD.toInt(),
                          0xFFF0564A.toInt(),
                      ),
                  )

                  addView(
                      TextView(context).apply {
                          text = "Duo Open\n\nBoth screens are on.\nFold the phone."
                          setTextColor(Color.WHITE)
                          textSize = 26f
                          gravity = Gravity.CENTER
                      },
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT,
                      ),
                  )
              }

              private companion object {
                  const val TAG = "DuoDual"
                  const val PREFS_NAME = "duo_open"
                  const val PREF_ENABLED = "dual_screen_experimental_enabled"
              }
          }
          KOTLIN

          python3 <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "versionCode = 5" not in s:
              raise SystemExit("Expected smooth versionCode was not found.")

          if 'versionName = "1.3.1-zfold7-smooth"' not in s:
              raise SystemExit("Expected smooth versionName was not found.")

          s = s.replace(
              "versionCode = 5",
              "versionCode = 6",
              1,
          )

          s = s.replace(
              'versionName = "1.3.1-zfold7-smooth"',
              'versionName = "1.3.2-zfold7-dual-persist"',
              1,
          )

          p.write_text(s)
          PY

      - name: Install on-device field diagnostics
        run: |
          mkdir -p app/src/main/java/com/duoopen/debug

          cat > app/src/main/java/com/duoopen/debug/DuoDiagnostics.kt <<'KOTLIN'
          package com.duoopen.debug

          import android.app.KeyguardManager
          import android.content.Context
          import android.hardware.display.DisplayManager
          import android.os.Build
          import android.os.PowerManager
          import android.os.SystemClock
          import android.util.Log
          import com.duoopen.BuildConfig
          import java.io.File
          import java.time.Instant
          import java.util.ArrayDeque
          import java.util.concurrent.Executors

          /**
           * Persistent, low-overhead field recorder for fold/dual-screen debugging.
           * It records technical state transitions only; it never records screen
           * pixels, notification contents, messages, passwords, or keystrokes.
           */
          object DuoDiagnostics {
              private const val TAG = "DuoDiag"
              private const val FILE_NAME = "duoopen-field-debug.log"
              private const val MAX_LINES = 1200
              private const val MAX_FILE_BYTES = 1_000_000L
              private const val KEEP_BYTES = 500_000

              private val lock = Any()
              private val lines = ArrayDeque<String>(MAX_LINES)
              private val writer = Executors.newSingleThreadExecutor { r ->
                  Thread(r, "DuoDiagnostics").apply { isDaemon = true }
              }

              @Volatile
              private var ready = false

              private lateinit var app: Context
              private lateinit var file: File

              fun init(context: Context) {
                  if (ready) return

                  synchronized(lock) {
                      if (ready) return

                      app = context.applicationContext
                      file = File(
                          app.filesDir,
                          FILE_NAME,
                      )

                      runCatching {
                          if (file.exists()) {
                              file.readLines()
                                  .takeLast(MAX_LINES)
                                  .forEach(::pushLocked)
                          }
                      }

                      ready = true
                  }

                  event(
                      "app",
                      "session-start version=${BuildConfig.VERSION_NAME} code=${BuildConfig.VERSION_CODE} " +
                          "manufacturer=${Build.MANUFACTURER} model=${Build.MODEL} " +
                          "device=${Build.DEVICE} sdk=${Build.VERSION.SDK_INT}",
                  )

                  event(
                      "display",
                      displaySummary(),
                  )
              }

              fun event(
                  category: String,
                  message: String,
                  error: Throwable? = null,
              ) {
                  if (!ready) return

                  val suffix =
                      error?.let {
                          " error=${it.javaClass.simpleName}:${it.message}"
                      } ?: ""

                  val line =
                      "${Instant.now()} uptime=${SystemClock.uptimeMillis()} [$category] $message$suffix"

                  synchronized(lock) {
                      pushLocked(line)
                  }

                  Log.i(
                      TAG,
                      line,
                  )

                  writer.execute {
                      runCatching {
                          rotateIfNeeded()

                          file.appendText(
                              line + "\n"
                          )
                      }.onFailure {
                          Log.w(
                              TAG,
                              "diagnostic write failed",
                              it,
                          )
                      }
                  }
              }

              fun report(): String {
                  if (!ready) {
                      return "DuoDiagnostics not initialised."
                  }

                  val snapshot =
                      synchronized(lock) {
                          lines.toList()
                      }

                  return buildString {
                      appendLine(
                          "=== Duo Open field diagnostics ==="
                      )
                      appendLine(
                          "generated=${Instant.now()}"
                      )
                      appendLine(
                          "version=${BuildConfig.VERSION_NAME} (${BuildConfig.VERSION_CODE})"
                      )
                      appendLine(
                          "manufacturer=${Build.MANUFACTURER}"
                      )
                      appendLine(
                          "model=${Build.MODEL}"
                      )
                      appendLine(
                          "device=${Build.DEVICE}"
                      )
                      appendLine(
                          "sdk=${Build.VERSION.SDK_INT}"
                      )
                      appendLine(
                          displaySummary()
                      )
                      appendLine(
                          deviceStateSummary()
                      )
                      appendLine(
                          "events=${snapshot.size}"
                      )
                      appendLine()

                      snapshot.forEach(
                          ::appendLine
                      )
                  }
              }

              fun clear() {
                  if (!ready) return

                  synchronized(lock) {
                      lines.clear()
                  }

                  writer.execute {
                      runCatching {
                          file.delete()
                      }
                  }

                  event(
                      "app",
                      "diagnostics-cleared",
                  )
              }

              private fun pushLocked(
                  line: String,
              ) {
                  while (
                      lines.size >= MAX_LINES
                  ) {
                      lines.removeFirst()
                  }

                  lines.addLast(line)
              }

              private fun rotateIfNeeded() {
                  if (
                      !file.exists() ||
                      file.length() <= MAX_FILE_BYTES
                  ) {
                      return
                  }

                  val bytes =
                      file.readBytes()

                  val start =
                      (
                          bytes.size -
                              KEEP_BYTES
                          )
                          .coerceAtLeast(0)

                  file.writeBytes(
                      bytes.copyOfRange(
                          start,
                          bytes.size,
                      )
                  )
              }

              private fun deviceStateSummary(): String {
                  val pm =
                      app.getSystemService(
                          PowerManager::class.java,
                      )

                  val km =
                      app.getSystemService(
                          KeyguardManager::class.java,
                      )

                  return (
                      "interactive=${pm?.isInteractive} " +
                          "keyguardLocked=${km?.isKeyguardLocked}"
                      )
              }

              private fun displaySummary(): String {
                  val dm =
                      app.getSystemService(
                          DisplayManager::class.java,
                      )

                  return (
                      "displays=" +
                          dm.displays.joinToString(
                              " | "
                          ) { display ->

                              val mode =
                                  runCatching {
                                      display.mode
                                  }.getOrNull()

                              if (mode == null) {
                                  "id=${display.displayId} " +
                                      "name=${display.name} " +
                                      "state=${display.state}"
                              } else {
                                  "id=${display.displayId} " +
                                      "name=${display.name} " +
                                      "state=${display.state} " +
                                      "${mode.physicalWidth}x${mode.physicalHeight}@" +
                                      "${"%.1f".format(mode.refreshRate)}Hz"
                              }
                          }
                      )
              }
          }
          KOTLIN

          python3 <<'PY'
          from pathlib import Path

          def one(
              path,
              old,
              new,
              label,
          ):
              p = Path(path)
              s = p.read_text()

              if old not in s:
                  raise SystemExit(
                      f"{label}: source anchor not found"
                  )

              p.write_text(
                  s.replace(
                      old,
                      new,
                      1,
                  )
              )

          one(
              "app/src/main/java/com/duoopen/DuoApplication.kt",
              "        DuoSettings.init(this)",
              "        com.duoopen.debug.DuoDiagnostics.init(this)\n        DuoSettings.init(this)",
              "DuoApplication",
          )

          p = Path(
              "app/src/main/java/com/duoopen/fold/HingeAngleSource.kt"
          )

          s = p.read_text()

          anchor = (
              "        if (others.isNotEmpty()) {\n"
              "            appendLine(\"other fold-related sensors (not angle candidates):\")\n"
              "            for (s in others) {\n"
              "                appendLine(\"- ${s.name} type=${s.type} (${s.stringType}) range=${s.maximumRange} wakeUp=${s.isWakeUpSensor}\")\n"
              "            }\n"
              "        }\n"
              "    }\n"
          )

          replacement = (
              "        if (others.isNotEmpty()) {\n"
              "            appendLine(\"other fold-related sensors (not angle candidates):\")\n"
              "            for (s in others) {\n"
              "                appendLine(\"- ${s.name} type=${s.type} (${s.stringType}) range=${s.maximumRange} wakeUp=${s.isWakeUpSensor}\")\n"
              "            }\n"
              "        }\n"
              "        appendLine()\n"
              "        append(com.duoopen.debug.DuoDiagnostics.report())\n"
              "    }\n"
          )

          if anchor not in s:
              raise SystemExit(
                  "HingeAngleSource report anchor not found"
              )

          p.write_text(
              s.replace(
                  anchor,
                  replacement,
                  1,
              )
          )

          p = Path(
              "app/src/main/java/com/duoopen/ui/ControlSheet.kt"
          )

          s = p.read_text()

          if (
              "import com.duoopen.debug.DuoDiagnostics"
              not in s
          ):
              s = s.replace(
                  "import com.duoopen.fold.HingeAngleSource\n",
                  "import com.duoopen.debug.DuoDiagnostics\n" +
                      "import com.duoopen.fold.HingeAngleSource\n",
                  1,
              )

          anchor = (
              "            Row(verticalAlignment = Alignment.CenterVertically) {\n"
              "                Hint(dualStatus, modifier = Modifier.weight(1f))\n"
              "                Switch(checked = dualActive, onCheckedChange = onDualChange, enabled = dualStatus.startsWith(\"Available\") || dualActive)\n"
              "            }\n"
          )

          replacement = (
              anchor +
              "            Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {\n"
              "                TextButton(\n"
              "                    onClick = {\n"
              "                        clipboard.setText(AnnotatedString(DuoDiagnostics.report()))\n"
              "                    },\n"
              "                ) { Text(\"Copy diagnostics\") }\n"
              "                TextButton(onClick = DuoDiagnostics::clear) {\n"
              "                    Text(\"Clear diagnostics\")\n"
              "                }\n"
              "            }\n"
          )

          if anchor not in s:
              raise SystemExit(
                  "ControlSheet dual-screen anchor not found"
              )

          p.write_text(
              s.replace(
                  anchor,
                  replacement,
                  1,
              )
          )

          p = Path(
              "app/src/main/java/com/duoopen/DualScreen.kt"
          )

          s = p.read_text()

          if (
              "import com.duoopen.debug.DuoDiagnostics"
              not in s
          ):
              s = s.replace(
                  "import androidx.window.core.ExperimentalWindowApi\n",
                  "import androidx.window.core.ExperimentalWindowApi\n" +
                      "import com.duoopen.debug.DuoDiagnostics\n",
                  1,
              )

          patches = [
              (
                  "    init {\n        activity.lifecycle.addObserver(this)\n",
                  "    init {\n"
                  "        activity.lifecycle.addObserver(this)\n"
                  "        DuoDiagnostics.event(\"dual\", \"created desired=$desired lifecycle=${activity.lifecycle.currentState}\")\n",
              ),
              (
                  "                    refreshStatus()\n                    if (desired) maybeStart(\"window-area update\")",
                  "                    val diagnosticCap = rearInfo?.getCapability(\n"
                  "                        WindowAreaCapability.Operation.OPERATION_PRESENT_ON_AREA,\n"
                  "                    )?.status\n"
                  "                    DuoDiagnostics.event(\n"
                  "                        \"dual\",\n"
                  "                        \"windowAreas count=${infos.size} cap=$diagnosticCap desired=$desired \" +\n"
                  "                            \"presenter=${presenter != null} inFlight=$requestInFlight\",\n"
                  "                    )\n"
                  "                    refreshStatus()\n"
                  "                    if (desired) maybeStart(\"window-area update\")",
              ),
              (
