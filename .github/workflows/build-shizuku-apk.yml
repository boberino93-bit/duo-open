name: Build Z Fold 7 Smoothness Field Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Apply Fold 7 smoothness patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new, label):
              s = read(path)
              if old not in s:
                  raise SystemExit(
                      f"{label}: expected source not found in {path}"
                  )
              write(path, s.replace(old, new, 1))

          def regex_once(path, pattern, replacement, label):
              s = read(path)
              out, n = re.subn(
                  pattern,
                  replacement,
                  s,
                  count=1,
                  flags=re.S,
              )

              if n != 1:
                  raise SystemExit(
                      f"{label}: expected 1 match in {path}, got {n}"
                  )

              write(path, out)


          # ================================================================
          # 1. HingeAngleSource
          #
          # Samsung's Fold Interactive wallpaper can repeatedly return the
          # same hinge angle.
          #
          # Those repeated values are useful as a heartbeat, but they are NOT
          # real movement and should not keep driving the animation/render
          # pipeline.
          # ================================================================

          p = "app/src/main/java/com/duoopen/fold/HingeAngleSource.kt"

          regex_once(
              p,
              r'''    fun feedExternal\(angle: Float\) \{.*?\n    \}\n\n    fun clearExternal''',
              '''    fun feedExternal(angle: Float) {
                  if (!angle.isFinite()) return

                  val now = SystemClock.uptimeMillis()
                  val next = angle.coerceIn(0f, 180f)

                  externalActive = true
                  externalLastUptime = now

                  // Keep source freshness/rate diagnostics alive, but only
                  // animate when the physical angle actually changed.
                  tickRate(now)
                  lastEventUptime = now

                  val changed =
                      lastAngle.isNaN() ||
                          abs(next - lastAngle) >= EXTERNAL_CHANGE_EPS

                  lastAngle = next

                  if (changed) {
                      onAngle(next)
                  }
              }

              fun clearExternal''',
              "HingeAngleSource.feedExternal",
          )

          replace_once(
              p,
              "        val now = SystemClock.uptimeMillis()\n"
              "        lastEventUptime = now\n"
              "        tickRate(now)\n"
              "        lastAngle = value.coerceIn(0f, 180f)",
              "        val now = SystemClock.uptimeMillis()\n"
              "        tickRate(now)\n"
              "        lastEventUptime = now\n"
              "        lastAngle = value.coerceIn(0f, 180f)",
              "HingeAngleSource rate ordering",
          )

          replace_once(
              p,
              "        const val EXTERNAL_STALE_MS = 3_000L\n"
              "        val STOPS = intArrayOf(0, 90, 180)",
              "        const val EXTERNAL_STALE_MS = 3_000L\n"
              "\n"
              "        // Ignore tiny Samsung wallpaper jitter / duplicates.\n"
              "        const val EXTERNAL_CHANGE_EPS = 0.10f\n"
              "\n"
              "        val STOPS = intArrayOf(0, 90, 180)",
              "HingeAngleSource epsilon",
          )


          # ================================================================
          # 2. FoldOverlayService
          #
          # IMPORTANT PERFORMANCE FIX
          #
          # The existing code calls syncDisplays() on EVERY hinge event.
          #
          # When Shizuku is delivering continuous angles, that means repeated
          # DisplayManager enumeration while we're also trying to animate.
          #
          # DisplayManager already tells us when a display changes, appears or
          # disappears. So remove this work from the high-frequency hinge path.
          # ================================================================

          p = "app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt"

          replace_once(
              p,
              "    private fun onHinge(angle: Float) {\n"
              "        syncDisplays()\n"
              "        for (e in engines.values.toList()) e.onHinge(angle)\n"
              "    }",
              "    private fun onHinge(angle: Float) {\n"
              "        // DisplayManager callbacks own panel topology.\n"
              "        // Keep the high-frequency hinge path render-only.\n"
              "        for (e in engines.values.toList()) {\n"
              "            e.onHinge(angle)\n"
              "        }\n"
              "    }",
              "FoldOverlayService.onHinge",
          )


          # ================================================================
          # 3. ShizukuBridge
          #
          # Samsung's shell-side angle reader ALREADY sends the original
          # timestamp with every angle.
          #
          # The app currently throws that timestamp away.
          #
          # Keep it so we can measure actual end-to-end Shizuku delivery
          # latency on the Fold 7.
          #
          # Also periodically record how long Shizuku screen capture takes.
          # ================================================================

          p = "app/src/full/java/com/duoopen/shell/ShizukuBridge.kt"

          replace_once(
              p,
              "import android.os.Parcel\n"
              "import android.util.Log",
              "import android.os.Parcel\n"
              "import android.os.SystemClock\n"
              "import android.util.Log",
              "ShizukuBridge SystemClock import",
          )

          replace_once(
              p,
              "    private var binding = false\n"
              "    private lateinit var appContext: Context",
              "    private var binding = false\n"
              "    private lateinit var appContext: Context\n"
              "\n"
              "    private val captureSeq =\n"
              "        java.util.concurrent.atomic.AtomicLong()",
              "ShizukuBridge capture counter",
          )

          regex_once(
              p,
              r'''    /\*\* Receives angles from the shell-side wallpaper log reader\. \*/\n    private class AngleCallback.*?\n    fun startAngles\(action: String, onAngle: \(Float\) -> Unit\): Boolean \{\n        val cb = AngleCallback\(onAngle\)''',
              '''    /** Receives angles from the shell-side wallpaper log reader. */
              private class AngleCallback(
                  private val onAngle: (Float, Long) -> Unit,
              ) : Binder() {

                  init {
                      attachInterface(
                          null,
                          ShellProtocol.CALLBACK_TOKEN,
                      )
                  }

                  override fun onTransact(
                      code: Int,
                      data: Parcel,
                      reply: Parcel?,
                      flags: Int,
                  ): Boolean {

                      if (code != ShellProtocol.CB_ANGLE) {
                          return super.onTransact(
                              code,
                              data,
                              reply,
                              flags,
                          )
                      }

                      data.enforceInterface(
                          ShellProtocol.CALLBACK_TOKEN,
                      )

                      val angle = data.readFloat()

                      val sourceUptime =
                          if (
                              data.dataAvail() >=
                              Long.SIZE_BYTES
                          ) {
                              data.readLong()
                          } else {
                              SystemClock.uptimeMillis()
                          }

                      onAngle(
                          angle,
                          sourceUptime,
                      )

                      return true
                  }
              }

              private var angleCallback:
                  AngleCallback? = null

              fun startAngles(
                  action: String,
                  onAngle: (Float, Long) -> Unit,
              ): Boolean {

                  val cb =
                      AngleCallback(onAngle)''',
              "ShizukuBridge angle callback",
          )

          replace_once(
              p,
              "        if (!b.getBoolean(\"ok\")) {\n"
              "            Log.w(TAG, \"shell capture failed: ${b.getString(\"error\")}\")\n"
              "            return null\n"
              "        }\n"
              "        if (b.getBoolean(\"secure\")) return null",
              "        if (!b.getBoolean(\"ok\")) {\n"
              "            Log.w(\n"
              "                TAG,\n"
              "                \"shell capture failed: ${b.getString(\"error\")}\",\n"
              "            )\n"
              "            return null\n"
              "        }\n"
              "\n"
              "        val seq =\n"
              "            captureSeq.incrementAndGet()\n"
              "\n"
              "        val captureMs =\n"
              "            b.getLong(\"ms\")\n"
              "\n"
              "        if (\n"
              "            seq == 1L ||\n"
              "            seq % 20L == 0L\n"
              "        ) {\n"
              "            Log.i(\n"
              "                TAG,\n"
              "                \"capture display=$displayId \" +\n"
              "                    \"scale=$scale ${captureMs}ms\",\n"
              "            )\n"
              "        }\n"
              "\n"
              "        if (b.getBoolean(\"secure\")) {\n"
              "            return null\n"
              "        }",
              "ShizukuBridge capture timing log",
          )


          # ================================================================
          # 4. WallpaperAngleFeed
          #
          # CURRENT BEHAVIOUR:
          #     33 ms polling at all times
          #
          # NEW BEHAVIOUR:
          #
          #     idle:
          #         33 ms (~30 Hz)
          #
          #     while actual hinge movement is detected:
          #         8 ms target (~125 Hz)
          #
          # It returns to the lower idle rate shortly after movement stops.
          #
          # We also expose:
          #
          # - current Shizuku delivery latency
          # - worst delivery latency
          # - current poll interval
          # - duplicate Samsung angle count
          #
          # This makes the Fold 7 itself our field-test rig.
          # ================================================================

          p = "app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt"

          replace_once(
              p,
              "import com.duoopen.fold.HingeAngleSource",
              "import com.duoopen.fold.HingeAngleSource\n"
              "import kotlin.math.abs",
              "WallpaperAngleFeed abs import",
          )

          replace_once(
              p,
              "wallpaper through it at [POLL_MS], and let the Shizuku-side log reader",
              "wallpaper through it at an adaptive cadence, and let the Shizuku-side log reader",
              "WallpaperAngleFeed documentation",
          )

          replace_once(
              p,
              "    private var lastCallbackUptime = 0L",
              "    private var lastCallbackUptime = 0L\n"
              "\n"
              "    private var lastDeliveryLagMs = -1L\n"
              "    private var maxDeliveryLagMs = 0L\n"
              "\n"
              "    private var lastAngleSeen = Float.NaN\n"
              "    private var lastAngleChangeUptime = 0L\n"
              "\n"
              "    private var duplicateAngles = 0L",
              "WallpaperAngleFeed fields",
          )

          replace_once(
              p,
              "            handler.postDelayed(this, POLL_MS)",
              "            handler.postDelayed(\n"
              "                this,\n"
              "                pollInterval(\n"
              "                    SystemClock.uptimeMillis(),\n"
              "                ),\n"
              "            )",
              "WallpaperAngleFeed adaptive polling",
          )

          replace_once(
              p,
              "            status = if (b == null) \"Reader unreachable\" else\n"
              "                \"Reader ${b.getString(\"state\")}: ${b.getInt(\"parsed\")} angles / ${b.getInt(\"lines\")} lines\" +\n"
              "                    (if (age >= 0) \" · last ${age} ms ago\" else \" · nothing received yet\")",
              "            status =\n"
              "                if (b == null) {\n"
              "                    \"Reader unreachable\"\n"
              "                } else {\n"
              "                    \"Reader ${b.getString(\"state\")}: \" +\n"
              "                        \"${b.getInt(\"parsed\")} angles / \" +\n"
              "                        \"${b.getInt(\"lines\")} lines\" +\n"
              "                        (\n"
              "                            if (age >= 0) {\n"
              "                                \" · last ${age} ms ago\"\n"
              "                            } else {\n"
              "                                \" · nothing received yet\"\n"
              "                            }\n"
              "                        ) +\n"
              "                        (\n"
              "                            if (lastDeliveryLagMs >= 0) {\n"
              "                                \" · delivery ${lastDeliveryLagMs} ms \" +\n"
              "                                    \"(max ${maxDeliveryLagMs})\"\n"
              "                            } else {\n"
              "                                \"\"\n"
              "                            }\n"
              "                        ) +\n"
              "                        \" · poll ${pollInterval(SystemClock.uptimeMillis())} ms\" +\n"
              "                        \" · dup $duplicateAngles\"\n"
              "                }",
              "WallpaperAngleFeed status",
          )

          replace_once(
              p,
              "        if (!ShizukuBridge.startAngles(action) { angle -> handler.post { onAngle(angle) } }) {",
              "        if (\n"
              "            !ShizukuBridge.startAngles(\n"
              "                action,\n"
              "            ) { angle, sourceUptime ->\n"
              "                handler.post {\n"
              "                    onAngle(\n"
              "                        angle,\n"
              "                        sourceUptime,\n"
              "                    )\n"
              "                }\n"
              "            }\n"
              "        ) {",
              "WallpaperAngleFeed callback",
          )

          replace_once(
              p,
              "        running = true\n"
              "        startedAt = SystemClock.uptimeMillis()\n"
              "        status = \"Starting\"",
              "        running = true\n"
              "        startedAt =\n"
              "            SystemClock.uptimeMillis()\n"
              "\n"
              "        lastCallbackUptime = 0L\n"
              "        lastDeliveryLagMs = -1L\n"
              "        maxDeliveryLagMs = 0L\n"
              "\n"
              "        lastAngleSeen = Float.NaN\n"
              "        lastAngleChangeUptime = 0L\n"
              "\n"
              "        duplicateAngles = 0L\n"
              "\n"
              "        status = \"Starting\"",
              "WallpaperAngleFeed reset",
          )

          regex_once(
              p,
              r'''    private fun onAngle\(angle: Float\) \{.*?\n    \}\n\n    private fun displayKey''',
              '''    private fun onAngle(
                  angle: Float,
                  sourceUptime: Long,
              ) {
                  if (!running) return

                  val now =
                      SystemClock.uptimeMillis()

                  lastCallbackUptime =
                      now

                  lastDeliveryLagMs =
                      (now - sourceUptime)
                          .coerceAtLeast(0L)

                  if (
                      lastDeliveryLagMs >
                      maxDeliveryLagMs
                  ) {
                      maxDeliveryLagMs =
                          lastDeliveryLagMs
                  }

                  if (
                      lastAngleSeen.isNaN() ||
                      abs(
                          angle -
                              lastAngleSeen,
                      ) >= ANGLE_CHANGE_EPS
                  ) {
                      lastAngleSeen =
                          angle

                      lastAngleChangeUptime =
                          now
                  } else {
                      duplicateAngles++
                  }

                  hinge.feedExternal(angle)
              }

              private fun pollInterval(
                  now: Long,
              ): Long {

                  val moving =
                      lastAngleChangeUptime != 0L &&
                          now -
                          lastAngleChangeUptime <=
                          ACTIVE_BURST_MS

                  return if (moving) {
                      ACTIVE_POLL_MS
                  } else {
                      IDLE_POLL_MS
                  }
              }

              private fun displayKey''',
              "WallpaperAngleFeed onAngle",
          )

          replace_once(
              p,
              "        const val POLL_MS = 33L\n"
              "        private const val STALE_MS = 2_500L",
              "        // Low overhead while the phone is stationary.\n"
              "        const val IDLE_POLL_MS = 33L\n"
              "\n"
              "        // Near-display-refresh polling while moving.\n"
              "        const val ACTIVE_POLL_MS = 8L\n"
              "\n"
              "        // Remain in fast mode briefly after the last movement.\n"
              "        const val ACTIVE_BURST_MS = 900L\n"
              "\n"
              "        const val ANGLE_CHANGE_EPS = 0.10f\n"
              "\n"
              "        private const val STALE_MS = 2_500L",
              "WallpaperAngleFeed constants",
          )


          # ================================================================
          # 5. PanelEngine
          #
          # TWO MAJOR SMOOTHNESS FIXES
          #
          # A)
          # Samsung's real continuous hinge angle deserves a tighter follower
          # than the public coarse sensor.
          #
          # B)
          # The old live-capture loop effectively did:
          #
          #       capture (~50 ms)
          #       +
          #       wait 80 ms
          #
          # That can mean only ~7-8 screen-image updates per second.
          #
          # The new loop schedules the next capture relative to the START of
          # the previous capture.
          #
          # This removes the unnecessary extra delay.
          # ================================================================

          p = "app/src/full/java/com/duoopen/overlay/PanelEngine.kt"

          replace_once(
              p,
              "        }.also { it.snap(startTilt) }",
              "        }.also {\n"
              "            it.snap(startTilt)\n"
              "\n"
              "            if (\n"
              "                hinge.externalActive &&\n"
              "                easeTo == null\n"
              "            ) {\n"
              "                it.tauS =\n"
              "                    SAMSUNG_LIVE_TAU_S\n"
              "            }\n"
              "        }",
              "PanelEngine follower",
          )

          regex_once(
              p,
              r'''    private fun startLiveLoop\(\) \{.*?\n    \}\n\n    private fun clearOverlayState''',
              '''    private fun startLiveLoop() {
                  if (liveLoop) return

                  liveLoop = true

                  val myGen =
                      captureGen

                  var frames = 0

                  fun tick() {
                      if (
                          !liveLoop ||
                          phase != Phase.SHOWING ||
                          myGen != captureGen
                      ) {
                          liveLoop = false
                          return
                      }

                      val s =
                          surface as?
                              SnapshotSurface

                      if (
                          s == null ||
                          s.tilt <
                          DuoShader.FLAT_EPSILON
                      ) {
                          handler.postDelayed(
                              { tick() },
                              LIVE_RETRY_MS,
                          )
                          return
                      }

                      val excluded =
                          excludedLayers()

                      if (excluded.isEmpty()) {
                          handler.postDelayed(
                              { tick() },
                              LIVE_RETRY_MS,
                          )
                          return
                      }

                      val frameStarted =
                          SystemClock.uptimeMillis()

                      scope.launch {
                          val frame =
                              withContext(
                                  Dispatchers.IO,
                              ) {
                                  ShizukuBridge.capture(
                                      displayId,
                                      excluded,
                                      LIVE_SHELL_SCALE,
                                  )
                              }

                          if (
                              liveLoop &&
                              phase ==
                              Phase.SHOWING &&
                              myGen ==
                              captureGen &&
                              frame != null &&
                              !bridging
                          ) {
                              (
                                  surface as?
                                      SnapshotSurface
                              )?.replaceSnapshot(
                                  frame,
                              )

                              frames++

                              if (
                                  frames == 1 ||
                                  frames % 25 == 0
                              ) {
                                  Log.i(
                                      TAG,
                                      "display $displayId: " +
                                          "live frame $frames " +
                                          "(${frame.width}x${frame.height})",
                                  )
                              }
                          }

                          val nextDelay =
                              if (frame == null) {
                                  LIVE_RETRY_MS
                              } else {
                                  (
                                      frameStarted +
                                          LIVE_FRAME_PERIOD_MS -
                                          SystemClock.uptimeMillis()
                                      )
                                      .coerceAtLeast(
                                          0L,
                                      )
                              }

                          handler.postDelayed(
                              { tick() },
                              nextDelay,
                          )
                      }
                  }

                  handler.postDelayed(
                      { tick() },
                      LIVE_START_DELAY_MS,
                  )
              }

              private fun clearOverlayState''',
              "PanelEngine live loop",
          )

          replace_once(
              p,
              "        const val REST_LEAVE_TILT = 3f",
              "        const val REST_LEAVE_TILT = 2f",
              "PanelEngine rest threshold",
          )

          replace_once(
              p,
              "        /** Shizuku capture: full-size first frame, half-size live frames at ~12 fps. */\n"
              "        const val INITIAL_SHELL_SCALE = 1f\n"
              "        const val LIVE_SHELL_SCALE = 0.5f\n"
              "        const val LIVE_INTERVAL_MS = 80L\n"
              "        const val SHELL_RETRY_MS = 60L",
              "        /**\n"
              "         * Full resolution for the initial frame.\n"
              "         *\n"
              "         * Live frames trade some resolution for latency because\n"
              "         * they are visible only briefly under the fold shader.\n"
              "         */\n"
              "        const val INITIAL_SHELL_SCALE = 1f\n"
              "\n"
              "        const val LIVE_SHELL_SCALE = 0.40f\n"
              "\n"
              "        // Target roughly 20 fps. Actual cadence naturally falls\n"
              "        // back to capture speed if the device cannot sustain it.\n"
              "        const val LIVE_FRAME_PERIOD_MS = 48L\n"
              "\n"
              "        const val LIVE_START_DELAY_MS = 12L\n"
              "\n"
              "        const val LIVE_RETRY_MS = 80L\n"
              "\n"
              "        // Lower latency tracking for Samsung continuous angles.\n"
              "        const val SAMSUNG_LIVE_TAU_S = 0.028f\n"
              "\n"
              "        const val SHELL_RETRY_MS = 60L",
              "PanelEngine live constants",
          )


          # ================================================================
          # 6. Version
          # ================================================================

          p = "app/build.gradle.kts"

          replace_once(
              p,
              "versionCode = 4",
              "versionCode = 5",
              "versionCode",
          )

          replace_once(
              p,
              'versionName = "1.3.0"',
              'versionName = "1.3.1-zfold7-smooth"',
              "versionName",
          )

          print(
              "Fold 7 smoothness + Shizuku field-test patch applied."
          )

          PY


      - name: Validate patch
        run: |
          git diff --check
          git diff --stat

          mkdir -p zfold7-artifacts

          git diff \
            > zfold7-artifacts/zfold7-smoothness.patch


      - name: Compile, unit test, and build
        run: |
          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace


      - name: Prepare APK
        run: |
          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "Debug APK not found."
            exit 1
          fi

          cp \
            "$APK" \
            zfold7-artifacts/DuoOpen-ZFold7-smooth-debug.apk

          {
            echo "commit=${GITHUB_SHA}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo

            sha256sum \
              zfold7-artifacts/DuoOpen-ZFold7-smooth-debug.apk

          } > zfold7-artifacts/BUILD-INFO.txt

          cat \
            zfold7-artifacts/BUILD-INFO.txt


      - name: Upload field-test artifacts
        uses: actions/upload-artifact@v4

        with:
          name: DuoOpen-ZFold7-smooth

          path: |
            zfold7-artifacts/DuoOpen-ZFold7-smooth-debug.apk
            zfold7-artifacts/zfold7-smoothness.patch
            zfold7-artifacts/BUILD-INFO.txt

          if-no-files-found: error

          retention-days: 30