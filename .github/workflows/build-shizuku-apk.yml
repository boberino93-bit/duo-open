name: Build Z Fold 7 Debug Variants

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Create artifact directory
        run: mkdir -p zfold7-artifacts

      # ================================================================
      # ITERATION 1 — CORE Z FOLD 7 FIXES
      # ================================================================

      - name: Apply core fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()

              if old not in s:
                  raise SystemExit(
                      f"Could not find expected text in {path}:\n{old}"
                  )

              p.write_text(s.replace(old, new, 1))


          # ------------------------------------------------------------
          # HingeAngleSource
          #
          # Do not treat duplicate Samsung wallpaper readings as actual
          # physical hinge movement.
          # ------------------------------------------------------------

          p = "app/src/main/java/com/duoopen/fold/HingeAngleSource.kt"

          replace(
              p,
              '''    fun feedExternal(angle: Float) {
                  if (!angle.isFinite()) return
                  val now = SystemClock.uptimeMillis()
                  externalActive = true
                  externalLastUptime = now
                  lastEventUptime = now
                  tickRate(now)
                  lastAngle = angle.coerceIn(0f, 180f)
                  onAngle(lastAngle)
              }''',
              '''    fun feedExternal(angle: Float) {
                  if (!angle.isFinite()) return

                  val now = SystemClock.uptimeMillis()

                  externalActive = true
                  externalLastUptime = now

                  // Keep the Shizuku source heartbeat alive without treating
                  // repeated identical wallpaper replies as hinge movement.
                  tickRate(now)
                  lastEventUptime = now

                  val next = angle.coerceIn(0f, 180f)

                  val changed =
                      lastAngle.isNaN() ||
                          abs(next - lastAngle) >= EXTERNAL_CHANGE_EPS

                  lastAngle = next

                  if (changed) {
                      onAngle(next)
                  }
              }'''
          )

          # Fix event-rate calculation ordering for the normal sensor path.
          replace(
              p,
              '''        val now = SystemClock.uptimeMillis()
                  lastEventUptime = now
                  tickRate(now)
                  lastAngle = value.coerceIn(0f, 180f)''',
              '''        val now = SystemClock.uptimeMillis()
                  tickRate(now)
                  lastEventUptime = now
                  lastAngle = value.coerceIn(0f, 180f)'''
          )

          replace(
              p,
              '''        const val EXTERNAL_STALE_MS = 3_000L
                  val STOPS = intArrayOf(0, 90, 180)''',
              '''        const val EXTERNAL_STALE_MS = 3_000L

                  // Small deadband for Samsung wallpaper angle jitter.
                  const val EXTERNAL_CHANGE_EPS = 0.15f

                  val STOPS = intArrayOf(0, 90, 180)'''
          )


          # ------------------------------------------------------------
          # FoldOverlayService
          #
          # Display enumeration does not belong