name: Build Z Fold 7 Physical Cover Handoff 1.3.15

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Replay last successful Fold7 geometry build
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          # Run 38 / successful 1.3.13r geometry-glass build.
          previous_commit = "fc41750970a5270274ea1f9ce6502921d40c2581"

          previous_workflow = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{previous_commit}:.github/workflows/build-shizuku-apk.yml",
              ],
              text=True,
          )

          lines = previous_workflow.splitlines()

          wanted_steps = [
              "Replay proven 1.3.11 continuity build",
              "Replace mirror crop with owned pane container",
              "Validate pane-container pass",
              "Switch to AOSP setGeometry and restore bidirectional fold animation",
              "Validate 1.3.13 geometry continuity pass",
              "Graft zfoldduo glass and bidirectional motion behavior",
              "Validate revised 1.3.13 graft",
          ]

          def extract_run_block(step_name: str) -> str:
              step_start = None

              for index, line in enumerate(lines):
                  if line.strip() == f"- name: {step_name}":
                      step_start = index
                      break

              if step_start is None:
                  raise SystemExit(
                      f"Previous workflow step not found: {step_name}"
                  )

              run_line = None

              for index in range(step_start + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  if line.strip() == "run: |":
                      run_line = index
                      break

              if run_line is None:
                  raise SystemExit(
                      f"run: | block not found for: {step_name}"
                  )

              block = []

              for index in range(run_line + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  block.append(line)

              return textwrap.dedent("\n".join(block))

          for step_name in wanted_steps:
              script = extract_run_block(step_name)

              script_path = Path(
                  "/tmp/" +
                  re.sub(
                      r"[^A-Za-z0-9]+",
                      "-",
                      step_name,
                  ).strip("-") +
                  ".sh"
              )

              script_path.write_text(
                  "set -euo pipefail\n" +
                  script +
                  "\n"
              )

              print(f"Replaying proven step: {step_name}")

              subprocess.run(
                  ["bash", str(script_path)],
                  check=True,
              )
          PY

      - name: Fix Fold7 physical panel handoff
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text()

          def save(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new, label):
              text = load(path)

              if old not in text:
                  raise SystemExit(
                      f"{label}: expected source not found in {path}"
                  )

              save(
                  path,
                  text.replace(
                      old,
                      new,
                      1,
                  ),
              )

          def regex_replace_once(
              path,
              pattern,
              replacement,
              label,
          ):
              text = load(path)

              updated, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=re.S,
              )

              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one match "
                      f"in {path}; got {count}"
                  )

              save(
                  path,
                  updated,
              )

          service_path = (
              "app/src/full/java/com/duoopen/overlay/"
              "FoldOverlayService.kt"
          )

          # ---------------------------------------------------------------
          # Fold7 topology rule:
          #
          # Logical display IDs are NOT physical-panel identities.
          #
          # Samsung may remap:
          #
          #     logical 0
          #     logical 1
          #
          # during folding/unfolding.
          #
          # Physical Fold7 identities:
          #
          # INNER
          #   1968 x 2184
          #   local:4630946449689556883
          #   port 147
          #
          # COVER
          #   1080 x 2520
          #   local:4630946872173396372
          #   port 148
          #
          # Exact unique identity is preferred when available.
          # Physical geometry is the fallback.
          #
          # Cover becoming DEFAULT_DISPLAY must NOT by itself destroy the
          # SurfaceFlinger continuity host.
          # ---------------------------------------------------------------

          regex_replace_once(
              service_path,
              r'''    private fun syncMirrorHost\(
                  reason: String,
              \) \{
          .*?
              \}

              private fun safeToReleaseSecondaryPanel\(\): Boolean \{''',
              '''    private fun syncMirrorHost(
                  reason: String,
              ) {
                  if (!mirrorRequested) {
                      return
                  }

                  val allDisplays =
                      displayManager.displays.toList()

                  fun displayUniqueId(
                      candidate: Display,
                  ): String? =
                      runCatching {
                          org.lsposed.hiddenapibypass.HiddenApiBypass
                              .addHiddenApiExemptions(
                                  "Landroid/view/Display;"
                              )

                          candidate.javaClass
                              .getDeclaredMethod(
                                  "getUniqueId"
                              )
                              .apply {
                                  isAccessible = true
                              }
                              .invoke(candidate)
                              as? String
                      }.getOrNull()

                  fun isActive(
                      candidate: Display,
                  ): Boolean =
                      candidate.state !=
                          Display.STATE_OFF &&
                          candidate.state !=
                          Display.STATE_UNKNOWN

                  fun hasInnerGeometry(
                      candidate: Display,
                  ): Boolean {
                      val mode =
                          candidate.mode

                      return (
                          mode.physicalWidth ==
                              FOLD7_INNER_WIDTH &&
                              mode.physicalHeight ==
                              FOLD7_INNER_HEIGHT
                      )
                  }

                  fun hasCoverGeometry(
                      candidate: Display,
                  ): Boolean {
                      val mode =
                          candidate.mode

                      return (
                          mode.physicalWidth ==
                              FOLD7_COVER_WIDTH &&
                              mode.physicalHeight ==
                              FOLD7_COVER_HEIGHT
                      )
                  }

                  val exactInner =
                      allDisplays.firstOrNull { candidate ->
                          displayUniqueId(candidate) ==
                              FOLD7_INNER_UNIQUE_ID
                      }

                  val exactCover =
                      allDisplays.firstOrNull { candidate ->
                          displayUniqueId(candidate) ==
                              FOLD7_COVER_UNIQUE_ID
                      }

                  val inner =
                      exactInner
                          ?: allDisplays.firstOrNull(
                              ::hasInnerGeometry
                          )

                  val cover =
                      exactCover
                          ?: allDisplays.firstOrNull(
                              ::hasCoverGeometry
                          )

                  val activeInner =
                      inner?.takeIf(
                          ::isActive
                      )

                  val activeCover =
                      cover?.takeIf(
                          ::isActive
                      )

                  com.duoopen.debug.DuoDiagnostics.event(
                      "live-mirror",
                      "physical topology reason=$reason " +
                          "innerId=${inner?.displayId} " +
                          "innerUnique=${inner?.let(::displayUniqueId)} " +
                          "innerMode=${inner?.mode?.physicalWidth}x" +
                          "${inner?.mode?.physicalHeight} " +
                          "innerState=${inner?.state} " +
                          "coverId=${cover?.displayId} " +
                          "coverUnique=${cover?.let(::displayUniqueId)} " +
                          "coverMode=${cover?.mode?.physicalWidth}x" +
                          "${cover?.mode?.physicalHeight} " +
                          "coverState=${cover?.state} " +
                          "defaultLogical=${Display.DEFAULT_DISPLAY} " +
                          "hostId=${mirrorHost?.displayId} " +
                          "hostUsable=${mirrorHost?.isUsable == true}",
                  )

                  /*
                   * Samsung may temporarily remove the physical cover from
                   * DisplayManager while assigning it a new logical ID.
                   *
                   * Do not tear down the current host during that window.
                   */
                  if (cover == null) {
                      _secondaryDisplayStatus.value =
                          "Cover topology is remapping; " +
                              "retaining the existing continuity host."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "physical cover temporarily missing; " +
                              "host retained reason=$reason " +
                              "usable=${mirrorHost?.isUsable == true}",
                      )

                      return
                  }

                  /*
                   * Likewise, an OFF/UNKNOWN cover may simply be between
                   * topology states. Keep the host until Samsung reports
                   * the next usable state.
                   */
                  if (activeCover == null) {
                      _secondaryDisplayStatus.value =
                          "Physical cover is currently inactive; " +
                              "waiting for Fold7 topology."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "physical cover inactive; " +
                              "host retained for transition " +
                              "reason=$reason " +
                              "cover=${cover.displayId}",
                      )

                      return
                  }

                  /*
                   * A completely missing inner Display can also be a short
                   * remap window.
                   *
                   * Missing != confirmed powered off.
                   */
                  if (inner == null) {
                      _secondaryDisplayStatus.value =
                          "Inner topology is remapping; " +
                              "retaining the existing continuity host."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "physical inner temporarily missing; " +
                              "host retained reason=$reason " +
                              "usable=${mirrorHost?.isUsable == true}",
                      )

                      return
                  }

                  /*
                   * CRITICAL:
                   *
                   * Do NOT special-case Display.DEFAULT_DISPLAY.
                   *
                   * The physical COVER can become logical display 0.
                   *
                   * That is an ID remap, not proof that the continuity
                   * operation is finished.
                   */
                  if (activeInner == null) {
                      _secondaryDisplayStatus.value =
                          "Physical inner panel is OFF; " +
                              "native cover owns the completed topology."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "inner inactive after topology settle " +
                              "reason=$reason " +
                              "cover=${activeCover.displayId} " +
                              "coverDefault=" +
                              (
                                  activeCover.displayId ==
                                      Display.DEFAULT_DISPLAY
                              ),
                      )

                      /*
                       * Let DisplayMirrorHost verify that its physical source
                       * has actually disappeared and release the stale mirror.
                       */
                      mirrorHost?.refresh(
                          "inner-inactive:$reason"
                      )

                      return
                  }

                  /*
                   * Defensive guard. Geometry/identity resolution must never
                   * resolve both physical panels to one logical display.
                   */
                  if (
                      activeInner.displayId ==
                          activeCover.displayId
                  ) {
                      _secondaryDisplayStatus.value =
                          "Fold7 physical panel identities temporarily " +
                              "collapsed to one logical display; " +
                              "waiting for remap."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "same logical id after physical resolve " +
                              "reason=$reason " +
                              "id=${activeCover.displayId}",
                      )

                      return
                  }

                  val current =
                      mirrorHost

                  /*
                   * If Samsung changed the cover's logical ID, rebuild the
                   * accessibility-window host on the newly mapped logical
                   * Display object.
                   *
                   * Physical COVER identity stays the same.
                   */
                  if (
                      current == null ||
                      current.displayId !=
                          activeCover.displayId ||
                      !current.isUsable
                  ) {
                      current?.detach()

                      mirrorHost =
                          DisplayMirrorHost(
                              service = this,
                              display = activeCover,
                              scope = scope,
                              onStatus = { message ->
                                  _secondaryDisplayStatus.value =
                                      message
                              },
                          ).also {
                              it.attach()
                          }

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "physical cover host created/rebound " +
                              "reason=$reason " +
                              "coverLogical=${activeCover.displayId} " +
                              "coverUnique=" +
                              "${displayUniqueId(activeCover)} " +
                              "innerLogical=${activeInner.displayId} " +
                              "innerUnique=" +
                              "${displayUniqueId(activeInner)} " +
                              "coverIsDefault=" +
                              (
                                  activeCover.displayId ==
                                      Display.DEFAULT_DISPLAY
                              ),
                      )

                      return
                  }

                  /*
                   * Same physical cover, same current logical destination.
                   * Keep the existing SurfaceControl tree alive.
                   */
                  current.refresh(
                      "physical-stable:$reason"
                  )
              }

              private fun safeToReleaseSecondaryPanel(): Boolean {''',
              "FoldOverlayService physical Fold7 topology resolution",
          )

          # ---------------------------------------------------------------
          # Add verified Fold7 physical constants.
          #
          # These are physical identifiers only.
          #
          # They must NEVER be interpreted as logical display numbers.
          # ---------------------------------------------------------------

          regex_replace_once(
              service_path,
              r'''    companion object \{''',
              '''    companion object {
                  const val FOLD7_INNER_WIDTH =
                      1968

                  const val FOLD7_INNER_HEIGHT =
                      2184

                  const val FOLD7_COVER_WIDTH =
                      1080

                  const val FOLD7_COVER_HEIGHT =
                      2520

                  const val FOLD7_INNER_UNIQUE_ID =
                      "local:4630946449689556883"

                  const val FOLD7_COVER_UNIQUE_ID =
                      "local:4630946872173396372"
          ''',
              "FoldOverlayService Fold7 physical constants",
          )

          mirror_path = (
              "app/src/full/java/com/duoopen/overlay/"
              "DisplayMirrorHost.kt"
          )

          # ---------------------------------------------------------------
          # Make the SurfaceFlinger mirror source physical-identity aware.
          #
          # Current implementation only searched geometry. Keep that fallback,
          # but prefer the verified Fold7 inner physical display ID.
          # ---------------------------------------------------------------

          regex_replace_once(
              mirror_path,
              r'''              private fun findInnerDisplay\(\): Display\? =
                  displayManager\.displays
                      \.firstOrNull \{ candidate ->
          .*?
                      \}

              private fun bind\(reason: String\) \{''',
              '''              private fun findInnerDisplay(): Display? {
                  val displays =
                      displayManager.displays.toList()

                  fun uniqueId(
                      candidate: Display,
                  ): String? =
                      runCatching {
                          org.lsposed.hiddenapibypass.HiddenApiBypass
                              .addHiddenApiExemptions(
                                  "Landroid/view/Display;"
                              )

                          candidate.javaClass
                              .getDeclaredMethod(
                                  "getUniqueId"
                              )
                              .apply {
                                  isAccessible = true
                              }
                              .invoke(candidate)
                              as? String
                      }.getOrNull()

                  fun active(
                      candidate: Display,
                  ): Boolean =
                      candidate.state !=
                          Display.STATE_OFF &&
                          candidate.state !=
                          Display.STATE_UNKNOWN

                  val exact =
                      displays.firstOrNull { candidate ->
                          active(candidate) &&
                              uniqueId(candidate) ==
                              INNER_UNIQUE_ID
                      }

                  if (exact != null) {
                      return exact
                  }

                  return displays.firstOrNull { candidate ->
                      if (!active(candidate)) {
                          false
                      } else {
                          val mode =
                              candidate.mode

                          mode.physicalWidth ==
                              INNER_WIDTH &&
                              mode.physicalHeight ==
                              INNER_HEIGHT
                      }
                  }
              }

              private fun bind(reason: String) {''',
              "DisplayMirrorHost physical inner resolution",
          )

          # ---------------------------------------------------------------
          # Add verified physical inner ID to DisplayMirrorHost.
          # ---------------------------------------------------------------

          replace_once(
              mirror_path,
              '''              private companion object {
                  const val INNER_WIDTH = 1968
                  const val INNER_HEIGHT = 2184
              }''',
              '''              private companion object {
                  const val INNER_WIDTH = 1968
                  const val INNER_HEIGHT = 2184

                  const val INNER_UNIQUE_ID =
                      "local:4630946449689556883"
              }''',
              "DisplayMirrorHost physical inner constant",
          )

          # ---------------------------------------------------------------
          # Once the physical inner panel is genuinely inactive, don't leave
          # an obsolete mirrored SurfaceControl frozen above native cover UI.
          # ---------------------------------------------------------------

          replace_once(
              mirror_path,
              '''                  if (source == null) {
                      onStatus("Waiting for the Fold7 inner display.")

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "inner source missing reason=$reason " +
                              "destination=$displayId hinge=$latestHingeAngle " +
                              "direction=$hingeDirection",
                      )
                      return
                  }''',
              '''                  if (source == null) {
                      mirrorSourceKey = null

                      releaseAppMirror()

                      scope.launch(
                          Dispatchers.IO
                      ) {
                          ShizukuBridge.stopDisplayMirror()
                      }

                      onStatus(
                          "Physical inner panel is inactive; " +
                              "released stale mirror for native cover."
                      )

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "physical inner source unavailable; " +
                              "mirror released " +
                              "reason=$reason " +
                              "destination=$displayId " +
                              "hinge=$latestHingeAngle " +
                              "direction=$hingeDirection",
                      )

                      return
                  }''',
              "DisplayMirrorHost stale source release",
          )

          # ---------------------------------------------------------------
          # Separate version for this isolated topology/handoff experiment.
          # ---------------------------------------------------------------

          gradle_path =
              Path(
                  "app/build.gradle.kts"
              )

          gradle =
              gradle_path.read_text()

          if "versionCode = 18" not in gradle:
              raise SystemExit(
                  "Expected geometry-glass versionCode 18 was not found."
              )

          if (
              'versionName = "1.3.13r-zfold7-geometry-glass"'
              not in gradle
          ):
              raise SystemExit(
                  "Expected geometry-glass versionName was not found."
              )

          gradle =
              gradle.replace(
                  "versionCode = 18",
                  "versionCode = 19",
                  1,
              )

          gradle =
              gradle.replace(
                  'versionName = "1.3.13r-zfold7-geometry-glass"',
                  'versionName = "1.3.15-zfold7-physical-handoff"',
                  1,
              )

          gradle_path.write_text(
              gradle
          )
          PY

      - name: Validate Fold7 physical handoff fix
        run: |
          set -euo pipefail

          git diff --check

          grep -R -F \
            'local:4630946449689556883' \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt

          grep -R -F \
            'local:4630946872173396372' \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt

          grep -R -F \
            'physical cover host created/rebound' \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt

          grep -R -F \
            'coverIsDefault=' \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt

          grep -R -F \
            'INNER_UNIQUE_ID' \
            app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt

          grep -R -F \
            'physical inner source unavailable; mirror released' \
            app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt

          grep -R -F \
            '1.3.15-zfold7-physical-handoff' \
            app/build.gradle.kts

          # -------------------------------------------------------------
          # Regression guards.
          #
          # These were the incorrect assumptions in the previous build.
          # -------------------------------------------------------------

          if grep -R -F \
            'coverIsNativePrimary' \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt
          then
            echo \
              "ERROR: old logical-default-display teardown path still exists."

            exit 1
          fi

          if grep -R -F \
            'Native cover is primary; temporary geometry mirror released.' \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt
          then
            echo \
              "ERROR: old native-cover mirror release behavior still exists."

            exit 1
          fi

          mkdir -p \
            zfold7-artifacts

          git diff > \
            zfold7-artifacts/zfold7-physical-handoff.patch

          git diff --stat

      - name: Compile, unit test, and build
        run: |
          set -euo pipefail

          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

      - name: Prepare field-test APK
        run: |
          set -euo pipefail

          mkdir -p \
            zfold7-artifacts

          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "Debug APK not found."
            exit 1
          fi

          OUTPUT_APK="zfold7-artifacts/DuoOpen-ZFold7-physical-handoff-1.3.15-debug.apk"

          cp \
            "$APK" \
            "$OUTPUT_APK"

          {
            echo "commit=${GITHUB_SHA}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=1.3.15-zfold7-physical-handoff"
            echo "versionCode=19"

            echo \
              "target=Samsung Galaxy Z Fold7 SM-F966W"

            echo \
              "android=16"

            echo \
              "innerGeometry=1968x2184"

            echo \
              "coverGeometry=1080x2520"

            echo \
              "innerPhysicalId=local:4630946449689556883"

            echo \
              "innerPort=147"

            echo \
              "coverPhysicalId=local:4630946872173396372"

            echo \
              "coverPort=148"

            echo \
              "baseWorkflowCommit=fc41750970a5270274ea1f9ce6502921d40c2581"

            echo \
              "pass=physical-panel-identity+logical-id-remap+geometry-continuity+89.5deg-glass+bidirectional-motion"

            echo

            sha256sum \
              "$OUTPUT_APK"

          } > \
            zfold7-artifacts/BUILD-INFO-1.3.15.txt

          cat \
            zfold7-artifacts/BUILD-INFO-1.3.15.txt

      - name: Upload field-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-physical-handoff-1.3.15

          path: |
            zfold7-artifacts/DuoOpen-ZFold7-physical-handoff-1.3.15-debug.apk
            zfold7-artifacts/zfold7-pane-container.patch
            zfold7-artifacts/zfold7-geometry-continuity.patch
            zfold7-artifacts/zfold7-geometry-continuity-revised.patch
            zfold7-artifacts/zfold7-physical-handoff.patch
            zfold7-artifacts/BUILD-INFO-1.3.15.txt

          if-no-files-found: error
          retention-days: 30