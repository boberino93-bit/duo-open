name: Build Z Fold 7 Field Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Conflict guard
        run: |
          check_blob() {
            path="$1"
            expected="$2"
            actual="$(git hash-object "$path")"

            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Source changed since this diagnostic pass was designed. Expected $expected but found $actual. Stopping instead of overwriting newer work."
              exit 1
            fi
          }

          check_blob "app/src/main/java/com/duoopen/fold/HingeAngleSource.kt" "da3fe9abda7795bfd714d4b5074acf90a1b91c48"
          check_blob "app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt" "7610633d11dc8bdb3667e2670cace595305f853e"
          check_blob "app/src/full/java/com/duoopen/shell/ShizukuBridge.kt" "4600ea293222c94cca02310734850a78e6cc62bd"
          check_blob "app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt" "fdc4f607ed8e8e7d03df4223bd79dac36be93952"
          check_blob "app/src/full/java/com/duoopen/overlay/PanelEngine.kt" "a1285f81ffe5e1f7d7e0f46e86b4e7bef747e5ae"
          check_blob "app/build.gradle.kts" "dcbfbaf660fd2efd4f625569affc1db738e52ec8"
          check_blob "app/src/main/java/com/duoopen/DualScreen.kt" "5c89b33a4970ee87a08671f47b1edebaf57c5d90"
          check_blob "app/src/main/java/com/duoopen/ui/ControlSheet.kt" "7f88ae6a7f6ce8452c8c8f17d1b2627442eaea6f"
          check_blob "app/src/main/java/com/duoopen/ui/DuoApp.kt" "d4d2a66adc94645e7347a184b5598b0d95575d67"

          if [ -e "app/src/main/java/com/duoopen/diagnostics/DuoDiagnostics.kt" ]; then
            echo "::error::DuoDiagnostics.kt already exists. Reconcile the newer diagnostics implementation instead of overwriting it."
            exit 1
          fi

          echo "Conflict guard passed."

      - name: Restore last known-good smoothness and dual-screen pass
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import re
          import subprocess
          import textwrap

          BASE_WORKFLOW_COMMIT = "b589534faf84f47d51ad91675138c824ccac08a6"

          old = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{BASE_WORKFLOW_COMMIT}:.github/workflows/build-shizuku-apk.yml",
              ],
              text=True,
          )

          patch_match = re.search(
              r"printf '%s' '([^']+)' \| base64 -d \| gzip -d > /tmp/zfold7-smoothness\.patch",
              old,
          )

          if not patch_match:
              raise SystemExit(
                  "Could not recover the proven smoothness patch from the last known-good workflow."
              )

          patch_bytes = gzip.decompress(
              base64.b64decode(
                  patch_match.group(1)
              )
          )

          Path(
              "/tmp/zfold7-smoothness.patch"
          ).write_bytes(
              patch_bytes
          )

          dual_match = re.search(
              r"cat > app/src/main/java/com/duoopen/DualScreen\.kt <<'KOTLIN'\n(.*?)\n\s+KOTLIN",
              old,
              flags=re.S,
          )

          if not dual_match:
              raise SystemExit(
                  "Could not recover the proven persistent DualScreen implementation from the last known-good workflow."
              )

          dual_source = textwrap.dedent(
              dual_match.group(1)
          )

          Path(
              "/tmp/DualScreen-persistent.kt"
          ).write_text(
              dual_source
          )

          print(
              "Recovered proven smoothness patch and persistent dual-screen source."
          )
          PY

          git apply --check /tmp/zfold7-smoothness.patch
          git apply /tmp/zfold7-smoothness.patch

          cp \
            /tmp/DualScreen-persistent.kt \
            app/src/main/java/com/duoopen/DualScreen.kt

      - name: Add rolling on-device diagnostics
        run: |
          mkdir -p \
            app/src/main/java/com/duoopen/diagnostics

          cat > app/src/main/java/com/duoopen/diagnostics/DuoDiagnostics.kt <<'KOTLIN'
          package com.duoopen.diagnostics

          import android.app.KeyguardManager
          import android.content.Context
          import android.hardware.display.DisplayManager
          import android.os.Build
          import android.os.PowerManager
          import android.os.SystemClock
          import android.view.Display
          import java.io.File
          import java.time.Instant
          import java.util.Locale

          /**
           * Small persistent field recorder for Fold lifecycle/display debugging.
           *
           * It records Duo Open state transitions and Android display state only.
           * It does not capture screen contents, notifications, typed text,
           * passwords, clipboard contents, or other app data.
           */
          object DuoDiagnostics {

              private const val FILE_NAME =
                  "duo-open-field-diagnostics.log"

              private const val MAX_BYTES =
                  128 * 1024L

              private const val TRIM_TO_BYTES =
                  64 * 1024

              private val lock =
                  Any()

              fun record(
                  context: Context,
                  category: String,
                  message: String,
              ) {
                  val app =
                      context.applicationContext

                  val line =
                      buildString {
                          append(
                              Instant.now()
                                  .toString()
                          )
                          append(
                              " up="
                          )
                          append(
                              SystemClock.uptimeMillis()
                          )
                          append(
                              " ["
                          )
                          append(
                              category
                          )
                          append(
                              "] "
                          )
                          append(
                              sanitize(message)
                          )
                          append(
                              " | "
                          )
                          append(
                              compactSystemState(app)
                          )
                          append(
                              '\n'
                          )
                      }

                  synchronized(lock) {
                      runCatching {
                          val file =
                              logFile(app)

                          if (
                              file.exists() &&
                              file.length() >
                              MAX_BYTES
                          ) {
                              val old =
                                  file.readText()

                              file.writeText(
                                  old.takeLast(
                                      TRIM_TO_BYTES,
                                  )
                              )

                              file.appendText(
                                  "\n--- rolling log trimmed ---\n"
                              )
                          }

                          file.appendText(
                              line
                          )
                      }
                  }
              }

              fun clear(
                  context: Context,
              ) {
                  val app =
                      context.applicationContext

                  synchronized(lock) {
                      runCatching {
                          logFile(app)
                              .delete()
                      }
                  }

                  record(
                      app,
                      "DIAG",
                      "diagnostics cleared",
                  )
              }

              fun report(
                  context: Context,
              ): String {
                  val app =
                      context.applicationContext

                  val contents =
                      synchronized(lock) {
                          runCatching {
                              logFile(app)
                                  .takeIf {
                                      it.exists()
                                  }
                                  ?.readText()
                                  .orEmpty()
                          }.getOrDefault(
                              ""
                          )
                      }

                  return buildString {
                      appendLine(
                          "Duo Open field diagnostics"
                      )
                      appendLine(
                          "generated=${Instant.now()}"
                      )
                      appendLine(
                          "device=${Build.MANUFACTURER} ${Build.MODEL} (${Build.DEVICE})"
                      )
                      appendLine(
                          "android=${Build.VERSION.RELEASE} sdk=${Build.VERSION.SDK_INT}"
                      )
                      appendLine(
                          "current=${fullSystemState(app)}"
                      )
                      appendLine()
                      appendLine(
                          "Rolling event log:"
                      )

                      if (
                          contents.isBlank()
                      ) {
                          appendLine(
                              "(empty)"
                          )
                      } else {
                          append(
                              contents
                          )
                      }
                  }
              }

              private fun logFile(
                  context: Context,
              ): File =
                  File(
                      context.filesDir,
                      FILE_NAME,
                  )

              private fun sanitize(
                  value: String,
              ): String =
                  value
                      .replace(
                          '\n',
                          ' ',
                      )
                      .replace(
                          '\r',
                          ' ',
                      )

              private fun compactSystemState(
                  context: Context,
              ): String {

                  val power =
                      context.getSystemService(
                          PowerManager::class.java,
                      )

                  val keyguard =
                      context.getSystemService(
                          KeyguardManager::class.java,
                      )

                  val dm =
                      context.getSystemService(
                          DisplayManager::class.java,
                      )

                  val displays =
                      runCatching {
                          dm?.displays
                              ?.joinToString(
                                  separator = ",",
                              ) {
                                  displayCompact(it)
                              }
                              .orEmpty()
                      }.getOrDefault(
                          "?"
                      )

                  return (
                      "interactive=${power?.isInteractive} " +
                          "keyguard=${keyguard?.isKeyguardLocked} " +
                          "displays=[$displays]"
                      )
              }

              private fun fullSystemState(
                  context: Context,
              ): String {

                  val dm =
                      context.getSystemService(
                          DisplayManager::class.java,
                      )

                  val displays =
                      runCatching {
                          dm?.displays
                              ?.joinToString(
                                  separator = " ; ",
                              ) {
                                  displayFull(it)
                              }
                              .orEmpty()
                      }.getOrDefault(
                          "unavailable"
                      )

                  return (
                      compactSystemState(context) +
                          " fullDisplays=[$displays]"
                      )
              }

              private fun displayCompact(
                  display: Display,
              ): String {

                  val mode =
                      runCatching {
                          display.mode
                      }.getOrNull()

                  val hz =
                      mode?.refreshRate
                          ?.let {
                              String.format(
                                  Locale.US,
                                  "%.1f",
                                  it,
                              )
                          }
                          ?: "?"

                  return (
                      "${display.displayId}:" +
                          stateName(
                              display.state
                          ) +
                          "@${hz}Hz"
                      )
              }

              private fun displayFull(
                  display: Display,
              ): String {

                  val mode =
                      runCatching {
                          display.mode
                      }.getOrNull()

                  val width =
                      mode?.physicalWidth
                          ?: -1

                  val height =
                      mode?.physicalHeight
                          ?: -1

                  val hz =
                      mode?.refreshRate
                          ?.let {
                              String.format(
                                  Locale.US,
                                  "%.2f",
                                  it,
                              )
                          }
                          ?: "?"

                  return (
                      "id=${display.displayId} " +
                          "name=${display.name} " +
                          "state=${stateName(display.state)} " +
                          "mode=${width}x${height}@${hz}Hz " +
                          "flags=${display.flags}"
                      )
              }

              private fun stateName(
                  state: Int,
              ): String =
                  when (state) {
                      Display.STATE_OFF ->
                          "OFF"
                      Display.STATE_ON ->
                          "ON"
                      Display.STATE_DOZE ->
                          "DOZE"
                      Display.STATE_DOZE_SUSPEND ->
                          "DOZE_SUSPEND"
                      Display.STATE_VR ->
                          "VR"
                      Display.STATE_ON_SUSPEND ->
                          "ON_SUSPEND"
                      else ->
                          state.toString()
                  }
          }
          KOTLIN

