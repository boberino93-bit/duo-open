      - name: Add Copy diagnostics controls
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "app/src/main/java/com/duoopen/ui/ControlSheet.kt"
          )

          s = p.read_text()

          def block(lines):
              return "\n".join(lines)

          old = block([
              "    dualActive: Boolean,",
              "    onDualChange: (Boolean) -> Unit,",
              "    shizukuAvailable: Boolean,",
          ])

          new = block([
              "    dualActive: Boolean,",
              "    onDualChange: (Boolean) -> Unit,",
              "    diagnosticReport: () -> String,",
              "    onClearDiagnostics: () -> Unit,",
              "    shizukuAvailable: Boolean,",
          ])

          if old not in s:
              raise SystemExit(
                  "ControlSheet signature anchor not found"
              )

          s = s.replace(
              old,
              new,
              1,
          )

          old = block([
              "            Row(verticalAlignment = Alignment.CenterVertically) {",
              "                Hint(dualStatus, modifier = Modifier.weight(1f))",
              "                Switch(checked = dualActive, onCheckedChange = onDualChange, enabled = dualStatus.startsWith(\"Available\") || dualActive)",
              "            }",
              "",
              "            // 7. Hinge sensor",
          ])

          new = block([
              "            Row(verticalAlignment = Alignment.CenterVertically) {",
              "                Hint(dualStatus, modifier = Modifier.weight(1f))",
              "                Switch(checked = dualActive, onCheckedChange = onDualChange, enabled = dualStatus.startsWith(\"Available\") || dualActive)",
              "            }",
              "            Spacer(Modifier.height(8.dp))",
              "            Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {",
              "                OutlinedButton(",
              "                    onClick = {",
              "                        clipboard.setText(",
              "                            AnnotatedString(",
              "                                buildString {",
              "                                    append(",
              "                                        diagnosticReport()",
              "                                    )",
              "                                    appendLine()",
              "                                    appendLine()",
              "                                    append(",
              "                                        hinge.report()",
              "                                    )",
              "                                },",
              "                            ),",
              "                        )",
              "                    },",
              "                    modifier = Modifier.weight(1f),",
              "                ) {",
              "                    Text(\"Copy diagnostics\")",
              "                }",
              "                OutlinedButton(",
              "                    onClick = onClearDiagnostics,",
              "                    modifier = Modifier.weight(1f),",
              "                ) {",
              "                    Text(\"Clear diagnostics\")",
              "                }",
              "            }",
              "            Hint(",
              "                \"The field log records Duo Open lifecycle, display and dual-screen state only. Clear it, reproduce the problem, then copy it here.\",",
              "            )",
              "",
              "            // 7. Hinge sensor",
          ])

          if old not in s:
              raise SystemExit(
                  "ControlSheet dual-screen UI anchor not found"
              )

          s = s.replace(
              old,
              new,
              1,
          )

          p.write_text(
              s
          )

          print(
              "ControlSheet diagnostic controls applied."
          )
          PY

      - name: Wire diagnostic report into UI
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "app/src/main/java/com/duoopen/ui/DuoApp.kt"
          )

          s = p.read_text()

          def block(lines):
              return "\n".join(lines)

          old = block([
              "                dualActive = dualActive,",
              "                onDualChange = { on -> if (on) dualScreen?.start() else dualScreen?.stop() },",
              "                onEnableOverlay = { openAccessibilitySettings(context) },",
          ])

          new = block([
              "                dualActive = dualActive,",
              "                onDualChange = { on -> if (on) dualScreen?.start() else dualScreen?.stop() },",
              "                diagnosticReport = {",
              "                    buildString {",
              "                        append(",
              "                            dualScreen?.diagnosticReport()",
              "                                ?: \"Dual-screen controller unavailable\"",
              "                        )",
              "                        appendLine()",
              "                        appendLine()",
              "                        appendLine(",
              "                            \"Shizuku:\"",
              "                        )",
              "                        appendLine(",
              "                            OverlayFeature.shizukuStatus.value",
              "                        )",
              "                        appendLine(",
              "                            \"angleFeed=${OverlayFeature.angleFeedStatus()}\"",
              "                        )",
              "                    }",
              "                },",
              "                onClearDiagnostics = {",
              "                    dualScreen?.clearDiagnostics()",
              "                },",
              "                onEnableOverlay = { openAccessibilitySettings(context) },",
          ])

          if old not in s:
              raise SystemExit(
                  "DuoApp diagnostic wiring anchor not found"
              )

          s = s.replace(
              old,
              new,
              1,
          )

          p.write_text(
              s
          )

          print(
              "DuoApp diagnostic wiring applied."
          )
          PY

      - name: Set diagnostic build version
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path(
              "app/build.gradle.kts"
          )

          s = p.read_text()

          if "versionCode = 5" not in s:
              raise SystemExit(
                  "Expected smoothness versionCode 5 after base patch."
              )

          if 'versionName = "1.3.1-zfold7-smooth"' not in s:
              raise SystemExit(
                  "Expected smoothness versionName after base patch."
              )

          s = s.replace(
              "versionCode = 5",
              "versionCode = 7",
              1,
          )

          s = s.replace(
              'versionName = "1.3.1-zfold7-smooth"',
              'versionName = "1.3.3-zfold7-fielddiag"',
              1,
          )

          p.write_text(
              s
          )
          PY

      - name: Validate diagnostic pass
        run: |
          git diff --check
          git diff --stat

          mkdir -p \
            zfold7-artifacts

          git diff \
            > zfold7-artifacts/zfold7-fielddiag.patch

      - name: Compile, unit test, and build
        run: |
          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

      - name: Prepare APK
        run: |
          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "Debug APK not found."
            exit 1
          fi

          cp \
            "$APK" \
            zfold7-artifacts/DuoOpen-ZFold7-fielddiag-debug.apk

          {
            echo "commit=${GITHUB_SHA}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "pass=field-diagnostics"
            echo
            sha256sum \
              zfold7-artifacts/DuoOpen-ZFold7-fielddiag-debug.apk
          } > zfold7-artifacts/BUILD-INFO.txt

          cat \
            zfold7-artifacts/BUILD-INFO.txt

      - name: Upload field-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-fielddiag

          path: |
            zfold7-artifacts/DuoOpen-ZFold7-fielddiag-debug.apk
            zfold7-artifacts/zfold7-fielddiag.patch
            zfold7-artifacts/BUILD-INFO.txt

          if-no-files-found: error
          retention-days: 30