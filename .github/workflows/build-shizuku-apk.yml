name: Build Z Fold 7 Live Display Mirror Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Replay proven 1.3.7 service-dual build
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          previous_commit = "870c45d3f6acf08ab411d90a4e7b740fa4a0de6a"

          previous_workflow = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{previous_commit}:.github/workflows/build-shizuku-apk.yml",
              ],
              text=True,
          )

          lines = previous_workflow.splitlines()

          wanted_steps = [
              "Replay previous display-probe build",
              "Keep Samsung angle reader alive across cover-screen handoff",
              "Add controlled service-owned secondary-display experiment",
          ]

          def extract_run_block(step_name: str) -> str:
              step_start = None

              for index, line in enumerate(lines):
                  if line.strip() == f"- name: {step_name}":
                      step_start = index
                      break

              if step_start is None:
                  raise SystemExit(
                      f"Previous workflow step not found: {step_name}"
                  )

              run_line = None

              for index in range(step_start + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  if line.strip() == "run: |":
                      run_line = index
                      break

              if run_line is None:
                  raise SystemExit(
                      f"Run block not found for: {step_name}"
                  )

              block = []

              for index in range(run_line + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  block.append(line)

              return textwrap.dedent(
                  "\n".join(block)
              )

          for step_name in wanted_steps:
              script = extract_run_block(step_name)

              script_path = Path(
                  "/tmp/" +
                  re.sub(
                      r"[^A-Za-z0-9]+",
                      "-",
                      step_name,
                  ).strip("-") +
                  ".sh"
              )

              script_path.write_text(
                  "set -euo pipefail\n" +
                  script +
                  "\n"
              )

              print(
                  f"Replaying proven step: {step_name}"
              )

              subprocess.run(
                  [
                      "bash",
                      str(script_path),
                  ],
                  check=True,
              )
          PY

      - name: Add live SurfaceControl display mirror probe
        run: |
          python3 <<'PY'
          from pathlib import Path

          def load(path):
              return Path(path).read_text()

          def save(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new, label):
              text = load(path)
              if old not in text:
                  raise SystemExit(f"{label}: expected source not found in {path}")
              save(path, text.replace(old, new, 1))

          def insert_before_once(path, marker, addition, label):
              text = load(path)
              if marker not in text:
                  raise SystemExit(f"{label}: marker not found in {path}")
              save(path, text.replace(marker, addition + marker, 1))

          protocol_path = (
              "app/src/full/java/com/duoopen/shell/"
              "ShellProtocol.kt"
          )

          replace_once(
              protocol_path,
              '''    const val RESET_SECONDARY_DISPLAY = 8
          ''',
              '''    const val RESET_SECONDARY_DISPLAY = 8

              /**
               * in:
               *   boolean enable
               *   if enable:
               *     int sourceDisplayId
               *     SurfaceControl destinationParent
               *     int sourceWidth, sourceHeight
               *     int destinationWidth, destinationHeight
               *
               * out:
               *   Bundle{ok, error, sourceDisplayId, scale, x, y}
               */
              const val MIRROR_DISPLAY = 9
          ''',
              "ShellProtocol mirror command",
          )

          shell_path = (
              "app/src/full/java/com/duoopen/shell/"
              "DuoShellService.kt"
          )

          replace_once(
              shell_path,
              '''    private var captureApi: CaptureApi? = null
              private var reader: AngleReader? = null
          ''',
              '''    private var captureApi: CaptureApi? = null
              private var reader: AngleReader? = null

              private var liveMirror: SurfaceControl? = null
          ''',
              "DuoShellService mirror state",
          )

          replace_once(
              shell_path,
              '''        if (code == SHIZUKU_DESTROY) {
                      reader?.stop()
                      System.exit(0)
                      return true
                  }''',
              '''        if (code == SHIZUKU_DESTROY) {
                      reader?.stop()
                      stopLiveMirror()
                      System.exit(0)
                      return true
                  }''',
              "DuoShellService mirror cleanup",
          )

          insert_before_once(
              shell_path,
              '''            else -> return super.onTransact(code, data, reply, flags)''',
              '''            ShellProtocol.MIRROR_DISPLAY -> {
                          val enable = data.readInt() != 0
                          val identity = clearCallingIdentity()

                          val result = try {
                              if (!enable) {
                                  stopLiveMirror()

                                  Bundle().apply {
                                      putBoolean("ok", true)
                                      putBoolean("enabled", false)
                                  }
                              } else {
                                  val sourceDisplayId = data.readInt()

                                  val destinationParent =
                                      data.readTypedObject(
                                          SurfaceControl.CREATOR
                                      ) ?: throw IllegalArgumentException(
                                          "destinationParent"
                                      )

                                  val sourceWidth = data.readInt()
                                  val sourceHeight = data.readInt()
                                  val destinationWidth = data.readInt()
                                  val destinationHeight = data.readInt()

                                  try {
                                      startLiveMirror(
                                          sourceDisplayId =
                                              sourceDisplayId,
                                          destinationParent =
                                              destinationParent,
                                          sourceWidth =
                                              sourceWidth,
                                          sourceHeight =
                                              sourceHeight,
                                          destinationWidth =
                                              destinationWidth,
                                          destinationHeight =
                                              destinationHeight,
                                      )
                                  } finally {
                                      destinationParent.release()
                                  }
                              }
                          } catch (t: Throwable) {
                              var root: Throwable = t

                              while (root.cause != null) {
                                  root = root.cause!!
                              }

                              Bundle().apply {
                                  putBoolean("ok", false)
                                  putBoolean("enabled", enable)
                                  putString(
                                      "error",
                                      "${root.javaClass.simpleName}: ${root.message}",
                                  )
                              }
                          } finally {
                              restoreCallingIdentity(identity)
                          }

                          out.writeNoException()
                          out.writeBundle(result)
                      }

          ''',
              "DuoShellService mirror transaction",
          )

          replace_once(
              shell_path,
              '"cmd display power-reset $targetId"',
              '"cmd display disable-display $targetId"',
              "DuoShellService disable-display",
          )

          insert_before_once(
              shell_path,
              '''    // ---- capture -----------------------------------------------------------
          ''',
              '''    // ---- live logical-display mirror ---------------------------------------

              private fun stopLiveMirror() {
                  val current =
                      liveMirror
                          ?: return

                  liveMirror =
                      null

                  runCatching {
                      SurfaceControl.Transaction().use { tx ->
                          tx.reparent(
                              current,
                              null,
                          )
                          tx.apply()
                      }
                  }

                  runCatching {
                      current.release()
                  }
              }

              private fun startLiveMirror(
                  sourceDisplayId: Int,
                  destinationParent: SurfaceControl,
                  sourceWidth: Int,
                  sourceHeight: Int,
                  destinationWidth: Int,
                  destinationHeight: Int,
              ): Bundle {
                  require(
                      sourceWidth > 0 &&
                          sourceHeight > 0 &&
                          destinationWidth > 0 &&
                          destinationHeight > 0
                  ) {
                      "invalid mirror geometry"
                  }

                  stopLiveMirror()

                  val wm =
                      systemService(
                          "window",
                          "android.view.IWindowManager\\$Stub",
                      )

                  val mirror =
                      SurfaceControl()

                  val mirrored =
                      Class.forName(
                          "android.view.IWindowManager"
                      ).getMethod(
                          "mirrorDisplay",
                          Integer.TYPE,
                          SurfaceControl::class.java,
                      ).invoke(
                          wm,
                          sourceDisplayId,
                          mirror,
                      ) as? Boolean
                          ?: false

                  if (
                      !mirrored ||
                      !mirror.isValid
                  ) {
                      runCatching {
                          mirror.release()
                      }

                      throw IllegalStateException(
                          "WindowManager mirrorDisplay($sourceDisplayId) returned no valid surface"
                      )
                  }

                  val scale =
                      minOf(
                          destinationWidth.toFloat() /
                              sourceWidth.toFloat(),
                          destinationHeight.toFloat() /
                              sourceHeight.toFloat(),
                      )

                  val drawnWidth =
                      sourceWidth *
                          scale

                  val drawnHeight =
                      sourceHeight *
                          scale

                  val x =
                      (
                          destinationWidth -
                              drawnWidth
                          ) * 0.5f

                  val y =
                      (
                          destinationHeight -
                              drawnHeight
                          ) * 0.5f

                  try {
                      SurfaceControl.Transaction().use { tx ->
                          tx.reparent(
                              mirror,
                              destinationParent,
                          )

                          tx.setScale(
                              mirror,
                              scale,
                              scale,
                          )

                          tx.setPosition(
                              mirror,
                              x,
                              y,
                          )

                          tx.setLayer(
                              mirror,
                              10_000,
                          )

                          tx.setVisibility(
                              mirror,
                              true,
                          )

                          tx.apply()
                      }
                  } catch (t: Throwable) {
                      runCatching {
                          mirror.release()
                      }

                      throw t
                  }

                  liveMirror =
                      mirror

                  return Bundle().apply {
                      putBoolean("ok", true)
                      putBoolean("enabled", true)
                      putInt(
                          "sourceDisplayId",
                          sourceDisplayId,
                      )
                      putInt(
                          "sourceWidth",
                          sourceWidth,
                      )
                      putInt(
                          "sourceHeight",
                          sourceHeight,
                      )
                      putInt(
                          "destinationWidth",
                          destinationWidth,
                      )
                      putInt(
                          "destinationHeight",
                          destinationHeight,
                      )
                      putFloat(
                          "scale",
                          scale,
                      )
                      putFloat(
                          "x",
                          x,
                      )
                      putFloat(
                          "y",
                          y,
                      )
                  }
              }

          ''',
              "DuoShellService live mirror implementation",
          )

          bridge_path = (
              "app/src/full/java/com/duoopen/shell/"
              "ShizukuBridge.kt"
          )

          replace_once(
              bridge_path,
              '''    fun resetSecondaryDisplay(): Bundle? =
                  call(
                      ShellProtocol.RESET_SECONDARY_DISPLAY
                  )
          ''',
              '''    fun resetSecondaryDisplay(): Bundle? =
                  call(
                      ShellProtocol.RESET_SECONDARY_DISPLAY
                  )

              fun startDisplayMirror(
                  sourceDisplayId: Int,
                  destinationParent: SurfaceControl,
                  sourceWidth: Int,
                  sourceHeight: Int,
                  destinationWidth: Int,
                  destinationHeight: Int,
              ): Bundle? =
                  call(
                      ShellProtocol.MIRROR_DISPLAY
                  ) { parcel ->
                      parcel.writeInt(1)
                      parcel.writeInt(
                          sourceDisplayId
                      )
                      parcel.writeTypedObject(
                          destinationParent,
                          0,
                      )
                      parcel.writeInt(
                          sourceWidth
                      )
                      parcel.writeInt(
                          sourceHeight
                      )
                      parcel.writeInt(
                          destinationWidth
                      )
                      parcel.writeInt(
                          destinationHeight
                      )
                  }

              fun stopDisplayMirror(): Bundle? =
                  call(
                      ShellProtocol.MIRROR_DISPLAY
                  ) { parcel ->
                      parcel.writeInt(0)
                  }
          ''',
              "ShizukuBridge live mirror calls",
          )

          mirror_host_path = Path(
              "app/src/full/java/com/duoopen/overlay/"
              "DisplayMirrorHost.kt"
          )

          mirror_host_path.write_text(
              r'''package com.duoopen.overlay

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.os.Handler
          import android.view.Display
          import android.view.Gravity
          import android.view.SurfaceHolder
          import android.view.SurfaceView
          import android.view.WindowManager
          import com.duoopen.shell.ShizukuBridge
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch

          class DisplayMirrorHost(
              private val service: AccessibilityService,
              val display: Display,
              private val handler: Handler,
              private val scope: CoroutineScope,
              private val onStatus: (String) -> Unit,
          ) {
              val displayId: Int =
                  display.displayId

              private val displayManager =
                  service.getSystemService(
                      DisplayManager::class.java
                  )

              private val context =
                  service
                      .createDisplayContext(
                          display
                      )
                      .createWindowContext(
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          null,
                      )

              private val windowManager =
                  context.getSystemService(
                      WindowManager::class.java
                  )

              private var attached =
                  false

              private var generation =
                  0

              private val surfaceView =
                  SurfaceView(
                      context
                  ).apply {
                      setBackgroundColor(
                          Color.BLACK
                      )

                      holder.setFormat(
                          PixelFormat.OPAQUE
                      )

                      holder.addCallback(
                          object :
                              SurfaceHolder.Callback {

                              override fun surfaceCreated(
                                  holder: SurfaceHolder,
                              ) {
                                  bind(
                                      "surface-created"
                                  )
                              }

                              override fun surfaceChanged(
                                  holder: SurfaceHolder,
                                  format: Int,
                                  width: Int,
                                  height: Int,
                              ) {
                                  bind(
                                      "surface-changed ${width}x$height"
                                  )
                              }

                              override fun surfaceDestroyed(
                                  holder: SurfaceHolder,
                              ) {
                                  generation++

                                  onStatus(
                                      "Mirror host surface was destroyed; waiting for the display to return."
                                  )

                                  DuoDiagnostics.event(
                                      "live-mirror",
                                      "host surface destroyed display=$displayId",
                                  )
                              }
                          }
                      )
                  }

              fun attach() {
                  if (attached) {
                      refresh(
                          "already-attached"
                      )
                      return
                  }

                  val params =
                      WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                              WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                          PixelFormat.OPAQUE,
                      ).apply {
                          gravity =
                              Gravity.TOP or
                                  Gravity.START

                          layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS

                          fitInsetsTypes =
                              0

                          title =
                              "DuoOpenLiveMirror"
                      }

                  attached =
                      runCatching {
                          windowManager.addView(
                              surfaceView,
                              params,
                          )
                      }.onFailure { error ->
                          onStatus(
                              "Could not attach the live-mirror host: ${error.message}"
                          )

                          DuoDiagnostics.event(
                              "live-mirror",
                              "host add failed display=$displayId error=${error.javaClass.simpleName}:${error.message}",
                          )
                      }.isSuccess
              }

              fun refresh(
                  reason: String,
              ) {
                  if (
                      !attached ||
                      !surfaceView.holder.surface.isValid
                  ) {
                      return
                  }

                  bind(
                      reason
                  )
              }

              private fun bind(
                  reason: String,
              ) {
                  val parent =
                      runCatching {
                          surfaceView.surfaceControl
                      }.getOrNull()

                  if (
                      parent == null ||
                      !parent.isValid
                  ) {
                      onStatus(
                          "Mirror host exists, but its SurfaceControl isn't ready yet."
                      )
                      return
                  }

                  val source =
                      displayManager.getDisplay(
                          Display.DEFAULT_DISPLAY
                      )

                  if (source == null) {
                      onStatus(
                          "Default display is unavailable; waiting to rebind mirror."
                      )
                      return
                  }

                  val sourceMode =
                      source.mode

                  val destinationMode =
                      display.mode

                  val sourceWidth =
                      sourceMode.physicalWidth

                  val sourceHeight =
                      sourceMode.physicalHeight

                  val destinationWidth =
                      destinationMode.physicalWidth

                  val destinationHeight =
                      destinationMode.physicalHeight

                  val localGeneration =
                      ++generation

                  onStatus(
                      "Binding live display 0 " +
                          "${sourceWidth}×$sourceHeight → " +
                          "display $displayId " +
                          "${destinationWidth}×$destinationHeight…"
                  )

                  scope.launch(
                      Dispatchers.IO
                  ) {
                      val result =
                          ShizukuBridge.startDisplayMirror(
                              sourceDisplayId =
                                  Display.DEFAULT_DISPLAY,
                              destinationParent =
                                  parent,
                              sourceWidth =
                                  sourceWidth,
                              sourceHeight =
                                  sourceHeight,
                              destinationWidth =
                                  destinationWidth,
                              destinationHeight =
                                  destinationHeight,
                          )

                      if (
                          localGeneration !=
                          generation
                      ) {
                          return@launch
                      }

                      val ok =
                          result?.getBoolean(
                              "ok",
                              false,
                          ) == true

                      val error =
                          result?.getString(
                              "error"
                          )

                      val scale =
                          result?.getFloat(
                              "scale",
                              Float.NaN,
                          ) ?: Float.NaN

                      DuoDiagnostics.event(
                          "live-mirror",
                          "bind reason=$reason ok=$ok source=0 " +
                              "sourceSize=${sourceWidth}x$sourceHeight " +
                              "destination=$displayId " +
                              "destinationSize=${destinationWidth}x$destinationHeight " +
                              "scale=$scale error=$error",
                      )

                      handler.post {
                          if (
                              localGeneration !=
                              generation
                          ) {
                              return@post
                          }

                          onStatus(
                              if (ok) {
                                  "LIVE MIRROR ACTIVE: display 0 → display $displayId. " +
                                      "Open another app and move the hinge."
                              } else {
                                  "Live mirror failed" +
                                      (
                                          error?.let {
                                              ": $it"
                                          } ?: "."
                                          )
                              }
                          )
                      }
                  }
              }

              fun detach() {
                  generation++

                  if (!attached) {
                      return
                  }

                  attached =
                      false

                  runCatching {
                      windowManager.removeViewImmediate(
                          surfaceView
                      )
                  }

                  DuoDiagnostics.event(
                      "live-mirror",
                      "host detached display=$displayId",
                  )
              }
          }
          '''
          )

          service_path = (
              "app/src/full/java/com/duoopen/overlay/"
              "FoldOverlayService.kt"
          )

          insert_before_once(
              service_path,
              '''    private val secondaryDisplaySafetyReset =
          ''',
              '''    private var mirrorRequested =
                  false

              private var mirrorHost:
                  DisplayMirrorHost? =
                  null

              private val mirrorRefreshRunnable =
                  Runnable {
                      syncMirrorHost(
                          "display-topology-change"
                      )
                  }

          ''',
              "FoldOverlayService mirror state",
          )

          replace_once(
              service_path,
              '''    private val secondaryDisplaySafetyReset =
                  Runnable {
                      runSecondaryDisplayExperiment(
                          enable = false,
                          reason = "90-second safety reset",
                      )
                  }
          ''',
              '''    private val secondaryDisplaySafetyReset =
                  Runnable {
                      if (safeToReleaseSecondaryPanel()) {
                          runSecondaryDisplayExperiment(
                              enable = false,
                              reason = "90-second safety release",
                          )
                      } else {
                          _secondaryDisplayStatus.value =
                              "Safety release is waiting until the phone is fully open."

                          handler.postDelayed(
                              secondaryDisplaySafetyReset,
                              2_000L,
                          )
                      }
                  }
          ''',
              "FoldOverlayService safe safety reset",
          )

          insert_before_once(
              service_path,
              '''        handler.removeCallbacks(
                      secondaryDisplaySafetyReset
                  )
          ''',
              '''        handler.removeCallbacks(
                      mirrorRefreshRunnable
                  )

                  mirrorRequested =
                      false

                  mirrorHost?.detach()
                  mirrorHost =
                      null

                  runCatching {
                      ShizukuBridge.stopDisplayMirror()
                  }

          ''',
              "FoldOverlayService mirror destroy cleanup",
          )

          replace_once(
              service_path,
              '''    private fun onHinge(angle: Float) {
                  // DisplayManager callbacks own panel topology.
                  // Keep the high-frequency hinge path render-only.
                  for (e in engines.values.toList()) {
                      e.onHinge(angle)
                  }
              }
          ''',
              '''    private fun onHinge(angle: Float) {
                  if (mirrorRequested) {
                      return
                  }

                  // DisplayManager callbacks own panel topology.
                  // Keep the high-frequency hinge path render-only.
                  for (e in engines.values.toList()) {
                      e.onHinge(angle)
                  }
              }
          ''',
              "FoldOverlayService isolate mirror from fold effect",
          )

          replace_once(
              service_path,
              '''        for (e in engines.values.toList()) e.evaluate()
                  angleFeed?.onDisplayChanged()
          ''',
              '''        if (!mirrorRequested) {
                      for (e in engines.values.toList()) {
                          e.evaluate()
                      }
                  }

                  angleFeed?.onDisplayChanged()

                  scheduleMirrorRefresh(
                      "sync-displays"
                  )
          ''',
              "FoldOverlayService mirror refresh after topology sync",
          )

          replace_once(
              service_path,
              '''        DuoDiagnostics.event(
                      "dual-shell",
                      "begin enable=$enable reason=$reason",
                  )

                  scope.launch(Dispatchers.IO) {
                      val result =
                          if (enable) {
                              ShizukuBridge.enableSecondaryDisplay()
                          } else {
                              ShizukuBridge.resetSecondaryDisplay()
                          }
          ''',
              '''        DuoDiagnostics.event(
                      "dual-shell",
                      "begin enable=$enable reason=$reason",
                  )

                  if (!enable) {
                      mirrorRequested =
                          false

                      handler.removeCallbacks(
                          mirrorRefreshRunnable
                      )

                      mirrorHost?.detach()
                      mirrorHost =
                          null
                  }

                  scope.launch(Dispatchers.IO) {
                      if (!enable) {
                          ShizukuBridge.stopDisplayMirror()
                      }

                      val result =
                          if (enable) {
                              ShizukuBridge.enableSecondaryDisplay()
                          } else {
                              ShizukuBridge.resetSecondaryDisplay()
                          }
          ''',
              "FoldOverlayService mirror release ordering",
          )

          replace_once(
              service_path,
              '''            if (enable && ok) {
                          handler.postDelayed(
                              secondaryDisplaySafetyReset,
                              SECONDARY_DISPLAY_SAFETY_RESET_MS,
                          )
                      }

                      scheduleDisplayProbe(
          ''',
              '''            if (
                          enable &&
                          ok &&
                          visibleAfter
                      ) {
                          handler.post {
                              mirrorRequested =
                                  true

                              syncMirrorHost(
                                  "secondary-enabled"
                              )
                          }

                          handler.postDelayed(
                              secondaryDisplaySafetyReset,
                              SECONDARY_DISPLAY_SAFETY_RESET_MS,
                          )
                      }

                      scheduleDisplayProbe(
          ''',
              "FoldOverlayService start mirror after enable",
          )

          insert_before_once(
              service_path,
              '''    private fun updateRunning() {
          ''',
              '''    private fun scheduleMirrorRefresh(
                  reason: String,
              ) {
                  if (!mirrorRequested) {
                      return
                  }

                  handler.removeCallbacks(
                      mirrorRefreshRunnable
                  )

                  handler.postDelayed(
                      mirrorRefreshRunnable,
                      MIRROR_REBIND_DEBOUNCE_MS,
                  )

                  DuoDiagnostics.event(
                      "live-mirror",
                      "refresh scheduled reason=$reason",
                  )
              }

              private fun syncMirrorHost(
                  reason: String,
              ) {
                  if (!mirrorRequested) {
                      return
                  }

                  val secondary =
                      displayManager.displays
                          .firstOrNull { display ->
                              display.displayId !=
                                  Display.DEFAULT_DISPLAY &&
                                  display.state !=
                                      Display.STATE_OFF &&
                                  display.state !=
                                      Display.STATE_UNKNOWN
                          }

                  if (secondary == null) {
                      _secondaryDisplayStatus.value =
                          "Live mirror is waiting for Samsung's secondary logical display."

                      mirrorHost?.detach()
                      mirrorHost =
                          null

                      DuoDiagnostics.event(
                          "live-mirror",
                          "secondary logical display missing reason=$reason",
                      )
                      return
                  }

                  val current =
                      mirrorHost

                  if (
                      current == null ||
                      current.displayId !=
                          secondary.displayId
                  ) {
                      current?.detach()

                      mirrorHost =
                          DisplayMirrorHost(
                              service = this,
                              display = secondary,
                              handler = handler,
                              scope = scope,
                              onStatus = { message ->
                                  _secondaryDisplayStatus.value =
                                      message
                              },
                          ).also {
                              it.attach()
                          }

                      DuoDiagnostics.event(
                          "live-mirror",
                          "host created reason=$reason display=${secondary.displayId} " +
                              "mode=${secondary.mode.physicalWidth}x${secondary.mode.physicalHeight}",
                      )
                      return
                  }

                  current.refresh(
                      reason
                  )
              }

              private fun safeToReleaseSecondaryPanel(): Boolean {
                  val primary =
                      displayManager.getDisplay(
                          Display.DEFAULT_DISPLAY
                      ) ?: return false

                  val primaryMode =
                      primary.mode

                  val innerIsPrimary =
                      primaryMode.physicalWidth ==
                          1968 &&
                          primaryMode.physicalHeight ==
                              2184

                  val coverSecondary =
                      displayManager.displays.any { display ->
                          if (
                              display.displayId ==
                              Display.DEFAULT_DISPLAY
                          ) {
                              false
                          } else {
                              val mode =
                                  display.mode

                              mode.physicalWidth ==
                                  1080 &&
                                  mode.physicalHeight ==
                                      2520
                          }
                      }

                  return innerIsPrimary &&
                      coverSecondary
              }

          ''',
              "FoldOverlayService mirror orchestration",
          )

          insert_before_once(
              service_path,
              '''        /** How old a panel's last picture may be and still bridge the next fold. */
          ''',
              '''        private const val MIRROR_REBIND_DEBOUNCE_MS =
                      80L

          ''',
              "FoldOverlayService mirror debounce constant",
          )

          sheet_path = (
              "app/src/main/java/com/duoopen/ui/"
              "ControlSheet.kt"
          )

          replace_once(
              sheet_path,
              '"Enable inactive panel"',
              '"Start persistent mirror"',
              "ControlSheet mirror start label",
          )

          replace_once(
              sheet_path,
              '"Reset panel power"',
              '"Stop mirror / release"',
              "ControlSheet mirror stop label",
          )

          replace_once(
              sheet_path,
              '''"One-shot Fold7 test. There is no retry loop. " +
                              "The secondary panel is automatically power-reset " +
                              "after 90 seconds."''',
              '''"Live-mirror probe: the running app on logical display 0 is mirrored " +
                              "into the secondary Fold7 display. Open Chrome, Settings, the launcher, " +
                              "or another ordinary app and move the hinge. The screenshot/frost effect " +
                              "is disabled during this probe so we can isolate application continuity. " +
                              "After 90 seconds the release waits until the phone is fully open before " +
                              "disabling the secondary panel."''',
              "ControlSheet mirror explanation",
          )

          gradle_path = Path(
              "app/build.gradle.kts"
          )

          gradle = gradle_path.read_text()

          if "versionCode = 11" not in gradle:
              raise SystemExit(
                  "Expected service-dual versionCode 11 was not found."
              )

          if (
              'versionName = "1.3.7-zfold7-service-dual-probe"'
              not in gradle
          ):
              raise SystemExit(
                  "Expected service-dual versionName was not found."
              )

          gradle = gradle.replace(
              "versionCode = 11",
              "versionCode = 13",
              1,
          )

          gradle = gradle.replace(
              'versionName = "1.3.7-zfold7-service-dual-probe"',
              'versionName = "1.3.9-zfold7-live-mirror-probe"',
              1,
          )

          gradle_path.write_text(
              gradle
          )
          PY

      - name: Validate live mirror pass
        run: |
          git diff --check
          git diff --stat

          grep -R "MIRROR_DISPLAY = 9" app/src/full/java/com/duoopen/shell/ShellProtocol.kt
          grep -R "mirrorDisplay" app/src/full/java/com/duoopen/shell/DuoShellService.kt
          grep -R "DisplayMirrorHost" app/src/full/java/com/duoopen/overlay
          grep -R "cmd display disable-display" app/src/full/java/com/duoopen/shell/DuoShellService.kt
          grep -R "Start persistent mirror" app/src/main/java/com/duoopen/ui/ControlSheet.kt
          grep -R "1.3.9-zfold7-live-mirror-probe" app/build.gradle.kts

          mkdir -p zfold7-artifacts
          git diff > zfold7-artifacts/zfold7-live-mirror-probe.patch

      - name: Compile, unit test, and build
        run: |
          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

      - name: Prepare APK
        run: |
          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "Debug APK not found."
            exit 1
          fi

          cp \
            "$APK" \
            zfold7-artifacts/DuoOpen-ZFold7-live-mirror-probe-debug.apk

          {
            echo "commit=${GITHUB_SHA}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "pass=service-dual+live-display-mirror+safe-disable+angle-resilience"
            echo

            sha256sum \
              zfold7-artifacts/DuoOpen-ZFold7-live-mirror-probe-debug.apk

          } > zfold7-artifacts/BUILD-INFO.txt

          cat zfold7-artifacts/BUILD-INFO.txt

      - name: Upload field-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-live-mirror-probe
          path: |
            zfold7-artifacts/DuoOpen-ZFold7-live-mirror-probe-debug.apk
            zfold7-artifacts/zfold7-live-mirror-probe.patch
            zfold7-artifacts/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30