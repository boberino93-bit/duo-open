          # -------------------------------------------------------------------
          # Graft the strongest useful visual behavior from zfoldduo-0.1.3.apk.
          #
          # The APK's shipped AGSL shader clamps the moving pane to 89.5 degrees
          # and uses perspective + depth-dependent frost without the extra
          # darkening pass. Keep Duo Open's existing shader/settings interface,
          # but match those two visual behaviors.
          # -------------------------------------------------------------------

          shader_logic = Path(
              "app/src/main/java/com/duoopen/fold/DuoShader.kt"
          )

          replace_once(
              shader_logic,
              "    const val MAX_TILT = 45f",
              "    const val MAX_TILT = 89.5f",
              "DuoShader APK-derived tilt ceiling",
          )

          replace_once(
              shader_logic,
              '        shader.setFloatUniform("darkening", config.darkening * REFERENCE_PX_PER_MM / pxPerMm)',
              '        shader.setFloatUniform("darkening", 0f)',
              "DuoShader disable extra attenuation for APK-style frost",
          )

          shader_file = Path(
              "app/src/main/res/raw/duo_unfold.agsl"
          )

          replace_once(
              shader_file,
              "    float tilt = radians(clamp(tiltDegrees, 0.0, 60.0));",
              "    float tilt = radians(clamp(tiltDegrees, 0.0, 89.5));",
              "AGSL APK-derived 89.5 degree clamp",
          )

          # -------------------------------------------------------------------
          # Add a small direction estimator inspired by the APK's explicit
          # UNKNOWN / OPENING / CLOSING travel model. These thresholds are our
          # integration values, not claimed to be byte-for-byte APK constants.
          # It prevents tiny hinge jitter from flipping the perceived direction.
          # -------------------------------------------------------------------

          travel_path = Path(
              "app/src/main/java/com/duoopen/fold/HingeTravelEstimator.kt"
          )

          travel_path.write_text(
              r'''package com.duoopen.fold

          import android.os.SystemClock
          import kotlin.math.abs

          enum class HingeTravel {
              UNKNOWN,
              OPENING,
              CLOSING,
          }

          /**
           * Debounces hinge direction so tiny reversals do not flip the animation.
           *
           * A new direction becomes authoritative only after a meaningful amount of
           * travel and a short confirmation interval. Endpoints resolve immediately.
           */
          class HingeTravelEstimator {
              private var committed =
                  HingeTravel.UNKNOWN

              private var candidate =
                  HingeTravel.UNKNOWN

              private var candidateStartAngle =
                  Float.NaN

              private var candidateStartMs =
                  0L

              private var lastAngle =
                  Float.NaN

              fun reset() {
                  committed =
                      HingeTravel.UNKNOWN

                  candidate =
                      HingeTravel.UNKNOWN

                  candidateStartAngle =
                      Float.NaN

                  candidateStartMs =
                      0L

                  lastAngle =
                      Float.NaN
              }

              fun update(
                  angle: Float,
                  nowMs: Long = SystemClock.uptimeMillis(),
              ): HingeTravel {
                  if (angle.isNaN()) {
                      return committed
                  }

                  if (angle <= CLOSED_ENDPOINT_DEG) {
                      committed =
                          HingeTravel.CLOSING

                      candidate =
                          HingeTravel.UNKNOWN

                      lastAngle =
                          angle

                      return committed
                  }

                  if (angle >= OPEN_ENDPOINT_DEG) {
                      committed =
                          HingeTravel.OPENING

                      candidate =
                          HingeTravel.UNKNOWN

                      lastAngle =
                          angle

                      return committed
                  }

                  val previous =
                      lastAngle

                  lastAngle =
                      angle

                  if (previous.isNaN()) {
                      return committed
                  }

                  val delta =
                      angle -
                          previous

                  if (abs(delta) < SAMPLE_EPSILON_DEG) {
                      return committed
                  }

                  val observed =
                      if (delta > 0f) {
                          HingeTravel.OPENING
                      } else {
                          HingeTravel.CLOSING
                      }

                  if (observed == committed) {
                      candidate =
                          HingeTravel.UNKNOWN

                      return committed
                  }

                  if (observed != candidate) {
                      candidate =
                          observed

                      candidateStartAngle =
                          angle

                      candidateStartMs =
                          nowMs

                      return committed
                  }

                  val candidateTravel =
                      abs(
                          angle -
                              candidateStartAngle
                      )

                  val candidateAge =
                      nowMs -
                          candidateStartMs

                  if (
                      candidateTravel >= CONFIRM_TRAVEL_DEG &&
                      candidateAge >= CONFIRM_TIME_MS
                  ) {
                      committed =
                          candidate

                      candidate =
                          HingeTravel.UNKNOWN
                  }

                  return committed
              }

              private companion object {
                  const val CLOSED_ENDPOINT_DEG =
                      3f

                  const val OPEN_ENDPOINT_DEG =
                      168f

                  const val SAMPLE_EPSILON_DEG =
                      0.35f

                  const val CONFIRM_TRAVEL_DEG =
                      8f

                  const val CONFIRM_TIME_MS =
                      80L
              }
          }
          '''
          )

          # -------------------------------------------------------------------
          # Let PanelEngine recover if a mid-fold pause caused its overlay to
          # settle away. This is important for reversing/folding back in from the
          # current physical position instead of requiring another endpoint.
          # -------------------------------------------------------------------

          panel_path = (
              "app/src/full/java/com/duoopen/overlay/"
              "PanelEngine.kt"
          )

          replace_once(
              panel_path,
              "import com.duoopen.fold.HingeAngleSource\n",
              "import com.duoopen.fold.HingeAngleSource\n"
              "import com.duoopen.fold.HingeTravel\n"
              "import com.duoopen.fold.HingeTravelEstimator\n",
              "PanelEngine travel imports",
          )

          replace_once(
              panel_path,
              '''    /** Live re-capture loop (Shizuku mode) is scheduled. */
              private var liveLoop = false
          ''',
              '''    /** Live re-capture loop (Shizuku mode) is scheduled. */
              private var liveLoop = false

              /** Stable opening/closing state, resistant to tiny hinge jitter. */
              private val travelEstimator =
                  HingeTravelEstimator()

              private var travel =
                  HingeTravel.UNKNOWN

              /** Last raw hinge sample, used only to detect meaningful resumed motion. */
              private var lastRawHingeAngle =
                  Float.NaN
          ''',
              "PanelEngine travel state",
          )

          old_on_hinge = '''    fun onHinge(angle: Float) {
                  lastHingeMoveMs = SystemClock.uptimeMillis()
                  evaluate()
                  val tilt = tiltFor(angle)
                  if (tilt < DuoShader.FLAT_EPSILON && phase == Phase.SHOWING && !demoRunning) {
                      val f = follower
                      if (timedResolve && hinge.isCoarse && f != null && f.current > DuoShader.FLAT_EPSILON) {
                          // Stops-only sensor: the rest stop (180° / 0°) is the first news
                          // that the fold has finished, so clear from here — the frost
                          // was held meanwhile. The follower dismisses at flat.
                          handler.removeCallbacks(peakHold)
                          f.tauS = COARSE_CLEAR_TAU_S
                          f.setTarget(0f)
                      } else {
                          // At rest: drop the overlay now rather than easing the last degrees.
                          dismiss(fadeMs = FADE_OUT_FLAT_MS)
                      }
                  } else if (!timedResolve) {
                      follower?.setTarget(tilt)
                  }
              }
          '''

          new_on_hinge = '''    fun onHinge(angle: Float) {
                  val previousRaw =
                      lastRawHingeAngle

                  lastRawHingeAngle =
                      angle

                  val previousTravel =
                      travel

                  travel =
                      travelEstimator.update(
                          angle
                      )

                  lastHingeMoveMs =
                      SystemClock.uptimeMillis()

                  evaluate()

                  val tilt =
                      tiltFor(
                          angle
                      )

                  /*
                   * If a partial fold paused long enough for the overlay to settle away,
                   * meaningful resumed motion should re-enter the effect from the current
                   * physical hinge position. This also makes an OPENING→CLOSING reversal
                   * feel like the same physical pane running backward rather than a new
                   * canned animation.
                   */
                  val resumedMidFold =
                      phase == Phase.IDLE &&
                          !demoRunning &&
                          !restArmed &&
                          !panelSwitched &&
                          tilt >= REST_LEAVE_TILT &&
                          !previousRaw.isNaN() &&
                          kotlin.math.abs(
                              angle -
                                  previousRaw
                          ) >= RESUME_MOTION_DEG &&
                          travel != HingeTravel.UNKNOWN

                  if (resumedMidFold) {
                      Log.i(
                          TAG,
                          "display $displayId: resumed mid-fold " +
                              "travel=$travel previousTravel=$previousTravel " +
                              "hinge=$angle tilt=$tilt"
                      )

                      startEffect(
                          afterSwap = false,
                          startTilt = tilt,
                      )
                  }

                  if (
                      tilt < DuoShader.FLAT_EPSILON &&
                      phase == Phase.SHOWING &&
                      !demoRunning
                  ) {
                      val f =
                          follower

                      if (
                          timedResolve &&
                          hinge.isCoarse &&
                          f != null &&
                          f.current > DuoShader.FLAT_EPSILON
                      ) {
                          handler.removeCallbacks(
                              peakHold
                          )

                          f.tauS =
                              COARSE_CLEAR_TAU_S

                          f.setTarget(
                              0f
                          )
                      } else {
                          dismiss(
                              fadeMs =
                                  FADE_OUT_FLAT_MS
                          )
                      }
                  } else if (!timedResolve) {
                      follower?.setTarget(
                          tilt
                      )
                  }
              }
          '''

          replace_once(
              panel_path,
              old_on_hinge,
              new_on_hinge,
              "PanelEngine bidirectional resume path",
          )

          replace_once(
              panel_path,
              '''        const val SHELL_RETRY_MS = 60L
          ''',
              '''        const val SHELL_RETRY_MS = 60L
                  /** Minimum real hinge motion before a settled mid-fold effect resumes. */
                  const val RESUME_MOTION_DEG = 0.75f
          ''',
              "PanelEngine resume threshold",
          )

          # Version this as the revised 1.3.13 integration.
          gradle_path = Path(
              "app/build.gradle.kts"
          )

          gradle = gradle_path.read_text()

          if "versionCode = 17" not in gradle:
              raise SystemExit(
                  "Expected 1.3.13 versionCode 17 was not found."
              )

          if (
              'versionName = "1.3.13-zfold7-setgeometry-bidirectional"'
              not in gradle
          ):
              raise SystemExit(
                  "Expected 1.3.13 versionName was not found."
              )

          gradle = gradle.replace(
              "versionCode = 17",
              "versionCode = 18",
              1,
          )

          gradle = gradle.replace(
              'versionName = "1.3.13-zfold7-setgeometry-bidirectional"',
              'versionName = "1.3.13r-zfold7-geometry-glass"',
              1,
          )

          gradle_path.write_text(
              gradle
          )
          PY

      - name: Validate revised 1.3.13 graft
        run: |
          git diff --check

          grep -R "MAX_TILT = 89.5f"             app/src/main/java/com/duoopen/fold/DuoShader.kt

          grep -R "clamp(tiltDegrees, 0.0, 89.5)"             app/src/main/res/raw/duo_unfold.agsl

          grep -R "enum class HingeTravel"             app/src/main/java/com/duoopen/fold/HingeTravelEstimator.kt

          grep -R "resumed mid-fold"             app/src/full/java/com/duoopen/overlay/PanelEngine.kt

          grep -R "1.3.13r-zfold7-geometry-glass"             app/build.gradle.kts

          git diff > zfold7-artifacts/zfold7-geometry-continuity-revised.patch

      - name: Compile, unit test, and build
        run: |
          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

      - name: Prepare APK
        run: |
          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "Debug APK not found."
            exit 1
          fi

          cp \
            "$APK" \
            zfold7-artifacts/DuoOpen-ZFold7-geometry-glass-debug.apk

          {
            echo "commit=${GITHUB_SHA}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "pass=setGeometry-left-pane+restored-panel-engine+89.5deg-glass+debounced-direction+midfold-resume+topology-retention"
            echo

            sha256sum \
              zfold7-artifacts/DuoOpen-ZFold7-geometry-glass-debug.apk

          } > zfold7-artifacts/BUILD-INFO.txt

          cat zfold7-artifacts/BUILD-INFO.txt

      - name: Upload field-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-geometry-glass
          path: |
