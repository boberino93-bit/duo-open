name: Build Z Fold 7 Debug Variants

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      # ================================================================
      # ITERATION 1
      #
      # Core Z Fold 7 correctness / jank fixes.
      #
      # This build:
      # - filters duplicate Samsung wallpaper angle samples
      # - fixes hinge event-rate bookkeeping
      # - removes display enumeration from every hinge callback
      # - publishes the real Shizuku angle to the app UI
      # - fixes the misleading 0/90/180 diagnostic while Shizuku is active
      # ================================================================

      - name: Apply Z Fold 7 core fixes
        run: |
          python3 <<'PY'
          from pathlib import Path


          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()

              if old not in text:
                  raise SystemExit(
                      f"\nExpected source block was not found in {path}.\n"
                      f"Patch stopped rather than silently producing a bad build.\n\n"
                      f"{old}\n"
                  )

              p.write_text(text.replace(old, new, count))


          # ------------------------------------------------------------
          # HingeAngleSource
          # ------------------------------------------------------------
          #
          # Samsung's FoldInteractive wallpaper can emit the same angle
          # repeatedly because Duo Open continuously asks it for a reading.
          #
          # Previously every reply became an onAngle() event, even when the
          # hinge had not physically moved.
          #
          # That creates unnecessary work and also keeps "movement" timers
          # alive indefinitely while the phone is stationary.
          #
          # Keep the source heartbeat fresh, but only publish meaningful
          # physical angle changes.
          # ------------------------------------------------------------

          hinge = "app/src/main/java/com/duoopen/fold/HingeAngleSource.kt"

          replace(
              hinge,
              """    fun feedExternal(angle: Float) {
                  if (!angle.isFinite()) return
                  val now = SystemClock.uptimeMillis()
                  externalActive = true
                  externalLastUptime = now
                  lastEventUptime = now
                  tickRate(now)
                  lastAngle = angle.coerceIn(0f, 180f)
                  onAngle(lastAngle)
              }""",
              """    fun feedExternal(angle: Float) {
                  if (!angle.isFinite()) return

                  val now = SystemClock.uptimeMillis()
                  externalActive = true
                  externalLastUptime = now

                  // Update the source heartbeat even while the hinge is still,
                  // but don't turn repeated identical wallpaper responses into
                  // fake physical hinge movement.
                  tickRate(now)
                  lastEventUptime = now

                  val next = angle.coerceIn(0f, 180f)
                  val changed =
                      lastAngle.isNaN() ||
                          abs(next - lastAngle) >= EXTERNAL_CHANGE_EPS

                  lastAngle = next

                  if (changed) {
                      onAngle(next)
                  }
              }"""
          )

          # tickRate() checks how long it has been since the previous sample.
          # The old code overwrote lastEventUptime first, so that comparison
          # always saw an age of zero.
          replace(
              hinge,
              """        val now = SystemClock.uptimeMillis()
                  lastEventUptime = now
                  tickRate(now)
                  lastAngle = value.coerceIn(0f, 180f)""",
              """        val now = SystemClock.uptimeMillis()
                  tickRate(now)
                  lastEventUptime = now
                  lastAngle = value.coerceIn(0f, 180f)"""
          )

          replace(
              hinge,
              """        const val EXTERNAL_STALE_MS = 3_000L
                  val STOPS = intArrayOf(0, 90, 180)""",
              """        const val EXTERNAL_STALE_MS = 3_000L

                  // Ignore tiny wallpaper-angle jitter while preserving real
                  // hinge movement. Samsung generally reports much larger
                  // physical changes than this threshold.
                  const val EXTERNAL_CHANGE_EPS = 0.15f

                  val STOPS = intArrayOf(0, 90, 180)"""
          )


          # ------------------------------------------------------------
          # FoldOverlayService
          # ------------------------------------------------------------
          #
          # The old hot path did syncDisplays() for every hinge sample.
          #
          # With a fast continuous reader that means repeatedly enumerating
          # DisplayManager state while trying to animate.
          #
          # DisplayManager already has callbacks for panel state changes, so
          # keep hinge callbacks focused on animation.
          # ------------------------------------------------------------

          service = "app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt"

          replace(
              service,
              """    private fun onHinge(angle: Float) {
                  syncDisplays()
                  for (e in engines.values.toList()) e.onHinge(angle)
              }""",
              """    private fun onHinge(angle: Float) {
                  OverlayState.setHingeAngle(angle)

                  for (e in engines.values.toList()) {
                      e.onHinge(angle)
                  }
              }"""
          )

          replace(
              service,
              """        OverlayState.setRunning(false)
                  scope.cancel()""",
              """        OverlayState.setRunning(false)
                  OverlayState.setHingeAngle(Float.NaN)
                  scope.cancel()"""
          )


          # ------------------------------------------------------------
          # OverlayState
          # ------------------------------------------------------------
          #
          # Publish the real Shizuku-driven continuous angle so the app
          # preview and diagnostics don't continue displaying the public
          # Samsung 0/90/180 degree sensor.
          # ------------------------------------------------------------

          state = "app/src/main/java/com/duoopen/overlay/OverlayState.kt"

          replace(
              state,
              """    private val _running = MutableStateFlow(false)
              val running: StateFlow<Boolean> = _running.asStateFlow()

              internal fun setRunning(running: Boolean) {
                  _running.value = running
              }""",
              """    private val _running = MutableStateFlow(false)
              val running: StateFlow<Boolean> = _running.asStateFlow()

              private val _hingeAngle = MutableStateFlow(Float.NaN)
              val hingeAngle: StateFlow<Float> = _hingeAngle.asStateFlow()

              internal fun setRunning(running: Boolean) {
                  _running.value = running
              }

              internal fun setHingeAngle(angle: Float) {
                  _hingeAngle.value = angle
              }"""
          )


          # ------------------------------------------------------------
          # DuoApp
          # ------------------------------------------------------------

          app = "app/src/main/java/com/duoopen/ui/DuoApp.kt"

          replace(
              app,
              """    val config by DuoSettings.config.collectAsStateWithLifecycle()
              val foldLine by foldLineFlow.collectAsStateWithLifecycle()

              var hingeAngle by remember { mutableFloatStateOf(Float.NaN) }""",
              """    val config by DuoSettings.config.collectAsStateWithLifecycle()
              val foldLine by foldLineFlow.collectAsStateWithLifecycle()
              val overlayHingeAngle by OverlayState.hingeAngle.collectAsStateWithLifecycle()

              var hingeAngle by remember { mutableFloatStateOf(Float.NaN) }"""
          )

          replace(
              app,
              """    val angle = if (simulate || hinge.sensor == null) simulatedAngle else hingeAngle""",
              """    val angle = when {
                  simulate || hinge.sensor == null -> simulatedAngle
                  overlayHingeAngle.isFinite() -> overlayHingeAngle
                  else -> hingeAngle
              }"""
          )


          # ------------------------------------------------------------
          # ControlSheet diagnostics
          # ------------------------------------------------------------

          sheet = "app/src/main/java/com/duoopen/ui/ControlSheet.kt"

          replace(
              sheet,
              """    var showGuide by remember { mutableStateOf(false) }""",
              """    val continuousSamsungAngle =
                  shizukuReady &&
                      config.shizukuAngle &&
                      foldWallpaperActive &&
                      angleFeedStatus().contains("Reader receiving")

              var showGuide by remember { mutableStateOf(false) }"""
          )

          replace(
              sheet,
              """            if (hasSensor && hinge.isCoarse) {
                      Hint(
                          "This sensor only reports 0°, 90° and 180° (the continuous one is locked to system apps on " +
                              "Galaxy Z Fold 7 and earlier), so the fold plays as a short animation at each stop instead of " +
                              "tracking your hand.",
                          warn = true,
                      )
                  }""",
              """            if (hasSensor && hinge.isCoarse && !continuousSamsungAngle) {
                      Hint(
                          "This sensor only reports 0°, 90° and 180° (the continuous one is locked to system apps on " +
                              "Galaxy Z Fold 7 and earlier), so the fold plays as a short animation at each stop instead of " +
                              "tracking your hand.",
                          warn = true,
                      )
                  } else if (continuousSamsungAngle) {
                      Hint(
                          "Continuous Samsung hinge angle is active through Shizuku; " +
                              "the preview and whole-screen effect are using it.",
                      )
                  }"""
          )


          # ------------------------------------------------------------
          # Give iteration 1 its own version
          # ------------------------------------------------------------

          gradle = "app/build.gradle.kts"

          replace(
              gradle,
              'versionCode = 4',
              'versionCode = 5'
          )

          replace(
              gradle,
              'versionName = "1.3.0"',
              'versionName = "1.3.1-zfold7-core"'
          )

          print("Iteration 1 patches applied successfully.")
          PY

      - name: Check iteration 1 patch
        run: |
          git diff --check
          git diff --stat
          git diff

      - name: Compile and test iteration 1
        run: |
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

          mkdir -p zfold7-artifacts

          CORE_APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$CORE_APK" ]; then
            echo "Iteration 1 APK was not produced."
            exit 1
          fi

          cp "$CORE_APK" \
            zfold7-artifacts/DuoOpen-ZFold7-core-debug.apk

      # ================================================================
      # ITERATION 2
      #
      # Smoothness / latency pass.
      #
      # Builds on iteration 1.
      #
      # This build:
      # - runs Samsung angle polling much faster during movement
      # - falls back to slower polling when stationary
      # - reduces continuous hinge smoothing latency
      # - completion-paces Shizuku screen captures
      # - avoids capture interval = capture time + fixed 80ms
      # ================================================================

      - name: Apply Z Fold 7 smoothness enhancements
        run: |
          python3 <<'PY'
          from pathlib import Path


          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()

              if old not in text:
                  raise SystemExit(
                      f"\nExpected source block was not found in {path}.\n"
                      f"Patch stopped rather than silently producing a bad build.\n\n"
                      f"{old}\n"
                  )

              p.write_text(text.replace(old, new, count))


          # ------------------------------------------------------------
          # WallpaperAngleFeed
          # ------------------------------------------------------------
          #
          # Existing implementation: one request every 33ms (~30 Hz).
          #
          # New behavior:
          # - 33ms while stationary
          # - 8ms while physical movement is being observed
          #
          # That puts hinge updates much closer to the Fold 7's display
          # refresh cadence without polling hard all day while stationary.
          # ------------------------------------------------------------

          feed = "app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt"

          replace(
              feed,
              """import com.duoopen.fold.HingeAngleSource""",
              """import com.duoopen.fold.HingeAngleSource
          import kotlin.math.abs"""
          )

          replace(
              feed,
              """ * wallpaper through it at [POLL_MS], and let the Shizuku-side log reader""",
              """ * wallpaper through it at an adaptive cadence, and let the Shizuku-side log reader"""
          )

          replace(
              feed,
              """    private var anchorKey = ""
              private var lastCallbackUptime = 0L""",
              """    private var anchorKey = ""
              private var lastCallbackUptime = 0L

              private var lastAngleSeen = Float.NaN
              private var lastAngleChangeUptime = 0L"""
          )

          replace(
              feed,
              """            handler.postDelayed(this, POLL_MS)""",
              """            val now = SystemClock.uptimeMillis()

                  val moving =
                      lastAngleChangeUptime != 0L &&
                          now - lastAngleChangeUptime <= ACTIVE_BURST_MS

                  handler.postDelayed(
                      this,
                      if (moving) ACTIVE_POLL_MS else IDLE_POLL_MS,
                  )"""
          )

          replace(
              feed,
              """        running = true
              startedAt = SystemClock.uptimeMillis()
              status = "Starting" """.rstrip(),
              """        running = true
              startedAt = SystemClock.uptimeMillis()
              lastAngleSeen = Float.NaN
              lastAngleChangeUptime = 0L
              status = "Starting" """
              .rstrip()
          )

          replace(
              feed,
              """    private fun onAngle(angle: Float) {
                  if (!running) return
                  lastCallbackUptime = SystemClock.uptimeMillis()
                  hinge.feedExternal(angle)
              }""",
              """    private fun onAngle(angle: Float) {
                  if (!running) return

                  val now = SystemClock.uptimeMillis()
                  lastCallbackUptime = now

                  if (
                      lastAngleSeen.isNaN() ||
                      abs(angle - lastAngleSeen) >= ANGLE_CHANGE_EPS
                  ) {
                      lastAngleSeen = angle
                      lastAngleChangeUptime = now
                  }

                  hinge.feedExternal(angle)
              }"""
          )

          replace(
              feed,
              """        const val POLL_MS = 33L
                  private const val STALE_MS = 2_500L""",
              """        // At rest there is no reason to hammer Samsung's
                  // wallpaper service. Once movement begins, burst close to
                  // display-refresh cadence for responsive animation.
                  const val IDLE_POLL_MS = 33L
                  const val ACTIVE_POLL_MS = 8L
                  const val ACTIVE_BURST_MS = 750L
                  const val ANGLE_CHANGE_EPS = 0.15f

                  private const val STALE_MS = 2_500L"""
          )


          # ------------------------------------------------------------
          # PanelEngine
          # ------------------------------------------------------------
          #
          # Continuous Samsung angle input benefits from slightly less
          # follower smoothing than a coarse/noisy public sensor.
          # ------------------------------------------------------------

          engine = "app/src/full/java/com/duoopen/overlay/PanelEngine.kt"

          replace(
              engine,
              """        follower = TiltFollower { t ->
                  created.tilt = t
                  if (t < DuoShader.FLAT_EPSILON && !demoRunning) dismiss(fadeMs = FADE_OUT_FLAT_MS)
              }.also { it.snap(startTilt) }""",
              """        follower = TiltFollower { t ->
                  created.tilt = t

                  if (t < DuoShader.FLAT_EPSILON && !demoRunning) {
                      dismiss(fadeMs = FADE_OUT_FLAT_MS)
                  }
              }.also {
                  it.snap(startTilt)

                  if (hinge.externalActive && easeTo == null) {
                      it.tauS = SAMSUNG_LIVE_TAU_S
                  }
              }"""
          )


          # ------------------------------------------------------------
          # Completion-paced screen capture
          # ------------------------------------------------------------
          #
          # Existing loop:
          #
          # capture takes ~50ms
          # THEN wait another 80ms
          #
          # = roughly one frame every 130ms in practice.
          #
          # New loop targets one completed frame every ~60ms, but never
          # allows overlapping captures.
          # ------------------------------------------------------------

          replace(
              engine,
              """    private fun startLiveLoop() {
                  if (liveLoop) return
                  liveLoop = true
                  val myGen = captureGen
                  var frames = 0
                  fun tick() {
                      if (!liveLoop || phase != Phase.SHOWING || myGen != captureGen) { liveLoop = false; return }
                      val s = surface as? SnapshotSurface
                      if (s == null || s.tilt < DuoShader.FLAT_EPSILON) { handler.postDelayed({ tick() }, LIVE_INTERVAL_MS); return }
                      val excluded = excludedLayers()
                      if (excluded.isEmpty()) { handler.postDelayed({ tick() }, LIVE_INTERVAL_MS); return }
                      scope.launch {
                          val frame = withContext(Dispatchers.IO) { ShizukuBridge.capture(displayId, excluded, LIVE_SHELL_SCALE) }
                          if (liveLoop && phase == Phase.SHOWING && myGen == captureGen && frame != null && !bridging) {
                              (surface as? SnapshotSurface)?.replaceSnapshot(frame)
                              frames++
                              if (frames == 1 || frames % 25 == 0) Log.i(TAG, "display $displayId: live frame $frames (${frame.width}x${frame.height})")
                          }
                          handler.postDelayed({ tick() }, LIVE_INTERVAL_MS)
                      }
                  }
                  handler.postDelayed({ tick() }, LIVE_INTERVAL_MS)
              }""",
              """    private fun startLiveLoop() {
                  if (liveLoop) return

                  liveLoop = true

                  val myGen = captureGen
                  var frames = 0

                  fun tick() {
                      if (
                          !liveLoop ||
                          phase != Phase.SHOWING ||
                          myGen != captureGen
                      ) {
                          liveLoop = false
                          return
                      }

                      val s = surface as? SnapshotSurface

                      if (s == null || s.tilt < DuoShader.FLAT_EPSILON) {
                          handler.postDelayed(
                              { tick() },
                              LIVE_FRAME_PERIOD_MS,
                          )
                          return
                      }

                      val excluded = excludedLayers()

                      if (excluded.isEmpty()) {
                          handler.postDelayed(
                              { tick() },
                              LIVE_FRAME_PERIOD_MS,
                          )
                          return
                      }

                      val frameStarted = SystemClock.uptimeMillis()

                      scope.launch {
                          val frame = withContext(Dispatchers.IO) {
                              ShizukuBridge.capture(
                                  displayId,
                                  excluded,
                                  LIVE_SHELL_SCALE,
                              )
                          }

                          if (
                              liveLoop &&
                              phase == Phase.SHOWING &&
                              myGen == captureGen &&
                              frame != null &&
                              !bridging
                          ) {
                              (surface as? SnapshotSurface)
                                  ?.replaceSnapshot(frame)

                              frames++

                              if (frames == 1 || frames % 25 == 0) {
                                  Log.i(
                                      TAG,
                                      "display $displayId: live frame $frames " +
                                          "(${frame.width}x${frame.height})",
                                  )
                              }
                          }

                          // Completion-paced:
                          //
                          // If capture took 50ms, wait about 10ms.
                          // If capture took >=60ms, immediately request the
                          // next frame.
                          //
                          // We never queue concurrent captures.
                          val delay =
                              (
                                  frameStarted +
                                      LIVE_FRAME_PERIOD_MS -
                                      SystemClock.uptimeMillis()
                              ).coerceAtLeast(0L)

                          handler.postDelayed(
                              { tick() },
                              delay,
                          )
                      }
                  }

                  handler.postDelayed(
                      { tick() },
                      LIVE_START_DELAY_MS,
                  )
              }"""
          )

          replace(
              engine,
              """        /** Shizuku capture: full-size first frame, half-size live frames at ~12 fps. */
                  const val INITIAL_SHELL_SCALE = 1f
                  const val LIVE_SHELL_SCALE = 0.5f
                  const val LIVE_INTERVAL_MS = 80L
                  const val SHELL_RETRY_MS = 60L""",
              """        /**
                   * Shizuku capture:
                   *
                   * - full resolution for the initial frame
                   * - reduced resolution for rapidly refreshed frames under
                   *   the frost
                   * - completion-paced around 16 fps rather than adding a
                   *   fixed delay after capture completion
                   */
                  const val INITIAL_SHELL_SCALE = 1f
                  const val LIVE_SHELL_SCALE = 0.45f
                  const val LIVE_FRAME_PERIOD_MS = 60L
                  const val LIVE_START_DELAY_MS = 20L

                  /**
                   * Samsung's Shizuku wallpaper angle is continuous and high
                   * frequency, so use less smoothing than the public sensor.
                   */
                  const val SAMSUNG_LIVE_TAU_S = 0.030f

                  const val SHELL_RETRY_MS = 60L"""
          )


          # ------------------------------------------------------------
          # Iteration 2 version
          # ------------------------------------------------------------

          gradle = "app/build.gradle.kts"

          replace(
              gradle,
              'versionCode = 5',
              'versionCode = 6'
          )

          replace(
              gradle,
              'versionName = "1.3.1-zfold7-core"',
              'versionName = "1.3.1-zfold7-enhanced"'
          )

          print("Iteration 2 patches applied successfully.")
          PY

      - name: Check iteration 2 patch
        run: |
          git diff --check
          git diff --stat

      - name: Compile and test iteration 2
        run: |
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

          ENHANCED_APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$ENHANCED_APK" ]; then
            echo "Iteration 2 APK was not produced."
            exit 1
          fi

          cp "$ENHANCED_APK" \
            zfold7-artifacts/DuoOpen-ZFold7-enhanced-debug.apk

      - name: APK checksums
        run: |
          echo
          echo "Built APKs:"
          ls -lh zfold7-artifacts
          echo
          echo "SHA-256:"
          sha256sum zfold7-artifacts/*.apk

      - name: Upload both APKs
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-debug-variants
          path: zfold7-artifacts/*.apk
          if-no-files-found: error
          retention-days: 30