name: Build Z Fold 7 Dual Power + OLED Idle Dim Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Replay proven 1.3.7 service-dual build
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          previous_commit = "870c45d3f6acf08ab411d90a4e7b740fa4a0de6a"

          previous_workflow = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{previous_commit}:.github/workflows/build-shizuku-apk.yml",
              ],
              text=True,
          )

          lines = previous_workflow.splitlines()

          wanted_steps = [
              "Replay previous display-probe build",
              "Keep Samsung angle reader alive across cover-screen handoff",
              "Add controlled service-owned secondary-display experiment",
          ]

          def extract_run_block(step_name: str) -> str:
              step_start = None

              for index, line in enumerate(lines):
                  if line.strip() == f"- name: {step_name}":
                      step_start = index
                      break

              if step_start is None:
                  raise SystemExit(
                      f"Previous workflow step not found: {step_name}"
                  )

              run_line = None

              for index in range(step_start + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  if line.strip() == "run: |":
                      run_line = index
                      break

              if run_line is None:
                  raise SystemExit(
                      f"Run block not found for: {step_name}"
                  )

              block = []

              for index in range(run_line + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  block.append(line)

              return textwrap.dedent(
                  "\n".join(block)
              )

          for step_name in wanted_steps:
              script = extract_run_block(step_name)

              script_path = Path(
                  "/tmp/" +
                  re.sub(
                      r"[^A-Za-z0-9]+",
                      "-",
                      step_name,
                  ).strip("-") +
                  ".sh"
              )

              script_path.write_text(
                  "set -euo pipefail\n" +
                  script +
                  "\n"
              )

              print(
                  f"Replaying proven step: {step_name}"
              )

              subprocess.run(
                  [
                      "bash",
                      str(script_path),
                  ],
                  check=True,
              )
          PY

      - name: Use disable-display and OLED idle dim
        run: |
          python3 <<'PY'
          from pathlib import Path

          def load(path):
              return Path(path).read_text()

          def save(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new, label):
              text = load(path)
              if old not in text:
                  raise SystemExit(
                      f"{label}: expected source not found in {path}"
                  )
              save(path, text.replace(old, new, 1))

          def insert_before_once(path, marker, addition, label):
              text = load(path)
              if marker not in text:
                  raise SystemExit(
                      f"{label}: marker not found in {path}"
                  )
              save(path, text.replace(marker, addition + marker, 1))

          # Shell protocol ---------------------------------------------------------

          protocol_path = (
              "app/src/full/java/com/duoopen/shell/"
              "ShellProtocol.kt"
          )

          replace_once(
              protocol_path,
              """    const val ENABLE_SECONDARY_DISPLAY = 7
              const val RESET_SECONDARY_DISPLAY = 8
          """,
              """    const val ENABLE_SECONDARY_DISPLAY = 7
              const val RESET_SECONDARY_DISPLAY = 8

              const val DIM_COVER_BRIGHTNESS = 9
              const val RESTORE_COVER_BRIGHTNESS = 10
          """,
              "ShellProtocol brightness commands",
          )

          # Shell service ----------------------------------------------------------

          shell_path = (
              "app/src/full/java/com/duoopen/shell/"
              "DuoShellService.kt"
          )

          replace_once(
              shell_path,
              """    private var captureApi: CaptureApi? = null
              private var reader: AngleReader? = null
          """,
              """    private var captureApi: CaptureApi? = null
              private var reader: AngleReader? = null

              private var savedCoverBrightness: Float? =
                  null
          """,
              "DuoShellService brightness state",
          )

          replace_once(
              shell_path,
              """        if (code == SHIZUKU_DESTROY) {
                      reader?.stop()
                      System.exit(0)
                      return true
                  }""",
              """        if (code == SHIZUKU_DESTROY) {
                      reader?.stop()

                      runCatching {
                          coverBrightnessCommand(
                              dim = false
                          )
                      }

                      System.exit(0)
                      return true
                  }""",
              "DuoShellService destroy restore",
          )

          insert_before_once(
              shell_path,
              """            else -> return super.onTransact(code, data, reply, flags)
          """,
              """            ShellProtocol.DIM_COVER_BRIGHTNESS -> {
                          val identity = clearCallingIdentity()

                          val result = try {
                              coverBrightnessCommand(
                                  dim = true
                              )
                          } catch (t: Throwable) {
                              Bundle().apply {
                                  putBoolean("ok", false)
                                  putString(
                                      "error",
                                      "${t.javaClass.simpleName}: ${t.message}",
                                  )
                              }
                          } finally {
                              restoreCallingIdentity(identity)
                          }

                          out.writeNoException()
                          out.writeBundle(result)
                      }

                      ShellProtocol.RESTORE_COVER_BRIGHTNESS -> {
                          val identity = clearCallingIdentity()

                          val result = try {
                              coverBrightnessCommand(
                                  dim = false
                              )
                          } catch (t: Throwable) {
                              Bundle().apply {
                                  putBoolean("ok", false)
                                  putString(
                                      "error",
                                      "${t.javaClass.simpleName}: ${t.message}",
                                  )
                              }
                          } finally {
                              restoreCallingIdentity(identity)
                          }

                          out.writeNoException()
                          out.writeBundle(result)
                      }

          """,
              "DuoShellService brightness transactions",
          )

          replace_once(
              shell_path,
              """        val command =
                      if (enable) {
                          "cmd display enable-display $targetId"
                      } else {
                          /*
                           * Return control to Samsung instead of forcing the display off.
                           */
                          "cmd display power-reset $targetId"
                      }

                  val commandOutput =
                      runProbe(command)
          """,
              """        if (!enable) {
                      /*
                       * Restore the exact brightness we saved before the display is
                       * disabled. If Duo Open never dimmed the cover this is a no-op.
                       */
                      coverBrightnessCommand(
                          dim = false
                      )
                  }

                  val command =
                      if (enable) {
                          "cmd display enable-display $targetId"
                      } else {
                          /*
                           * power-reset was proven to leave display 1 enabled.
                           * Disable the logical secondary display instead.
                           */
                          "cmd display disable-display $targetId"
                      }

                  val commandOutput =
                      runProbe(command)
          """,
              "DuoShellService disable-display",
          )

          insert_before_once(
              shell_path,
              """    // ---- capture -----------------------------------------------------------
          """,
              r"""    // ---- Fold7 cover OLED idle brightness ---------------------------------

              private fun activeCoverDisplayId(): Int? {
                  val displays =
                      runProbe(
                          "cmd display get-displays"
                      )

                  val coverBlock =
                      displays
                          .split(
                              Regex(
                                  "(?=Display id \\d+:)"
                              )
                          )
                          .firstOrNull { block ->
                              block.contains(
                                  "real 1080 x 2520"
                              )
                          }
                          ?: return null

                  return Regex(
                      "Display id (\\d+):"
                  ).find(
                      coverBlock
                  )?.groupValues
                      ?.getOrNull(1)
                      ?.toIntOrNull()
              }

              private fun probeSucceeded(
                  output: String,
              ): Boolean =
                  output.startsWith(
                      "exit=0\n"
                  ) &&
                      !output.contains(
                          "Exception",
                          ignoreCase = true,
                      ) &&
                      !output.contains(
                          "not possible",
                          ignoreCase = true,
                      )

              private fun coverBrightnessCommand(
                  dim: Boolean,
              ): Bundle {
                  val coverId =
                      activeCoverDisplayId()

                  if (coverId == null) {
                      return Bundle().apply {
                          putBoolean("ok", false)
                          putString(
                              "error",
                              "Active 1080x2520 Fold7 cover display not found.",
                          )
                      }
                  }

                  /*
                   * Never dim logical display 0: when the phone is closed the cover is
                   * the primary display and is the screen the user is actually using.
                   */
                  if (coverId == 0) {
                      return Bundle().apply {
                          putBoolean("ok", false)
                          putInt(
                              "coverDisplayId",
                              coverId,
                          )
                          putString(
                              "error",
                              "Cover is primary; refusing to dim it.",
                          )
                      }
                  }

                  if (dim) {
                      val currentOutput =
                          runProbe(
                              "cmd display get-brightness --id $coverId"
                          )

                      val current =
                          Regex(
                              "([0-9]+(?:\\.[0-9]+)?)"
                          ).find(
                              currentOutput.substringAfter(
                                  '\n',
                                  ""
                              )
                          )?.groupValues
                              ?.getOrNull(1)
                              ?.toFloatOrNull()

                      if (current == null) {
                          return Bundle().apply {
                              putBoolean("ok", false)
                              putString(
                                  "error",
                                  "Could not parse cover brightness.",
                              )
                              putString(
                                  "brightnessRead",
                                  currentOutput,
                              )
                          }
                      }

                      if (savedCoverBrightness == null) {
                          savedCoverBrightness =
                              current.coerceIn(
                                  0f,
                                  1f,
                              )
                      }

                      val commandOutput =
                          runProbe(
                              "cmd display set-brightness 0.01 --id $coverId"
                          )

                      val ok =
                          probeSucceeded(
                              commandOutput
                          )

                      return Bundle().apply {
                          putBoolean("ok", ok)
                          putBoolean("dim", true)
                          putInt(
                              "coverDisplayId",
                              coverId,
                          )
                          putFloat(
                              "savedBrightness",
                              savedCoverBrightness
                                  ?: current,
                          )
                          putString(
                              "commandOutput",
                              commandOutput,
                          )

                          if (!ok) {
                              putString(
                                  "error",
                                  "Setting cover brightness to 1% failed.",
                              )
                          }
                      }
                  }

                  val restore =
                      savedCoverBrightness

                  if (restore == null) {
                      return Bundle().apply {
                          putBoolean("ok", true)
                          putBoolean("dim", false)
                          putInt(
                              "coverDisplayId",
                              coverId,
                          )
                          putBoolean(
                              "nothingToRestore",
                              true,
                          )
                      }
                  }

                  val commandOutput =
                      runProbe(
                          "cmd display set-brightness $restore --id $coverId"
                      )

                  val ok =
                      probeSucceeded(
                          commandOutput
                      )

                  if (ok) {
                      savedCoverBrightness =
                          null
                  }

                  return Bundle().apply {
                      putBoolean("ok", ok)
                      putBoolean("dim", false)
                      putInt(
                          "coverDisplayId",
                          coverId,
                      )
                      putFloat(
                          "restoredBrightness",
                          restore,
                      )
                      putString(
                          "commandOutput",
                          commandOutput,
                      )

                      if (!ok) {
                          putString(
                              "error",
                              "Restoring previous cover brightness failed.",
                          )
                      }
                  }
              }

          """,
              "DuoShellService brightness implementation",
          )

          # Shizuku bridge ---------------------------------------------------------

          bridge_path = (
              "app/src/full/java/com/duoopen/shell/"
              "ShizukuBridge.kt"
          )

          replace_once(
              bridge_path,
              """    fun resetSecondaryDisplay(): Bundle? =
                  call(
                      ShellProtocol.RESET_SECONDARY_DISPLAY
                  )
          """,
              """    fun resetSecondaryDisplay(): Bundle? =
                  call(
                      ShellProtocol.RESET_SECONDARY_DISPLAY
                  )

              /** Blocking; call off the main thread. */
              fun dimCoverBrightness(): Bundle? =
                  call(
                      ShellProtocol.DIM_COVER_BRIGHTNESS
                  )

              /** Blocking; call off the main thread. */
              fun restoreCoverBrightness(): Bundle? =
                  call(
                      ShellProtocol.RESTORE_COVER_BRIGHTNESS
                  )
          """,
              "ShizukuBridge brightness calls",
          )

          # Persistent service ----------------------------------------------------

          service_path = (
              "app/src/full/java/com/duoopen/overlay/"
              "FoldOverlayService.kt"
          )

          replace_once(
              service_path,
              """import kotlinx.coroutines.flow.asStateFlow
          """,
              """import kotlinx.coroutines.flow.asStateFlow
          import kotlin.math.abs
          """,
              "FoldOverlayService abs import",
          )

          insert_before_once(
              service_path,
              """    private val displayListener =
          """,
              """    private var dualPanelEnabledByUs =
                  false

              private var coverBrightnessDesiredDim =
                  false

              private var coverBrightnessActualDim =
                  false

              private var coverBrightnessBusy =
                  false

              private var lastHingeAngleForCover =
                  Float.NaN

              private var dimmedAtHingeAngle =
                  Float.NaN

              private var coverIdleDimArmed =
                  false

              private val coverIdleDimRunnable =
                  Runnable {
                      if (
                          dualPanelEnabledByUs &&
                          coverIdleDimArmed &&
                          !lastHingeAngleForCover.isNaN() &&
                          lastHingeAngleForCover >=
                              COVER_IDLE_DIM_REARM_ANGLE
                      ) {
                          dimmedAtHingeAngle =
                              lastHingeAngleForCover

                          requestCoverBrightness(
                              dim = true,
                              reason = "fully-open idle",
                          )
                      }
                  }

          """,
              "FoldOverlayService brightness state",
          )

          replace_once(
              service_path,
              """        handler.removeCallbacks(
                      secondaryDisplaySafetyReset
                  )

                  angleFeed?.stop()
          """,
              """        handler.removeCallbacks(
                      secondaryDisplaySafetyReset
                  )

                  handler.removeCallbacks(
                      coverIdleDimRunnable
                  )

                  angleFeed?.stop()
          """,
              "FoldOverlayService brightness cleanup",
          )

          replace_once(
              service_path,
              """    private fun onHinge(angle: Float) {
                  // DisplayManager callbacks own panel topology.
                  // Keep the high-frequency hinge path render-only.
                  for (e in engines.values.toList()) {
                      e.onHinge(angle)
                  }
              }
          """,
              """    private fun onHinge(angle: Float) {
                  lastHingeAngleForCover =
                      angle

                  if (dualPanelEnabledByUs) {
                      handler.removeCallbacks(
                          coverIdleDimRunnable
                      )

                      if (
                          coverBrightnessActualDim &&
                          (
                              dimmedAtHingeAngle.isNaN() ||
                                  abs(
                                      angle -
                                          dimmedAtHingeAngle
                                  ) >=
                                      COVER_HINGE_WAKE_DEGREES
                              )
                      ) {
                          coverIdleDimArmed =
                              false

                          requestCoverBrightness(
                              dim = false,
                              reason = "hinge movement",
                          )
                      }

                      /*
                       * Do not re-dim while partly folded. It only rearms once the phone
                       * is essentially flat/open again and has remained settled.
                       */
                      if (
                          angle >=
                          COVER_IDLE_DIM_REARM_ANGLE
                      ) {
                          coverIdleDimArmed =
                              true

                          handler.postDelayed(
                              coverIdleDimRunnable,
                              COVER_IDLE_DIM_DELAY_MS,
                          )
                      }
                  }

                  // DisplayManager callbacks own panel topology.
                  // Keep the high-frequency hinge path render-only.
                  for (e in engines.values.toList()) {
                      e.onHinge(angle)
                  }
              }
          """,
              "FoldOverlayService hinge brightness behavior",
          )

          replace_once(
              service_path,
              """        _secondaryDisplayStatus.value =
                      if (enable) {
                          "Requesting the inactive Fold7 panel from the persistent service…"
                      } else {
                          "Returning the secondary panel to Samsung's normal power state…"
                      }
          """,
              """        _secondaryDisplayStatus.value =
                      if (enable) {
                          "Requesting the inactive Fold7 panel from the persistent service…"
                      } else {
                          "Disabling Duo Open's secondary Fold7 panel…"
                      }
          """,
              "FoldOverlayService disable status",
          )

          replace_once(
              service_path,
              '"Secondary panel power was returned to Samsung."',
              """if (!visibleAfter) {
                                  "Success: display $target is disabled and Samsung can " +
                                      "resume normal one-panel fold behavior."
                              } else {
                                  "The disable command returned without an error, but " +
                                      "display $target is still exposed."
                              }""",
              "FoldOverlayService disable result",
          )

          replace_once(
              service_path,
              """            if (enable && ok) {
                          handler.postDelayed(
                              secondaryDisplaySafetyReset,
                              SECONDARY_DISPLAY_SAFETY_RESET_MS,
                          )
                      }

                      scheduleDisplayProbe(
          """,
              """            handler.post {
                          if (
                              enable &&
                              ok &&
                              visibleAfter
                          ) {
                              dualPanelEnabledByUs =
                                  true

                              coverIdleDimArmed =
                                  !lastHingeAngleForCover.isNaN() &&
                                      lastHingeAngleForCover >=
                                          COVER_IDLE_DIM_REARM_ANGLE

                              if (coverIdleDimArmed) {
                                  handler.removeCallbacks(
                                      coverIdleDimRunnable
                                  )

                                  handler.postDelayed(
                                      coverIdleDimRunnable,
                                      COVER_IDLE_DIM_DELAY_MS,
                                  )
                              }
                          } else if (
                              !enable &&
                              ok &&
                              !visibleAfter
                          ) {
                              dualPanelEnabledByUs =
                                  false

                              coverIdleDimArmed =
                                  false

                              coverBrightnessDesiredDim =
                                  false

                              coverBrightnessActualDim =
                                  false

                              dimmedAtHingeAngle =
                                  Float.NaN

                              handler.removeCallbacks(
                                  coverIdleDimRunnable
                              )
                          }
                      }

                      if (
                          enable &&
                          ok &&
                          visibleAfter
                      ) {
                          handler.postDelayed(
                              secondaryDisplaySafetyReset,
                              SECONDARY_DISPLAY_SAFETY_RESET_MS,
                          )
                      }

                      scheduleDisplayProbe(
          """,
              "FoldOverlayService track dual ownership",
          )

          insert_before_once(
              service_path,
              """    private fun updateRunning() {
          """,
              """    private fun requestCoverBrightness(
                  dim: Boolean,
                  reason: String,
              ) {
                  coverBrightnessDesiredDim =
                      dim

                  if (coverBrightnessBusy) {
                      return
                  }

                  coverBrightnessBusy =
                      true

                  scope.launch(
                      Dispatchers.IO
                  ) {
                      val requested =
                          coverBrightnessDesiredDim

                      val result =
                          if (requested) {
                              ShizukuBridge.dimCoverBrightness()
                          } else {
                              ShizukuBridge.restoreCoverBrightness()
                          }

                      val ok =
                          result?.getBoolean(
                              "ok",
                              false,
                          ) == true

                      val error =
                          result?.getString(
                              "error"
                          )

                      val coverId =
                          result?.getInt(
                              "coverDisplayId",
                              -1,
                          ) ?: -1

                      DuoDiagnostics.event(
                          "cover-brightness",
                          "dim=$requested ok=$ok reason=$reason " +
                              "coverId=$coverId error=$error",
                      )

                      handler.post {
                          coverBrightnessBusy =
                              false

                          if (ok) {
                              coverBrightnessActualDim =
                                  requested
                          } else if (!requested) {
                              /*
                               * Fail safe: do not keep automatically dimming if restoring
                               * the user's previous cover brightness did not succeed.
                               */
                              coverBrightnessActualDim =
                                  false

                              coverIdleDimArmed =
                                  false
                          }

                          if (
                              coverBrightnessDesiredDim !=
                              coverBrightnessActualDim
                          ) {
                              requestCoverBrightness(
                                  dim =
                                      coverBrightnessDesiredDim,
                                  reason =
                                      "reconcile",
                              )
                          }
                      }
                  }
              }

          """,
              "FoldOverlayService brightness worker",
          )

          insert_before_once(
              service_path,
              """        /** How old a panel's last picture may be and still bridge the next fold. */
          """,
              """        private const val COVER_HINGE_WAKE_DEGREES =
                      2.0f

                  private const val COVER_IDLE_DIM_REARM_ANGLE =
                      179.0f

                  private const val COVER_IDLE_DIM_DELAY_MS =
                      700L

          """,
              "FoldOverlayService brightness constants",
          )

          # UI --------------------------------------------------------------------

          sheet_path = (
              "app/src/main/java/com/duoopen/ui/"
              "ControlSheet.kt"
          )

          replace_once(
              sheet_path,
              """                    Text(
                                  "Reset panel power"
                              )
          """,
              """                    Text(
                                  "Disable secondary panel"
                              )
          """,
              "ControlSheet disable label",
          )

          replace_once(
              sheet_path,
              """            Hint(
                          "One-shot Fold7 test. There is no retry loop. " +
                              "The secondary panel is automatically power-reset " +
                              "after 90 seconds.",
                      )""",
              """            Hint(
                          "Field-test mode: enable-display keeps the second panel alive " +
                              "without Samsung's presentation popup. While fully open and " +
                              "idle, the cover OLED is set to 1%; its previous brightness " +
                              "returns after about 2° of hinge movement. The secondary " +
                              "display auto-disables after 90 seconds in this build.",
                      )""",
              "ControlSheet power explanation",
          )

          # Version ----------------------------------------------------------------

          gradle_path = Path(
              "app/build.gradle.kts"
          )

          gradle = gradle_path.read_text()

          if "versionCode = 11" not in gradle:
              raise SystemExit(
                  "Expected versionCode 11 was not found."
              )

          if (
              'versionName = "1.3.7-zfold7-service-dual-probe"'
              not in gradle
          ):
              raise SystemExit(
                  "Expected 1.3.7 versionName was not found."
              )

          gradle = gradle.replace(
              "versionCode = 11",
              "versionCode = 12",
              1,
          )

          gradle = gradle.replace(
              'versionName = "1.3.7-zfold7-service-dual-probe"',
              'versionName = "1.3.8-zfold7-dual-power-oled"',
              1,
          )

          gradle_path.write_text(
              gradle
          )
          PY

      - name: Validate dual power + OLED pass
        run: |
          git diff --check
          git diff --stat

          grep -R "cmd display disable-display" app/src/full/java/com/duoopen/shell/DuoShellService.kt
          grep -R "cmd display set-brightness 0.01" app/src/full/java/com/duoopen/shell/DuoShellService.kt
          grep -R "COVER_HINGE_WAKE_DEGREES" app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt
          grep -R "Disable secondary panel" app/src/main/java/com/duoopen/ui/ControlSheet.kt
          grep -R "1.3.8-zfold7-dual-power-oled" app/build.gradle.kts

          mkdir -p zfold7-artifacts
          git diff > zfold7-artifacts/zfold7-dual-power-oled.patch

      - name: Compile, unit test, and build
        run: |
          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

      - name: Prepare APK
        run: |
          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "Debug APK not found."
            exit 1
          fi

          cp \
            "$APK" \
            zfold7-artifacts/DuoOpen-ZFold7-dual-power-oled-debug.apk

          {
            echo "commit=${GITHUB_SHA}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "pass=disable-display+cover-oled-idle-dim+angle-resilience"
            echo

            sha256sum \
              zfold7-artifacts/DuoOpen-ZFold7-dual-power-oled-debug.apk

          } > zfold7-artifacts/BUILD-INFO.txt

          cat zfold7-artifacts/BUILD-INFO.txt

      - name: Upload field-test artifacts
