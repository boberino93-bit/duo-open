                          visibleAfter
                      ) {
                          handler.post {
                              mirrorRequested =
                                  true

                              syncMirrorHost(
                                  "secondary-enabled"
                              )
                          }
                      }

                      scheduleDisplayProbe(
          """,
              "FoldOverlayService remove 90-second motion shutdown",
          )

          replace_once(
              service_path,
              '            service.runSecondaryDisplayExperiment(\n                enable = enable,\n            )\n            return true\n',
              """                      if (enable) {
                          service.armGeometryContinuity()
                      } else {
                          service.runSecondaryDisplayExperiment(
                              enable =
                                  false,
                              reason =
