name: Build Z Fold 7 Debug Variants

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Create artifact directory
        run: mkdir -p zfold7-artifacts

      # ================================================================
      # ITERATION 1 — CORE Z FOLD 7 FIXES
      # ================================================================

      - name: Apply core fixes
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()

              if old not in s:
                  raise SystemExit(
                      f"Could not find expected text in {path}:\n{old}"
                  )

              p.write_text(s.replace(old, new, 1))


          # ------------------------------------------------------------
          # HingeAngleSource
          #
          # Do not treat duplicate Samsung wallpaper readings as actual
          # physical hinge movement.
          # ------------------------------------------------------------

          p = "app/src/main/java/com/duoopen/fold/HingeAngleSource.kt"

          replace(
              p,
              '''    fun feedExternal(angle: Float) {
                  if (!angle.isFinite()) return
                  val now = SystemClock.uptimeMillis()
                  externalActive = true
                  externalLastUptime = now
                  lastEventUptime = now
                  tickRate(now)
                  lastAngle = angle.coerceIn(0f, 180f)
                  onAngle(lastAngle)
              }''',
              '''    fun feedExternal(angle: Float) {
                  if (!angle.isFinite()) return

                  val now = SystemClock.uptimeMillis()

                  externalActive = true
                  externalLastUptime = now

                  // Keep the Shizuku source heartbeat alive without treating
                  // repeated identical wallpaper replies as hinge movement.
                  tickRate(now)
                  lastEventUptime = now

                  val next = angle.coerceIn(0f, 180f)

                  val changed =
                      lastAngle.isNaN() ||
                          abs(next - lastAngle) >= EXTERNAL_CHANGE_EPS

                  lastAngle = next

                  if (changed) {
                      onAngle(next)
                  }
              }'''
          )

          # Fix event-rate calculation ordering for the normal sensor path.
          replace(
              p,
              '''        val now = SystemClock.uptimeMillis()
                  lastEventUptime = now
                  tickRate(now)
                  lastAngle = value.coerceIn(0f, 180f)''',
              '''        val now = SystemClock.uptimeMillis()
                  tickRate(now)
                  lastEventUptime = now
                  lastAngle = value.coerceIn(0f, 180f)'''
          )

          replace(
              p,
              '''        const val EXTERNAL_STALE_MS = 3_000L
                  val STOPS = intArrayOf(0, 90, 180)''',
              '''        const val EXTERNAL_STALE_MS = 3_000L

                  // Small deadband for Samsung wallpaper angle jitter.
                  const val EXTERNAL_CHANGE_EPS = 0.15f

                  val STOPS = intArrayOf(0, 90, 180)'''
          )


          # ------------------------------------------------------------
          # FoldOverlayService
          #
          # Display enumeration does not belong in the hinge hot path.
          # DisplayManager already sends display-change callbacks.
          # ------------------------------------------------------------

          p = "app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt"

          replace(
              p,
              '''    private fun onHinge(angle: Float) {
                  syncDisplays()
                  for (e in engines.values.toList()) e.onHinge(angle)
              }''',
              '''    private fun onHinge(angle: Float) {
                  for (e in engines.values.toList()) {
                      e.onHinge(angle)
                  }
              }'''
          )


          # ------------------------------------------------------------
          # Version
          # ------------------------------------------------------------

          p = "app/build.gradle.kts"

          replace(
              p,
              'versionCode = 4',
              'versionCode = 5'
          )

          replace(
              p,
              'versionName = "1.3.0"',
              'versionName = "1.3.1-zfold7-core"'
          )

          print("Core patches applied.")
          PY


      - name: Validate core patch
        run: |
          git diff --check
          git diff --stat
          git diff > zfold7-artifacts/zfold7-core.patch


      - name: Compile and test core build
        run: |
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

          CORE_APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$CORE_APK" ]; then
            echo "Core APK not found."
            exit 1
          fi

          cp "$CORE_APK" \
            zfold7-artifacts/DuoOpen-ZFold7-core-debug.apk


      # Upload this NOW so we keep it even if experimental iteration 2 fails.
      - name: Upload core APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-core
          path: |
            zfold7-artifacts/DuoOpen-ZFold7-core-debug.apk
            zfold7-artifacts/zfold7-core.patch
          if-no-files-found: error
          retention-days: 30


      # ================================================================
      # ITERATION 2 — SMOOTHNESS / LATENCY PASS
      # ================================================================

      - name: Apply smoothness enhancements
        run: |
          python3 <<'PY'
          from pathlib import Path


          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()

              if old not in s:
                  raise SystemExit(
                      f"Could not find expected text in {path}:\n{old}"
                  )

              p.write_text(s.replace(old, new, 1))


          # ============================================================
          # WallpaperAngleFeed
          # ============================================================

          p = "app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt"


          # Needed for angle-delta detection.
          replace(
              p,
              'import com.duoopen.fold.HingeAngleSource',
              '''import com.duoopen.fold.HingeAngleSource
          import kotlin.math.abs'''
          )


          # Documentation only.
          replace(
              p,
              'wallpaper through it at [POLL_MS], and let the Shizuku-side log reader',
              'wallpaper through it at an adaptive cadence, and let the Shizuku-side log reader'
          )


          # Track whether the physical hinge is actively moving.
          replace(
              p,
              '''    private var lastCallbackUptime = 0L''',
              '''    private var lastCallbackUptime = 0L

              private var lastAngleSeen = Float.NaN
              private var lastAngleChangeUptime = 0L'''
          )


          # ------------------------------------------------------------
          # Adaptive Samsung polling
          #
          # At rest:  33ms ≈ 30Hz
          # Moving:    8ms ≈ 125Hz target
          # ------------------------------------------------------------

          replace(
              p,
              '''            handler.postDelayed(this, POLL_MS)''',
              '''            val now = SystemClock.uptimeMillis()

                  val moving =
                      lastAngleChangeUptime != 0L &&
                          now - lastAngleChangeUptime <= ACTIVE_BURST_MS

                  handler.postDelayed(
                      this,
                      if (moving) ACTIVE_POLL_MS else IDLE_POLL_MS,
                  )'''
          )


          # Reset movement state each time the feed starts.
          replace(
              p,
              '''        startedAt = SystemClock.uptimeMillis()
                  status = "Starting"''',
              '''        startedAt = SystemClock.uptimeMillis()

                  lastAngleSeen = Float.NaN
                  lastAngleChangeUptime = 0L

                  status = "Starting"'''
          )


          # Detect real hinge movement separately from repeated replies.
          replace(
              p,
              '''    private fun onAngle(angle: Float) {
                  if (!running) return
                  lastCallbackUptime = SystemClock.uptimeMillis()
                  hinge.feedExternal(angle)
              }''',
              '''    private fun onAngle(angle: Float) {
                  if (!running) return

                  val now = SystemClock.uptimeMillis()
                  lastCallbackUptime = now

                  if (
                      lastAngleSeen.isNaN() ||
                      abs(angle - lastAngleSeen) >= ANGLE_CHANGE_EPS
                  ) {
                      lastAngleSeen = angle
                      lastAngleChangeUptime = now
                  }

                  hinge.feedExternal(angle)
              }'''
          )


          replace(
              p,
              '''        const val POLL_MS = 33L
                  private const val STALE_MS = 2_500L''',
              '''        /**
                   * Low overhead at rest, near-display-refresh polling while
                   * the Fold 7 hinge is physically moving.
                   */
                  const val IDLE_POLL_MS = 33L
                  const val ACTIVE_POLL_MS = 8L
                  const val ACTIVE_BURST_MS = 750L
                  const val ANGLE_CHANGE_EPS = 0.15f

                  private const val STALE_MS = 2_500L'''
          )


          # ============================================================
          # PanelEngine
          # ============================================================

          p = "app/src/full/java/com/duoopen/overlay/PanelEngine.kt"


          # ------------------------------------------------------------
          # Faster follower for the continuous Samsung angle.
          #
          # Original tau is 45ms.
          # Continuous Shizuku source gets 30ms.
          # ------------------------------------------------------------

          replace(
              p,
              '''            }.also { it.snap(startTilt) }''',
              '''            }.also {
                  it.snap(startTilt)

                  if (
                      hinge.externalActive &&
                      easeTo == null
                  ) {
                      it.tauS = SAMSUNG_LIVE_TAU_S
                  }
              }'''
          )


          # ------------------------------------------------------------
          # Completion-paced screen capture
          #
          # Add a timestamp immediately before each actual live capture.
          # ------------------------------------------------------------

          replace(
              p,
              '''            scope.launch {
                      val frame = withContext(Dispatchers.IO) { ShizukuBridge.capture(displayId, excluded, LIVE_SHELL_SCALE) }''',
              '''            val frameStarted = SystemClock.uptimeMillis()

                  scope.launch {
                      val frame = withContext(Dispatchers.IO) {
                          ShizukuBridge.capture(
                              displayId,
                              excluded,
                              LIVE_SHELL_SCALE,
                          )
                      }'''
          )


          # ------------------------------------------------------------
          # Replace "capture time + fixed delay" with completion pacing.
          #
          # Old:
          #
          # capture ~50ms
          # + wait 80ms
          # ~= 130ms/frame
          #
          # New:
          #
          # next target = frame start + 60ms
          # ------------------------------------------------------------

          replace(
              p,
              '''                handler.postDelayed({ tick() }, LIVE_INTERVAL_MS)
                  }
              }
              handler.postDelayed({ tick() }, LIVE_INTERVAL_MS)
          ''',
              '''                val nextDelay =
                      (
                          frameStarted +
                              LIVE_FRAME_PERIOD_MS -
                              SystemClock.uptimeMillis()
                      ).coerceAtLeast(0L)

                  handler.postDelayed(
                      { tick() },
                      nextDelay,
                  )
              }
          }

              handler.postDelayed(
                  { tick() },
                  LIVE_START_DELAY_MS,
              )
          '''
          )


          # ------------------------------------------------------------
          # Runtime tuning
          # ------------------------------------------------------------

          replace(
              p,
              '''        const val LIVE_SHELL_SCALE = 0.5f''',
              '''        const val LIVE_SHELL_SCALE = 0.45f'''
          )

          replace(
              p,
              '''        const val LIVE_INTERVAL_MS = 80L''',
              '''        // Idle/error retry cadence for the live loop.
                  const val LIVE_INTERVAL_MS = 60L

                  // Target period for successfully captured frames.
                  const val LIVE_FRAME_PERIOD_MS = 60L

                  // Start the live refresh shortly after the first frame.
                  const val LIVE_START_DELAY_MS = 20L

                  // Lower latency for Samsung's real continuous angle source.
                  const val SAMSUNG_LIVE_TAU_S = 0.030f'''
          )


          # ------------------------------------------------------------
          # Iteration 2 version
          # ------------------------------------------------------------

          p = "app/build.gradle.kts"

          replace(
              p,
              'versionCode = 5',
              'versionCode = 6'
          )

          replace(
              p,
              'versionName = "1.3.1-zfold7-core"',
              'versionName = "1.3.1-zfold7-enhanced"'
          )

          print("Enhanced patches applied.")
          PY


      - name: Validate enhanced patch
        run: |
          git diff --check
          git diff --stat
          git diff > zfold7-artifacts/zfold7-enhanced.patch


      - name: Compile and test enhanced build
        run: |
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

          ENHANCED_APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"

          if [ -z "$ENHANCED_APK" ]; then
            echo "Enhanced APK not found."
            exit 1
          fi

          cp "$ENHANCED_APK" \
            zfold7-artifacts/DuoOpen-ZFold7-enhanced-debug.apk


      - name: Show checksums
        run: |
          echo
          echo "Artifacts:"
          ls -lh zfold7-artifacts
          echo
          echo "SHA-256:"
          sha256sum zfold7-artifacts/*.apk


      - name: Upload enhanced APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-enhanced
          path: |
            zfold7-artifacts/DuoOpen-ZFold7-enhanced-debug.apk
            zfold7-artifacts/zfold7-enhanced.patch
          if-no-files-found: error
          retention-days: 30