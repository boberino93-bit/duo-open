name: Build Z Fold 7 Left Pane Continuity

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Replay proven 1.3.10 root-mirror build
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          previous_commit = "fcec434b09f055a7277ed4414cdb5cce39d7a07c"

          previous_workflow = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{previous_commit}:.github/workflows/build-shizuku-apk.yml",
              ],
              text=True,
          )

          lines = previous_workflow.splitlines()

          wanted_steps = [
              "Replay proven 1.3.9 live-mirror build",
              "Move mirror to destination window root",
          ]

          def extract_run_block(step_name: str) -> str:
              step_start = None

              for index, line in enumerate(lines):
                  if line.strip() == f"- name: {step_name}":
                      step_start = index
                      break

              if step_start is None:
                  raise SystemExit(
                      f"Previous workflow step not found: {step_name}"
                  )

              run_line = None

              for index in range(step_start + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  if line.strip() == "run: |":
                      run_line = index
                      break

              if run_line is None:
                  raise SystemExit(
                      f"Run block not found for: {step_name}"
                  )

              block = []

              for index in range(run_line + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  block.append(line)

              return textwrap.dedent(
                  "\n".join(block)
              )

          for step_name in wanted_steps:
              script = extract_run_block(
                  step_name
              )

              script_path = Path(
                  "/tmp/" +
                  re.sub(
                      r"[^A-Za-z0-9]+",
                      "-",
                      step_name,
                  ).strip("-") +
                  ".sh"
              )

              script_path.write_text(
                  "set -euo pipefail\n" +
                  script +
                  "\n"
              )

              print(
                  f"Replaying proven step: {step_name}"
              )

              subprocess.run(
                  [
                      "bash",
                      str(script_path),
                  ],
                  check=True,
              )
          PY

      - name: Consolidate left-pane continuity and topology handling
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text()

          def save(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new, label):
              text = load(path)
              if old not in text:
                  raise SystemExit(f"{label}: expected source not found in {path}")
              save(path, text.replace(old, new, 1))

          def regex_replace_once(path, pattern, replacement, label, flags=re.S):
              text = load(path)
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected one regex match in {path}, got {count}"
                  )
              save(path, new_text)

          mirror_host_path = Path(
              "app/src/full/java/com/duoopen/overlay/"
              "DisplayMirrorHost.kt"
          )

          mirror_host_path.write_text(
              r'''package com.duoopen.overlay

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.hardware.display.DisplayManager
          import android.view.Display
          import android.view.Gravity
          import android.view.SurfaceControl
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout
          import com.duoopen.shell.ShizukuBridge
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch

          class DisplayMirrorHost(
              private val service: AccessibilityService,
              val display: Display,
              private val scope: CoroutineScope,
              private val onStatus: (String) -> Unit,
          ) {
              val displayId: Int = display.displayId

              private val displayManager =
                  service.getSystemService(DisplayManager::class.java)

              private val context =
                  service
                      .createDisplayContext(display)
                      .createWindowContext(
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          null,
                      )

              private val windowManager =
                  context.getSystemService(WindowManager::class.java)

              private var attached = false
              private var generation = 0
              private var mirrorSourceKey: String? = null
              private var appMirror: SurfaceControl? = null
              private var latestHingeAngle = Float.NaN
              private var lastLoggedAngleBucket = Int.MIN_VALUE

              private val hostView =
                  FrameLayout(context).apply {
                      setBackgroundColor(Color.TRANSPARENT)
                      importantForAccessibility =
                          View.IMPORTANT_FOR_ACCESSIBILITY_NO

                      addOnAttachStateChangeListener(
                          object : View.OnAttachStateChangeListener {
                              override fun onViewAttachedToWindow(v: View) {
                                  v.post {
                                      bind("window-attached")
                                  }
                              }

                              override fun onViewDetachedFromWindow(v: View) {
                                  generation++
                                  mirrorSourceKey = null
                                  releaseAppMirror()

                                  com.duoopen.debug.DuoDiagnostics.event(
                                      "live-mirror",
                                      "left-pane host detached display=$displayId",
                                  )
                              }
                          }
                      )

                      addOnLayoutChangeListener {
                              _,
                              left,
                              top,
                              right,
                              bottom,
                              oldLeft,
                              oldTop,
                              oldRight,
                              oldBottom,
                          ->
                          val width = right - left
                          val height = bottom - top
                          val oldWidth = oldRight - oldLeft
                          val oldHeight = oldBottom - oldTop

                          if (
                              width > 0 &&
                              height > 0 &&
                              (
                                  width != oldWidth ||
                                      height != oldHeight
                              )
                          ) {
                              post {
                                  refresh("host-layout ${width}x$height")
                              }
                          }
                      }
                  }

              fun attach() {
                  if (attached) {
                      refresh("already-attached")
                      return
                  }

                  val params =
                      WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                              WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                          PixelFormat.TRANSLUCENT,
                      ).apply {
                          gravity = Gravity.TOP or Gravity.START
                          layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                          fitInsetsTypes = 0
                          title = "DuoOpenLeftPaneMirror"
                      }

                  attached =
                      runCatching {
                          windowManager.addView(hostView, params)
                      }.onFailure { error ->
                          onStatus(
                              "Could not attach left-pane mirror window: ${error.message}"
                          )

                          com.duoopen.debug.DuoDiagnostics.event(
                              "live-mirror",
                              "left-pane host add failed display=$displayId " +
                                  "error=${error.javaClass.simpleName}:${error.message}",
                          )
                      }.isSuccess
              }

              fun refresh(reason: String) {
                  if (
                      !attached ||
                      !hostView.isAttachedToWindow
                  ) {
                      return
                  }

                  bind(reason)
              }

              fun onHinge(angle: Float) {
                  latestHingeAngle = angle

                  val bucket =
                      (angle / 10f).toInt()

                  if (bucket != lastLoggedAngleBucket) {
                      lastLoggedAngleBucket = bucket

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "hinge angle=$angle display=$displayId " +
                              "mirrorValid=${appMirror?.isValid == true}",
                      )
                  }
              }

              private fun findInnerDisplay(): Display? =
                  displayManager.displays
                      .firstOrNull { candidate ->
                          val mode = candidate.mode

                          mode.physicalWidth == INNER_WIDTH &&
                              mode.physicalHeight == INNER_HEIGHT
                      }

              private fun bind(reason: String) {
                  val root = hostView.rootSurfaceControl

                  if (root == null) {
                      onStatus(
                          "Left-pane mirror window is attached, but its root SurfaceControl is not ready."
                      )
                      return
                  }

                  val source =
                      findInnerDisplay()

                  if (source == null) {
                      onStatus(
                          "Waiting for the Fold7 inner display before binding the left pane."
                      )

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "inner source missing reason=$reason " +
                              "destination=$displayId hinge=$latestHingeAngle",
                      )
                      return
                  }

                  val sourceMode = source.mode
                  val sourceWidth = sourceMode.physicalWidth
                  val sourceHeight = sourceMode.physicalHeight

                  val sourceKey =
                      "inner=${source.displayId}:${sourceWidth}x$sourceHeight;" +
                          "cover=$displayId"

                  val current = appMirror

                  if (
                      mirrorSourceKey == sourceKey &&
                      current != null &&
                      current.isValid
                  ) {
                      applyGeometry(
                          mirror = current,
                          sourceWidth = sourceWidth,
                          sourceHeight = sourceHeight,
                          reason = "reuse:$reason",
                          initialReparent = false,
                      )
                      return
                  }

                  val localGeneration = ++generation
                  mirrorSourceKey = null

                  onStatus(
                      "Creating live left-pane mirror: " +
                          "display ${source.displayId} " +
                          "${sourceWidth}×$sourceHeight → " +
                          "cover display $displayId…"
                  )

                  scope.launch(Dispatchers.IO) {
                      val result =
                          ShizukuBridge.startDisplayMirror(
                              sourceDisplayId = source.displayId,
                          )

                      val ok =
                          result?.getBoolean("ok", false) == true

                      val error =
                          result?.getString("error")

                      val mirror =
                          if (ok) {
                              result?.getParcelable(
                                  "mirrorSurface",
                                  SurfaceControl::class.java,
                              )
                          } else {
                              null
                          }

                      hostView.post {
                          if (localGeneration != generation) {
                              mirror?.release()
                              return@post
                          }

                          if (
                              !ok ||
                              mirror == null ||
                              !mirror.isValid
                          ) {
                              mirror?.release()
                              mirrorSourceKey = null

                              val detail =
                                  error
                                      ?: "shell returned no valid mirror SurfaceControl"

                              onStatus(
                                  "Left-pane live mirror failed: $detail"
                              )

                              com.duoopen.debug.DuoDiagnostics.event(
                                  "live-mirror",
                                  "left-pane bind failed reason=$reason " +
                                      "source=${source.displayId} " +
                                      "destination=$displayId error=$detail",
                              )
                              return@post
                          }

                          releaseAppMirror()

                          appMirror = mirror
                          mirrorSourceKey = sourceKey

                          val applied =
                              applyGeometry(
                                  mirror = mirror,
                                  sourceWidth = sourceWidth,
                                  sourceHeight = sourceHeight,
                                  reason = "new:$reason",
                                  initialReparent = true,
                              )

                          if (!applied) {
                              releaseAppMirror()
                              mirrorSourceKey = null
                              return@post
                          }

                          onStatus(
                              "LEFT PANE LIVE: inner display ${source.displayId} → cover display $displayId."
                          )
                      }
                  }
              }

              private fun applyGeometry(
                  mirror: SurfaceControl,
                  sourceWidth: Int,
                  sourceHeight: Int,
                  reason: String,
                  initialReparent: Boolean,
              ): Boolean {
                  val root =
                      hostView.rootSurfaceControl
                          ?: return false

                  val destinationMode = display.mode

                  val destinationWidth =
                      hostView.width
                          .takeIf { it > 0 }
                          ?: destinationMode.physicalWidth

                  val destinationHeight =
                      hostView.height
                          .takeIf { it > 0 }
                          ?: destinationMode.physicalHeight

                  if (
                      destinationWidth <= 0 ||
                      destinationHeight <= 0
                  ) {
                      onStatus("Waiting for non-zero cover bounds.")
                      return false
                  }

                  val sourceCropWidth =
                      (sourceWidth / 2).coerceAtLeast(1)

                  val sourceCrop =
                      Rect(
                          0,
                          0,
                          sourceCropWidth,
                          sourceHeight,
                      )

                  val scale =
                      maxOf(
                          destinationWidth.toFloat() /
                              sourceCropWidth.toFloat(),
                          destinationHeight.toFloat() /
                              sourceHeight.toFloat(),
                      )

                  val drawnWidth =
                      sourceCropWidth * scale

                  val drawnHeight =
                      sourceHeight * scale

                  val x =
                      (destinationWidth - drawnWidth) * 0.5f

                  val y =
                      (destinationHeight - drawnHeight) * 0.5f

                  val transaction =
                      if (initialReparent) {
                          root.buildReparentTransaction(mirror)
                      } else {
                          SurfaceControl.Transaction()
                      }

                  if (transaction == null) {
                      onStatus(
                          "Android could not create the mirror transaction."
                      )
                      return false
                  }

                  return try {
                      transaction
                          .setCrop(
                              mirror,
                              sourceCrop,
                          )
                          .setScale(
                              mirror,
                              scale,
                              scale,
                          )
                          .setPosition(
                              mirror,
                              x,
                              y,
                          )
                          .setLayer(
                              mirror,
                              10_000,
                          )
                          .setAlpha(
                              mirror,
                              1f,
                          )
                          .setVisibility(
                              mirror,
                              true,
                          )

                      val queued =
                          root.applyTransactionOnDraw(
                              transaction
                          )

                      hostView.invalidate()

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "left-pane geometry ok reason=$reason " +
                              "source=${sourceWidth}x$sourceHeight " +
                              "crop=0,0-${sourceCropWidth},${sourceHeight} " +
                              "destination=${destinationWidth}x$destinationHeight " +
                              "scale=$scale x=$x y=$y " +
                              "queuedOnDraw=$queued hinge=$latestHingeAngle",
                      )

                      true
                  } catch (t: Throwable) {
                      runCatching {
                          transaction.close()
                      }

                      val detail =
                          "${t.javaClass.simpleName}: ${t.message}"

                      onStatus(
                          "Left-pane geometry failed: $detail"
                      )

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "left-pane geometry exception reason=$reason error=$detail",
                      )

                      false
                  }
              }

              private fun releaseAppMirror() {
                  val current =
                      appMirror
                          ?: return

                  appMirror = null

                  runCatching {
                      current.release()
                  }
              }

              fun detach() {
                  generation++
                  mirrorSourceKey = null
                  releaseAppMirror()

                  if (!attached) {
                      return
                  }

                  attached = false

                  runCatching {
                      windowManager.removeViewImmediate(hostView)
                  }

                  com.duoopen.debug.DuoDiagnostics.event(
                      "live-mirror",
                      "left-pane host removed display=$displayId",
                  )
              }

              private companion object {
                  const val INNER_WIDTH = 1968
                  const val INNER_HEIGHT = 2184
              }
          }
          '''
          )

          service_path = (
              "app/src/full/java/com/duoopen/overlay/"
              "FoldOverlayService.kt"
          )

          replace_once(
              service_path,
              '''    private fun onHinge(angle: Float) {
                  if (mirrorRequested) {
                      return
                  }

                  // DisplayManager callbacks own panel topology.
                  // Keep the high-frequency hinge path render-only.
                  for (e in engines.values.toList()) {
                      e.onHinge(angle)
                  }
              }
          ''',
              '''    private fun onHinge(angle: Float) {
                  if (mirrorRequested) {
                      mirrorHost?.onHinge(
                          angle
                      )
                      return
                  }

                  // DisplayManager callbacks own panel topology.
                  // Keep the high-frequency hinge path render-only.
                  for (e in engines.values.toList()) {
                      e.onHinge(angle)
                  }
              }
          ''',
              "FoldOverlayService hinge feed to mirror",
          )

          regex_replace_once(
              service_path,
              r'''    private fun syncMirrorHost\(
                  reason: String,
              \) \{
          .*?
              \}

              private fun safeToReleaseSecondaryPanel\(\): Boolean \{''',
              '''    private fun syncMirrorHost(
                  reason: String,
              ) {
                  if (!mirrorRequested) {
                      return
                  }

                  val primary =
                      displayManager.getDisplay(
                          Display.DEFAULT_DISPLAY
                      )

                  if (primary == null) {
                      _secondaryDisplayStatus.value =
                          "Waiting for Android's default display."
                      return
                  }

                  val primaryMode = primary.mode

                  val coverIsNativePrimary =
                      (
                          primaryMode.physicalWidth == 1080 &&
                              primaryMode.physicalHeight == 2520
                      ) ||
                          (
                              primaryMode.physicalWidth == 822 &&
                                  primaryMode.physicalHeight == 1918
                          )

                  if (coverIsNativePrimary) {
                      mirrorHost?.detach()
                      mirrorHost = null

                      scope.launch(
                          Dispatchers.IO
                      ) {
                          ShizukuBridge.stopDisplayMirror()
                      }

                      _secondaryDisplayStatus.value =
                          "Native cover is primary; temporary left-pane mirror released."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "native-cover-handoff reason=$reason " +
                              "primary=${primary.displayId} " +
                              "mode=${primaryMode.physicalWidth}x${primaryMode.physicalHeight}",
                      )
                      return
                  }

                  val innerIsPrimary =
                      primaryMode.physicalWidth == 1968 &&
                          primaryMode.physicalHeight == 2184

                  if (!innerIsPrimary) {
                      _secondaryDisplayStatus.value =
                          "Waiting for a known Fold7 inner/cover topology."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "unknown primary topology reason=$reason " +
                              "primary=${primary.displayId} " +
                              "mode=${primaryMode.physicalWidth}x${primaryMode.physicalHeight}",
                      )
                      return
                  }

                  val cover =
                      displayManager.displays
                          .firstOrNull { candidate ->
                              if (
                                  candidate.displayId ==
                                      Display.DEFAULT_DISPLAY ||
                                  candidate.state ==
                                      Display.STATE_OFF ||
                                  candidate.state ==
                                      Display.STATE_UNKNOWN
                              ) {
                                  false
                              } else {
                                  val mode = candidate.mode

                                  (
                                      mode.physicalWidth == 1080 &&
                                          mode.physicalHeight == 2520
                                  ) ||
                                      (
                                          mode.physicalWidth == 822 &&
                                              mode.physicalHeight == 1918
                                      )
                              }
                          }

                  if (cover == null) {
                      _secondaryDisplayStatus.value =
                          "Live mirror is waiting for the Fold7 cover display."

                      mirrorHost?.detach()
                      mirrorHost = null

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "cover logical display missing reason=$reason",
                      )
                      return
                  }

                  val current = mirrorHost

                  if (
                      current == null ||
                      current.displayId != cover.displayId
                  ) {
                      current?.detach()

                      mirrorHost =
                          DisplayMirrorHost(
                              service = this,
                              display = cover,
                              scope = scope,
                              onStatus = { message ->
                                  _secondaryDisplayStatus.value =
                                      message
                              },
                          ).also {
                              it.attach()
                          }

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "left-pane host created reason=$reason " +
                              "cover=${cover.displayId} " +
                              "mode=${cover.mode.physicalWidth}x${cover.mode.physicalHeight}",
                      )
                      return
                  }

                  current.refresh(reason)
              }

              private fun safeToReleaseSecondaryPanel(): Boolean {''',
              "FoldOverlayService Fold7 topology-aware mirror host",
          )

          sheet_path = (
              "app/src/main/java/com/duoopen/ui/"
              "ControlSheet.kt"
          )

          replace_once(
              sheet_path,
              '"Start root mirror"',
              '"Start left-pane continuity"',
              "ControlSheet left-pane label",
          )

          replace_once(
              sheet_path,
              '''"Root-mirror probe: WindowManager creates the live display mirror in the " +
                              "Shizuku shell process, then Duo Open attaches that mirror directly to the " +
                              "secondary overlay window root. Repeated display callbacks reuse the same " +
                              "mirror unless Samsung actually changes display geometry. Test an open app " +
                              "and the launcher before moving the hinge."''',
              '''"Fold7 continuity probe: only the LEFT half of the live inner display is " +
                              "carried onto the cover, matching the pane that physically moves across the crease. " +
                              "The mirror fills the cover with a small centered overscan, updates geometry without " +
                              "recreating the mirror, tracks Samsung topology changes, and releases itself when the " +
                              "cover becomes Android's native primary display."''',
              "ControlSheet left-pane explanation",
          )

          gradle_path = Path(
              "app/build.gradle.kts"
          )

          gradle = gradle_path.read_text()

          if "versionCode = 14" not in gradle:
              raise SystemExit(
                  "Expected root-mirror versionCode 14 was not found."
              )

          if (
              'versionName = "1.3.10-zfold7-root-mirror-probe"'
              not in gradle
          ):
              raise SystemExit(
                  "Expected root-mirror versionName was not found."
              )

          gradle = gradle.replace(
              "versionCode = 14",
              "versionCode = 15",
              1,
          )

          gradle = gradle.replace(
              'versionName = "1.3.10-zfold7-root-mirror-probe"',
              'versionName = "1.3.11-zfold7-left-pane-continuity"',
              1,
          )

          gradle_path.write_text(
              gradle
          )
          PY

      - name: Validate consolidated continuity pass
        run: |
          git diff --check
          git diff --stat

          grep -R "setCrop" app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt
          grep -R "sourceWidth / 2" app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt
          grep -R "left-pane geometry ok" app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt
          grep -R "native-cover-handoff" app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt
          grep -R "Start left-pane continuity" app/src/main/java/com/duoopen/ui/ControlSheet.kt
          grep -R "1.3.11-zfold7-left-pane-continuity" app/build.gradle.kts

          mkdir -p zfold7-artifacts
          git diff > zfold7-artifacts/zfold7-left-pane-continuity.patch

      - name: Compile, unit test, and build
        run: |
          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

      - name: Prepare APK
        run: |
          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "Debug APK not found."
            exit 1
          fi

          cp \
            "$APK" \
            zfold7-artifacts/DuoOpen-ZFold7-left-pane-continuity-debug.apk

          {
            echo "commit=${GITHUB_SHA}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "pass=left-pane-crop+cover-fill+stable-reuse+layout-refresh+physical-topology+native-handoff+hinge-diagnostics"
            echo

            sha256sum \
              zfold7-artifacts/DuoOpen-ZFold7-left-pane-continuity-debug.apk

          } > zfold7-artifacts/BUILD-INFO.txt

          cat zfold7-artifacts/BUILD-INFO.txt

      - name: Upload field-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-left-pane-continuity
          path: |
            zfold7-artifacts/DuoOpen-ZFold7-left-pane-continuity-debug.apk
            zfold7-artifacts/zfold7-left-pane-continuity.patch
            zfold7-artifacts/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30