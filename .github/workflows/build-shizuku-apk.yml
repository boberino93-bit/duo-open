name: Build Z Fold 7 Root Surface Mirror Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Replay proven 1.3.9 live-mirror build
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          previous_commit = "5a2aeeced2995eeef158ad7f82ae07eddb5188ab"

          previous_workflow = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{previous_commit}:.github/workflows/build-shizuku-apk.yml",
              ],
              text=True,
          )

          lines = previous_workflow.splitlines()

          wanted_steps = [
              "Replay proven 1.3.7 service-dual build",
              "Add live SurfaceControl display mirror probe",
          ]

          def extract_run_block(step_name: str) -> str:
              step_start = None

              for index, line in enumerate(lines):
                  if line.strip() == f"- name: {step_name}":
                      step_start = index
                      break

              if step_start is None:
                  raise SystemExit(
                      f"Previous workflow step not found: {step_name}"
                  )

              run_line = None

              for index in range(step_start + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  if line.strip() == "run: |":
                      run_line = index
                      break

              if run_line is None:
                  raise SystemExit(
                      f"Run block not found for: {step_name}"
                  )

              block = []

              for index in range(run_line + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  block.append(line)

              return textwrap.dedent(
                  "\n".join(block)
              )

          for step_name in wanted_steps:
              script = extract_run_block(
                  step_name
              )

              script_path = Path(
                  "/tmp/" +
                  re.sub(
                      r"[^A-Za-z0-9]+",
                      "-",
                      step_name,
                  ).strip("-") +
                  ".sh"
              )

              script_path.write_text(
                  "set -euo pipefail\n" +
                  script +
                  "\n"
              )

              print(
                  f"Replaying proven step: {step_name}"
              )

              subprocess.run(
                  [
                      "bash",
                      str(script_path),
                  ],
                  check=True,
              )
          PY

      - name: Move mirror to destination window root
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text()

          def save(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new, label):
              text = load(path)
              if old not in text:
                  raise SystemExit(f"{label}: expected source not found in {path}")
              save(path, text.replace(old, new, 1))

          def regex_replace_once(path, pattern, replacement, label, flags=re.S):
              text = load(path)
              new_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected one regex match in {path}, got {count}")
              save(path, new_text)

          # ----------------------------------------------------------------------
          # Protocol: simplify the mirror request. WMS creates the mirror in the
          # shell process, then returns that SurfaceControl handle to the app.
          # The app itself reparents it to its own window root.
          # ----------------------------------------------------------------------

          protocol_path = (
              "app/src/full/java/com/duoopen/shell/"
              "ShellProtocol.kt"
          )

          regex_replace_once(
              protocol_path,
              r'''    /\*\*
               \* in:
               \*   boolean enable
               \*   if enable:
               \*     int sourceDisplayId
               \*     SurfaceControl destinationParent
               \*     int sourceWidth, sourceHeight
               \*     int destinationWidth, destinationHeight
               \*
               \* out:
               \*   Bundle\{ok, error, sourceDisplayId, scale, x, y\}
               \*/
              const val MIRROR_DISPLAY = 9''',
              '''    /**
               * in:
               *   boolean enable
               *   if enable: int sourceDisplayId
               *
               * out:
               *   Bundle{ok, error, sourceDisplayId, mirrorSurface}
               *
               * The shell process is privileged enough to ask WindowManagerService
               * for the display mirror. The normal app process receives that
               * SurfaceControl handle and reparents it to its own window root.
               */
              const val MIRROR_DISPLAY = 9''',
              "ShellProtocol root-mirror contract",
          )

          # ----------------------------------------------------------------------
          # Shell service: create/own the display mirror only. Do not parent it to
          # an app-owned SurfaceView from the shell process.
          # ----------------------------------------------------------------------

          shell_path = (
              "app/src/full/java/com/duoopen/shell/"
              "DuoShellService.kt"
          )

          regex_replace_once(
              shell_path,
              r'''            ShellProtocol\.MIRROR_DISPLAY -> \{
          .*?
                          out\.writeNoException\(\)
                          out\.writeBundle\(result\)
                      \}

          ''',
              '''            ShellProtocol.MIRROR_DISPLAY -> {
                          val enable = data.readInt() != 0
                          val identity = clearCallingIdentity()

                          val result = try {
                              if (!enable) {
                                  stopLiveMirror()

                                  Bundle().apply {
                                      putBoolean("ok", true)
                                      putBoolean("enabled", false)
                                  }
                              } else {
                                  val sourceDisplayId =
                                      data.readInt()

                                  createLiveMirror(
                                      sourceDisplayId =
                                          sourceDisplayId,
                                  )
                              }
                          } catch (t: Throwable) {
                              var root: Throwable = t

                              while (root.cause != null) {
                                  root = root.cause!!
                              }

                              Bundle().apply {
                                  putBoolean("ok", false)
                                  putBoolean("enabled", enable)
                                  putString(
                                      "error",
                                      "${root.javaClass.simpleName}: ${root.message}",
                                  )
                              }
                          } finally {
                              restoreCallingIdentity(identity)
                          }

                          out.writeNoException()
                          out.writeBundle(result)
                      }

          ''',
              "DuoShellService root-mirror transaction",
          )

          regex_replace_once(
              shell_path,
              r'''    private fun startLiveMirror\(
          .*?
              \}

              // ---- capture -----------------------------------------------------------''',
              '''    private fun createLiveMirror(
                  sourceDisplayId: Int,
              ): Bundle {
                  stopLiveMirror()

                  val wm =
                      systemService(
                          "window",
                          "android.view.IWindowManager\\\\$Stub",
                      )

                  runCatching {
                      org.lsposed.hiddenapibypass.HiddenApiBypass
                          .addHiddenApiExemptions(
                              "Landroid/view/SurfaceControl;"
                          )
                  }

                  val mirror =
                      SurfaceControl::class.java
                          .getDeclaredConstructor()
                          .let { constructor ->
                              constructor.isAccessible =
                                  true

                              constructor.newInstance()
                          }

                  val mirrored =
                      Class.forName(
                          "android.view.IWindowManager"
                      ).getMethod(
                          "mirrorDisplay",
                          Integer.TYPE,
                          SurfaceControl::class.java,
                      ).invoke(
                          wm,
                          sourceDisplayId,
                          mirror,
                      ) as? Boolean
                          ?: false

                  if (
                      !mirrored ||
                      !mirror.isValid
                  ) {
                      runCatching {
                          mirror.release()
                      }

                      throw IllegalStateException(
                          "WindowManager mirrorDisplay($sourceDisplayId) returned no valid surface"
                      )
                  }

                  liveMirror =
                      mirror

                  return Bundle().apply {
                      putBoolean("ok", true)
                      putBoolean("enabled", true)
                      putInt(
                          "sourceDisplayId",
                          sourceDisplayId,
                      )

                      /*
                       * SurfaceControl is Parcelable. This duplicates the handle into the
                       * normal app process, which can then attach it to its own window
                       * using AttachedSurfaceControl.buildReparentTransaction().
                       */
                      putParcelable(
                          "mirrorSurface",
                          mirror,
                      )
                  }
              }

              // ---- capture -----------------------------------------------------------''',
              "DuoShellService return mirror SurfaceControl",
          )

          # ----------------------------------------------------------------------
          # App bridge: the shell only needs the source display ID now.
          # ----------------------------------------------------------------------

          bridge_path = (
              "app/src/full/java/com/duoopen/shell/"
              "ShizukuBridge.kt"
          )

          regex_replace_once(
              bridge_path,
              r'''    fun startDisplayMirror\(
          .*?
              fun stopDisplayMirror\(\): Bundle\? =
                  call\(
                      ShellProtocol\.MIRROR_DISPLAY
                  \) \{ parcel ->
                      parcel\.writeInt\(0\)
                  \}''',
              '''    fun startDisplayMirror(
                  sourceDisplayId: Int,
              ): Bundle? =
                  call(
                      ShellProtocol.MIRROR_DISPLAY
                  ) { parcel ->
                      parcel.writeInt(1)
                      parcel.writeInt(
                          sourceDisplayId
                      )
                  }

              fun stopDisplayMirror(): Bundle? =
                  call(
                      ShellProtocol.MIRROR_DISPLAY
                  ) { parcel ->
                      parcel.writeInt(0)
                  }''',
              "ShizukuBridge root-mirror request",
          )

          # ----------------------------------------------------------------------
          # Replace SurfaceView hosting with a normal transparent overlay window.
          #
          # View.getRootSurfaceControl() returns AttachedSurfaceControl on API 31+.
          # Its public buildReparentTransaction(child) API is specifically intended
          # for attaching app-created SurfaceControls to the window root.
          # ----------------------------------------------------------------------

          mirror_host_path = Path(
              "app/src/full/java/com/duoopen/overlay/"
              "DisplayMirrorHost.kt"
          )

          mirror_host_path.write_text(
              r'''package com.duoopen.overlay

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.os.Handler
          import android.view.Display
          import android.view.Gravity
          import android.view.SurfaceControl
          import android.view.View
          import android.view.WindowManager
          import android.widget.FrameLayout
          import com.duoopen.shell.ShizukuBridge
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch

          /**
           * Transparent accessibility-overlay window on Samsung's secondary logical
           * display. The privileged shell process creates a live WindowManager display
           * mirror; this normal app process reparents that mirror directly to the
           * overlay window's root SurfaceControl.
           */
          class DisplayMirrorHost(
              private val service: AccessibilityService,
              val display: Display,
              private val handler: Handler,
              private val scope: CoroutineScope,
              private val onStatus: (String) -> Unit,
          ) {
              val displayId: Int =
                  display.displayId

              private val displayManager =
                  service.getSystemService(
                      DisplayManager::class.java
                  )

              private val context =
                  service
                      .createDisplayContext(
                          display
                      )
                      .createWindowContext(
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          null,
                      )

              private val windowManager =
                  context.getSystemService(
                      WindowManager::class.java
                  )

              private var attached =
                  false

              private var generation =
                  0

              private var boundKey:
                  String? =
                  null

              private var appMirror:
                  SurfaceControl? =
                  null

              private val hostView =
                  FrameLayout(
                      context
                  ).apply {
                      setBackgroundColor(
                          Color.TRANSPARENT
                      )

                      importantForAccessibility =
                          View.IMPORTANT_FOR_ACCESSIBILITY_NO

                      addOnAttachStateChangeListener(
                          object :
                              View.OnAttachStateChangeListener {

                              override fun onViewAttachedToWindow(
                                  v: View,
                              ) {
                                  /*
                                   * rootSurfaceControl is only non-null while attached.
                                   * Post once so WindowManager has completed this attach
                                   * before we request the first mirror.
                                   */
                                  v.post {
                                      bind(
                                          "window-attached"
                                      )
                                  }
                              }

                              override fun onViewDetachedFromWindow(
                                  v: View,
                              ) {
                                  generation++
                                  boundKey =
                                      null

                                  releaseAppMirror()

                                  com.duoopen.debug.DuoDiagnostics.event(
                                      "live-mirror",
                                      "root host detached display=$displayId",
                                  )
                              }
                          }
                      )
                  }

              fun attach() {
                  if (attached) {
                      refresh(
                          "already-attached"
                      )
                      return
                  }

                  val params =
                      WindowManager.LayoutParams(
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                              WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                              WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                              WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS or
                              WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                          PixelFormat.TRANSLUCENT,
                      ).apply {
                          gravity =
                              Gravity.TOP or
                                  Gravity.START

                          layoutInDisplayCutoutMode =
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS

                          fitInsetsTypes =
                              0

                          title =
                              "DuoOpenRootMirror"
                      }

                  attached =
                      runCatching {
                          windowManager.addView(
                              hostView,
                              params,
                          )
                      }.onFailure { error ->
                          onStatus(
                              "Could not attach root mirror window: ${error.message}"
                          )

                          com.duoopen.debug.DuoDiagnostics.event(
                              "live-mirror",
                              "root host add failed display=$displayId " +
                                  "error=${error.javaClass.simpleName}:${error.message}",
                          )
                      }.isSuccess
              }

              fun refresh(
                  reason: String,
              ) {
                  if (
                      !attached ||
                      !hostView.isAttachedToWindow
                  ) {
                      return
                  }

                  bind(
                      reason
                  )
              }

              private fun bind(
                  reason: String,
              ) {
                  /*
                   * View.getRootSurfaceControl() is public from API 31 and returns an
                   * AttachedSurfaceControl for this exact window hierarchy.
                   */
                  val root =
                      hostView.rootSurfaceControl

                  if (root == null) {
                      onStatus(
                          "Root mirror window is attached, but its root SurfaceControl is not ready."
                      )
                      return
                  }

                  val source =
                      displayManager.getDisplay(
                          Display.DEFAULT_DISPLAY
                      )

                  if (source == null) {
                      onStatus(
                          "Default display is unavailable; waiting to rebind mirror."
                      )
                      return
                  }

                  val sourceMode =
                      source.mode

                  val destinationMode =
                      display.mode

                  val sourceWidth =
                      sourceMode.physicalWidth

                  val sourceHeight =
                      sourceMode.physicalHeight

                  val destinationWidth =
                      destinationMode.physicalWidth

                  val destinationHeight =
                      destinationMode.physicalHeight

                  val key =
                      "source=${source.displayId}:${sourceWidth}x$sourceHeight;" +
                          "destination=$displayId:${destinationWidth}x$destinationHeight"

                  /*
                   * Samsung emits several DisplayManager callbacks for one topology
                   * transition. Do not destroy a healthy mirror just because another
                   * displayChanged callback arrived with identical geometry.
                   */
                  if (
                      boundKey == key &&
                      appMirror?.isValid == true
                  ) {
                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "reuse reason=$reason key=$key",
                      )
                      return
                  }

                  val localGeneration =
                      ++generation

                  boundKey =
                      null

                  onStatus(
                      "Creating root live mirror: display 0 " +
                          "${sourceWidth}×$sourceHeight → " +
                          "display $displayId " +
                          "${destinationWidth}×$destinationHeight…"
                  )

                  scope.launch(
                      Dispatchers.IO
                  ) {
                      val result =
                          ShizukuBridge.startDisplayMirror(
                              sourceDisplayId =
                                  Display.DEFAULT_DISPLAY,
                          )

                      val ok =
                          result?.getBoolean(
                              "ok",
                              false,
                          ) == true

                      val error =
                          result?.getString(
                              "error"
                          )

                      val mirror =
                          if (ok) {
                              result?.getParcelable(
                                  "mirrorSurface",
                                  SurfaceControl::class.java,
                              )
                          } else {
                              null
                          }

                      handler.post {
                          if (
                              localGeneration !=
                              generation
                          ) {
                              mirror?.release()
                              return@post
                          }

                          if (
                              !ok ||
                              mirror == null ||
                              !mirror.isValid
                          ) {
                              mirror?.release()

                              boundKey =
                                  null

                              val detail =
                                  error
                                      ?: "shell returned no valid mirror SurfaceControl"

                              onStatus(
                                  "Root live mirror failed: $detail"
                              )

                              com.duoopen.debug.DuoDiagnostics.event(
                                  "live-mirror",
                                  "root bind failed reason=$reason key=$key error=$detail",
                              )
                              return@post
                          }

                          val currentRoot =
                              hostView.rootSurfaceControl

                          if (currentRoot == null) {
                              mirror.release()

                              boundKey =
                                  null

                              onStatus(
                                  "Mirror was created, but the destination root disappeared before attach."
                              )

                              com.duoopen.debug.DuoDiagnostics.event(
                                  "live-mirror",
                                  "root disappeared reason=$reason key=$key",
                              )
                              return@post
                          }

                          val scale =
                              minOf(
                                  destinationWidth.toFloat() /
                                      sourceWidth.toFloat(),
                                  destinationHeight.toFloat() /
                                      sourceHeight.toFloat(),
                              )

                          val drawnWidth =
                              sourceWidth *
                                  scale

                          val drawnHeight =
                              sourceHeight *
                                  scale

                          val x =
                              (
                                  destinationWidth -
                                      drawnWidth
                                  ) * 0.5f

                          val y =
                              (
                                  destinationHeight -
                                      drawnHeight
                                  ) * 0.5f

                          val transaction =
                              currentRoot.buildReparentTransaction(
                                  mirror
                              )

                          if (transaction == null) {
                              mirror.release()

                              boundKey =
                                  null

                              onStatus(
                                  "Android could not build the root reparent transaction."
                              )

                              com.duoopen.debug.DuoDiagnostics.event(
                                  "live-mirror",
                                  "root reparent transaction null reason=$reason key=$key",
                              )
                              return@post
                          }

                          try {
                              transaction
                                  .setScale(
                                      mirror,
                                      scale,
                                      scale,
                                  )
                                  .setPosition(
                                      mirror,
                                      x,
                                      y,
                                  )
                                  .setLayer(
                                      mirror,
                                      10_000,
                                  )
                                  .show(
                                      mirror
                                  )

                              /*
                               * Apply with the next ViewRoot draw so the child arrives
                               * atomically inside the root hierarchy.
                               */
                              val queued =
                                  currentRoot.applyTransactionOnDraw(
                                      transaction
                                  )

                              hostView.invalidate()

                              releaseAppMirror()

                              appMirror =
                                  mirror

                              boundKey =
                                  key

                              onStatus(
                                  "ROOT LIVE MIRROR ACTIVE: display 0 → display $displayId."
                              )

                              com.duoopen.debug.DuoDiagnostics.event(
                                  "live-mirror",
                                  "root bind ok reason=$reason key=$key " +
                                      "scale=$scale x=$x y=$y queuedOnDraw=$queued",
                              )
                          } catch (t: Throwable) {
                              runCatching {
                                  transaction.close()
                              }

                              mirror.release()

                              boundKey =
                                  null

                              val detail =
                                  "${t.javaClass.simpleName}: ${t.message}"

                              onStatus(
                                  "Root mirror attach failed: $detail"
                              )

                              com.duoopen.debug.DuoDiagnostics.event(
                                  "live-mirror",
                                  "root attach exception reason=$reason key=$key error=$detail",
                              )
                          }
                      }
                  }
              }

              private fun releaseAppMirror() {
                  val current =
                      appMirror
                          ?: return

                  appMirror =
                      null

                  runCatching {
                      current.release()
                  }
              }

              fun detach() {
                  generation++
                  boundKey =
                      null

                  releaseAppMirror()

                  if (!attached) {
                      return
                  }

                  attached =
                      false

                  runCatching {
                      windowManager.removeViewImmediate(
                          hostView
                      )
                  }

                  com.duoopen.debug.DuoDiagnostics.event(
                      "live-mirror",
                      "root host removed display=$displayId",
                  )
              }
          }
          '''
          )

          # ----------------------------------------------------------------------
          # Version and user-facing copy.
          # ----------------------------------------------------------------------

          sheet_path = (
              "app/src/main/java/com/duoopen/ui/"
              "ControlSheet.kt"
          )

          replace_once(
              sheet_path,
              '"Start persistent mirror"',
              '"Start root mirror"',
              "ControlSheet root mirror label",
          )

          replace_once(
              sheet_path,
              '''"Live-mirror probe: the running app on logical display 0 is mirrored " +
                              "into the secondary Fold7 display. Open Chrome, Settings, the launcher, " +
                              "or another ordinary app and move the hinge. The screenshot/frost effect " +
                              "is disabled during this probe so we can isolate application continuity. " +
                              "After 90 seconds the release waits until the phone is fully open before " +
                              "disabling the secondary panel."''',
              '''"Root-mirror probe: WindowManager creates the live display mirror in the " +
                              "Shizuku shell process, then Duo Open attaches that mirror directly to the " +
                              "secondary overlay window root. Repeated display callbacks reuse the same " +
                              "mirror unless Samsung actually changes display geometry. Test an open app " +
                              "and the launcher before moving the hinge."''',
              "ControlSheet root mirror explanation",
          )

          gradle_path = Path(
              "app/build.gradle.kts"
          )

          gradle = gradle_path.read_text()

          if "versionCode = 13" not in gradle:
              raise SystemExit(
                  "Expected live-mirror versionCode 13 was not found."
              )

          if (
              'versionName = "1.3.9-zfold7-live-mirror-probe"'
              not in gradle
          ):
              raise SystemExit(
                  "Expected live-mirror versionName was not found."
              )

          gradle = gradle.replace(
              "versionCode = 13",
              "versionCode = 14",
              1,
          )

          gradle = gradle.replace(
              'versionName = "1.3.9-zfold7-live-mirror-probe"',
              'versionName = "1.3.10-zfold7-root-mirror-probe"',
              1,
          )

          gradle_path.write_text(
              gradle
          )
          PY

      - name: Validate root mirror pass
        run: |
          git diff --check
          git diff --stat

          grep -R "buildReparentTransaction" app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt
          grep -R "applyTransactionOnDraw" app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt
          grep -R "mirrorSurface" app/src/full/java/com/duoopen/shell/DuoShellService.kt
          grep -R "reuse reason=" app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt
          grep -R "Start root mirror" app/src/main/java/com/duoopen/ui/ControlSheet.kt
          grep -R "1.3.10-zfold7-root-mirror-probe" app/build.gradle.kts

          mkdir -p zfold7-artifacts
          git diff > zfold7-artifacts/zfold7-root-mirror-probe.patch

      - name: Compile, unit test, and build
        run: |
          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

      - name: Prepare APK
        run: |
          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "Debug APK not found."
            exit 1
          fi

          cp \
            "$APK" \
            zfold7-artifacts/DuoOpen-ZFold7-root-mirror-probe-debug.apk

          {
            echo "commit=${GITHUB_SHA}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "pass=root-surface-mirror+mirror-handle-handoff+idempotent-rebind"
            echo

            sha256sum \
              zfold7-artifacts/DuoOpen-ZFold7-root-mirror-probe-debug.apk

          } > zfold7-artifacts/BUILD-INFO.txt

          cat zfold7-artifacts/BUILD-INFO.txt

      - name: Upload field-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-root-mirror-probe
          path: |
            zfold7-artifacts/DuoOpen-ZFold7-root-mirror-probe-debug.apk
            zfold7-artifacts/zfold7-root-mirror-probe.patch
            zfold7-artifacts/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30