name: Build Z Fold 7 Cover Primary Continuity 1.3.14

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Replay last successful 1.3.13 integration
        env:
          BASE_WORKFLOW_COMMIT: a1b6403aa85ae463f8114dc78b53e9c28d540f4d
        run: |
          python3 <<'PY'
          import os
          import subprocess
          import textwrap
          from pathlib import Path

          base_commit = os.environ["BASE_WORKFLOW_COMMIT"]

          previous_workflow = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{base_commit}:.github/workflows/build-shizuku-apk.yml",
              ],
              text=True,
          )

          lines = previous_workflow.splitlines()

          wanted_steps = [
              "Replay proven 1.3.11 continuity build",
              "Replace mirror crop with owned pane container",
              "Validate pane-container pass",
              "Switch to AOSP setGeometry and restore bidirectional fold animation",
              "Validate 1.3.13 geometry continuity pass",
              "Graft zfoldduo glass and bidirectional motion behavior",
              "Validate revised 1.3.13 graft",
          ]

          def extract_run_block(step_name: str) -> str:
              step_start = None

              for index, line in enumerate(lines):
                  if line.strip() == f"- name: {step_name}":
                      step_start = index
                      break

              if step_start is None:
                  raise SystemExit(
                      f"Base workflow step not found: {step_name}"
                  )

              run_line = None

              for index in range(step_start + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  if line.strip() == "run: |":
                      run_line = index
                      break

              if run_line is None:
                  raise SystemExit(
                      f"run: | block not found for: {step_name}"
                  )

              block = []

              for index in range(run_line + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  block.append(line)

              return textwrap.dedent(
                  "\n".join(block)
              )

          for number, step_name in enumerate(
              wanted_steps,
              start=1,
          ):
              script = extract_run_block(
                  step_name
              )

              script_path = Path(
                  f"/tmp/duo-open-base-{number}.sh"
              )

              script_path.write_text(
                  "set -euo pipefail\n" +
                  script +
                  "\n"
              )

              print(
                  f"=== Replaying known-good step: {step_name} ==="
              )

              subprocess.run(
                  [
                      "bash",
                      str(script_path),
                  ],
                  check=True,
              )

          print(
              "Known-good 1.3.13r working tree reconstructed successfully."
          )
          PY

      - name: Apply cover-primary continuity fix
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(
              path,
              old,
              new,
              label,
          ):
              p = Path(path)
              text = p.read_text()

              if old not in text:
                  raise SystemExit(
                      f"{label}: expected source not found in {path}"
                  )

              p.write_text(
                  text.replace(
                      old,
                      new,
                      1,
                  )
              )

          def regex_replace_once(
              path,
              pattern,
              replacement,
              label,
          ):
              p = Path(path)
              text = p.read_text()

              updated, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=re.S,
              )

              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one match, got {count}"
                  )

              p.write_text(
                  updated
              )

          service_path = Path(
              "app/src/full/java/com/duoopen/overlay/"
              "FoldOverlayService.kt"
          )

          regex_replace_once(
              service_path,
              r'''    private fun syncMirrorHost\(
                  reason: String,
              \) \{
          .*?
              \}

              private fun safeToReleaseSecondaryPanel\(\): Boolean \{''',
              '''    private fun syncMirrorHost(
                  reason: String,
              ) {
                  if (!mirrorRequested) {
                      return
                  }

                  val primary =
                      displayManager.getDisplay(
                          Display.DEFAULT_DISPLAY
                      )

                  if (primary == null) {
                      _secondaryDisplayStatus.value =
                          "Waiting for Android's default display."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "default display missing reason=$reason",
                      )

                      return
                  }

                  val primaryMode =
                      primary.mode

                  /*
                   * Never assume that logical display 0 is
                   * permanently the inner or cover panel.
                   *
                   * Samsung can change which physical panel owns
                   * Android's DEFAULT_DISPLAY during the fold.
                   *
                   * Identify the physical Fold7 panels using their
                   * native dimensions instead.
                   */
                  val coverIsPrimary =
                      primaryMode.physicalWidth == 1080 &&
                          primaryMode.physicalHeight == 2520

                  val innerIsPrimary =
                      primaryMode.physicalWidth == 1968 &&
                          primaryMode.physicalHeight == 2184

                  if (
                      !coverIsPrimary &&
                      !innerIsPrimary
                  ) {
                      _secondaryDisplayStatus.value =
                          "Waiting for a known Fold7 inner/cover topology."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "unknown primary topology reason=$reason " +
                              "primary=${primary.displayId} " +
                              "mode=${primaryMode.physicalWidth}x${primaryMode.physicalHeight} " +
                              "hostUsable=${mirrorHost?.isUsable == true}",
                      )

                      return
                  }

                  /*
                   * CRITICAL 1.3.14 CHANGE
                   *
                   * 1.3.13r previously treated:
                   *
                   *     DEFAULT_DISPLAY == 1080x2520
                   *
                   * as a reason to destroy the mirror.
                   *
                   * That is exactly the point at which Samsung has
                   * promoted the physical cover panel to primary.
                   *
                   * Do the opposite:
                   *
                   * Use that physical cover panel as the continuity
                   * destination and retain/recreate the mirror host.
                   */
                  val cover =
                      if (coverIsPrimary) {
                          primary
                      } else {
                          displayManager.displays
                              .firstOrNull { candidate ->
                                  if (
                                      candidate.state ==
                                          Display.STATE_OFF ||
                                      candidate.state ==
                                          Display.STATE_UNKNOWN
                                  ) {
                                      false
                                  } else {
                                      val mode =
                                          candidate.mode

                                      mode.physicalWidth == 1080 &&
                                          mode.physicalHeight == 2520
                                  }
                              }
                      }

                  if (cover == null) {
                      _secondaryDisplayStatus.value =
                          "Cover topology is transitioning; retaining the continuity host."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "cover logical display missing; host retained reason=$reason " +
                              "hostUsable=${mirrorHost?.isUsable == true}",
                      )

                      return
                  }

                  if (coverIsPrimary) {
                      _secondaryDisplayStatus.value =
                          "Native cover is primary; retaining geometry continuity from the inner panel."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "cover-primary-continuity reason=$reason " +
                              "cover=${cover.displayId} " +
                              "mode=${cover.mode.physicalWidth}x${cover.mode.physicalHeight}",
                      )
                  }

                  val current =
                      mirrorHost

                  /*
                   * Recreate the host only if:
                   *
                   * - no host exists,
                   * - Samsung changed the logical ID representing
                   *   the physical cover panel, or
                   * - the existing SurfaceControl host died.
                   *
                   * Merely becoming DEFAULT_DISPLAY is no longer a
                   * teardown condition.
                   */
                  if (
                      current == null ||
                      current.displayId != cover.displayId ||
                      !current.isUsable
                  ) {
                      current?.detach()

                      mirrorHost =
                          DisplayMirrorHost(
                              service = this,
                              display = cover,
                              scope = scope,
                              onStatus = { message ->
                                  _secondaryDisplayStatus.value =
                                      message
                              },
                          ).also {
                              it.attach()
                          }

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "geometry host created reason=$reason " +
                              "cover=${cover.displayId} " +
                              "mode=${cover.mode.physicalWidth}x${cover.mode.physicalHeight} " +
                              "coverIsPrimary=$coverIsPrimary",
                      )

                      return
                  }

                  /*
                   * The same physical destination is still alive.
                   *
                   * Refresh its SurfaceControl geometry instead of
                   * destroying it.
                   */
                  current.refresh(
                      reason
                  )
              }

              private fun safeToReleaseSecondaryPanel(): Boolean {''',
              "FoldOverlayService cover-primary continuity",
          )

          mirror_host_path = Path(
              "app/src/full/java/com/duoopen/overlay/"
              "DisplayMirrorHost.kt"
          )

          /*
           * Do not accept a stale/off logical display simply because
           * it still advertises the Fold7 inner native dimensions.
           *
           * The source must represent an active inner panel.
           */
          replace_once(
              mirror_host_path,
              '''    private fun findInnerDisplay(): Display? =
                  displayManager.displays
                      .firstOrNull { candidate ->
                          val mode = candidate.mode

                          mode.physicalWidth == INNER_WIDTH &&
                              mode.physicalHeight == INNER_HEIGHT
                      }
          ''',
              '''    private fun findInnerDisplay(): Display? =
                  displayManager.displays
                      .firstOrNull { candidate ->
                          val mode =
                              candidate.mode

                          candidate.state != Display.STATE_OFF &&
                              candidate.state != Display.STATE_UNKNOWN &&
                              mode.physicalWidth == INNER_WIDTH &&
                              mode.physicalHeight == INNER_HEIGHT
                      }
          ''',
              "DisplayMirrorHost active inner-panel lookup",
          )

          service_text =
              service_path.read_text()

          /*
           * These are the exact 1.3.13 regression markers.
           *
           * If either returns in a future integration pass,
           * deliberately fail the build.
           */
          for forbidden in (
              "Native cover is primary; temporary geometry mirror released.",
              "native-cover-handoff",
          ):
              if forbidden in service_text:
                  raise SystemExit(
                      "Known cover-primary regression remains: " +
                      forbidden
                  )

          if (
              "cover-primary-continuity"
              not in service_text
          ):
              raise SystemExit(
                  "Cover-primary continuity diagnostic marker missing."
              )

          gradle_path = Path(
              "app/build.gradle.kts"
          )

          gradle =
              gradle_path.read_text()

          if (
              "versionCode = 18"
              not in gradle
          ):
              raise SystemExit(
                  "Expected versionCode 18 from the known-good baseline."
              )

          if (
              'versionName = "1.3.13r-zfold7-geometry-glass"'
              not in gradle
          ):
              raise SystemExit(
                  "Expected 1.3.13r baseline versionName."
              )

          gradle =
              gradle.replace(
                  "versionCode = 18",
                  "versionCode = 19",
                  1,
              )

          gradle =
              gradle.replace(
                  'versionName = "1.3.13r-zfold7-geometry-glass"',
                  'versionName = "1.3.14-zfold7-cover-primary-continuity"',
                  1,
              )

          gradle_path.write_text(
              gradle
          )

          Path(
              "zfold7-artifacts"
          ).mkdir(
              parents=True,
              exist_ok=True,
          )

          print(
              "Cover-primary continuity fix applied."
          )
          PY

      - name: Validate cover-primary continuity fix
        run: |
          set -euo pipefail

          echo
          echo "=============================================="
          echo "Validate Fold7 cover-primary continuity"
          echo "=============================================="
          echo

          git diff --check

          grep -R \
            "cover-primary-continuity" \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt

          grep -R \
            "retaining geometry continuity from the inner panel" \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt

          grep -R \
            "candidate.state != Display.STATE_OFF" \
            app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt

          grep -R \
            "candidate.state != Display.STATE_UNKNOWN" \
            app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt

          grep -R \
            "1.3.14-zfold7-cover-primary-continuity" \
            app/build.gradle.kts

          echo
          echo "Checking that the 1.3.13 regression cannot return..."
          echo

          if grep -R -F \
            "Native cover is primary; temporary geometry mirror released." \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt
          then
            echo
            echo "ERROR:"
            echo "Known cover-primary teardown regression still exists."
            exit 1
          fi

          if grep -R -F \
            "native-cover-handoff" \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt
          then
            echo
            echo "ERROR:"
            echo "Legacy native-cover teardown event still exists."
            exit 1
          fi

          echo
          echo "Cover-primary teardown regression is absent."
          echo

          git diff > \
            zfold7-artifacts/zfold7-cover-primary-continuity.patch

          echo
          echo "=============================================="
          echo "Integrated diff"
          echo "=============================================="
          echo

          git diff --stat

      - name: Compile, unit test, and build
        run: |
          set -euo pipefail

          echo
          echo "=============================================="
          echo "Building Duo Open Fold7 1.3.14"
          echo "=============================================="
          echo

          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

          echo
          echo "=============================================="
          echo "Gradle build completed"
          echo "=============================================="
          echo

          find \
            app/build/outputs/apk/full/debug \
            -type f \
            -name '*.apk' \
            -print

      - name: Prepare field-test APK
        run: |
          set -euo pipefail

          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "Debug APK not found."
            exit 1
          fi

          cp \
            "$APK" \
            zfold7-artifacts/DuoOpen-ZFold7-cover-primary-continuity-debug.apk

          {
            echo "commit=${GITHUB_SHA}"
            echo "base_workflow_commit=a1b6403aa85ae463f8114dc78b53e9c28d540f4d"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=1.3.14-zfold7-cover-primary-continuity"
            echo "versionCode=19"
            echo "target=Samsung Galaxy Z Fold7"
            echo "inner=1968x2184"
            echo "cover=1080x2520"
            echo "pass=known-good-1.3.13r+cover-primary-host-retention+active-inner-source"
            echo

            sha256sum \
              zfold7-artifacts/DuoOpen-ZFold7-cover-primary-continuity-debug.apk

          } > \
            zfold7-artifacts/BUILD-INFO-1.3.14.txt

          echo
          echo "=============================================="
          echo "Field test build information"
          echo "=============================================="
          echo

          cat \
            zfold7-artifacts/BUILD-INFO-1.3.14.txt

      - name: Upload field-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-cover-primary-continuity-1.3.14
          path: |
            zfold7-artifacts/DuoOpen-ZFold7-cover-primary-continuity-debug.apk
            zfold7-artifacts/zfold7-pane-container.patch
            zfold7-artifacts/zfold7-geometry-continuity.patch
            zfold7-artifacts/zfold7-geometry-continuity-revised.patch
            zfold7-artifacts/zfold7-cover-primary-continuity.patch
            zfold7-artifacts/BUILD-INFO-1.3.14.txt
          if-no-files-found: error
          retention-days: 30