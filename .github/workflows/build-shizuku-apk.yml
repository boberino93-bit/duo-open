name: Build Z Fold 7 Background Display Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Verify expected source base
        run: |
          check_blob() {
            path="$1"
            expected="$2"
            actual="$(git hash-object "$path")"

            if [ "$actual" != "$expected" ]; then
              echo "::error file=$path::Source changed since this probe was designed. Expected $expected but found $actual."
              exit 1
            fi
          }

          check_blob "app/src/main/java/com/duoopen/fold/HingeAngleSource.kt" "da3fe9abda7795bfd714d4b5074acf90a1b91c48"
          check_blob "app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt" "7610633d11dc8bdb3667e2670cace595305f853e"
          check_blob "app/src/full/java/com/duoopen/shell/ShizukuBridge.kt" "4600ea293222c94cca02310734850a78e6cc62bd"
          check_blob "app/src/full/java/com/duoopen/shell/DuoShellService.kt" "87414a0e7cde36673daeb574d18402e7f1a29c4b"
          check_blob "app/src/full/java/com/duoopen/shell/ShellProtocol.kt" "4a413f20cfd8c316fe7c8f80ca470e40940f341c"
          check_blob "app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt" "fdc4f607ed8e8e7d03df4223bd79dac36be93952"
          check_blob "app/src/full/java/com/duoopen/overlay/PanelEngine.kt" "a1285f81ffe5e1f7d7e0f46e86b4e7bef747e5ae"
          check_blob "app/build.gradle.kts" "dcbfbaf660fd2efd4f625569affc1db738e52ec8"
          check_blob "app/src/main/java/com/duoopen/DualScreen.kt" "5c89b33a4970ee87a08671f47b1edebaf57c5d90"
          check_blob "app/src/main/java/com/duoopen/DuoApplication.kt" "e07dc81c3479afe0a1f493b53ae92d7b96d692cd"
          check_blob "app/src/main/java/com/duoopen/ui/ControlSheet.kt" "7f88ae6a7f6ce8452c8c8f17d1b2627442eaea6f"

          git cat-file -e fd41615491e8939352ae3e298637585f4958b5c0^{commit}

          echo "Source guard passed."

      - name: Replay previous proven transforms
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          previous_commit = "fd41615491e8939352ae3e298637585f4958b5c0"

          previous_workflow = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{previous_commit}:.github/workflows/build-shizuku-apk.yml",
              ],
              text=True,
          )

          lines = previous_workflow.splitlines()

          wanted_steps = [
              "Reapply proven Fold 7 smoothness pass",
              "Install persistent dual-screen lifecycle",
              "Install on-device field diagnostics",
              "Stabilize dual-screen recovery state machine",
          ]

          def extract_run_block(step_name: str) -> str:
              step_start = None

              for index, line in enumerate(lines):
                  if line.strip() == f"- name: {step_name}":
                      step_start = index
                      break

              if step_start is None:
                  raise SystemExit(
                      f"Previous workflow step not found: {step_name}"
                  )

              run_line = None

              for index in range(step_start + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  if line.strip() == "run: |":
                      run_line = index
                      break

              if run_line is None:
                  raise SystemExit(
                      f"Run block not found for: {step_name}"
                  )

              block = []

              for index in range(run_line + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  block.append(line)

              return textwrap.dedent(
                  "\n".join(block)
              )

          for step_name in wanted_steps:
              script = extract_run_block(step_name)

              script_path = Path(
                  "/tmp/" +
                  re.sub(
                      r"[^A-Za-z0-9]+",
                      "-",
                      step_name,
                  ).strip("-") +
                  ".sh"
              )

              script_path.write_text(
                  "set -euo pipefail\n" +
                  script +
                  "\n"
              )

              print(
                  f"Replaying previous proven step: {step_name}"
              )

              subprocess.run(
                  [
                      "bash",
                      str(script_path),
                  ],
                  check=True,
              )
          PY

      - name: Add service-owned read-only display probe
        run: |
          python3 <<'PY'
          from pathlib import Path

          def load(path):
              return Path(path).read_text()

          def save(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new, label):
              text = load(path)

              if old not in text:
                  raise SystemExit(
                      f"{label}: expected source not found in {path}"
                  )

              save(
                  path,
                  text.replace(
                      old,
                      new,
                      1,
                  ),
              )

          # Binder protocol.
          replace_once(
              "app/src/full/java/com/duoopen/shell/ShellProtocol.kt",
              """    /** → Bundle{state, lines, parsed, rejected, last, angle} */
              const val ANGLE_STATUS = 5

              /** callback: float angle, long uptimeMs */""",
              """    /** → Bundle{state, lines, parsed, rejected, last, angle} */
              const val ANGLE_STATUS = 5

              /**
               * Read-only shell-side display investigation.
               * No display state is changed by this transaction.
               */
              const val DISPLAY_PROBE = 6

              /** callback: float angle, long uptimeMs */""",
              "ShellProtocol DISPLAY_PROBE",
          )

          # Shizuku user service.
          shell_path = (
              "app/src/full/java/com/duoopen/shell/"
              "DuoShellService.kt"
          )

          replace_once(
              shell_path,
              """            ShellProtocol.ANGLE_STATUS -> {
                          out.writeNoException()
                          out.writeBundle(reader?.status() ?: Bundle().apply { putString("state", "not started") })
                      }
                      else -> return super.onTransact(code, data, reply, flags)""",
              """            ShellProtocol.ANGLE_STATUS -> {
                          out.writeNoException()
                          out.writeBundle(reader?.status() ?: Bundle().apply { putString("state", "not started") })
                      }
                      ShellProtocol.DISPLAY_PROBE -> {
                          val identity = clearCallingIdentity()
                          val result = try {
                              displayProbe()
                          } catch (t: Throwable) {
                              Bundle().apply {
                                  putString(
                                      "error",
                                      "${t.javaClass.simpleName}: ${t.message}",
                                  )
                              }
                          } finally {
                              restoreCallingIdentity(identity)
                          }

                          out.writeNoException()
                          out.writeBundle(result)
                      }
                      else -> return super.onTransact(code, data, reply, flags)""",
              "DuoShellService DISPLAY_PROBE transaction",
          )

          replace_once(
              shell_path,
              """    // ---- capture -----------------------------------------------------------
          """,
              """    // ---- read-only display probe -------------------------------------------

              private fun displayProbe(): Bundle =
                  Bundle().apply {

                      putInt(
                          "uid",
                          Process.myUid(),
                      )

                      putInt(
                          "pid",
                          Process.myPid(),
                      )

                      putString(
                          "identity",
                          runProbe(
                              "id"
                          ),
                      )

                      putString(
                          "cmd_display",
                          runProbe(
                              "cmd display get-displays"
                          ),
                      )

                      putString(
                          "cmd_display_help",
                          runProbe(
                              "cmd display help"
                          ),
                      )

                      putString(
                          "surfaceflinger",
                          runProbe(
                              "dumpsys SurfaceFlinger --display-id"
                          ),
                      )

                      putString(
                          "display_filtered",
                          runProbe(
                              "dumpsys display | " +
                                  "grep -E -i " +
                                  "'DisplayDeviceInfo|LogicalDisplay|uniqueId=|" +
                                  "displayId|mDisplayId|state=|type=|address=|" +
                                  "modeId|supportedModes|Built-in|fold|rear' | " +
                                  "head -n 300"
                          ),
                      )

                      putString(
                          "window_displays",
                          runProbe(
                              "dumpsys window displays | head -n 250"
                          ),
                      )
                  }

              private fun runProbe(
                  command: String,
              ): String {

                  val process =
                      ProcessBuilder(
                          "sh",
                          "-c",
                          "$command 2>&1",
                      ).start()

                  val output =
                      process.inputStream
                          .bufferedReader()
                          .use {
                              it.readText()
                          }

                  val finished =
                      process.waitFor(
                          3,
                          java.util.concurrent.TimeUnit.SECONDS,
                      )

                  if (
                      !finished
                  ) {
                      process.destroyForcibly()

                      return (
                          "timeout after 3000ms\\n" +
                              output.take(
                                  PROBE_OUTPUT_LIMIT
                              )
                          )
                  }

                  return (
                      "exit=${process.exitValue()}\\n" +
                          output.take(
                              PROBE_OUTPUT_LIMIT
                          )
                      )
              }

              // ---- capture -----------------------------------------------------------
          """,
              "DuoShellService displayProbe implementation",
          )

          replace_once(
              shell_path,
              """        const val SHIZUKU_DESTROY = 16777115
                  val FAMILIES = listOf("android.window.ScreenCaptureInternal", "android.window.ScreenCapture")""",
              """        const val SHIZUKU_DESTROY = 16777115

                  const val PROBE_OUTPUT_LIMIT =
                      16_000

                  val FAMILIES = listOf("android.window.ScreenCaptureInternal", "android.window.ScreenCapture")""",
              "DuoShellService probe limit",
          )

          # App-side Shizuku bridge.
          replace_once(
              "app/src/full/java/com/duoopen/shell/ShizukuBridge.kt",
              """    fun angleStatus(): Bundle? = call(ShellProtocol.ANGLE_STATUS)
          }""",
              """    fun angleStatus(): Bundle? = call(ShellProtocol.ANGLE_STATUS)

              /**
               * Executes the read-only display probe as Shizuku's shell user.
               * This is blocking and must be called off the main thread.
               */
              fun displayProbe(): Bundle? =
                  call(
                      ShellProtocol.DISPLAY_PROBE
                  )
          }""",
              "ShizukuBridge displayProbe",
          )

          # Persistent accessibility service owns the probe.
          service_path = (
              "app/src/full/java/com/duoopen/overlay/"
              "FoldOverlayService.kt"
          )

          replace_once(
              service_path,
              """import android.util.Log
          import android.view.Display""",
              """import android.util.Log
          import android.view.Display
          import com.duoopen.debug.DuoDiagnostics""",
              "FoldOverlayService diagnostics import",
          )

          replace_once(
              service_path,
              """import kotlinx.coroutines.launch
          import kotlinx.coroutines.MainScope
          import kotlinx.coroutines.cancel""",
              """import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.MainScope
          import kotlinx.coroutines.cancel""",
              "FoldOverlayService dispatcher import",
          )

          replace_once(
              service_path,
              """    private val snapshots = SnapshotCache(maxAgeMs = SNAPSHOT_MAX_AGE_MS)
              private var angleFeed: WallpaperAngleFeed? = null

              private val displayListener = object : DisplayManager.DisplayListener {
                  override fun onDisplayAdded(displayId: Int) = syncDisplays()
                  override fun onDisplayRemoved(displayId: Int) = syncDisplays()
                  override fun onDisplayChanged(displayId: Int) = syncDisplays()
              }""",
              """    private val snapshots = SnapshotCache(maxAgeMs = SNAPSHOT_MAX_AGE_MS)
              private var angleFeed: WallpaperAngleFeed? = null

              private var pendingProbeReason =
                  "service-connected"

              private var lastDisplayProbeUptime =
                  0L

              private val displayProbeRunnable =
                  Runnable {
                      runDisplayProbe(
                          pendingProbeReason
                      )
                  }

              private val displayListener =
                  object :
                      DisplayManager.DisplayListener {

                      override fun onDisplayAdded(
                          displayId: Int,
                      ) {
                          syncDisplays()

                          scheduleDisplayProbe(
                              "display-added:$displayId"
                          )
                      }

                      override fun onDisplayRemoved(
                          displayId: Int,
                      ) {
                          syncDisplays()

                          scheduleDisplayProbe(
                              "display-removed:$displayId"
                          )
                      }

                      override fun onDisplayChanged(
                          displayId: Int,
                      ) {
                          syncDisplays()

                          scheduleDisplayProbe(
                              "display-changed:$displayId"
                          )
                      }
                  }""",
              "FoldOverlayService display listener",
          )

          replace_once(
              service_path,
              """        scope.launch { ShizukuBridge.state.collect { syncAngleFeed() } }
                  scope.launch { DuoSettings.config.collect { syncAngleFeed() } }
                  syncDisplays()
                  Log.i(TAG, "connected; hinge=${hinge.sensor?.name} live displays=${engines.keys}")""",
              """        scope.launch {
                      ShizukuBridge.state.collect { state ->
                          syncAngleFeed()

                          if (
                              state is
                                  ShizukuBridge.State.Ready
                          ) {
                              scheduleDisplayProbe(
                                  "shizuku-ready",
                                  delayMs = 800L,
                              )
                          }
                      }
                  }

                  scope.launch {
                      DuoSettings.config.collect {
                          syncAngleFeed()
                      }
                  }

                  syncDisplays()

                  scheduleDisplayProbe(
                      "service-connected",
                      delayMs = 1_000L,
                  )

                  Log.i(
                      TAG,
                      "connected; hinge=${hinge.sensor?.name} live displays=${engines.keys}",
                  )""",
              "FoldOverlayService startup",
          )

          replace_once(
              service_path,
              """        instance = null
                  angleFeed?.stop()""",
              """        instance = null

                  handler.removeCallbacks(
                      displayProbeRunnable
                  )

                  angleFeed?.stop()""",
              "FoldOverlayService cleanup",
          )

          replace_once(
              service_path,
              """    fun angleFeedStatus(): String = angleFeed?.status ?: "Idle"

              private fun updateRunning() {""",
              """    fun angleFeedStatus(): String =
                  angleFeed?.status ?: "Idle"

              private fun scheduleDisplayProbe(
                  reason: String,
                  delayMs: Long =
                      DISPLAY_PROBE_DEBOUNCE_MS,
              ) {
                  if (
                      !ShizukuBridge.ready
                  ) {
                      return
                  }

                  pendingProbeReason =
                      reason

                  handler.removeCallbacks(
                      displayProbeRunnable
                  )

                  handler.postDelayed(
                      displayProbeRunnable,
                      delayMs,
                  )
              }

              private fun runDisplayProbe(
                  reason: String,
              ) {
                  if (
                      !ShizukuBridge.ready
                  ) {
                      return
                  }

                  val now =
                      android.os.SystemClock
                          .uptimeMillis()

                  val elapsed =
                      now -
                          lastDisplayProbeUptime

                  if (
                      lastDisplayProbeUptime != 0L &&
                      elapsed <
                          DISPLAY_PROBE_MIN_GAP_MS
                  ) {
                      handler.removeCallbacks(
                          displayProbeRunnable
                      )

                      handler.postDelayed(
                          displayProbeRunnable,
                          DISPLAY_PROBE_MIN_GAP_MS -
                              elapsed,
                      )

                      return
                  }

                  lastDisplayProbeUptime =
                      now

                  val local =
                      displayManager.displays
                          .joinToString(
                              " | "
                          ) { display ->

                              val mode =
                                  runCatching {
                                      display.mode
                                  }.getOrNull()

                              (
                                  "id=${display.displayId} " +
                                      "name=${display.name} " +
                                      "state=${display.state} " +
                                      "mode=${mode?.physicalWidth}x" +
                                      "${mode?.physicalHeight}@" +
                                      "${mode?.refreshRate}Hz"
                                  )
                          }

                  DuoDiagnostics.event(
                      "display-probe",
                      "begin reason=$reason local=[$local]",
                  )

                  scope.launch(
                      Dispatchers.IO
                  ) {
                      val result =
                          ShizukuBridge.displayProbe()

                      if (
                          result == null
                      ) {
                          DuoDiagnostics.event(
                              "display-probe",
                              "unavailable reason=$reason",
                          )

                          return@launch
                      }

                      result.getString(
                          "error"
                      )?.let { error ->

                          DuoDiagnostics.event(
                              "display-probe",
                              "shell error reason=$reason error=$error",
                          )
                      }

                      DuoDiagnostics.event(
                          "display-probe",
                          "shell uid=${result.getInt("uid", -1)} " +
                              "pid=${result.getInt("pid", -1)} " +
                              "reason=$reason",
                      )

                      listOf(
                          "identity",
                          "cmd_display",
                          "cmd_display_help",
                          "surfaceflinger",
                          "display_filtered",
                          "window_displays",
                      ).forEach { key ->

                          val value =
                              result.getString(
                                  key
                              ) ?: "(missing)"

                          DuoDiagnostics.event(
                              "display-probe",
                              "$key=" +
                                  value
                                      .replace(
                                          "\\r",
                                          ""
                                      )
                                      .replace(
                                          "\\n",
                                          "\\\\n"
                                      ),
                          )
                      }
                  }
              }

              private fun updateRunning() {""",
              "FoldOverlayService probe methods",
          )

          replace_once(
              service_path,
              """        const val ACTION_DEMO = "com.duoopen.DEMO"
                  private const val TEST_DISPLAYS_SETTING = "duoopen_test_displays"
                  /** How old a panel's last picture may be and still bridge the next fold. */""",
              """        const val ACTION_DEMO = "com.duoopen.DEMO"

                  private const val TEST_DISPLAYS_SETTING =
                      "duoopen_test_displays"

                  private const val DISPLAY_PROBE_DEBOUNCE_MS =
                      450L

                  private const val DISPLAY_PROBE_MIN_GAP_MS =
                      1_500L

                  /** How old a panel's last picture may be and still bridge the next fold. */""",
              "FoldOverlayService probe constants",
          )

          # Version.
          gradle = Path(
              "app/build.gradle.kts"
          )

          text = gradle.read_text()

          if (
              "versionCode = 8"
              not in text
          ):
              raise SystemExit(
                  "Expected dual-stable versionCode 8 was not found."
              )

          if (
              'versionName = "1.3.4-zfold7-dual-stable"'
              not in text
          ):
              raise SystemExit(
                  "Expected dual-stable versionName was not found."
              )

          text = text.replace(
              "versionCode = 8",
              "versionCode = 9",
              1,
          )

          text = text.replace(
              'versionName = "1.3.4-zfold7-dual-stable"',
              'versionName = "1.3.5-zfold7-display-probe"',
              1,
          )

          gradle.write_text(
              text
          )
          PY

      - name: Validate probe pass
        run: |
          git diff --check
          git diff --stat

          grep -R "DISPLAY_PROBE" app/src/full/java/com/duoopen/shell
          grep -R "display-probe" app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt

          mkdir -p zfold7-artifacts
          git diff > zfold7-artifacts/zfold7-display-probe.patch

      - name: Compile, unit test, and build
        run: |
          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

      - name: Prepare APK
        run: |
          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "Debug APK not found."
            exit 1
          fi

          cp \
            "$APK" \
            zfold7-artifacts/DuoOpen-ZFold7-display-probe-debug.apk

          {
            echo "commit=${GITHUB_SHA}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "pass=background-display-probe"
            echo

            sha256sum \
              zfold7-artifacts/DuoOpen-ZFold7-display-probe-debug.apk

          } > zfold7-artifacts/BUILD-INFO.txt

          cat zfold7-artifacts/BUILD-INFO.txt

      - name: Upload field-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-display-probe

          path: |
            zfold7-artifacts/DuoOpen-ZFold7-display-probe-debug.apk
            zfold7-artifacts/zfold7-display-probe.patch
            zfold7-artifacts/BUILD-INFO.txt

          if-no-files-found: error
          retention-days: 30