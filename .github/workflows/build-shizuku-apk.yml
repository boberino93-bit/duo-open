name: Materialize Fold7 1.3.16 Generated Baseline

on:
  workflow_dispatch:
    inputs:
      output_branch:
        description: Branch to create with the fully generated 1.3.16 source tree
        required: true
        default: generated/fold7-1.3.16-baseline
        type: string

permissions:
  contents: write

concurrency:
  group: materialize-fold7-1.3.16
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest

    env:
      BASELINE_SHA: 1a8787c5727be47f40d77ca9258e1cadb56fa1a4
      BASELINE_VERSION: 1.3.16-zfold7-motion-power
      BASELINE_VERSION_CODE: "20"

    steps:
      - name: Checkout trusted baseline and full history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SHA }}
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Reconstruct exact generated 1.3.16 source
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import textwrap

          baseline = os.environ["BASELINE_SHA"]
          workflow_path = ".github/workflows/build-shizuku-apk.yml"

          workflow = subprocess.check_output(
              ["git", "show", f"{baseline}:{workflow_path}"],
              text=True,
          )

          lines = workflow.splitlines()

          # These are the baseline workflow's source-generation/validation passes.
          # Deliberately exclude its compile/package/upload steps; this workflow
          # performs fresh validation after the generated source has been materialized.
          wanted_steps = [
              "Replay last successful Fold7 geometry build",
              "Fix Fold7 physical panel handoff",
              "Validate Fold7 physical handoff source",
              "Add motion-gated cover power hold",
              "Validate motion-gated cover power source",
          ]

          def extract_run_block(step_name: str) -> str:
              step_start = None
              for index, line in enumerate(lines):
                  if line.strip() == f"- name: {step_name}":
                      step_start = index
                      break

              if step_start is None:
                  raise SystemExit(
                      f"Baseline workflow step not found: {step_name}"
                  )

              run_line = None
              for index in range(step_start + 1, len(lines)):
                  line = lines[index]
                  if line.startswith("      - name:"):
                      break
                  if line.strip() == "run: |":
                      run_line = index
                      break

              if run_line is None:
                  raise SystemExit(
                      f"run: | block not found for baseline step: {step_name}"
                  )

              block = []
              for index in range(run_line + 1, len(lines)):
                  line = lines[index]
                  if line.startswith("      - name:"):
                      break
                  block.append(line)

              return textwrap.dedent("\n".join(block))

          for ordinal, step_name in enumerate(wanted_steps, start=1):
              script = extract_run_block(step_name)
              safe_name = re.sub(r"[^A-Za-z0-9]+", "-", step_name).strip("-")
              script_path = Path(f"/tmp/fold7-baseline-{ordinal:02d}-{safe_name}.sh")
              script_path.write_text("set -euo pipefail\n" + script + "\n")

              print(f"=== Replaying baseline step: {step_name} ===")
              subprocess.run(["bash", str(script_path)], check=True)

          print("=== Baseline generation complete ===")
          PY

      - name: Verify materialized source identity
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="app/build.gradle.kts"
          SERVICE="app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt"
          HOST="app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt"
          PANEL="app/src/full/java/com/duoopen/overlay/PanelEngine.kt"
          SHADER="app/src/main/java/com/duoopen/fold/DuoShader.kt"

          test -f "$GRADLE"
          test -f "$SERVICE"
          test -f "$HOST"
          test -f "$PANEL"
          test -f "$SHADER"

          grep -F 'versionCode = 20' "$GRADLE"
          grep -F 'versionName = "1.3.16-zfold7-motion-power"' "$GRADLE"

          # Known 1.3.16 architecture markers.
          grep -F 'COVER_WAKE_TRAVEL_DEG' "$SERVICE"
          grep -F 'physical-resolve reason=' "$SERVICE"
          grep -F 'mode.physicalWidth == INNER_WIDTH' "$HOST"
          grep -F 'setGeometry' "$HOST"

          # Guard the physical-panel rule that must survive all future work.
          if grep -REn 'displayId[[:space:]]*==[[:space:]]*0.*inner|displayId[[:space:]]*==[[:space:]]*1.*cover' \
              app/src/full/java app/src/main/java; then
            echo "ERROR: found a direct logical-display-ID panel identity assumption."
            exit 1
          fi

          git diff --check

      - name: Capture generated-source audit
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p zfold7-materialized

          git diff --name-status -- \
            app/build.gradle.kts \
            app/src \
            > zfold7-materialized/GENERATED-FILES-1.3.16.txt

          git diff -- \
            app/build.gradle.kts \
            app/src \
            > zfold7-materialized/GENERATED-SOURCE-1.3.16.patch

          {
            echo "Fold7 1.3.16 hot-path index"
            echo "baseline=$BASELINE_SHA"
            echo "version=$BASELINE_VERSION"
            echo "versionCode=$BASELINE_VERSION_CODE"
            echo
            echo "--- capture / pacing / topology / rendering references ---"
            grep -RInE \
              'LIVE_INTERVAL_MS|LIVE_SHELL_SCALE|INITIAL_SHELL_SCALE|POLL_MS|postDelayed|Choreographer|ShizukuBridge\.capture|takeScreenshot|displayManager\.displays|values\.toList\(\)|SurfaceControl\.Transaction|setGeometry|applyTransactionOnDraw|mirrorDisplay|onHinge\(' \
              app/src/full/java \
              app/src/main/java \
              || true
          } > zfold7-materialized/HOTPATH-INDEX-1.3.16.txt

          {
            echo "Fold7 generated baseline inventory"
            echo "baseline=$BASELINE_SHA"
            echo "version=$BASELINE_VERSION"
            echo "versionCode=$BASELINE_VERSION_CODE"
            echo "innerPhysicalGeometry=1968x2184"
            echo "coverPhysicalGeometry=1080x2520"
            echo
            echo "Generated/modified files relative to the checked-in baseline:"
            cat zfold7-materialized/GENERATED-FILES-1.3.16.txt
          } > zfold7-materialized/BASELINE-INFO-1.3.16.txt

          tar -czf \
            zfold7-materialized/DuoOpen-ZFold7-generated-source-1.3.16.tar.gz \
            app/build.gradle.kts \
            app/src

      - name: Compile and run existing Full debug tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

      - name: Preserve rebuilt baseline APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "Full debug APK not found."
            exit 1
          fi

          OUTPUT="zfold7-materialized/DuoOpen-ZFold7-1.3.16-materialized-debug.apk"
          cp "$APK" "$OUTPUT"
          sha256sum "$OUTPUT" \
            > zfold7-materialized/APK-SHA256-1.3.16.txt

      - name: Write canonical generated-baseline note
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p docs

          cat > docs/FOLD7-GENERATED-BASELINE.md <<'EOF'
          # Samsung Galaxy Z Fold7 generated baseline

          This branch materializes the source tree generated by the trusted Duo Open
          `1.3.16-zfold7-motion-power` workflow from baseline commit
          `1a8787c5727be47f40d77ca9258e1cadb56fa1a4`.

          It exists so future engineering can work from ordinary source files instead
          of repeatedly reasoning through the historical GitHub Actions patch stack.

          ## Physically established target geometry

          - Inner panel: `1968 x 2184`
          - Cover panel: `1080 x 2520`
          - Logical display IDs are not physical panel identities and may be remapped
            by Samsung during a fold transition.

          ## Preserved 1.3.16 architecture

          - Live `SurfaceControl` display mirror.
          - Explicit geometry mapping of the left pane of the inner panel to the cover.
          - Existing glass/frost rendering architecture.
          - Shizuku-assisted capture/mirroring.
          - Existing 1.3.16 motion-gated cover-power behavior.

          ## Important status

          This branch is a source materialization only. It does not claim to improve
          Fold7 performance or transition behavior. Any subsequent change must be
          compiled/tested and then physically validated on the target Fold7 before it
          is described as working hardware behavior.
          EOF

      - name: Create generated-source branch
        shell: bash
        env:
          OUTPUT_BRANCH: ${{ inputs.output_branch }}
        run: |
          set -euo pipefail

          if [ -z "$OUTPUT_BRANCH" ]; then
            echo "output_branch cannot be empty"
            exit 1
          fi

          if ! printf '%s' "$OUTPUT_BRANCH" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
            echo "output_branch contains unsupported characters: $OUTPUT_BRANCH"
            exit 1
          fi

          git fetch origin --prune

          if git ls-remote --exit-code --heads origin "refs/heads/$OUTPUT_BRANCH" >/dev/null 2>&1; then
            echo "ERROR: remote branch already exists: $OUTPUT_BRANCH"
            echo "Choose a different output_branch so this recovery workflow never overwrites prior work."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$OUTPUT_BRANCH"

          # Commit only the generated application source and its canonical note.
          # Build outputs and temporary workflow artifacts remain Actions artifacts.
          git add \
            app/build.gradle.kts \
            app/src \
            docs/FOLD7-GENERATED-BASELINE.md

          if git diff --cached --quiet; then
            echo "ERROR: baseline replay produced no materialized source changes."
            exit 1
          fi

          git commit -m "Materialize generated Fold7 1.3.16 baseline"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"

          MATERIALIZED_SHA="$(git rev-parse HEAD)"

          {
            echo "outputBranch=$OUTPUT_BRANCH"
            echo "materializedCommit=$MATERIALIZED_SHA"
            echo "baselineCommit=$BASELINE_SHA"
          } | tee zfold7-materialized/MATERIALIZED-BRANCH.txt

      - name: Upload reconstruction artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-materialized-1.3.16
          path: |
            zfold7-materialized/DuoOpen-ZFold7-generated-source-1.3.16.tar.gz
            zfold7-materialized/DuoOpen-ZFold7-1.3.16-materialized-debug.apk
            zfold7-materialized/APK-SHA256-1.3.16.txt
            zfold7-materialized/BASELINE-INFO-1.3.16.txt
            zfold7-materialized/GENERATED-FILES-1.3.16.txt
            zfold7-materialized/GENERATED-SOURCE-1.3.16.patch
            zfold7-materialized/HOTPATH-INDEX-1.3.16.txt
            zfold7-materialized/MATERIALIZED-BRANCH.txt
          if-no-files-found: error
          retention-days: 30
