      - name: Restore cover-primary continuity regression
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(
                      f"{label}: expected source not found in {path}"
                  )
              p.write_text(text.replace(old, new, 1))

          def regex_replace_once(path, pattern, replacement, label):
              p = Path(path)
              text = p.read_text()

              new_text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=re.S,
              )

              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one match in {path}, got {count}"
                  )

              p.write_text(new_text)

          # ============================================================
          # COVER-PRIMARY CONTINUITY REGRESSION FIX
          #
          # 1.3.13r regressed the previously working experimental
          # cover-screen behaviour.
          #
          # The regression was caused by syncMirrorHost() explicitly
          # detaching DisplayMirrorHost and calling stopDisplayMirror()
          # as soon as Samsung made the 1080x2520 cover screen the
          # Android default display.
          #
          # That means the exact topology handoff where continuity is
          # still required was being interpreted as a reason to destroy
          # the continuity path.
          #
          # Do NOT permanently assume logical display IDs.
          #
          # Known physical Fold7 geometry:
          #
          # INNER:
          # 1968x2184
          #
          # COVER:
          # 1080x2520
          #
          # Identify panels by physical geometry and current state.
          # Keep the cover as the destination even after Samsung makes
          # it the primary/default display.
          # ============================================================

          service_path = Path(
              "app/src/full/java/com/duoopen/overlay/"
              "FoldOverlayService.kt"
          )

          regex_replace_once(
              service_path,
              r'''    private fun syncMirrorHost\(
                  reason: String,
              \) \{
          .*?
              \}

              private fun safeToReleaseSecondaryPanel\(\): Boolean \{''',
              '''    private fun syncMirrorHost(
                  reason: String,
              ) {
                  if (!mirrorRequested) {
                      return
                  }

                  val primary =
                      displayManager.getDisplay(
                          Display.DEFAULT_DISPLAY
                      )

                  if (primary == null) {
                      _secondaryDisplayStatus.value =
                          "Waiting for Android's default display."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "default display missing reason=$reason",
                      )

                      return
                  }

                  val primaryMode =
                      primary.mode

                  val coverIsPrimary =
                      primaryMode.physicalWidth == 1080 &&
                          primaryMode.physicalHeight == 2520

                  val innerIsPrimary =
                      primaryMode.physicalWidth == 1968 &&
                          primaryMode.physicalHeight == 2184

                  if (
                      !coverIsPrimary &&
                      !innerIsPrimary
                  ) {
                      _secondaryDisplayStatus.value =
                          "Waiting for a known Fold7 inner/cover topology."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "unknown primary topology reason=$reason " +
                              "primary=${primary.displayId} " +
                              "mode=${primaryMode.physicalWidth}x${primaryMode.physicalHeight} " +
                              "hostUsable=${mirrorHost?.isUsable == true}",
                      )

                      return
                  }

                  /*
                   * Critical regression fix:
                   *
                   * The cover display is still the continuity destination
                   * even after Samsung promotes it to DEFAULT_DISPLAY.
                   *
                   * Previously this state triggered:
                   *
                   *     mirrorHost?.detach()
                   *     mirrorHost = null
                   *     ShizukuBridge.stopDisplayMirror()
                   *
                   * That guaranteed the front-screen path would disappear
                   * during the closed-phone handoff.
                   *
                   * Instead, resolve the cover dynamically and keep/rebuild
                   * DisplayMirrorHost on that physical panel.
                   */
                  val cover =
                      if (coverIsPrimary) {
                          primary
                      } else {
                          displayManager.displays
                              .firstOrNull { candidate ->
                                  if (
                                      candidate.state ==
                                          Display.STATE_OFF ||
                                      candidate.state ==
                                          Display.STATE_UNKNOWN
                                  ) {
                                      false
                                  } else {
                                      val mode =
                                          candidate.mode

                                      mode.physicalWidth == 1080 &&
                                          mode.physicalHeight == 2520
                                  }
                              }
                      }

                  if (cover == null) {
                      _secondaryDisplayStatus.value =
                          "Cover topology is transitioning; retaining the continuity host."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "cover logical display missing; host retained reason=$reason " +
                              "hostUsable=${mirrorHost?.isUsable == true}",
                      )

                      return
                  }

                  if (coverIsPrimary) {
                      _secondaryDisplayStatus.value =
                          "Native cover is primary; retaining geometry continuity from the inner panel."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "cover-primary-continuity reason=$reason " +
                              "cover=${cover.displayId} " +
                              "mode=${cover.mode.physicalWidth}x${cover.mode.physicalHeight}",
                      )
                  }

                  val current =
                      mirrorHost

                  /*
                   * Rebuild the host only when the actual destination
                   * changes or the existing host is no longer usable.
                   *
                   * Logical display IDs are allowed to change during the
                   * fold transition.
                   */
                  if (
                      current == null ||
                      current.displayId != cover.displayId ||
                      !current.isUsable
                  ) {
                      current?.detach()

                      mirrorHost =
                          DisplayMirrorHost(
                              service = this,
                              display = cover,
                              scope = scope,
                              onStatus = { message ->
                                  _secondaryDisplayStatus.value =
                                      message
                              },
                          ).also {
                              it.attach()
                          }

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "geometry host created reason=$reason " +
                              "cover=${cover.displayId} " +
                              "mode=${cover.mode.physicalWidth}x${cover.mode.physicalHeight} " +
                              "coverIsPrimary=$coverIsPrimary",
                      )

                      return
                  }

                  /*
                   * Same physical destination and a usable host:
                   * refresh instead of tearing it down.
                   */
                  current.refresh(
                      reason
                  )
              }

              private fun safeToReleaseSecondaryPanel(): Boolean {''',
              "FoldOverlayService cover-primary continuity",
          )

          # ============================================================
          # INNER DISPLAY SOURCE VALIDATION
          #
          # Do not select a stale logical display solely because it still
          # reports the Fold7 inner-panel dimensions.
          #
          # The source must also be active.
          # ============================================================

          mirror_host_path = Path(
              "app/src/full/java/com/duoopen/overlay/"
              "DisplayMirrorHost.kt"
          )

          replace_once(
              mirror_host_path,
              '''    private fun findInnerDisplay(): Display? =
                  displayManager.displays
                      .firstOrNull { candidate ->
                          val mode = candidate.mode
                          mode.physicalWidth == INNER_WIDTH &&
                              mode.physicalHeight == INNER_HEIGHT
                      }
          ''',
              '''    private fun findInnerDisplay(): Display? =
                  displayManager.displays
                      .firstOrNull { candidate ->
                          val mode =
                              candidate.mode

                          candidate.state !=
                              Display.STATE_OFF &&
                              candidate.state !=
                                  Display.STATE_UNKNOWN &&
                              mode.physicalWidth ==
                                  INNER_WIDTH &&
                              mode.physicalHeight ==
                                  INNER_HEIGHT
                      }
          ''',
              "DisplayMirrorHost active inner-panel lookup",
          )

          # ============================================================
          # REGRESSION GUARDS
          #
          # These strings represent the exact behaviour that caused the
          # front-screen regression.
          #
          # If they return in a later integration pass, fail the build
          # rather than silently producing another broken APK.
          # ============================================================

          service_text =
              service_path.read_text()

          forbidden_regressions = (
              "Native cover is primary; temporary geometry mirror released.",
              "native-cover-handoff",
          )

          for needle in forbidden_regressions:
              if needle in service_text:
                  raise SystemExit(
                      "Cover-primary regression remains: " +
                      needle
                  )

          if (
              "cover-primary-continuity"
              not in service_text
          ):
              raise SystemExit(
                  "Cover-primary continuity marker is missing."
              )

          if (
              "retaining geometry continuity from the inner panel"
              not in service_text
          ):
              raise SystemExit(
                  "Cover-primary retention status is missing."
              )

          mirror_text =
              mirror_host_path.read_text()

          if (
              "candidate.state !=" not in mirror_text or
              "Display.STATE_OFF" not in mirror_text or
              "Display.STATE_UNKNOWN" not in mirror_text
          ):
              raise SystemExit(
                  "Inner-display active-state guard is missing."
              )

          # ============================================================
          # VERSION
          # ============================================================

          gradle_path =
              Path(
                  "app/build.gradle.kts"
              )

          gradle =
              gradle_path.read_text()

          if (
              "versionCode = 18"
              not in gradle
          ):
              raise SystemExit(
                  "Expected revised 1.3.13 versionCode 18 was not found."
              )

          if (
              'versionName = "1.3.13r-zfold7-geometry-glass"'
              not in gradle
          ):
              raise SystemExit(
                  "Expected revised 1.3.13 versionName was not found."
              )

          gradle =
              gradle.replace(
                  "versionCode = 18",
                  "versionCode = 19",
                  1,
              )

          gradle =
              gradle.replace(
                  'versionName = "1.3.13r-zfold7-geometry-glass"',
                  'versionName = "1.3.14-zfold7-cover-primary-continuity"',
                  1,
              )

          gradle_path.write_text(
              gradle
          )

          print(
              "Fold7 cover-primary continuity regression fix applied."
          )
          PY

      - name: Validate cover-primary regression fix
        run: |
          set -e

          git diff --check

          echo
          echo "=================================================="
          echo "Checking cover-primary continuity implementation"
          echo "=================================================="
          echo

          grep -R \
            "cover-primary-continuity" \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt

          grep -R \
            "retaining geometry continuity from the inner panel" \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt

          grep -R \
            "candidate.state !=" \
            app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt

          grep -R \
            "Display.STATE_OFF" \
            app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt

          grep -R \
            "Display.STATE_UNKNOWN" \
            app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt

          grep -R \
            "1.3.14-zfold7-cover-primary-continuity" \
            app/build.gradle.kts

          echo
          echo "=================================================="
          echo "Checking known regression is gone"
          echo "=================================================="
          echo

          if grep -R -F \
            "Native cover is primary; temporary geometry mirror released." \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt
          then
            echo
            echo "ERROR:"
            echo "Known cover-primary teardown regression is still present."
            exit 1
          fi

          if grep -R -F \
            "native-cover-handoff" \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt
          then
            echo
            echo "ERROR:"
            echo "Legacy native-cover teardown event is still present."
            exit 1
          fi

          echo
          echo "Cover-primary teardown regression is absent."
          echo

          mkdir -p \
            zfold7-artifacts

          git diff > \
            zfold7-artifacts/zfold7-cover-primary-continuity.patch

          echo
          echo "=================================================="
          echo "Regression fix diff"
          echo "=================================================="
          echo

          git diff --stat

      - name: Compile, unit test, and build
        run: |
          set -e

          echo
          echo "=================================================="
          echo "Building Duo Open Fold7 1.3.14"
          echo "=================================================="
          echo

          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

          echo
          echo "=================================================="
          echo "Build completed"
          echo "=================================================="
          echo

          find \
            app/build/outputs/apk/full/debug \
            -type f \
            -name '*.apk' \
            -print