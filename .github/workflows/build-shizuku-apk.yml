      - name: Validate motion-gated cover power source
        run: |
          set -euo pipefail

          PROTOCOL="app/src/full/java/com/duoopen/shell/ShellProtocol.kt"
          SHELL="app/src/full/java/com/duoopen/shell/DuoShellService.kt"
          BRIDGE="app/src/full/java/com/duoopen/shell/ShizukuBridge.kt"
          SERVICE="app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt"
          SHEET="app/src/main/java/com/duoopen/ui/ControlSheet.kt"
          GRADLE="app/build.gradle.kts"

          git diff --check

          grep -F \
            'REQUEST_DISPLAY_POWER = 10' \
            "$PROTOCOL"

          grep -F \
            'requestDisplayPowerInternal' \
            "$SHELL"

          grep -F \
            'The physical Fold7 cover route (1080x2520)' \
            "$SHELL"

          grep -F \
            'fun requestDisplayPower(' \
            "$BRIDGE"

          grep -F \
            'COVER_WAKE_TRAVEL_DEG' \
            "$SERVICE"

          grep -F \
            '4.0f' \
            "$SERVICE"

          grep -F \
            'COVER_POWER_ASSERT_INTERVAL_MS' \
            "$SERVICE"

          grep -F \
            'Display.STATE_ON' \
            "$SERVICE"

          grep -F \
            'Arm geometry continuity (4°)' \
            "$SHEET"

          grep -F \
            '1.3.16-zfold7-motion-power' \
            "$GRADLE"

          grep -F \
            'enableConnectedDisplayInternal' \
            "$SHELL"

          grep -F \
            'coverPowerWatchdog' \
            "$SERVICE"

          if grep -F \
            'COVER_WAKE_CONFIRM_MS' \
            "$SERVICE"
          then
            echo "ERROR: delayed 4-degree trigger remains."
            exit 1
          fi

          if grep -F \
            '"cmd display disable-display $targetId"' \
            "$SHELL"
          then
            echo "ERROR: unsafe cover disable path remains."
            exit 1
          fi

          mkdir -p \
            zfold7-artifacts

          git diff > \
            zfold7-artifacts/zfold7-motion-power.patch

      - name: Compile, unit test, and build
        run: |
          set -euo pipefail

          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

      - name: Prepare field-test APK
        run: |
          set -euo pipefail

          mkdir -p \
            zfold7-artifacts

          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "Debug APK not found."
            exit 1
          fi

          OUTPUT_APK="zfold7-artifacts/DuoOpen-ZFold7-motion-power-1.3.16-debug.apk"

          cp \
            "$APK" \
            "$OUTPUT_APK"

          {
            echo "commit=${GITHUB_SHA}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=1.3.16-zfold7-motion-power"
            echo "versionCode=20"
            echo "target=Samsung Galaxy Z Fold7 SM-F966W"
            echo "android=16"
            echo "innerGeometry=1968x2184"
            echo "coverGeometry=1080x2520"
            echo "innerPhysicalId=local:4630946449689556883"
            echo "innerPort=147"
            echo "coverPhysicalId=local:4630946872173396372"
            echo "coverPort=148"
            echo "baseWorkflowCommit=fc41750970a5270274ea1f9ce6502921d40c2581"
            echo "pass=4deg-motion-gate+cover-power-hold+physical-routing+logical-id-remap+setGeometry+89.5deg-glass+bidirectional-motion"
            echo

            sha256sum \
              "$OUTPUT_APK"

          } > \
            zfold7-artifacts/BUILD-INFO-1.3.16.txt

          cat \
            zfold7-artifacts/BUILD-INFO-1.3.16.txt

      - name: Upload field-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-motion-power-1.3.16
          path: |
            zfold7-artifacts/DuoOpen-ZFold7-motion-power-1.3.16-debug.apk
            zfold7-artifacts/zfold7-pane-container.patch
            zfold7-artifacts/zfold7-geometry-continuity.patch
            zfold7-artifacts/zfold7-geometry-continuity-revised.patch
            zfold7-artifacts/zfold7-physical-handoff.patch
            zfold7-artifacts/zfold7-motion-power.patch
            zfold7-artifacts/BUILD-INFO-1.3.16.txt
          if-no-files-found: error
          retention-days: 30