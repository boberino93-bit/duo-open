                                return
                            }

                            val current = mirrorHost''',
              "FoldOverlayService retain mirror host through transient cover loss",
          )

          replace_once(
              service_path,
              '''                  if (
                                current == null ||
                                current.displayId != cover.displayId
                            ) {''',
              '''                  if (
                                current == null ||
                                current.displayId != cover.displayId ||
                                !current.isUsable
                            ) {''',
              "FoldOverlayService rebuild detached geometry host",
          )

          sheet_path = (
              "app/src/main/java/com/duoopen/ui/"
              "ControlSheet.kt"
          )

          replace_once(
              sheet_path,
              '"Start pane-container continuity"',
              '"Start geometry continuity"',
              "ControlSheet geometry label",
          )

          replace_once(
              sheet_path,
              '''"Fold7 pane-container probe: the full live display mirror is parented inside " +
                              "an owned SurfaceControl container whose bounds clip it to the LEFT half of the inner " +
                              "display. The cropped parent then fills the cover. This avoids relying on crop semantics " +
                              "of the special WindowManager display-mirror layer while preserving live launcher and app content."''',
              '''"Fold7 geometry continuity: Android's display mirror is mapped with an explicit " +
                              "source rectangle selecting only the LEFT half of the inner display, then scaled to fill " +
                              "the cover. The original fold animation continues to receive hinge updates at the same time, " +
                              "so opening and folding back in reverse smoothly from the current hinge position."''',
              "ControlSheet geometry explanation",
          )

          gradle_path = Path("app/build.gradle.kts")
          gradle = gradle_path.read_text()

          if "versionCode = 16" not in gradle:
              raise SystemExit(
                  "Expected pane-container versionCode 16 was not found."
              )

          if (
              'versionName = "1.3.12-zfold7-pane-container"'
              not in gradle
          ):
              raise SystemExit(
                  "Expected pane-container versionName was not found."
              )

          gradle = gradle.replace(
              "versionCode = 16",
              "versionCode = 17",
              1,
          )

          gradle = gradle.replace(
              'versionName = "1.3.12-zfold7-pane-container"',
              'versionName = "1.3.13-zfold7-setgeometry-bidirectional"',
              1,
          )

          gradle_path.write_text(gradle)
          PY

