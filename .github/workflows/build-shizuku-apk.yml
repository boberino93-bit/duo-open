name: Build Z Fold 7 Service-Owned Dual Screen Probe Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Replay previous display-probe build
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          previous_commit = "83cc8a3816b3286017a0cbbaaa61d7ec9fe8a68c"

          previous_workflow = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{previous_commit}:.github/workflows/build-shizuku-apk.yml",
              ],
              text=True,
          )

          lines = previous_workflow.splitlines()

          wanted_steps = [
              "Verify expected source base",
              "Replay previous proven transforms",
              "Add service-owned read-only display probe",
          ]

          def extract_run_block(step_name: str) -> str:
              step_start = None

              for index, line in enumerate(lines):
                  if line.strip() == f"- name: {step_name}":
                      step_start = index
                      break

              if step_start is None:
                  raise SystemExit(
                      f"Previous workflow step not found: {step_name}"
                  )

              run_line = None

              for index in range(step_start + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  if line.strip() == "run: |":
                      run_line = index
                      break

              if run_line is None:
                  raise SystemExit(
                      f"Run block not found for: {step_name}"
                  )

              block = []

              for index in range(run_line + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  block.append(line)

              return textwrap.dedent(
                  "\n".join(block)
              )

          for step_name in wanted_steps:
              script = extract_run_block(step_name)

              script_path = Path(
                  "/tmp/" +
                  re.sub(
                      r"[^A-Za-z0-9]+",
                      "-",
                      step_name,
                  ).strip("-") +
                  ".sh"
              )

              script_path.write_text(
                  "set -euo pipefail\n" +
                  script +
                  "\n"
              )

              print(
                  f"Replaying previous proven step: {step_name}"
              )

              subprocess.run(
                  [
                      "bash",
                      str(script_path),
                  ],
                  check=True,
              )
          PY

      - name: Keep Samsung angle reader alive across cover-screen handoff
        run: |
          python3 <<'PY'
          from pathlib import Path

          def load(path):
              return Path(path).read_text()

          def save(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new, label):
              text = load(path)

              if old not in text:
                  raise SystemExit(
                      f"{label}: expected source not found in {path}"
                  )

              save(
                  path,
                  text.replace(
                      old,
                      new,
                      1,
                  ),
              )

          service_path = (
              "app/src/full/java/com/duoopen/overlay/"
              "FoldOverlayService.kt"
          )

          replace_once(
              service_path,
              """        val want = DuoSettings.config.value.shizukuAngle && ShizukuBridge.ready && WallpaperAngleFeed.foldWallpaperActive(this)
                  if (want && !feed.active) feed.start() else if (!want && feed.active) feed.stop()""",
              """        /*
                   * Do not gate the live Samsung angle reader on WallpaperManager.
                   *
                   * On the Fold7, the inner display reports Samsung's FoldInteractive
                   * service while the cover display may report a Video wallpaper.
                   * That metadata switch does not prove the underlying angle source has
                   * disappeared. The real authority is whether fresh angle callbacks
                   * continue arriving from the Shizuku-side log reader.
                   */
                  val want =
                      DuoSettings.config.value.shizukuAngle &&
                          ShizukuBridge.ready

                  if (
                      want &&
                      !feed.active
                  ) {
                      feed.start()
                  } else if (
                      !want &&
                      feed.active
                  ) {
                      feed.stop()
                  }""",
              "FoldOverlayService angle source gate",
          )

          angle_path = (
              "app/src/full/java/com/duoopen/shell/"
              "WallpaperAngleFeed.kt"
          )

          replace_once(
              angle_path,
              """        if (!ShizukuBridge.ready) { status = "Shizuku not ready"; return }
                  if (!foldWallpaperActive(context)) { status = "Samsung's Fold interactive wallpaper isn't the home wallpaper"; return }
                  action = "com.duoopen.angle.READ_${SystemClock.elapsedRealtime()}\"""".replace('\\"', '"'),
              """        if (!ShizukuBridge.ready) {
                      status = "Shizuku not ready"
                      return
                  }

                  /*
                   * Samsung exposes different wallpaper metadata on the Fold7 cover
                   * display. Always attempt the reader and let fresh/stale callbacks
                   * determine whether the continuous source is usable.
                   */
                  action = "com.duoopen.angle.READ_${SystemClock.elapsedRealtime()}\"""".replace('\\"', '"'),
              "WallpaperAngleFeed hard wallpaper gate",
          )

          replace_once(
              angle_path,
              """    private var duplicateAngles = 0L

              /** One line for the UI. */""",
              """    private var duplicateAngles = 0L

              private var lastWallpaperIdentity =
                  ""

              private var lastFreshState:
                  Boolean? = null

              /** One line for the UI. */""",
              "WallpaperAngleFeed metadata fields",
          )

          old_status = """    private val statusTick = object : Runnable {
                  override fun run() {
                      if (!running) return
                      val b = ShizukuBridge.angleStatus()
                      val age = if (lastCallbackUptime == 0L) -1 else SystemClock.uptimeMillis() - lastCallbackUptime
                      status =
                          if (b == null) {
                              "Reader unreachable"
                          } else {
                              "Reader ${b.getString("state")}: " +
                                  "${b.getInt("parsed")} angles / " +
                                  "${b.getInt("lines")} lines" +
                                  (
                                      if (age >= 0) {
                                          " · last ${age} ms ago"
                                      } else {
                                          " · nothing received yet"
                                      }
                                  ) +
                                  (
                                      if (lastDeliveryLagMs >= 0) {
                                          " · delivery ${lastDeliveryLagMs} ms " +
                                              "(max ${maxDeliveryLagMs})"
                                      } else {
                                          ""
                                      }
                                  ) +
                                  " · poll ${pollInterval(SystemClock.uptimeMillis())} ms" +
                                  " · dup $duplicateAngles"
                          }
                      if (age > STALE_MS || (age < 0 && SystemClock.uptimeMillis() - startedAt > STALE_MS)) hinge.clearExternal()
                      handler.postDelayed(this, 1_000)
                  }
              }"""

          new_status = """    private val statusTick = object : Runnable {
                  override fun run() {
                      if (!running) return

                      val now =
                          SystemClock.uptimeMillis()

                      val b =
                          ShizukuBridge.angleStatus()

                      val age =
                          if (
                              lastCallbackUptime == 0L
                          ) {
                              -1L
                          } else {
                              now -
                                  lastCallbackUptime
                          }

                      val fresh =
                          age in 0..STALE_MS ||
                              (
                                  age < 0L &&
                                      now - startedAt <=
                                      STALE_MS
                                  )

                      val wallpaper =
                          wallpaperIdentity(
                              context
                          )

                      if (
                          wallpaper !=
                          lastWallpaperIdentity
                      ) {
                          com.duoopen.debug.DuoDiagnostics.event(
                              "angle-source",
                              "wallpaper changed from=" +
                                  "${lastWallpaperIdentity.ifEmpty { "(initial)" }} " +
                                  "to=$wallpaper " +
                                  "readerFresh=$fresh ageMs=$age",
                          )

                          lastWallpaperIdentity =
                              wallpaper
                      }

                      if (
                          lastFreshState != fresh
                      ) {
                          com.duoopen.debug.DuoDiagnostics.event(
                              "angle-source",
                              "readerFresh=$fresh ageMs=$age " +
                                  "wallpaper=$wallpaper",
                          )

                          lastFreshState =
                              fresh
                      }

                      status =
                          if (
                              b == null
                          ) {
                              "Reader unreachable · wallpaper $wallpaper"
                          } else {
                              "Reader ${b.getString("state")}: " +
                                  "${b.getInt("parsed")} angles / " +
                                  "${b.getInt("lines")} lines" +
                                  (
                                      if (
                                          age >= 0
                                      ) {
                                          " · last ${age} ms ago"
                                      } else {
                                          " · waiting for first angle"
                                      }
                                  ) +
                                  (
                                      if (
                                          lastDeliveryLagMs >= 0
                                      ) {
                                          " · delivery ${lastDeliveryLagMs} ms " +
                                              "(max ${maxDeliveryLagMs})"
                                      } else {
                                          ""
                                      }
                                  ) +
                                  " · poll ${pollInterval(now)} ms" +
                                  " · dup $duplicateAngles" +
                                  " · source " +
                                  (
                                      if (
                                          fresh
                                      ) {
                                          "live"
                                      } else {
                                          "stale"
                                      }
                                  ) +
                                  " · wallpaper $wallpaper"
                          }

                      if (
                          !fresh &&
                          (
                              age > STALE_MS ||
                                  (
                                      age < 0 &&
                                          now - startedAt >
                                          STALE_MS
                                      )
                              )
                      ) {
                          hinge.clearExternal()
                      }

                      handler.postDelayed(
                          this,
                          1_000
                      )
                  }
              }"""

          replace_once(
              angle_path,
              old_status,
              new_status,
              "WallpaperAngleFeed status authority",
          )

          replace_once(
              angle_path,
              """        duplicateAngles = 0L

                  status = "Starting\"""".replace('\\"', '"'),
              """        duplicateAngles = 0L

                  lastWallpaperIdentity =
                      ""

                  lastFreshState =
                      null

                  status =
                      "Starting live Samsung hinge reader\"""".replace('\\"', '"'),
              "WallpaperAngleFeed diagnostics reset",
          )

          replace_once(
              angle_path,
              """        /** Whether Samsung's fold-reactive wallpaper is the current home wallpaper. */
                  fun foldWallpaperActive(context: Context): Boolean {
                      val info = runCatching { WallpaperManager.getInstance(context).wallpaperInfo }.getOrNull() ?: return false
                      return info.packageName == FOLD_WALLPAPER.packageName &&
                          (info.serviceName == FOLD_WALLPAPER.className || info.serviceName.contains("FoldInteractive"))
                  }
              }""",
              """        /**
                   * WallpaperManager metadata is diagnostic only.
                   *
                   * Samsung may report FoldInteractive on the inner display and a Video
                   * wallpaper on the cover display even during the same physical fold
                   * session, so this must never be used as the live-angle kill switch.
                   */
                  fun foldWallpaperActive(
                      context: Context,
                  ): Boolean {
                      val info =
                          runCatching {
                              WallpaperManager.getInstance(
                                  context
                              ).wallpaperInfo
                          }.getOrNull()
                              ?: return false

                      return (
                          info.packageName ==
                              FOLD_WALLPAPER.packageName &&
                              (
                                  info.serviceName ==
                                      FOLD_WALLPAPER.className ||
                                      info.serviceName.contains(
                                          "FoldInteractive"
                                      )
                                  )
                          )
                  }

                  fun wallpaperIdentity(
                      context: Context,
                  ): String {
                      val info =
                          runCatching {
                              WallpaperManager.getInstance(
                                  context
                              ).wallpaperInfo
                          }.getOrNull()
                              ?: return "none"

                      val service =
                          info.serviceName
                              .substringAfterLast(
                                  '.'
                              )
                              .ifEmpty {
                                  "unknown"
                              }

                      return (
                          "${info.packageName.substringAfterLast('.')}/" +
                              service
                          )
                  }
              }""",
              "WallpaperAngleFeed wallpaper metadata helper",
          )

          sheet_path = (
              "app/src/main/java/com/duoopen/ui/"
              "ControlSheet.kt"
          )

          replace_once(
              sheet_path,
              """    val sensorStatus by produceState(hinge.statusText(), hinge) {
                  while (true) {
                      delay(250)
                      value = hinge.statusText()
                  }
              }
              var showGuide by remember { mutableStateOf(false) }""",
              """    val sensorStatus by produceState(hinge.statusText(), hinge) {
                  while (true) {
                      delay(250)
                      value = hinge.statusText()
                  }
              }

              val liveAngleStatus by produceState(
                  angleFeedStatus(),
                  angleFeedStatus,
              ) {
                  while (true) {
                      delay(250)
                      value = angleFeedStatus()
                  }
              }

              val liveAngleHealthy =
                  liveAngleStatus.contains(
                      "source live"
                  )

              var showGuide by remember { mutableStateOf(false) }""",
              "ControlSheet live angle state",
          )

          old_ui = """                            Hint(
                                          if (foldWallpaperActive) "Samsung's Fold interactive wallpaper is set — the real angle is read from it. " + angleFeedStatus()
                                          else "Needs Samsung's built-in “Fold interactive” wallpaper as the home wallpaper (it's what receives the real angle). Set it, then come back.",
                                          warn = !foldWallpaperActive,
                                      )
                                  }
                                  Switch(checked = config.shizukuAngle, onCheckedChange = { v -> DuoSettings.update { it.copy(shizukuAngle = v) } })
                              }
                              if (!foldWallpaperActive) {
                                  TextButton(onClick = onOpenWallpaperSettings) { Text("Open wallpaper settings") }
                              }"""

          new_ui = """                            Hint(
                                          when {
                                              config.shizukuAngle &&
                                                  liveAngleHealthy -> {
                                                  "Continuous angle is live. " +
                                                      liveAngleStatus +
                                                      if (!foldWallpaperActive) {
                                                          " · Samsung reports the cover wallpaper separately; Duo Open keeps the reader active."
                                                      } else {
                                                          ""
                                                      }
                                              }

                                              config.shizukuAngle -> {
                                                  "Trying Samsung's continuous hinge source. " +
                                                      liveAngleStatus +
                                                      if (!foldWallpaperActive) {
                                                          " · Cover-screen wallpaper metadata is not used as a kill switch."
                                                      } else {
                                                          ""
                                                      }
                                              }

                                              foldWallpaperActive -> {
                                                  "Samsung Fold interactive is detected. Enable this to use the continuous angle source."
                                              }

                                              else -> {
                                                  "Enable this to try Samsung's continuous hinge source. The Fold7 may report the cover wallpaper as Video, so live callbacks are used as the authority."
                                              }
                                          },
                                          warn =
                                              config.shizukuAngle &&
                                                  !liveAngleHealthy &&
                                                  liveAngleStatus.contains(
                                                      "stale"
                                                  ),
                                      )
                                  }

                                  Switch(
                                      checked = config.shizukuAngle,
                                      onCheckedChange = { value ->
                                          DuoSettings.update {
                                              it.copy(
                                                  shizukuAngle = value
                                              )
                                          }
                                      },
                                  )
                              }

                              if (
                                  !foldWallpaperActive &&
                                  !liveAngleHealthy
                              ) {
                                  TextButton(
                                      onClick = onOpenWallpaperSettings
                                  ) {
                                      Text(
                                          "Open wallpaper settings"
                                      )
                                  }
                              }"""

          replace_once(
              sheet_path,
              old_ui,
              new_ui,
              "ControlSheet continuous angle UI",
          )

          gradle_path = Path("app/build.gradle.kts")
          gradle = gradle_path.read_text()

          if "versionCode = 9" not in gradle:
              raise SystemExit(
                  "Expected display-probe versionCode 9 was not found."
              )

          if 'versionName = "1.3.5-zfold7-display-probe"' not in gradle:
              raise SystemExit(
                  "Expected display-probe versionName was not found."
              )

          gradle = gradle.replace(
              "versionCode = 9",
              "versionCode = 10",
              1,
          )

          gradle = gradle.replace(
              'versionName = "1.3.5-zfold7-display-probe"',
              'versionName = "1.3.6-zfold7-angle-resilient"',
              1,
          )

          gradle_path.write_text(
              gradle
          )
          PY

      - name: Add controlled service-owned secondary-display experiment
        run: |
          python3 <<'PY'
          from pathlib import Path

          def load(path):
              return Path(path).read_text()

          def save(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new, label):
              text = load(path)
              if old not in text:
                  raise SystemExit(
                      f"{label}: expected source not found in {path}"
                  )
              save(
                  path,
                  text.replace(
                      old,
                      new,
                      1,
                  ),
              )

          def insert_before_once(path, marker, addition, label):
              text = load(path)
              if marker not in text:
                  raise SystemExit(
                      f"{label}: marker not found in {path}"
                  )
              save(
                  path,
                  text.replace(
                      marker,
                      addition + marker,
                      1,
                  ),
              )

          # ------------------------------------------------------------------
          # Shizuku protocol and shell service.
          # ------------------------------------------------------------------

          protocol_path = (
              "app/src/full/java/com/duoopen/shell/"
              "ShellProtocol.kt"
          )

          replace_once(
              protocol_path,
              """    const val DISPLAY_PROBE = 6
          """,
              """    const val DISPLAY_PROBE = 6

              /** One-shot Fold7 service-owned secondary-panel experiment. */
              const val ENABLE_SECONDARY_DISPLAY = 7
              const val RESET_SECONDARY_DISPLAY = 8
          """,
              "ShellProtocol display commands",
          )

          shell_path = (
              "app/src/full/java/com/duoopen/shell/"
              "DuoShellService.kt"
          )

          replace_once(
              shell_path,
              """            else -> return super.onTransact(code, data, reply, flags)""",
              """            ShellProtocol.ENABLE_SECONDARY_DISPLAY -> {
                          val identity = clearCallingIdentity()

                          val result = try {
                              secondaryDisplayCommand(
                                  enable = true
                              )
                          } catch (t: Throwable) {
                              Bundle().apply {
                                  putBoolean("ok", false)
                                  putString(
                                      "error",
                                      "${t.javaClass.simpleName}: ${t.message}",
                                  )
                              }
                          } finally {
                              restoreCallingIdentity(identity)
                          }

                          out.writeNoException()
                          out.writeBundle(result)
                      }

                      ShellProtocol.RESET_SECONDARY_DISPLAY -> {
                          val identity = clearCallingIdentity()

                          val result = try {
                              secondaryDisplayCommand(
                                  enable = false
                              )
                          } catch (t: Throwable) {
                              Bundle().apply {
                                  putBoolean("ok", false)
                                  putString(
                                      "error",
                                      "${t.javaClass.simpleName}: ${t.message}",
                                  )
                              }
                          } finally {
                              restoreCallingIdentity(identity)
                          }

                          out.writeNoException()
                          out.writeBundle(result)
                      }

                      else -> return super.onTransact(code, data, reply, flags)""",
              "DuoShellService display transactions",
          )

          insert_before_once(
              shell_path,
              """    // ---- capture -----------------------------------------------------------
          """,
              """    // ---- one-shot Fold7 secondary display experiment -----------------------

              private fun secondaryDisplayCommand(
                  enable: Boolean,
              ): Bundle {
                  val windowDisplays =
                      runProbe(
                          "dumpsys window displays | " +
                              "grep -E '^[[:space:]]*Display: mDisplayId=|^[[:space:]]*init='"
                      )

                  val foldDisplays =
                      Regex(
                          "Display: mDisplayId=(\\\\d+).*?init=(\\\\d+)x(\\\\d+)",
                          setOf(RegexOption.DOT_MATCHES_ALL),
                      ).findAll(
                          windowDisplays
                      ).mapNotNull { match ->
                          val id =
                              match.groupValues[1]
                                  .toIntOrNull()
                                  ?: return@mapNotNull null

                          val width =
                              match.groupValues[2]
                                  .toIntOrNull()
                                  ?: return@mapNotNull null

                          val height =
                              match.groupValues[3]
                                  .toIntOrNull()
                                  ?: return@mapNotNull null

                          Triple(id, width, height)
                      }.filter { (_, width, height) ->
                          (
                              width == 1080 &&
                                  height == 2520
                              ) ||
                              (
                                  width == 1968 &&
                                      height == 2184
                                  )
                      }.toList()

                  val target =
                      foldDisplays.firstOrNull { (id, _, _) ->
                          id != 0
                      }

                  if (target == null) {
                      return Bundle().apply {
                          putBoolean("ok", false)
                          putInt("targetDisplayId", -1)
                          putString(
                              "error",
                              "No non-zero Fold7 internal display was found.",
                          )
                          putString(
                              "windowDisplays",
                              windowDisplays,
                          )
                      }
                  }

                  val targetId =
                      target.first

                  val command =
                      if (enable) {
                          "cmd display enable-display $targetId"
                      } else {
                          /*
                           * Return control to Samsung instead of forcing the display off.
                           */
                          "cmd display power-reset $targetId"
                      }

                  val commandOutput =
                      runProbe(command)

                  Thread.sleep(600L)

                  val afterDisplays =
                      runProbe(
                          "cmd display get-displays"
                      )

                  val afterPhysical =
                      runProbe(
                          "dumpsys display | " +
                              "grep -E -i " +
                              "'DisplayDeviceInfo|mDisplayId=|mState=|" +
                              "mCommittedState=|mPhysicalDisplayId=|" +
                              "uniqueId=|state ON|state OFF' | " +
                              "head -n 220"
                      )

                  val visibleAfter =
                      afterDisplays.contains(
                          "Display id $targetId:"
                      )

                  val commandFailed =
                      commandOutput.contains(
                          "Exception",
                          ignoreCase = true,
                      ) ||
                          commandOutput.contains(
                              "error",
                              ignoreCase = true,
                          ) ||
                          commandOutput.contains(
                              "not possible",
                              ignoreCase = true,
                          )

                  return Bundle().apply {
                      putBoolean("ok", !commandFailed)
                      putBoolean("enable", enable)
                      putInt("targetDisplayId", targetId)
                      putInt("targetWidth", target.second)
                      putInt("targetHeight", target.third)
                      putBoolean("visibleAfter", visibleAfter)
                      putString("command", command)
                      putString("commandOutput", commandOutput)
                      putString("windowDisplays", windowDisplays)
                      putString("afterDisplays", afterDisplays)
                      putString("afterPhysical", afterPhysical)
                  }
              }

          """,
              "DuoShellService secondary display implementation",
          )

          # ------------------------------------------------------------------
          # App-side Shizuku bridge.
          # ------------------------------------------------------------------

          bridge_path = (
              "app/src/full/java/com/duoopen/shell/"
              "ShizukuBridge.kt"
          )

          bridge_anchor = """    fun displayProbe(): Bundle? =
                  call(
                      ShellProtocol.DISPLAY_PROBE
                  )
          """

          replace_once(
              bridge_path,
              bridge_anchor,
              bridge_anchor +
              """
              /** Blocking; call off the main thread. */
              fun enableSecondaryDisplay(): Bundle? =
                  call(
                      ShellProtocol.ENABLE_SECONDARY_DISPLAY
                  )

              /** Blocking; call off the main thread. */
              fun resetSecondaryDisplay(): Bundle? =
                  call(
                      ShellProtocol.RESET_SECONDARY_DISPLAY
                  )
          """,
              "ShizukuBridge secondary display commands",
          )

          # ------------------------------------------------------------------
          # Persistent accessibility service owns the experiment.
          # ------------------------------------------------------------------

          service_path = (
              "app/src/full/java/com/duoopen/overlay/"
              "FoldOverlayService.kt"
          )

          replace_once(
              service_path,
              """import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.MainScope
          import kotlinx.coroutines.cancel
          """,
              """import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.MainScope
          import kotlinx.coroutines.cancel
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          """,
              "FoldOverlayService state imports",
          )

          insert_before_once(
              service_path,
              """    private val displayListener =
          """,
              """    private val secondaryDisplaySafetyReset =
                  Runnable {
                      runSecondaryDisplayExperiment(
                          enable = false,
                          reason = "90-second safety reset",
                      )
                  }

          """,
              "FoldOverlayService safety reset",
          )

          insert_before_once(
              service_path,
              """        angleFeed?.stop()
          """,
              """        handler.removeCallbacks(
                      secondaryDisplaySafetyReset
                  )

          """,
              "FoldOverlayService cleanup",
          )

          insert_before_once(
              service_path,
              """    private fun updateRunning() {
          """,
              """    fun runSecondaryDisplayExperiment(
                  enable: Boolean,
                  reason: String = "user",
              ) {
                  if (!ShizukuBridge.ready) {
                      _secondaryDisplayStatus.value =
                          "Shizuku isn't ready."

                      DuoDiagnostics.event(
                          "dual-shell",
                          "refused enable=$enable reason=$reason; Shizuku not ready",
                      )
                      return
                  }

                  handler.removeCallbacks(
                      secondaryDisplaySafetyReset
                  )

                  _secondaryDisplayStatus.value =
                      if (enable) {
                          "Requesting the inactive Fold7 panel from the persistent service…"
                      } else {
                          "Returning the secondary panel to Samsung's normal power state…"
                      }

                  DuoDiagnostics.event(
                      "dual-shell",
                      "begin enable=$enable reason=$reason",
                  )

                  scope.launch(Dispatchers.IO) {
                      val result =
                          if (enable) {
                              ShizukuBridge.enableSecondaryDisplay()
                          } else {
                              ShizukuBridge.resetSecondaryDisplay()
                          }

                      if (result == null) {
                          _secondaryDisplayStatus.value =
                              "No response from the Shizuku display service."

                          DuoDiagnostics.event(
                              "dual-shell",
                              "no binder response enable=$enable reason=$reason",
                          )
                          return@launch
                      }

                      val ok =
                          result.getBoolean(
                              "ok",
                              false,
                          )

                      val target =
                          result.getInt(
                              "targetDisplayId",
                              -1,
                          )

                      val width =
                          result.getInt(
                              "targetWidth",
                              -1,
                          )

                      val height =
                          result.getInt(
                              "targetHeight",
                              -1,
                          )

                      val visibleAfter =
                          result.getBoolean(
                              "visibleAfter",
                              false,
                          )

                      val error =
                          result.getString("error")

                      val command =
                          result.getString("command")

                      val commandOutput =
                          result.getString(
                              "commandOutput"
                          ) ?: ""

                      _secondaryDisplayStatus.value =
                          when {
                              !ok ->
                                  "Shell command did not succeed" +
                                      (error?.let { ": $it" } ?: ".")

                              enable && visibleAfter ->
                                  "Success: Android exposes Fold7 display $target " +
                                      "($width×$height). Leave Duo Open and test it."

                              enable ->
                                  "The enable command returned without an error, but " +
                                      "display $target is not exposed as active yet."

                              else ->
                                  "Secondary panel power was returned to Samsung."
                          }

                      DuoDiagnostics.event(
                          "dual-shell",
                          "result enable=$enable ok=$ok target=$target " +
                              "size=${width}x$height visibleAfter=$visibleAfter " +
                              "command=$command error=$error output=" +
                              commandOutput
                                  .replace("\\r", "")
                                  .replace("\\n", "\\\\n"),
                      )

                      DuoDiagnostics.event(
                          "dual-shell",
                          "afterDisplays=" +
                              (
                                  result.getString(
                                      "afterDisplays"
                                  ) ?: "(missing)"
                              )
                                  .replace("\\r", "")
                                  .replace("\\n", "\\\\n"),
                      )

                      DuoDiagnostics.event(
                          "dual-shell",
                          "afterPhysical=" +
                              (
                                  result.getString(
                                      "afterPhysical"
                                  ) ?: "(missing)"
                              )
                                  .replace("\\r", "")
                                  .replace("\\n", "\\\\n"),
                      )

                      if (enable && ok) {
                          handler.postDelayed(
                              secondaryDisplaySafetyReset,
                              SECONDARY_DISPLAY_SAFETY_RESET_MS,
                          )
                      }

                      scheduleDisplayProbe(
                          if (enable) {
                              "service-dual-enable"
                          } else {
                              "service-dual-reset"
                          },
                          delayMs = 750L,
                      )
                  }
              }

          """,
              "FoldOverlayService service display method",
          )

          insert_before_once(
              service_path,
              """        /** How old a panel's last picture may be and still bridge the next fold. */
          """,
              """        private const val SECONDARY_DISPLAY_SAFETY_RESET_MS =
                      90_000L

                  private val _secondaryDisplayStatus =
                      MutableStateFlow(
                          "Service-owned secondary-panel test is idle."
                      )

                  val secondaryDisplayStatus:
                      StateFlow<String> =
                          _secondaryDisplayStatus.asStateFlow()

                  fun testSecondaryDisplay(
                      enable: Boolean,
                  ): Boolean {
                      val service =
                          instance
                              ?: run {
                                  _secondaryDisplayStatus.value =
                                      "The Duo Open accessibility service isn't connected."
                                  return false
                              }

                      service.runSecondaryDisplayExperiment(
                          enable = enable,
                      )
                      return true
                  }

          """,
              "FoldOverlayService companion display state",
          )

          # ------------------------------------------------------------------
          # Overlay feature facade.
          # ------------------------------------------------------------------

          feature_path = (
              "app/src/full/java/com/duoopen/overlay/"
              "OverlayFeature.kt"
          )

          replace_once(
              feature_path,
              """    /** Status of the continuous-angle reader, from the running service. */
              fun angleFeedStatus(): String = FoldOverlayService.instance?.angleFeedStatus() ?: "Service not running"
          }""",
              """    /** Status of the continuous-angle reader, from the running service. */
              fun angleFeedStatus(): String =
                  FoldOverlayService.instance?.angleFeedStatus()
                      ?: "Service not running"

              val secondaryDisplayStatus:
                  StateFlow<String> =
                      FoldOverlayService.secondaryDisplayStatus

              fun testSecondaryDisplay(
                  enable: Boolean,
              ): Boolean =
                  FoldOverlayService.testSecondaryDisplay(
                      enable
                  )
          }""",
              "OverlayFeature secondary display API",
          )

          # ------------------------------------------------------------------
          # Keep the old Activity WindowArea session out of this experiment.
          # ------------------------------------------------------------------

          main_path = (
              "app/src/main/java/com/duoopen/"
              "MainActivity.kt"
          )

          replace_once(
              main_path,
              """        dualScreen = DualScreen(this)
                  setContent {""",
              """        dualScreen = DualScreen(this)

                  /*
                   * Field build: keep Samsung's Activity-owned WindowArea path disabled
                   * so it cannot race the persistent Shizuku display experiment.
                   */
                  dualScreen.stop()

                  setContent {""",
              "MainActivity disable legacy dual session",
          )

          # ------------------------------------------------------------------
          # App/UI.
          # ------------------------------------------------------------------

          app_path = (
              "app/src/main/java/com/duoopen/ui/"
              "DuoApp.kt"
          )

          replace_once(
              app_path,
              """    val dualStatus by (dualScreen?.status ?: kotlinx.coroutines.flow.MutableStateFlow("")).collectAsStateWithLifecycle()
              val dualActive by (dualScreen?.active ?: kotlinx.coroutines.flow.MutableStateFlow(false)).collectAsStateWithLifecycle()

          """,
              """    val dualStatus by (dualScreen?.status ?: kotlinx.coroutines.flow.MutableStateFlow("")).collectAsStateWithLifecycle()
              val dualActive by (dualScreen?.active ?: kotlinx.coroutines.flow.MutableStateFlow(false)).collectAsStateWithLifecycle()
              val serviceDualStatus by OverlayFeature.secondaryDisplayStatus.collectAsStateWithLifecycle()

          """,
              "DuoApp secondary display status",
          )

          replace_once(
              app_path,
              """                dualStatus = dualStatus,
                          shizukuAvailable = OverlayFeature.SHIZUKU_AVAILABLE,""",
              """                dualStatus = dualStatus,
                          serviceDualStatus = serviceDualStatus,
                          shizukuAvailable = OverlayFeature.SHIZUKU_AVAILABLE,""",
              "DuoApp secondary status parameter",
          )

          replace_once(
              app_path,
              """                dualActive = dualActive,
                          onDualChange = { on -> if (on) dualScreen?.start() else dualScreen?.stop() },
                          onEnableOverlay = { openAccessibilitySettings(context) },""",
              """                dualActive = dualActive,
                          onDualChange = {
                              // Intentionally disabled in this field build.
                          },
                          onServiceDualEnable = {
                              dualScreen?.stop()

                              scope.launch {
                                  kotlinx.coroutines.delay(900L)

                                  if (
                                      !OverlayFeature.testSecondaryDisplay(
                                          true
                                      )
                                  ) {
                                      Toast.makeText(
                                          context,
                                          "The accessibility service isn't connected",
                                          Toast.LENGTH_SHORT,
                                      ).show()
                                  }
                              }
                          },
                          onServiceDualReset = {
                              OverlayFeature.testSecondaryDisplay(
                                  false
                              )
                          },
                          onEnableOverlay = { openAccessibilitySettings(context) },""",
              "DuoApp secondary display actions",
          )

          sheet_path = (
              "app/src/main/java/com/duoopen/ui/"
              "ControlSheet.kt"
          )

          replace_once(
              sheet_path,
              """    dualStatus: String,
              dualActive: Boolean,
              onDualChange: (Boolean) -> Unit,
              shizukuAvailable: Boolean,""",
              """    dualStatus: String,
              serviceDualStatus: String,
              dualActive: Boolean,
              onDualChange: (Boolean) -> Unit,
              onServiceDualEnable: () -> Unit,
              onServiceDualReset: () -> Unit,
              shizukuAvailable: Boolean,""",
              "ControlSheet secondary display parameters",
          )

          replace_once(
              sheet_path,
              """            Row(verticalAlignment = Alignment.CenterVertically) {
                          Hint(dualStatus, modifier = Modifier.weight(1f))
                          Switch(checked = dualActive, onCheckedChange = onDualChange, enabled = dualStatus.startsWith("Available") || dualActive)
                      }""",
              """            Row(
                          verticalAlignment =
                              Alignment.CenterVertically
                      ) {
                          Column(
                              Modifier.weight(1f)
                          ) {
                              Text(
                                  "Legacy Activity presentation",
                                  style =
                                      MaterialTheme.typography.titleSmall,
                              )
                              Hint(
                                  "Disabled for this field build. " +
                                      dualStatus,
                              )
                          }

                          Switch(
                              checked = false,
                              onCheckedChange = onDualChange,
                              enabled = false,
                          )
                      }

                      Spacer(
                          Modifier.height(12.dp)
                      )

                      Text(
                          "Persistent service / Shizuku test",
                          style =
                              MaterialTheme.typography.titleSmall,
                      )

                      Hint(
                          serviceDualStatus
                      )

                      Row(
                          horizontalArrangement =
                              Arrangement.spacedBy(12.dp)
                      ) {
                          TextButton(
                              onClick = onServiceDualEnable,
                              enabled =
                                  shizukuReady &&
                                      overlayEnabled,
                          ) {
                              Text("Enable inactive panel")
                          }

                          TextButton(
                              onClick = onServiceDualReset,
                              enabled =
                                  shizukuReady &&
                                      overlayEnabled,
                          ) {
                              Text("Reset panel power")
                          }
                      }

                      Hint(
                          "One-shot Fold7 test. There is no retry loop. " +
                              "The secondary panel is automatically power-reset " +
                              "after 90 seconds.",
                      )""",
              "ControlSheet secondary display UI",
          )

          # ------------------------------------------------------------------
          # Version.
          # ------------------------------------------------------------------

          gradle_path = Path(
              "app/build.gradle.kts"
          )

          gradle = gradle_path.read_text()

          if "versionCode = 10" not in gradle:
              raise SystemExit(
                  "Expected angle-resilient versionCode 10 was not found."
              )

          if (
              'versionName = "1.3.6-zfold7-angle-resilient"'
              not in gradle
          ):
              raise SystemExit(
                  "Expected angle-resilient versionName was not found."
              )

          gradle = gradle.replace(
              "versionCode = 10",
              "versionCode = 11",
              1,
          )

          gradle = gradle.replace(
              'versionName = "1.3.6-zfold7-angle-resilient"',
              'versionName = "1.3.7-zfold7-service-dual-probe"',
              1,
          )

          gradle_path.write_text(gradle)
          PY

      - name: Validate service-dual probe
        run: |
          git diff --check
          git diff --stat

          grep -R "source live" app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt
          grep -R "source live" app/src/main/java/com/duoopen/ui/ControlSheet.kt
          grep -R "ENABLE_SECONDARY_DISPLAY" app/src/full/java/com/duoopen/shell
          grep -R "Enable inactive panel" app/src/main/java/com/duoopen/ui/ControlSheet.kt
          grep -R "90-second safety reset" app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt

          mkdir -p zfold7-artifacts
          git diff > zfold7-artifacts/zfold7-service-dual-probe.patch

      - name: Compile, unit test, and build
        run: |
          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

      - name: Prepare APK
        run: |
          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "Debug APK not found."
            exit 1
          fi

          cp \
            "$APK" \
            zfold7-artifacts/DuoOpen-ZFold7-service-dual-probe-debug.apk

          {
            echo "commit=${GITHUB_SHA}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "pass=service-owned-dual-probe+angle-resilience+display-probe"
            echo

            sha256sum \
              zfold7-artifacts/DuoOpen-ZFold7-service-dual-probe-debug.apk

          } > zfold7-artifacts/BUILD-INFO.txt

          cat zfold7-artifacts/BUILD-INFO.txt

      - name: Upload field-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-service-dual-probe
          path: |
            zfold7-artifacts/DuoOpen-ZFold7-service-dual-probe-debug.apk
            zfold7-artifacts/zfold7-service-dual-probe.patch
            zfold7-artifacts/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30