name: Build Z Fold 7 Physical Cover Handoff 1.3.15

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Replay last successful Fold7 geometry build
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          previous_commit = "fc41750970a5270274ea1f9ce6502921d40c2581"

          previous_workflow = subprocess.check_output(
              [
                  "git",
                  "show",
                  f"{previous_commit}:.github/workflows/build-shizuku-apk.yml",
              ],
              text=True,
          )

          lines = previous_workflow.splitlines()

          wanted_steps = [
              "Replay proven 1.3.11 continuity build",
              "Replace mirror crop with owned pane container",
              "Validate pane-container pass",
              "Switch to AOSP setGeometry and restore bidirectional fold animation",
              "Validate 1.3.13 geometry continuity pass",
              "Graft zfoldduo glass and bidirectional motion behavior",
              "Validate revised 1.3.13 graft",
          ]

          def extract_run_block(step_name: str) -> str:
              step_start = None

              for index, line in enumerate(lines):
                  if line.strip() == f"- name: {step_name}":
                      step_start = index
                      break

              if step_start is None:
                  raise SystemExit(
                      f"Previous workflow step not found: {step_name}"
                  )

              run_line = None

              for index in range(step_start + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  if line.strip() == "run: |":
                      run_line = index
                      break

              if run_line is None:
                  raise SystemExit(
                      f"run: | block not found for: {step_name}"
                  )

              block = []

              for index in range(run_line + 1, len(lines)):
                  line = lines[index]

                  if line.startswith("      - name:"):
                      break

                  block.append(line)

              return textwrap.dedent(
                  "\n".join(block)
              )

          for step_name in wanted_steps:
              script = extract_run_block(
                  step_name
              )

              script_path = Path(
                  "/tmp/" +
                  re.sub(
                      r"[^A-Za-z0-9]+",
                      "-",
                      step_name,
                  ).strip("-") +
                  ".sh"
              )

              script_path.write_text(
                  "set -euo pipefail\n" +
                  script +
                  "\n"
              )

              print(
                  f"Replaying proven step: {step_name}"
              )

              subprocess.run(
                  [
                      "bash",
                      str(script_path),
                  ],
                  check=True,
              )
          PY

      - name: Fix Fold7 physical panel handoff
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          def load(path):
              return Path(path).read_text()

          def save(path, text):
              Path(path).write_text(text)

          def regex_replace_once(
              path,
              pattern,
              replacement,
              label,
          ):
              text = load(path)

              updated, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1,
                  flags=re.S,
              )

              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one match "
                      f"in {path}; got {count}"
                  )

              save(
                  path,
                  updated,
              )

          service_path = (
              "app/src/full/java/com/duoopen/overlay/"
              "FoldOverlayService.kt"
          )

          regex_replace_once(
              service_path,
              r'''    private fun syncMirrorHost\(
                  reason: String,
              \) \{
          .*?
              \}

              private fun safeToReleaseSecondaryPanel\(\): Boolean \{''',
              '''    private fun syncMirrorHost(
                  reason: String,
              ) {
                  if (!mirrorRequested) {
                      return
                  }

                  val displays =
                      displayManager.displays.toList()

                  fun isActive(
                      candidate: Display,
                  ): Boolean =
                      candidate.state != Display.STATE_OFF &&
                          candidate.state != Display.STATE_UNKNOWN

                  fun isInnerPanel(
                      candidate: Display,
                  ): Boolean {
                      val mode =
                          candidate.mode

                      return mode.physicalWidth == 1968 &&
                          mode.physicalHeight == 2184
                  }

                  fun isCoverPanel(
                      candidate: Display,
                  ): Boolean {
                      val mode =
                          candidate.mode

                      return mode.physicalWidth == 1080 &&
                          mode.physicalHeight == 2520
                  }

                  val inner =
                      displays.firstOrNull(
                          ::isInnerPanel
                      )

                  val cover =
                      displays.firstOrNull(
                          ::isCoverPanel
                      )

                  val activeInner =
                      inner?.takeIf(
                          ::isActive
                      )

                  val activeCover =
                      cover?.takeIf(
                          ::isActive
                      )

                  com.duoopen.debug.DuoDiagnostics.event(
                      "live-mirror",
                      "physical-resolve reason=$reason " +
                          "innerLogical=${inner?.displayId} " +
                          "innerMode=${inner?.mode?.physicalWidth}x" +
                          "${inner?.mode?.physicalHeight} " +
                          "innerState=${inner?.state} " +
                          "coverLogical=${cover?.displayId} " +
                          "coverMode=${cover?.mode?.physicalWidth}x" +
                          "${cover?.mode?.physicalHeight} " +
                          "coverState=${cover?.state} " +
                          "defaultLogical=${Display.DEFAULT_DISPLAY} " +
                          "hostLogical=${mirrorHost?.displayId} " +
                          "hostUsable=${mirrorHost?.isUsable == true}",
                  )

                  if (activeCover == null) {
                      _secondaryDisplayStatus.value =
                          "Physical cover is transitioning; " +
                              "retaining the continuity host."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "cover transition; host retained " +
                              "reason=$reason " +
                              "coverLogical=${cover?.displayId}",
                      )

                      return
                  }

                  if (activeInner == null) {
                      _secondaryDisplayStatus.value =
                          "Physical inner display is transitioning; " +
                              "retaining the continuity host."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "inner transition; host retained " +
                              "reason=$reason " +
                              "innerLogical=${inner?.displayId}",
                      )

                      return
                  }

                  if (
                      activeInner.displayId ==
                          activeCover.displayId
                  ) {
                      _secondaryDisplayStatus.value =
                          "Fold7 topology is remapping; " +
                              "waiting for distinct panel routes."

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "same-logical-id-after-physical-resolve " +
                              "reason=$reason " +
                              "logical=${activeCover.displayId}",
                      )

                      return
                  }

                  val current =
                      mirrorHost

                  if (
                      current == null ||
                      current.displayId != activeCover.displayId ||
                      !current.isUsable
                  ) {
                      current?.detach()

                      mirrorHost =
                          DisplayMirrorHost(
                              service = this,
                              display = activeCover,
                              scope = scope,
                              onStatus = { message ->
                                  _secondaryDisplayStatus.value =
                                      message
                              },
                          ).also {
                              it.attach()
                          }

                      com.duoopen.debug.DuoDiagnostics.event(
                          "live-mirror",
                          "physical cover host rebound " +
                              "reason=$reason " +
                              "innerLogical=${activeInner.displayId} " +
                              "coverLogical=${activeCover.displayId} " +
                              "coverIsDefault=" +
                              (
                                  activeCover.displayId ==
                                      Display.DEFAULT_DISPLAY
                              ),
                      )

                      return
                  }

                  current.refresh(
                      "physical-stable:$reason"
                  )
              }

              private fun safeToReleaseSecondaryPanel(): Boolean {''',
              "FoldOverlayService physical Fold7 handoff",
          )

          gradle_path = Path(
              "app/build.gradle.kts"
          )

          gradle = gradle_path.read_text()

          if "versionCode = 18" not in gradle:
              raise SystemExit(
                  "Expected geometry-glass versionCode 18 was not found."
              )

          if (
              'versionName = "1.3.13r-zfold7-geometry-glass"'
              not in gradle
          ):
              raise SystemExit(
                  "Expected geometry-glass versionName was not found."
              )

          gradle = gradle.replace(
              "versionCode = 18",
              "versionCode = 19",
              1,
          )

          gradle = gradle.replace(
              'versionName = "1.3.13r-zfold7-geometry-glass"',
              'versionName = "1.3.15-zfold7-physical-handoff"',
              1,
          )

          gradle_path.write_text(
              gradle
          )
          PY

      - name: Validate Fold7 physical handoff source
        run: |
          set -euo pipefail

          SERVICE="app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt"
          HOST="app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt"
          GRADLE="app/build.gradle.kts"

          git diff --check

          grep -F \
            'physical-resolve reason=' \
            "$SERVICE"

          grep -F \
            'physical cover host rebound' \
            "$SERVICE"

          grep -F \
            'coverIsDefault=' \
            "$SERVICE"

          grep -F \
            'mode.physicalWidth == INNER_WIDTH' \
            "$HOST"

          grep -F \
            'mode.physicalHeight == INNER_HEIGHT' \
            "$HOST"

          grep -F \
            '1.3.15-zfold7-physical-handoff' \
            "$GRADLE"

          if grep -F \
            'coverIsNativePrimary' \
            "$SERVICE"
          then
            echo \
              "ERROR: old logical-default-display teardown path remains."
            exit 1
          fi

          if grep -F \
            'Native cover is primary; temporary geometry mirror released.' \
            "$SERVICE"
          then
            echo \
              "ERROR: old native-cover mirror teardown remains."
            exit 1
          fi

          mkdir -p \
            zfold7-artifacts

          git diff > \
            zfold7-artifacts/zfold7-physical-handoff.patch

          git diff --stat

      - name: Compile, unit test, and build
        run: |
          set -euo pipefail

          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

      - name: Prepare field-test APK
        run: |
          set -euo pipefail

          mkdir -p \
            zfold7-artifacts

          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "Debug APK not found."
            exit 1
          fi

          OUTPUT_APK="zfold7-artifacts/DuoOpen-ZFold7-physical-handoff-1.3.15-debug.apk"

          cp \
            "$APK" \
            "$OUTPUT_APK"

          {
            echo "commit=${GITHUB_SHA}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "version=1.3.15-zfold7-physical-handoff"
            echo "versionCode=19"
            echo "target=Samsung Galaxy Z Fold7 SM-F966W"
            echo "android=16"
            echo "innerGeometry=1968x2184"
            echo "coverGeometry=1080x2520"
            echo "innerPhysicalId=local:4630946449689556883"
            echo "innerPort=147"
            echo "coverPhysicalId=local:4630946872173396372"
            echo "coverPort=148"
            echo "baseWorkflowCommit=fc41750970a5270274ea1f9ce6502921d40c2581"
            echo "pass=geometry-physical-routing+logical-id-remap+setGeometry+89.5deg-glass+bidirectional-motion"
            echo

            sha256sum \
              "$OUTPUT_APK"

          } > \
            zfold7-artifacts/BUILD-INFO-1.3.15.txt

          cat \
            zfold7-artifacts/BUILD-INFO-1.3.15.txt

      - name: Upload field-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-physical-handoff-1.3.15
          path: |
            zfold7-artifacts/DuoOpen-ZFold7-physical-handoff-1.3.15-debug.apk
            zfold7-artifacts/zfold7-pane-container.patch
            zfold7-artifacts/zfold7-geometry-continuity.patch
            zfold7-artifacts/zfold7-geometry-continuity-revised.patch
            zfold7-artifacts/zfold7-physical-handoff.patch
            zfold7-artifacts/BUILD-INFO-1.3.15.txt
          if-no-files-found: error
          retention-days: 30