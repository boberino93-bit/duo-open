      - name: Graft zfoldduo glass and bidirectional motion behavior
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"{label}: expected source not found in {path}")
