name: Build Gen7 Runtime Regression Beta2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-gen7-runtime-regression-beta2.yml"
      - "tools/apply_gen7_runtime_regression_beta2.py"
      - "service_packs/gen7_runtime_regression_beta2/**"

permissions:
  contents: read

concurrency:
  group: build-gen7-runtime-regression-beta2
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify expected production source baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 42' app/build.gradle.kts
          grep -F 'versionName = "5.0.0-beta1-zfold7"' app/build.gradle.kts
          grep -F 'const val INNER_WAKE_MIN_DEG = 3f' app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt
          grep -F 'const val COVER_PREWARM_DEG = 174f' app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt
          grep -F 'live recapture suppressed' app/src/full/java/com/duoopen/overlay/PanelEngine.kt
          grep -F 'BLIND_BOOTSTRAP' app/src/main/java/com/duoopen/fold/Fold7VirtualHingeGen5.kt

      - name: Reapply validated Shizuku/onboarding predecessor
        shell: bash
        run: |
          set -euo pipefail
          python3 service_packs/gen7_shizuku_onboarding_v1/apply_service_pack_v1.py .
          grep -F 'object Binding : State' app/src/full/java/com/duoopen/shell/ShizukuBridge.kt
          grep -F 'class BindFailed' app/src/full/java/com/duoopen/shell/ShizukuBridge.kt

      - name: Validate Beta2 patch applicability
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen7_runtime_regression_beta2.py --repo . --check
          python3 tools/apply_gen7_runtime_regression_beta2.py --self-test

      - name: Apply Beta2 runtime service pack in CI workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen7_runtime_regression_beta2.py --repo .
          git diff --check

          grep -F 'versionCode = 43' app/build.gradle.kts
          grep -F 'versionName = "5.1.0-beta2-zfold7"' app/build.gradle.kts
          grep -F 'device-state-opening-edge-recovered' app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt
          grep -F 'inner-wake-proof' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          grep -F 'shellLogicalPowered' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          grep -F 'innerLogicalPowered' app/src/full/java/com/duoopen/shell/DuoShellService.kt
          grep -F 'live recapture enabled on Fold7' app/src/full/java/com/duoopen/overlay/PanelEngine.kt
          grep -F 'gen3-live-content' app/src/full/java/com/duoopen/overlay/Fold7CoverVisualHost.kt
          grep -F 'AWAIT_PRECISE' app/src/main/java/com/duoopen/fold/Fold7VirtualHingeGen5.kt
          grep -F 'beforeOpeningState !=' app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt
          grep -F 'innerCaptureExclusions' app/src/full/java/com/duoopen/overlay/Fold7CoverVisualHost.kt
          grep -F 'COVER_PRESENTATION_V1' app/src/full/java/com/duoopen/shell/ShellProtocol.kt
          grep -F 'setDisplayBrightness' app/src/full/java/com/duoopen/shell/DuoShellService.kt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test and build full debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

      - name: Package test artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p beta2-build
          APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" beta2-build/DuoOpen-ZFold7-5.1.0-beta2-runtime-regression-debug.apk
          sha256sum beta2-build/DuoOpen-ZFold7-5.1.0-beta2-runtime-regression-debug.apk > beta2-build/APK-SHA256.txt
          git diff -- app > beta2-build/APPLIED-SOURCE.diff
          {
            echo "version=5.1.0-beta2-zfold7"
            echo "versionCode=43"
            echo "baseMain=${{ github.sha }}"
            echo "predecessor=Gen7 Shizuku/onboarding V1 reapplied in workspace"
            echo "fix1=device-state opening edge can recover stale closing visual states at confirmed closed endpoint"
            echo "fix2=inner wake retries physical NORMAL plus matching 1968x2184 logical route enable/STATE_ON until activity is observed or retry budget expires"
            echo "fix3=Gen5 no longer invents blind opening geometry before measured hinge data"
            echo "fix4=Fold7 snapshot surfaces resume live Shizuku recapture"
            echo "fix5=Gen3 closing cover re-captures live inner base content with Duo overlay exclusion and re-composes the physical right pane"
            echo "fix6=rotation-aware physical pane crops/fold axes for 0/90/180/270 degrees"
            echo "fix7=portrait/landscape snapshot caches are isolated by dimensions"
            echo "fix8=cover power/brightness policy: off near open, on at 175deg minimum, match inner by 90deg, off at 177deg opening"
            echo "tests=testFullDebugUnitTest"
            echo "build=assembleFullDebug"
            echo "physicalFold7Validation=NOT_RUN"
          } > beta2-build/BUILD-INFO.txt

      - name: Upload tested APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-5.1.0-beta2-runtime-regression
          path: |
            beta2-build/DuoOpen-ZFold7-5.1.0-beta2-runtime-regression-debug.apk
            beta2-build/APK-SHA256.txt
            beta2-build/BUILD-INFO.txt
            beta2-build/APPLIED-SOURCE.diff
          if-no-files-found: error
          retention-days: 30
