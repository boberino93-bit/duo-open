name: Runtime Optimization Cycle A

on:
  push:
    branches:
      - opt/runtime-cycle-a-20261003
    paths:
      - ".github/workflows/runtime-optimization-cycle-a.yml"
      - "tools/apply_runtime_optimization_cycle_a.py"
      - "service_packs/runtime_optimization_cycle_a_v1/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-optimization-cycle-a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct deployed Beta2 runtime
        run: |
          set -euo pipefail
          grep -F 'versionCode = 42' app/build.gradle.kts
          grep -F 'versionName = "5.0.0-beta1-zfold7"' app/build.gradle.kts
          python3 service_packs/gen7_shizuku_onboarding_v1/apply_service_pack_v1.py .
          python3 tools/apply_gen7_runtime_regression_beta2.py --repo . --check
          python3 tools/apply_gen7_runtime_regression_beta2.py --self-test
          python3 tools/apply_gen7_runtime_regression_beta2.py --repo .

      - name: Validate and apply Cycle A
        run: |
          set -euo pipefail
          python3 tools/apply_runtime_optimization_cycle_a.py --self-test
          python3 tools/apply_runtime_optimization_cycle_a.py --repo . --check
          python3 tools/apply_runtime_optimization_cycle_a.py --repo .
          git diff --check

      - name: Capture applied optimization diff
        run: |
          set -euo pipefail
          mkdir -p runtime-opt-a
          git diff -- app > runtime-opt-a/APPLIED-ANDROID-SOURCE.diff
          git diff --stat -- app > runtime-opt-a/APPLIED-ANDROID-SOURCE.stat
          sha256sum runtime-opt-a/APPLIED-ANDROID-SOURCE.diff > runtime-opt-a/APPLIED-ANDROID-SOURCE-SHA256.txt
          {
            echo "sourceHead=${GITHUB_SHA}"
            echo "cycle=runtime-optimization-cycle-a-v1"
            echo "behavioralFreeze=true"
            echo "innerWakeCorrectnessChanges=NONE"
            echo "physicalFold7Validation=NOT_RUN"
          } > runtime-opt-a/BUILD-INFO.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Full regression tests and APK build
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

      - name: Package APK and hashes
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" runtime-opt-a/DuoOpen-ZFold7-5.1.0-beta2-runtime-opt-cycle-a-debug.apk
          sha256sum runtime-opt-a/DuoOpen-ZFold7-5.1.0-beta2-runtime-opt-cycle-a-debug.apk > runtime-opt-a/APK-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-Runtime-Optimization-Cycle-A
          path: runtime-opt-a/
          if-no-files-found: error
          retention-days: 30
