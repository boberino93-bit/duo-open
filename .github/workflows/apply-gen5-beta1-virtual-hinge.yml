name: Apply Duo Open Gen5 Beta1 Virtual Hinge

on:
  push:
    branches:
      - main
    paths:
      - "APPLY_GEN5_BETA1_NOW.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duo-open-gen5-beta1-virtual-hinge
  cancel-in-progress: false

env:
  DUO_DIAGNOSTIC_UPLOAD_URL: ${{ vars.DUO_DIAGNOSTIC_UPLOAD_URL }}
  DUO_DIAGNOSTIC_INGEST_KEY: ${{ secrets.DUO_DIAGNOSTIC_INGEST_KEY }}

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact Gen4 Alpha1 runtime baseline
        shell: bash
        run: |
          set -euo pipefail

          GEN4="f9ba2ca7afa2e67586231770fd8b0abe56b94b5b"
          git merge-base --is-ancestor "$GEN4" HEAD

          check_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "ERROR: Gen5 baseline drift: $path"
              echo "expected=$expected"
              echo "actual=$actual"
              exit 1
            fi
          }

          check_blob app/build.gradle.kts d8f60f0d41eb2c16980511ed2c898b07b5b4e990
          check_blob app/src/full/java/com/duoopen/overlay/PanelEngine.kt b06f45a45eedc88b023754605492f928ebb66d11
          check_blob app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt 490309a46efdd2a42b28866f2c9f135fe2c89f17
          check_blob app/src/main/java/com/duoopen/ui/DuoApp.kt 4eb7e485414b2577a3fe9d737346d26ca22730fb
          check_blob app/src/main/java/com/duoopen/ui/HomePreview.kt 8b4c8675de7fb286beecf11b89a704f9b3956039
          check_blob app/src/main/java/com/duoopen/ui/ControlSheet.kt 6aa9a14ba641a33002ee0efff32d4ca239ff0133
          check_blob .github/workflows/build-shizuku-apk.yml 7924aa360c4d58d64a0274db674cb4db106f7375

          test ! -e app/src/main/java/com/duoopen/fold/Fold7VirtualHingeGen5.kt
          test ! -e app/src/main/java/com/duoopen/fold/Fold7VisualStateLut.kt
          test ! -e app/src/full/java/com/duoopen/overlay/Fold7RightPaneComposer.kt
          test ! -e app/src/test/java/com/duoopen/fold/Fold7VirtualHingeGen5Test.kt

          echo "GEN5 BETA1 BASELINE: PASS"

      - name: Verify Gen5 support-file checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c GEN5-SUPPORT-SHA256.txt

      - name: Validate patcher syntax
        run: python3 -m py_compile tools/apply_gen5_beta1.py

      - name: Apply Gen5 virtual-hinge opening architecture
        run: python3 tools/apply_gen5_beta1.py

      - name: Validate Gen5 invariants
        shell: bash
        run: |
          set -euo pipefail

          grep -F 'versionCode = 42' app/build.gradle.kts
          grep -F 'versionName = "5.0.0-beta1-zfold7"' app/build.gradle.kts

          grep -F 'class Fold7VirtualHingeGen5' app/src/main/java/com/duoopen/fold/Fold7VirtualHingeGen5.kt
          grep -F 'class Fold7VisualStateLut' app/src/main/java/com/duoopen/fold/Fold7VisualStateLut.kt
          grep -F 'BLIND_MAX_ANGLE_DEG = 92f' app/src/main/java/com/duoopen/fold/Fold7VirtualHingeGen5.kt
          grep -F 'MAX_VISUAL_SPEED_DPS = 480.0' app/src/main/java/com/duoopen/fold/Fold7VirtualHingeGen5.kt
          grep -F 'sin(PI * (angle / 180.0))' app/src/main/java/com/duoopen/fold/Fold7VisualStateLut.kt

          grep -F 'gen5VirtualHinge.startOpening' app/src/full/java/com/duoopen/overlay/PanelEngine.kt
          grep -F 'Choreographer.getInstance().postFrameCallback' app/src/full/java/com/duoopen/overlay/PanelEngine.kt
          grep -F 'GEN5_REQUESTED_HZ = 120f' app/src/full/java/com/duoopen/overlay/PanelEngine.kt
          grep -F 'CHANGE_FRAME_RATE_ONLY_IF_SEAMLESS' app/src/full/java/com/duoopen/overlay/PanelEngine.kt
          grep -F 'gen5-split-pane' app/src/full/java/com/duoopen/overlay/PanelEngine.kt
          grep -F 'gen5-virtual-hinge' app/src/full/java/com/duoopen/overlay/PanelEngine.kt
          grep -F 'Fold7RightPaneComposer.RIGHT_PANE_LEFT' app/src/full/java/com/duoopen/overlay/PanelEngine.kt

          grep -F 'Fold continuity for Galaxy Z Fold7' app/src/main/java/com/duoopen/ui/HomePreview.kt
          grep -F 'Text("Test fold")' app/src/main/java/com/duoopen/ui/HomePreview.kt
          grep -F 'Text("Settings")' app/src/main/java/com/duoopen/ui/HomePreview.kt
          grep -F 'Share diagnostic data' app/src/main/java/com/duoopen/ui/ControlSheet.kt
          grep -F 'opened the Android share sheet instead' app/src/main/java/com/duoopen/ui/DuoApp.kt

          # Closing authority and field-proven thresholds remain Gen4/Gen3-owned.
          grep -F 'internal class Fold7PanelAuthorityGen4' app/src/full/java/com/duoopen/shell/Fold7PanelAuthorityGen4.kt
          grep -F 'INNER_WAKE_MIN_DEG = 3f' app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt
          grep -F 'INNER_HANDOFF_MIN_DEG = 8f' app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt
          grep -F 'COVER_PREWARM_DEG = 174f' app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt
          grep -F 'COVER_VISUAL_START_DEG = 135f' app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt
          grep -F 'OPEN_LATCH_DEG = 172f' app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt
          grep -F 'OPEN_REARM_DEG = 166f' app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt

          # Old always-on replay gate must now be manual-only.
          grep -F 'workflow_dispatch:' .github/workflows/build-shizuku-apk.yml
          if grep -A5 '^on:' .github/workflows/build-shizuku-apk.yml | grep -q '^  push:'; then
            echo "ERROR: obsolete 1.3.16 workflow still runs on every main push"
            exit 1
          fi

          # Never introduce raw physical OFF or task migration.
          if git diff -U0 -- app | grep '^+' | grep -E 'moveTaskToDisplay|setDisplayPowerMode.*[, (]0[), ]'; then
            echo "ERROR: forbidden physical-off/task-migration behavior introduced"
            exit 1
          fi

          ALLOWED='^(app/build.gradle.kts|app/src/full/java/com/duoopen/overlay/PanelEngine.kt|app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt|app/src/full/java/com/duoopen/overlay/Fold7RightPaneComposer.kt|app/src/main/java/com/duoopen/fold/Fold7VirtualHingeGen5.kt|app/src/main/java/com/duoopen/fold/Fold7VisualStateLut.kt|app/src/main/java/com/duoopen/ui/DuoApp.kt|app/src/main/java/com/duoopen/ui/HomePreview.kt|app/src/main/java/com/duoopen/ui/ControlSheet.kt|app/src/test/java/com/duoopen/fold/Fold7VirtualHingeGen5Test.kt|\.github/workflows/build-shizuku-apk.yml)$'
          unexpected="$(git diff --name-only | grep -Ev "$ALLOWED" || true)"
          if [[ -n "$unexpected" ]]; then
            echo "ERROR: unexpected runtime files changed"
            echo "$unexpected"
            exit 1
          fi

          git diff --check
          git diff --stat

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run focused Gen5 and regression tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testFullDebugUnitTest --tests '*Fold7VirtualHingeGen5Test' --stacktrace
          ./gradlew testFullDebugUnitTest --tests '*Fold7PanelAuthorityGen4Test' --stacktrace
          ./gradlew testFullDebugUnitTest --tests '*Fold7ContinuityControllerTest' --stacktrace
          ./gradlew testFullDebugUnitTest --tests '*Fold7HingeIngressBatchTest' --stacktrace
          ./gradlew testFullDebugUnitTest --tests '*Fold7CoverVisualAttemptOwnerTest' --stacktrace

      - name: Run full Gen5 Beta1 gate
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

      - name: Commit and push validated Gen5 Beta1 runtime
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app .github/workflows/build-shizuku-apk.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"

          if git diff --cached --name-only | grep -qE '^(tools/|payload_gen5/|GEN5-|APPLY_GEN5_)'; then
            echo "ERROR: support files unexpectedly staged with runtime"
            exit 1
          fi

          git commit -m "Add Gen5 virtual-hinge opening pipeline"
          git push origin HEAD:main

      - name: Prepare Gen5 Beta1 APK
        shell: bash
        run: |
          set -euo pipefail

          OUT="fold7-gen5-beta1"
          mkdir -p "$OUT"

          APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"

          DEST="$OUT/DuoOpen-ZFold7-5.0.0-beta1-debug.apk"
          cp "$APK" "$DEST"
          sha256sum "$DEST" > "$OUT/APK-SHA256.txt"

          {
            echo "version=5.0.0-beta1-zfold7"
            echo "versionCode=42"
            echo "commit=$(git rev-parse HEAD)"
            echo "baseline=f9ba2ca7afa2e67586231770fd8b0abe56b94b5b"
            echo "target=Samsung Galaxy Z Fold7"
            echo "architecture=Gen4-panel-authority+Gen5-visual-only-virtual-hinge"
            echo "openingClock=vsync+blind-bootstrap+bounded-reacquisition"
            echo "glassEnvelope=0deg-clear+90deg-peak+180deg-clear"
            echo "splitPane=canonical-right-pane-bootstrap"
            echo "refreshRequest=120Hz-seamless-only"
            echo "closingPath=Gen4-preserved"
            echo "diagnosticFallback=share-when-upload-unconfigured"
            echo "diagnosticUploadConfigured=$([[ -n "${DUO_DIAGNOSTIC_UPLOAD_URL:-}" ]] && echo true || echo false)"
            echo
            sha256sum "$DEST"
          } > "$OUT/BUILD-INFO.txt"

          cat "$OUT/BUILD-INFO.txt"

      - name: Upload Gen5 Beta1 APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-5.0.0-beta1
          path: fold7-gen5-beta1/
          if-no-files-found: error
          retention-days: 30
