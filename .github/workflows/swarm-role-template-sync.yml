name: Swarm role-template sync

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Regenerate role prompts
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            python .swarm/generate_role_templates.py --base "origin/${{ github.base_ref }}"
          else
            python .swarm/generate_role_templates.py --base HEAD^
          fi

      - name: Validate deterministic generation on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # Generated prompts intentionally contain the exact checked-out revision
          # and current change context. A PR therefore cannot be required to have
          # the previous main snapshot already equal the synthetic PR merge output.
          # Regenerate once above, then require a second check to be a no-op.
          python .swarm/generate_role_templates.py --base "origin/${{ github.base_ref }}" --check
          git diff --check -- .swarm/generated
          echo "Generated role prompts are deterministic for this PR revision."
          echo "The main-push path remains responsible for committing refreshed generated artifacts after merge."

      - name: Commit regenerated prompts on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- .swarm/generated)" ]]; then
            echo "Role prompts already synchronized."
            exit 0
          fi
          git config user.name "duo-open-role-sync[bot]"
          git config user.email "duo-open-role-sync[bot]@users.noreply.github.com"
          git add .swarm/generated
          git commit -m "chore(swarm): regenerate role prompts [skip ci]"
          git push
