name: Apply Fold7 Gen2 Ownership Batch D Fix 4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-gen2-ownership-batch-d-fix4.yml"
      - "tools/apply_gen2_ownership_batch_d_fix3.py"
      - "GEN2_IMPORT_SUPPORT/APPLY_GEN2_OWNERSHIP_BATCH_D_FIX4_NOW.txt"

permissions:
  contents: write

concurrency:
  group: apply-fold7-gen2-ownership-batch-d-fix4
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify safe pre-integration state
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'fun startAnglesSequenced(' app/src/full/java/com/duoopen/shell/ShizukuBridge.kt
          grep -F 'p.writeLong(parsedLine.pollSequence)' app/src/full/java/com/duoopen/shell/DuoShellService.kt
          grep -F 'versionCode = 30' app/build.gradle.kts
          test -f tools/apply_gen2_ownership_batch_d.py
          test -f tools/apply_gen2_ownership_batch_d_fix3.py
          ! grep -Fq 'MIRROR_DISPLAY_V2' app/src/full/java/com/duoopen/shell/ShellProtocol.kt
          ! grep -Fq 'Fold7CoverPanelLease' app/src/full/java/com/duoopen/shell/DuoShellService.kt

      - name: Apply proven Fix 3 source integration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen2_ownership_batch_d_fix3.py

          # The original Batch D transform also modernizes the direct-build
          # workflow. The source change is valid, but the Actions GITHUB_TOKEN
          # cannot push workflow-file modifications without workflows permission.
          # Restore this one file so the tested production commit is pushable.
          git checkout -- .github/workflows/build-direct-fold7.yml

      - name: Validate single-authority ownership architecture
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          PROTOCOL=app/src/full/java/com/duoopen/shell/ShellProtocol.kt
          SHELL=app/src/full/java/com/duoopen/shell/DuoShellService.kt
          HOST=app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt
          COORDINATOR=app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          SERVICE=app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt
          GRADLE=app/build.gradle.kts

          grep -F 'MIRROR_DISPLAY_V2 = 14' "$PROTOCOL"
          grep -F 'COVER_PANEL_LEASE_V2 = 15' "$PROTOCOL"
          grep -F 'candidate-failed-preserved-current' "$SHELL"
          grep -F 'legacy mirror mutation rejected while V2 session is active' "$SHELL"
          grep -F 'stopDisplayMirrorV2(' "$HOST"
          grep -F 'mirrorLeaseCounter.incrementAndGet()' "$COORDINATOR"
          grep -F 'prewarmSecondaryDisplayV2' "$COORDINATOR"
          grep -F 'releaseSecondaryDisplayV2' "$COORDINATOR"
          grep -F 'requestDisplayPowerInternal' "$SHELL"

          grep -F 'continuity.onHinge(angle)' "$SERVICE"
          grep -F 'continuity.onTopologyChanged' "$SERVICE"
          grep -F 'continuity.destroy()' "$SERVICE"
          grep -F 'continuity.onPrivilegedReady()' "$SERVICE"
          grep -F 'continuity.onPrivilegedUnavailable()' "$SERVICE"

          ! grep -Fq 'DisplayMirrorHost(' "$SERVICE"
          ! grep -Fq 'ShizukuBridge.stopDisplayMirror()' "$SERVICE"
          ! grep -Fq 'runSecondaryDisplayExperiment(' "$SERVICE"
          ! grep -Fq 'private fun syncMirrorHost(' "$SERVICE"
          ! grep -Fq 'mirrorRequested' "$SERVICE"
          ! grep -Fq 'coverPowerHold' "$SERVICE"

          grep -F 'versionCode = 31' "$GRADLE"
          grep -F 'versionName = "1.3.26-zfold7-gen2-ownership"' "$GRADLE"
          ! grep -Fq 'setDisplayPowerMode.*OFF' "$SHELL"

          # Bot push must contain no workflow-file mutation.
          git diff --quiet -- .github/workflows/build-direct-fold7.yml

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build and test ownership integration
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

      - name: Prepare tested APK before push
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ownership-build
          APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" ownership-build/DuoOpen-ZFold7-1.3.26-gen2-ownership-debug.apk
          sha256sum ownership-build/DuoOpen-ZFold7-1.3.26-gen2-ownership-debug.apk > ownership-build/APK-SHA256.txt
          {
            echo "version=1.3.26-zfold7-gen2-ownership"
            echo "versionCode=31"
            echo "baseHead=$(git rev-parse HEAD)"
            echo "sourceTransform=Batch-D-Fix-3-green"
            echo "mirrorOwnership=coordinator-only+session+sequence+lease"
            echo "coverOwnership=coordinator-only+shell-lease+pending-release+direct-reset-with-fallback"
            echo "tests=testFullDebugUnitTest"
            echo "build=assembleFullDebug"
          } > ownership-build/BUILD-INFO.txt

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-1.3.26-gen2-ownership-fix4
          path: |
            ownership-build/DuoOpen-ZFold7-1.3.26-gen2-ownership-debug.apk
            ownership-build/APK-SHA256.txt
            ownership-build/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Commit and push tested production sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/build.gradle.kts \
            app/src/full/java/com/duoopen/shell/ShellProtocol.kt \
            app/src/full/java/com/duoopen/shell/ShizukuBridge.kt \
            app/src/full/java/com/duoopen/shell/DuoShellService.kt \
            app/src/full/java/com/duoopen/shell/Fold7MirrorLeaseArbiter.kt \
            app/src/full/java/com/duoopen/shell/Fold7CoverPanelLease.kt \
            app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt \
            app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt \
            app/src/test/java/com/duoopen/shell/Fold7MirrorLeaseArbiterTest.kt \
            app/src/test/java/com/duoopen/shell/Fold7CoverPanelLeaseTest.kt

          # Safety: never let this bot commit a workflow file.
          if ! git diff --cached --name-only | grep -q .; then
            echo 'ERROR: no generated production changes staged.'
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'ERROR: workflow file unexpectedly staged.'
            exit 1
          fi

          git diff --cached --check
          git commit -m "Fold7 1.3.26 Gen2: single-owner mirror and cover leases"
          git push origin HEAD:main
