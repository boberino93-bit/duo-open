name: Build Gen7 Service Pack - Shizuku Onboarding

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-gen7-service-pack.yml"
      - "app/**"
      - "service_packs/gen7_shizuku_onboarding_v1/**"
      - "APPLY_AFTER_COPY.py"
      - "APPLY_AFTER_COPY.sh"
      - "APPLY_AFTER_COPY.ps1"

permissions:
  contents: read

concurrency:
  group: gen7-service-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate service-pack applicability
        shell: bash
        run: |
          set -euo pipefail
          python3 APPLY_AFTER_COPY.py --check

      - name: Apply service pack in CI workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 APPLY_AFTER_COPY.py
          git diff --check
          git status --short
          git diff --stat

      - name: Run tests and build full debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

      - name: Package deployable APK and evidence
        shell: bash
        run: |
          set -euo pipefail
          out="gen7-service-pack-artifact"
          mkdir -p "$out"
          find app/build/outputs/apk/full/debug -maxdepth 1 -type f -name "*.apk" -print -exec cp {} "$out"/ \;
          test -n "$(find "$out" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          (
            cd "$out"
            sha256sum *.apk > SHA256SUMS.txt
          )
          {
            echo "source_head=${GITHUB_SHA}"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "workflow_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "service_pack=gen7_shizuku_onboarding_v1"
            grep -F 'versionCode =' app/build.gradle.kts
            grep -F 'versionName =' app/build.gradle.kts
          } > "$out/BUILD-INFO.txt"
          git diff -- \
            app/src/full/java/com/duoopen/shell/ShizukuBridge.kt \
            app/src/main/java/com/duoopen/ui/ControlSheet.kt \
            app/src/main/java/com/duoopen/ui/HomePreview.kt \
            app/src/main/java/com/duoopen/ui/DuoApp.kt \
            > "$out/APPLIED-SERVICE-PACK.diff"

      - name: Upload deployable service-pack APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-Gen7-ServicePack-Shizuku-Onboarding
          path: gen7-service-pack-artifact/
          if-no-files-found: error
          retention-days: 14
