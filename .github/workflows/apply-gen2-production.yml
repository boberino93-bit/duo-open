name: Apply Duo Open Gen2 Production Integration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-gen2-production.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duo-open-gen2-production-apply
  cancel-in-progress: false

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Execute staged Gen2 integration and mandatory gates
        shell: bash
        run: |
          set -euo pipefail
          python3 deploy_staged_gen2_v2.py .

      - name: Review generated production diff
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          git diff --stat
          test -n "$(git status --porcelain app .github/workflows/build-direct-fold7.yml)"

      - name: Commit verified Gen2 production runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/workflows/build-direct-fold7.yml
          git diff --cached --check
          git commit -m "Integrate Fold7 Gen2 production runtime"
          git push origin HEAD:main
