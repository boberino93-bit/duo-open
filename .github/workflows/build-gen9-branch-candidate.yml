name: Build Isolated Gen9 Responsiveness Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-gen9-branch-candidate.yml"

permissions:
  contents: read

concurrency:
  group: build-gen9-responsive-candidate
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout isolated Gen9 candidate branch
        uses: actions/checkout@v4
        with:
          ref: gen9-predictive-inner-wake
          fetch-depth: 0

      - name: Verify baseline and candidate tools
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 42' app/build.gradle.kts
          grep -F 'versionName = "5.0.0-beta1-zfold7"' app/build.gradle.kts
          test -f tools/apply_gen8_anchored_transition.py
          test -f tools/apply_gen9_predictive_inner_wake.py
          grep -F 'GEN7_RUNTIME_REGRESSION_BETA2' tools/apply_gen7_runtime_regression_beta2.py

      - name: Reapply validated Shizuku onboarding predecessor
        shell: bash
        run: |
          set -euo pipefail
          python3 service_packs/gen7_shizuku_onboarding_v1/apply_service_pack_v1.py .
          grep -F 'object Binding : State' app/src/full/java/com/duoopen/shell/ShizukuBridge.kt

      - name: Reapply validated Gen7 Beta2 runtime service pack
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen7_runtime_regression_beta2.py --repo .
          grep -F 'versionCode = 43' app/build.gradle.kts
          grep -F 'inner-wake-proof' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          grep -F 'innerLogicalPowered' app/src/full/java/com/duoopen/shell/DuoShellService.kt
          grep -F 'AWAIT_PRECISE' app/src/main/java/com/duoopen/fold/Fold7VirtualHingeGen5.kt

      - name: Reapply validated Gen8 anchored transition
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen8_anchored_transition.py --repo .
          grep -F 'versionCode = 44' app/build.gradle.kts
          grep -F 'private val anchorRotation = display.rotation' app/src/full/java/com/duoopen/overlay/Fold7CoverVisualHost.kt
          grep -F 'liveFrameEpoch.owns(loopEpoch)' app/src/full/java/com/duoopen/overlay/Fold7CoverVisualHost.kt

      - name: Apply Gen9 responsiveness overhaul
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen9_predictive_inner_wake.py --repo .
          git diff --check
          grep -F 'versionCode = 45' app/build.gradle.kts
          grep -F 'versionName = "5.3.0-gen9-responsive-zfold7"' app/build.gradle.kts
          grep -F 'onPreOpeningHint' app/src/full/java/com/duoopen/overlay/Fold7DeviceStateObserver.kt
          grep -F '"inner-prewake"' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          grep -F 'INNER_PREWAKE_V1 = 20' app/src/full/java/com/duoopen/shell/ShellProtocol.kt
          grep -F 'prewakeInnerPhysicalDisplay' app/src/full/java/com/duoopen/shell/DuoShellService.kt
          grep -F 'MAX_VISUAL_SPEED_DPS = 720.0' app/src/main/java/com/duoopen/fold/Fold7VirtualHingeGen5.kt
          grep -F 'SAMSUNG_LIVE_TAU_S = 0.020f' app/src/full/java/com/duoopen/overlay/PanelEngine.kt
          grep -F '0.050f' app/src/full/java/com/duoopen/overlay/Fold7CoverVisualHost.kt
          grep -F 'liveFrameEpoch.owns(loopEpoch)' app/src/full/java/com/duoopen/overlay/Fold7CoverVisualHost.kt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test and build full debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

      - name: Package failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -u
          mkdir -p gen9-failure
          if [ -d app/build/reports/tests/testFullDebugUnitTest ]; then
            cp -R app/build/reports/tests/testFullDebugUnitTest gen9-failure/test-report
          fi
          if [ -d app/build/test-results/testFullDebugUnitTest ]; then
            cp -R app/build/test-results/testFullDebugUnitTest gen9-failure/test-results
          fi
          git diff -- app > gen9-failure/APPLIED-SOURCE.diff || true
          {
            echo "candidateBranch=gen9-predictive-inner-wake"
            echo "candidateHead=$(git rev-parse HEAD)"
            echo "status=CI_FAILED_BEFORE_TESTED_ARTIFACT"
            echo "physicalFold7Validation=NOT_RUN"
          } > gen9-failure/FAILURE-INFO.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-5.3.0-gen9-responsive-failure-diagnostics
          path: gen9-failure/
          if-no-files-found: warn
          retention-days: 14

      - name: Package tested Gen9 artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gen9-build
          APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          OUTPUT="gen9-build/DuoOpen-ZFold7-5.3.0-gen9-responsive-debug.apk"
          cp "$APK" "$OUTPUT"
          sha256sum "$OUTPUT" > gen9-build/APK-SHA256.txt
          git diff -- app > gen9-build/APPLIED-SOURCE.diff
          {
            echo "version=5.3.0-gen9-responsive-zfold7"
            echo "versionCode=45"
            echo "candidateBranch=gen9-predictive-inner-wake"
            echo "candidateHead=$(git rev-parse HEAD)"
            echo "baseLineage=Gen7 Shizuku onboarding -> Gen7 Beta2 -> Gen8 anchored transition -> Gen9"
            echo "change1=physical-only predictive inner prewake on folded-to-folded Samsung device-state transition"
            echo "change2=full inner wake remains authoritative for logical routing and visible handoff"
            echo "change3=inner wake retry cadence 55ms -> 40ms"
            echo "change4=Gen5 visual slew 480 -> 720 deg/s; minimum frame slew 1.0 -> 1.5 deg"
            echo "change5=Samsung live follower tau 28ms -> 20ms"
            echo "change6=cover opening tau 90ms -> 50ms; closing tau 28ms -> 22ms"
            echo "change7=fade-in 140ms -> 90ms; flat fade-out 120ms -> 80ms; settle 700ms -> 550ms"
            echo "gen8OwnershipInvariant=PRESERVED"
            echo "physicalFold7Validation=NOT_RUN"
            echo "tests=testFullDebugUnitTest"
            echo "build=assembleFullDebug"
          } > gen9-build/BUILD-INFO.txt

      - name: Upload tested APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-5.3.0-gen9-responsive
          path: |
            gen9-build/DuoOpen-ZFold7-5.3.0-gen9-responsive-debug.apk
            gen9-build/APK-SHA256.txt
            gen9-build/BUILD-INFO.txt
            gen9-build/APPLIED-SOURCE.diff
          if-no-files-found: error
          retention-days: 30
