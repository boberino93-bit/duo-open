name: Apply Fold7 1.3.27 Cover Route Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-fold7-1.3.27-cover-route-fix.yml"
      - "tools/apply_fold7_1_3_27_cover_route_fix.py"
      - "GEN2_IMPORT_SUPPORT/APPLY_FOLD7_1_3_27_COVER_ROUTE_FIX_NOW.txt"

permissions:
  contents: write

concurrency:
  group: apply-fold7-1-3-27-cover-route-fix
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Gen2 ownership production base
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 31' app/build.gradle.kts
          grep -F 'versionName = "1.3.26-zfold7-gen2-ownership"' app/build.gradle.kts
          grep -F 'MIRROR_DISPLAY_V2 = 14' app/src/full/java/com/duoopen/shell/ShellProtocol.kt
          grep -F 'COVER_PANEL_LEASE_V2 = 15' app/src/full/java/com/duoopen/shell/ShellProtocol.kt
          grep -F 'private fun prewarmCoverLeaseV2(' app/src/full/java/com/duoopen/shell/DuoShellService.kt
          grep -F 'mirrorLeaseCounter.incrementAndGet()' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          ! grep -Fq 'activateOwnedCoverRouteAfterPhysicalWake(' app/src/full/java/com/duoopen/shell/DuoShellService.kt

      - name: Apply cover-route regression fix
        run: python3 tools/apply_fold7_1_3_27_cover_route_fix.py

      - name: Validate cover prewarm path
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          SHELL=app/src/full/java/com/duoopen/shell/DuoShellService.kt
          GRADLE=app/build.gradle.kts

          grep -F 'activateOwnedCoverRouteAfterPhysicalWake(' "$SHELL"
          grep -F 'enableConnectedDisplayInternal(logicalId)' "$SHELL"
          grep -F 'Display.STATE_ON' "$SHELL"
          grep -F 'candidate.second == ownedPhysicalId' "$SHELL"
          grep -F 'after.second == ownedPhysicalId' "$SHELL"
          grep -F 'lease-owned physical+logical Fold7 cover prewarm' "$SHELL"

          grep -F 'versionCode = 32' "$GRADLE"
          grep -F 'versionName = "1.3.27-zfold7-cover-route-fix"' "$GRADLE"

          # Preserve physical-panel safety.
          ! grep -E 'setDisplayPowerMode.*(0|OFF)' "$SHELL"

          # Preserve Batch B identity and Batch D mirror ownership.
          grep -F 'p.writeLong(parsedLine.pollSequence)' "$SHELL"
          grep -F 'candidate-failed-preserved-current' "$SHELL"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build and test 1.3.27
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

      - name: Prepare tested APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cover-route-build
          APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" cover-route-build/DuoOpen-ZFold7-1.3.27-cover-route-fix-debug.apk
          sha256sum cover-route-build/DuoOpen-ZFold7-1.3.27-cover-route-fix-debug.apk > cover-route-build/APK-SHA256.txt
          {
            echo "version=1.3.27-zfold7-cover-route-fix"
            echo "versionCode=32"
            echo "baseHead=$(git rev-parse HEAD)"
            echo "fix=lease-owned physical wake plus freshly validated logical cover enable and STATE_ON"
            echo "tests=testFullDebugUnitTest"
            echo "build=assembleFullDebug"
          } > cover-route-build/BUILD-INFO.txt

      - name: Upload tested APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-1.3.27-cover-route-fix
          path: |
            cover-route-build/DuoOpen-ZFold7-1.3.27-cover-route-fix-debug.apk
            cover-route-build/APK-SHA256.txt
            cover-route-build/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Commit and push tested production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/build.gradle.kts \
            app/src/full/java/com/duoopen/shell/DuoShellService.kt

          if ! git diff --cached --name-only | grep -q .; then
            echo 'ERROR: no production changes staged.'
            exit 1
          fi

          git diff --cached --check
          git commit -m "Fold7 1.3.27: restore lease-owned cover route wake"
          git push origin HEAD:main
