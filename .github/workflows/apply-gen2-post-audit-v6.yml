name: Apply Gen2 Post-Audit Corrections V6

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-gen2-post-audit-v6.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duo-open-gen2-post-audit-v6
  cancel-in-progress: false

jobs:
  correct-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact audited Gen2 source
        shell: bash
        run: |
          set -euo pipefail

          BASE="4aa953925bf3aa2ac3f09d9c80b6653c6dfb058a"
          git merge-base --is-ancestor "$BASE" HEAD

          check_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "ERROR: audited blob drift: $path"
              echo "expected=$expected"
              echo "actual=$actual"
              exit 1
            fi
          }

          check_blob app/build.gradle.kts 0721ab26f46662c4d95acf37c42a7829e6b68c36
          check_blob app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt ba43dbd03bce1c7b754438087e4d69462d3878d8
          check_blob app/src/full/java/com/duoopen/overlay/Fold7ContinuityFrameStore.kt f531c239d02858d6e230d774012d10eff99fd3bf
          check_blob app/src/full/java/com/duoopen/shell/DuoShellService.kt 136b75803f950012c71624c7e38f6441798719e3
          check_blob app/src/test/java/com/duoopen/overlay/Fold7Gen2OwnershipTest.kt 4e74dddff8dafd22f7a2e6f056472bd559c32e2b

          echo "AUDITED GEN2 SOURCE: PASS"

      - name: Apply post-audit source corrections
        run: python3 tools/post_audit_v6.py

      - name: Validate corrected source shape
        shell: bash
        run: |
          set -euo pipefail

          grep -F 'versionCode = 36' app/build.gradle.kts
          grep -F 'versionName = "2.0.1-zfold7-gen2-audit1"' app/build.gradle.kts

          HOST="app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt"
          grep -F 'RIGHT half' "$HOST"
          grep -F 'canonical right-pane crop' "$HOST"
          grep -F 'FROZEN RIGHT PANE' "$HOST"
          grep -F 'RIGHT PANE GEOMETRY LIVE' "$HOST"
          test "$(grep -c 'val paneLeft =' "$HOST")" -eq 2

          STORE="app/src/full/java/com/duoopen/overlay/Fold7ContinuityFrameStore.kt"
          grep -F 'A newer capture attempt supersedes the previous frame immediately.' "$STORE"

          SHELL="app/src/full/java/com/duoopen/shell/DuoShellService.kt"
          if grep -Fq 'stampCoverLeaseV3(failureBundle("cover-lease-v3", t))' "$SHELL"; then
            echo "ERROR: V3 failure still stamps authority outside the serialized executor"
            exit 1
          fi

          TEST="app/src/test/java/com/duoopen/overlay/Fold7Gen2OwnershipTest.kt"
          grep -F 'frameStore_newCaptureRevokesOlderSameCycleFrame' "$TEST"

          git diff --check
          git diff --stat

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run full Gen2 gates
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

      - name: Commit and push audited runtime
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"

          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "ERROR: workflow file unexpectedly staged"
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^tools/'; then
            echo "ERROR: tooling unexpectedly staged"
            exit 1
          fi

          git commit -m "Correct Fold7 Gen2 post-audit runtime"
          git push origin HEAD:main

      - name: Prepare Fold7 field-test APK
        shell: bash
        run: |
          set -euo pipefail

          OUT="fold7-gen2-audit1"
          mkdir -p "$OUT"

          APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"

          DEST="$OUT/DuoOpen-ZFold7-2.0.1-gen2-audit1-debug.apk"
          cp "$APK" "$DEST"

          sha256sum "$DEST" > "$OUT/APK-SHA256.txt"

          {
            echo "version=2.0.1-zfold7-gen2-audit1"
            echo "versionCode=36"
            echo "commit=$(git rev-parse HEAD)"
            echo "target=Samsung Galaxy Z Fold7"
            echo "innerGeometry=1968x2184"
            echo "coverGeometry=1080x2520"
            echo "portal=right-inner-pane"
            echo "frozenSameCycleReplay=revoked-on-new-capture"
            echo "v3RevisionAuthority=serialized-mutation-only"
            echo
            sha256sum "$DEST"
          } > "$OUT/BUILD-INFO.txt"

          cat "$OUT/BUILD-INFO.txt"

      - name: Upload Fold7 field-test APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-2.0.1-gen2-audit1
          path: |
            fold7-gen2-audit1/DuoOpen-ZFold7-2.0.1-gen2-audit1-debug.apk
            fold7-gen2-audit1/APK-SHA256.txt
            fold7-gen2-audit1/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
