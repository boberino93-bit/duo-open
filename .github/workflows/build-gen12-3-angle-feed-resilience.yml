name: Build Gen12.3 Angle Feed Resilience

on:
  workflow_dispatch:
  push:
    branches:
      - build/gen12-3-angle-feed-resilience-20261008
    paths:
      - ".github/workflows/build-gen12-3-angle-feed-resilience.yml"
      - "tools/apply_gen12_3_angle_feed_resilience.py"
      - "tools/gen12_3_angle_feed_forensics.md"

permissions:
  contents: read

concurrency:
  group: build-gen12-3-angle-feed-resilience
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gen12.3 candidate
        uses: actions/checkout@v4
        with:
          ref: build/gen12-3-angle-feed-resilience-20261008
          fetch-depth: 0

      - name: Checkout same source for Gen12.2 reconstruction baseline
        uses: actions/checkout@v4
        with:
          ref: build/gen12-3-angle-feed-resilience-20261008
          path: baseline
          fetch-depth: 0

      - name: Reconstruct exact Gen12.2 runtime in candidate and baseline
        shell: bash
        run: |
          set -euo pipefail
          apply_gen12_2() {
            local repo="$1"
            python3 "$repo/service_packs/gen7_shizuku_onboarding_v1/apply_service_pack_v1.py" "$repo"
            python3 "$repo/tools/apply_gen7_runtime_regression_beta2.py" --repo "$repo"
            python3 "$repo/tools/apply_gen8_anchored_transition.py" --repo "$repo"
            python3 "$repo/tools/apply_gen9_predictive_inner_wake.py" --repo "$repo"
            python3 "$repo/tools/apply_gen9_guarded_prewake.py" --repo "$repo"
            python3 "$repo/tools/apply_gen10_live_mirror_close.py" --repo "$repo"
            python3 "$repo/tools/apply_gen10_1_handoff_guard.py" --repo "$repo"
            python3 "$repo/tools/apply_gen10_2_secure_fail_open.py" --repo "$repo"
            python3 "$repo/tools/apply_gen10_3_hybrid_animation.py" --repo "$repo"
            python3 "$repo/tools/apply_gen10_4_io_coalescing.py" --repo "$repo"
            python3 "$repo/tools/apply_gen10_5_mirror_warmup_retention.py" --repo "$repo"
            python3 "$repo/tools/apply_gen10_6_oneui9_android17_compat.py" --repo "$repo"
            python3 "$repo/tools/apply_gen10_6_api37_private_api_lint_contract.py" --repo "$repo"
            python3 "$repo/tools/apply_gen10_7_oneui9_display_angle.py" --repo "$repo"
            python3 "$repo/tools/apply_gen11_product_ui.py" --repo "$repo"
            python3 "$repo/tools/apply_gen12_route_lane_resilience.py" --repo "$repo"
            python3 "$repo/tools/apply_gen12_1_wallpaper_lifecycle.py" --repo "$repo"
            python3 "$repo/tools/apply_gen12_1_wallpaper_metadata_receipt.py" --repo "$repo"
            python3 "$repo/tools/apply_gen12_1_wallpaper_ui_io.py" --repo "$repo"
            python3 "$repo/tools/apply_gen12_1_ui_smoke_scroll.py" --repo "$repo"
            python3 "$repo/tools/apply_gen12_2_route_retention_fence.py" --repo "$repo"
          }
          apply_gen12_2 "$GITHUB_WORKSPACE/baseline"
          apply_gen12_2 "$GITHUB_WORKSPACE"
          grep -F 'versionCode = 58' baseline/app/build.gradle.kts
          grep -F 'versionCode = 58' app/build.gradle.kts
          grep -F 'GEN12_2_ROUTE_RETENTION_FENCE' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt

      - name: Apply Gen12.3 angle feed resilience
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen12_3_angle_feed_resilience.py --repo .
          git diff --check
          grep -F 'versionCode = 59' app/build.gradle.kts
          grep -F 'versionName = "5.6.3-gen12-3-angle-feed-resilience-zfold7"' app/build.gradle.kts
          grep -F 'GEN12_3_ANGLE_FEED_RESILIENCE' app/src/full/java/com/duoopen/shell/Fold7AngleReaderWatchdog.kt
          grep -F 'DuoOpenAngleAnchor:${display.displayId}' app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt
          grep -F 'angle-reader-restart' app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt
          ! grep -F 'line.contains("isVisible=true")' app/src/full/java/com/duoopen/shell/DuoShellService.kt

      - name: Enforce narrow runtime delta
        shell: bash
        run: |
          set -euo pipefail
          cmp baseline/app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          cmp baseline/app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt
          cmp baseline/app/src/full/java/com/duoopen/overlay/PanelEngine.kt app/src/full/java/com/duoopen/overlay/PanelEngine.kt
          cmp baseline/app/src/full/java/com/duoopen/shell/ShizukuBridge.kt app/src/full/java/com/duoopen/shell/ShizukuBridge.kt
          test ! -e baseline/app/src/full/java/com/duoopen/shell/Fold7AngleReaderWatchdog.kt
          test ! -e baseline/app/src/test/java/com/duoopen/shell/Fold7AngleReaderWatchdogTest.kt
          diff -u baseline/app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt > gen12-3-feed.diff || true
          diff -u baseline/app/src/full/java/com/duoopen/shell/DuoShellService.kt app/src/full/java/com/duoopen/shell/DuoShellService.kt > gen12-3-shell.diff || true
          test -s gen12-3-feed.diff
          test -s gen12-3-shell.diff

      - name: Static forensic replay assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          # Source capture: the last precise sample was followed by repeated
          # command sends, each timing out, while the reader produced no lines.
          poll_timeout_ms = 96
          restart_after = 3
          restart_detection_ms = poll_timeout_ms * restart_after
          assert restart_detection_ms == 288
          assert restart_detection_ms < 2500

          # The old implementation waited until stale status at 2.5 s and then
          # only expired authority; it never replaced the reader. Gen12.3 does.
          old_stale_ms = 2500
          assert restart_detection_ms < old_stale_ms
          print("GEN12.3 FORENSIC REPLAY: PASS")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Ensure Android 17 SDK is installed
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-37.0"

      - name: Run unit tests lint and assemble
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest lintFullDebug assembleFullDebug --stacktrace

      - name: Package failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -u
          mkdir -p gen12-3-failure
          git diff > gen12-3-failure/APPLIED-GEN12-3.diff || true
          cp gen12-3-feed.diff gen12-3-failure/ANGLE-FEED-DELTA.diff 2>/dev/null || true
          cp gen12-3-shell.diff gen12-3-failure/SHELL-READER-DELTA.diff 2>/dev/null || true
          cp tools/gen12_3_angle_feed_forensics.md gen12-3-failure/FORENSICS.md 2>/dev/null || true
          cp app/build/intermediates/lint_intermediate_text_report/fullDebug/lintReportFullDebug/lint-results-fullDebug.txt gen12-3-failure/LINT.txt 2>/dev/null || true
          {
            echo 'status=CI_FAILED'
            echo 'physicalFold7Validation=NOT_RUN'
            echo 'sourceCapture=duoopen-debug-1791442095112.zip'
          } > gen12-3-failure/FAILURE-INFO.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-5.6.3-gen12-3-angle-feed-resilience-failure
          path: gen12-3-failure/
          if-no-files-found: warn
          retention-days: 14

      - name: Package Gen12.3 validation candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gen12-3-build
          APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          OUTPUT="gen12-3-build/DuoOpen-ZFold7-5.6.3-gen12-3-angle-feed-resilience-debug.apk"
          cp "$APK" "$OUTPUT"
          sha256sum "$OUTPUT" > gen12-3-build/APK-SHA256.txt
          git diff > gen12-3-build/APPLIED-GEN12-3.diff
          cp gen12-3-feed.diff gen12-3-build/ANGLE-FEED-DELTA.diff
          cp gen12-3-shell.diff gen12-3-build/SHELL-READER-DELTA.diff
          cp tools/gen12_3_angle_feed_forensics.md gen12-3-build/FORENSICS.md
          {
            echo 'sourceFieldBundle=duoopen-debug-1791442095112.zip'
            echo 'sourceBuild=5.6.2-gen12-2-route-retention-fence-zfold7 code58'
            echo 'confirmedFailure=wallpaper commands continue sent=true while FoldInteractive reader produces no new lines or angles'
            echo 'handoffCorrelation=reader stops after native-cover remap and wallpaper identity changes live/FoldInteractive -> none'
            echo 'mitigation=multi-panel wallpaper command anchors + hidden-inner response acceptance + 3-timeout reader/session replacement watchdog'
            echo 'unitLintAssemble=PASS'
            echo 'physicalFold7Validation=REQUIRED'
          } > gen12-3-build/FORENSIC-EVIDENCE-SUMMARY.txt

      - name: Upload Gen12.3 candidate
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-5.6.3-gen12-3-angle-feed-resilience
          path: gen12-3-build/
          if-no-files-found: error
          retention-days: 14
