name: Apply Fold7 Gen2 Field Fix V9

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-gen2-field-fix-v9.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duo-open-gen2-field-fix-v9
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify V6 runtime and misplaced V7/V8 packages
        shell: bash
        run: |
          set -euo pipefail

          BASE="813b2ac2fa44edc3e69a7f534ad01dd79e45fa25"
          git merge-base --is-ancestor "$BASE" HEAD

          check_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "ERROR: unexpected source drift: $path"
              echo "expected=$expected"
              echo "actual=$actual"
              exit 1
            fi
          }

          check_optional_blob() {
            local path="$1"
            local expected="$2"
            if [[ -e "$path" ]]; then
              check_blob "$path" "$expected"
            fi
          }

          check_blob app/build.gradle.kts 0c49b96e890c1678380da10bc284d850783d5601
          check_blob app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt 6231beadcf986e0de2e5a83ea24c4e005419696a
          check_blob app/src/full/java/com/duoopen/overlay/PanelEngine.kt 336abfb545fdcd138bb727c8f2321b13ac460816
          check_blob app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt e1c316aaa27a534e1048b498a6e2657a2b840b73

          check_optional_blob app/.github/workflows/apply-gen2-field-fix-v7.yml 90de99f96b769533bd7c43180de3c8661e6a5dfa
          check_optional_blob app/tools/apply_field_fix_v7.py 237300d3727d5a058c41520f3fd40f848ffa3dc6
          check_optional_blob app/.github/workflows/apply-gen2-field-fix-v8.yml d8232ca9d3a36488cec7f1eda3dbd9c22025113c
          check_optional_blob app/tools/apply_field_fix_v8.py 3ca4f249856cd61fdabd59e832e5b932d11df972
          check_optional_blob app/README.md e69dacf32d1324539348a6ade69791fedfe07950
          check_optional_blob app/SHA256SUMS.txt 10468240492de8e0bebe244e44de28aa5164c290
          check_optional_blob app/UPLOAD_AT_REPOSITORY_ROOT.txt d8903c8976334ffa20fb153d8d234f14293bcbbc

          test ! -e app/src/full/java/com/duoopen/overlay/Fold7CoverRenderPolicy.kt
          test ! -e app/src/test/java/com/duoopen/overlay/Fold7CoverRenderPolicyTest.kt

                    echo "V9 BASELINE: PASS"
          echo "Current stranded V7/V8 package files are known and will be removed after tests pass."

      - name: Apply field-log-driven V9 corrections
        run: python3 tools/apply_field_fix_v9.py

      - name: Validate V9 source invariants
        shell: bash
        run: |
          set -euo pipefail

          grep -F 'versionCode = 37' app/build.gradle.kts
          grep -F 'versionName = "2.0.2-zfold7-gen2-field1"' app/build.gradle.kts

          SERVICE="app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt"
          PANEL="app/src/full/java/com/duoopen/overlay/PanelEngine.kt"
          COORDINATOR="app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt"
          POLICY="app/src/full/java/com/duoopen/overlay/Fold7CoverRenderPolicy.kt"
          POLICY_TEST="app/src/test/java/com/duoopen/overlay/Fold7CoverRenderPolicyTest.kt"

          test -f "$POLICY"
          test -f "$POLICY_TEST"

          grep -F 'primeContinuityFrameIfNeeded' "$SERVICE"
          grep -F 'setEarlyOpeningVisualLatched' "$SERVICE"
          grep -F 'earlyOpeningVisualStarted' "$SERVICE"
          grep -F 'EARLY_OPENING_VISUAL_MAX_MS' "$SERVICE"
          grep -F 'cover-route-missing:' "$SERVICE"
          grep -F 'shizuku-unavailable' "$SERVICE"
          grep -F 'user-stop' "$SERVICE"

          grep -F 'fun primeContinuityFrame(' "$PANEL"
          grep -F 'fun setContinuityCoverOwned(' "$PANEL"
          grep -F 'fun beginContinuityOpeningVisual(' "$PANEL"
          grep -F 'fun endContinuityOpeningVisual(' "$PANEL"
          grep -F 'fun isFold7CoverGeometryNow()' "$PANEL"
          grep -F 'fun isFold7InnerGeometryNow()' "$PANEL"
          grep -F 'primedContinuityCycleId' "$PANEL"
          grep -F 'Gen2 continuity prime READY' "$PANEL"
          grep -F 'explicitOpeningPeak' "$PANEL"

          if grep -Fq 'CONTINUITY_OPENING_MAX_MS' "$PANEL"; then
            echo "ERROR: renderer still owns opening timeout"
            exit 1
          fi

          grep -F 'renderOwnershipEnabled' "$COORDINATOR"
          grep -F 'renderOwnershipArmed = true' "$COORDINATOR"
          grep -F 'renderOwnershipArmed = false' "$COORDINATOR"

          grep -F 'openingFromClosedLatched' "$POLICY"
          grep -F 'OPENING_FROM_CLOSED' "$POLICY"
          grep -F 'INNER_HANDOFF' "$POLICY"
          grep -F 'openInner_clearsOpeningVisualEvenIfCallerStillHasLatch' "$POLICY_TEST"

          CONTROLLER="app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt"
          grep -F 'INNER_WAKE_MIN_DEG = 3f' "$CONTROLLER"
          grep -F 'INNER_HANDOFF_MIN_DEG = 8f' "$CONTROLLER"
          grep -F 'COVER_PREWARM_DEG = 174f' "$CONTROLLER"
          grep -F 'COVER_VISUAL_START_DEG = 135f' "$CONTROLLER"
          grep -F 'COVER_VISUAL_HIDE_OPEN_DEG = 140f' "$CONTROLLER"
          grep -F 'OPEN_LATCH_DEG = 172f' "$CONTROLLER"
          grep -F 'OPEN_REARM_DEG = 166f' "$CONTROLLER"

          HOST="app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt"
          STORE="app/src/full/java/com/duoopen/overlay/Fold7ContinuityFrameStore.kt"
          grep -F 'FROZEN RIGHT PANE' "$HOST"
          grep -F 'RIGHT PANE GEOMETRY LIVE' "$HOST"
          grep -F 'A newer capture attempt supersedes the previous frame immediately.' "$STORE"

          test ! -e app/.github/workflows/apply-gen2-field-fix-v7.yml
          test ! -e app/tools/apply_field_fix_v7.py
          test ! -e app/.github/workflows/apply-gen2-field-fix-v8.yml
          test ! -e app/tools/apply_field_fix_v8.py
          test ! -e app/README.md
          test ! -e app/SHA256SUMS.txt
          test ! -e app/UPLOAD_AT_REPOSITORY_ROOT.txt

          git diff --check
          git diff --stat

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run full V9 gates
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

      - name: Commit and push V9 runtime
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"

          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "ERROR: root workflow unexpectedly staged"
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^tools/'; then
            echo "ERROR: root tooling unexpectedly staged"
            exit 1
          fi

          git commit -m "Fix Fold7 Gen2 field transitions and render ownership"
          git push origin HEAD:main

      - name: Prepare V9 Fold7 field-test APK
        shell: bash
        run: |
          set -euo pipefail

          OUT="fold7-gen2-field1"
          mkdir -p "$OUT"

          APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"

          DEST="$OUT/DuoOpen-ZFold7-2.0.2-gen2-field1-debug.apk"
          cp "$APK" "$DEST"

          sha256sum "$DEST" > "$OUT/APK-SHA256.txt"

          {
            echo "version=2.0.2-zfold7-gen2-field1"
            echo "versionCode=37"
            echo "commit=$(git rev-parse HEAD)"
            echo "target=Samsung Galaxy Z Fold7"
            echo "fieldFix=closed-opening-semantic-visual"
            echo "fieldFix=service-owned-opening-latch-timeout"
            echo "fieldFix=close-cycle-early-capture-prime"
            echo "fieldFix=single-cover-render-owner"
            echo "fieldFix=immediate-local-open-cleanup"
            echo "fieldFix=manual-loss-route-cleanup"
            echo "portal=right-inner-pane"
            echo
            sha256sum "$DEST"
          } > "$OUT/BUILD-INFO.txt"

          cat "$OUT/BUILD-INFO.txt"

      - name: Upload V9 Fold7 field-test APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-2.0.2-gen2-field1-v9
          path: |
            fold7-gen2-field1/DuoOpen-ZFold7-2.0.2-gen2-field1-debug.apk
            fold7-gen2-field1/APK-SHA256.txt
            fold7-gen2-field1/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
