name: Apply Gen12 Standby Route Grace

on:
  push:
    branches:
      - build/gen12-route-lane-resilience-20261008
    paths:
      - ".github/workflows/apply-gen12-standby-route-grace.yml"
      - "tools/apply_gen12_standby_route_grace.py"
      - "app/src/full/java/com/duoopen/overlay/Fold7StandbyRouteLease.kt"
      - "app/src/test/java/com/duoopen/overlay/Fold7StandbyRouteLeaseTest.kt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-gen12-standby-route-grace
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gen12 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic standby grace
        run: python3 tools/apply_gen12_standby_route_grace.py

      - name: Validate standby policy diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'private val standbyRouteLease = Fold7StandbyRouteLease()' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          grep -F 'COVER_STANDBY_GRACE_MS = 1_800L' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          grep -F 'new-close:cycle=' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          grep -F 'standbyRouteLease.consumeExpiry(ticket)' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          grep -F 'class Fold7StandbyRouteLease' app/src/full/java/com/duoopen/overlay/Fold7StandbyRouteLease.kt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run unit tests and assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

      - name: Commit tested standby grace
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          git diff --cached --quiet && { echo 'No generated changes to commit.'; exit 0; }
          git commit -m "perf: retain hidden Fold7 cover route across quick reversal"
          git push origin HEAD:build/gen12-route-lane-resilience-20261008
