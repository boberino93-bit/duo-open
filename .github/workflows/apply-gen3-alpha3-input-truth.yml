name: Apply Duo Open Gen3 Alpha3 Input Truth

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-gen3-alpha3-input-truth.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duo-open-gen3-alpha3-input-truth
  cancel-in-progress: false

env:
  DUO_DIAGNOSTIC_UPLOAD_URL: ${{ vars.DUO_DIAGNOSTIC_UPLOAD_URL }}
  DUO_DIAGNOSTIC_INGEST_KEY: ${{ secrets.DUO_DIAGNOSTIC_INGEST_KEY }}

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify exact Alpha2 production baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE="413d4a722fe8193f15ff086595f10d1464505ace"
          git merge-base --is-ancestor "$BASE" HEAD

          check_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "ERROR: Alpha2 production source drift: $path"
              echo "expected=$expected"
              echo "actual=$actual"
              exit 1
            fi
          }

          check_blob app/build.gradle.kts b906bbf5cd24a7a71e0d07a7821d1ec792421f50
          check_blob app/src/main/java/com/duoopen/fold/HingeAngleSource.kt 21cd4f2719f307ee028384eb18fb759a3fea33f1
          check_blob app/src/main/java/com/duoopen/fold/DuoShader.kt 65985f6343cf0ed8e0370076661e8d22b88e098e
          check_blob app/src/main/java/com/duoopen/ui/DuoApp.kt 3f934dc8369b13f0737e28fac97844b8e8351a24
          check_blob app/src/main/java/com/duoopen/ui/ControlSheet.kt 681544b53f1638d3aacf768f57e0b11f649b4c05
          check_blob app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt 3758bc20ecc550b152d83cd9c44061de74944bb1
          check_blob app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt 769993070bbc517f45bf22d9f2b5b77833dfb297
          check_blob app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt 5d7d34332f778455bdbe617cd11d8c4f808c3d69
          check_blob app/src/full/java/com/duoopen/overlay/OverlayFeature.kt 45846557d30108eec97915e40cab15ff6d748164
          check_blob app/src/lite/java/com/duoopen/overlay/OverlayFeature.kt b570f1dc4fa9eb832573c2186078b6063357c5aa
          check_blob app/src/full/java/com/duoopen/overlay/FoldOverlayView.kt 5ce8a231562acf1285fa48009945d80559f1fd28
          check_blob app/src/full/java/com/duoopen/overlay/PanelEngine.kt 2b3a81624d269f5f8165bf158dbb94251b045549

          echo "GEN3 ALPHA3 BASELINE: PASS"

      - name: Verify Alpha3 support-file checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c ALPHA3-SUPPORT-SHA256.txt

      - name: Apply Alpha3 input-truth patch
        run: python3 tools/apply_gen3_alpha3.py

      - name: Validate Alpha3 invariants
        shell: bash
        run: |
          set -euo pipefail

          grep -F 'versionCode = 40' app/build.gradle.kts
          grep -F 'versionName = "3.0.0-alpha3-zfold7"' app/build.gradle.kts

          grep -F 'internal class Fold7AngleAuthority' app/src/main/java/com/duoopen/fold/Fold7AngleAuthority.kt
          grep -F 'private val authority = Fold7AngleAuthority()' app/src/main/java/com/duoopen/fold/HingeAngleSource.kt
          grep -F 'private val hingeIngress = Fold7HingeIngressBatch()' app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt
          grep -F 'observedUptimeMs: Long = SystemClock.uptimeMillis()' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          grep -F 'OVERFLOW fail-closed' app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt

          grep -F 'hinge.beginExternalSession(session)' app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt
          grep -F 'hinge.expireExternal("reader-stale")' app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt
          grep -F 'hinge.revokeExternalSession(' app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt
          grep -F 'hinge.feedSyntheticExternal(' app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt

          grep -F 'OverlayFeature.authoritativeHingeAngle()' app/src/main/java/com/duoopen/ui/DuoApp.kt
          if grep -Fq 'var hingeAngle by remember { mutableFloatStateOf(Float.NaN) }' app/src/main/java/com/duoopen/ui/DuoApp.kt; then
            echo "ERROR: duplicate full-app hinge readout survived"
            exit 1
          fi

          grep -F 'const val MAX_TILT = 60f' app/src/main/java/com/duoopen/fold/DuoShader.kt
          grep -F 'FILTER_MODE_LINEAR' app/src/full/java/com/duoopen/overlay/FoldOverlayView.kt
          grep -F 'private fun shellCapture(): Boolean = ShizukuBridge.ready' app/src/full/java/com/duoopen/overlay/PanelEngine.kt
          grep -F 'Glass renderer' app/src/main/java/com/duoopen/ui/ControlSheet.kt
          if grep -Fq 'Continuous hinge angle (Samsung)' app/src/main/java/com/duoopen/ui/ControlSheet.kt; then
            echo "ERROR: obsolete Fold7 angle toggle survived"
            exit 1
          fi
          if grep -Fq 'Fast live capture' app/src/main/java/com/duoopen/ui/ControlSheet.kt; then
            echo "ERROR: obsolete Fold7 capture toggle survived"
            exit 1
          fi

          grep -F 'INNER_WAKE_MIN_DEG = 3f' app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt
          grep -F 'INNER_HANDOFF_MIN_DEG = 8f' app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt
          grep -F 'COVER_PREWARM_DEG = 174f' app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt
          grep -F 'COVER_VISUAL_START_DEG = 135f' app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt
          grep -F 'OPEN_LATCH_DEG = 172f' app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt
          grep -F 'OPEN_REARM_DEG = 166f' app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt

          if grep -Fq 'latestControlAngle' app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt; then
            echo "ERROR: Alpha2 latest-only hinge bridge survived"
            exit 1
          fi
          if grep -Fq 'hingeDeliveryPending' app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt; then
            echo "ERROR: Alpha2 latest-only pending flag survived"
            exit 1
          fi
          if grep -Fq 'EXTERNAL_STALE_MS' app/src/main/java/com/duoopen/fold/HingeAngleSource.kt; then
            echo "ERROR: legacy implicit external-source lease survived"
            exit 1
          fi
          if grep -Fq 'GEN3_LIVE_BLUR' app/src/full/java/com/duoopen/overlay/Fold7Gen3VisualCoordinator.kt; then
            echo "ERROR: Fold7 Gen3 live blur returned"
            exit 1
          fi
          if git diff | grep -E 'STATE_OFF|setDisplayPower.*OFF|moveTaskToDisplay'; then
            echo "ERROR: forbidden raw OFF/task migration behavior introduced"
            exit 1
          fi

          git diff --check
          git diff --stat

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run focused Alpha3 tests
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testFullDebugUnitTest --tests '*Fold7AngleAuthorityTest' --stacktrace
          ./gradlew testFullDebugUnitTest --tests '*Fold7HingeIngressBatchTest' --stacktrace
          ./gradlew testFullDebugUnitTest --tests '*DebugBundleUploaderTest' --stacktrace
          ./gradlew testFullDebugUnitTest --tests '*Fold7ContinuityPrimeOwnerGen3Test' --stacktrace
          ./gradlew testFullDebugUnitTest --tests '*Fold7CoverPanelLeaseV4Test' --stacktrace

      - name: Run full Alpha3 gate
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

      - name: Commit and push validated Alpha3 runtime
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"

          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "ERROR: workflow unexpectedly staged"
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^tools/'; then
            echo "ERROR: tooling unexpectedly staged"
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^payload/'; then
            echo "ERROR: payload unexpectedly staged"
            exit 1
          fi

          git commit -m "Make Fold7 hinge authority explicit and ordered"
          git push origin HEAD:main

      - name: Prepare Alpha3 APK
        shell: bash
        run: |
          set -euo pipefail

          OUT="fold7-gen3-alpha3"
          mkdir -p "$OUT"

          APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"

          DEST="$OUT/DuoOpen-ZFold7-3.0.0-alpha3-debug.apk"
          cp "$APK" "$DEST"
          sha256sum "$DEST" > "$OUT/APK-SHA256.txt"

          {
            echo "version=3.0.0-alpha3-zfold7"
            echo "versionCode=40"
            echo "commit=$(git rev-parse HEAD)"
            echo "baseline=413d4a722fe8193f15ff086595f10d1464505ace"
            echo "target=Samsung Galaxy Z Fold7"
            echo "input=single-authority+shadow-fallback+ordered-source-time-mailbox"
            echo "renderer=60deg-optical-domain+bilinear-bitmap-input"
            echo "wakeThresholds=unchanged"
            echo "FoldInteractive=retained-temporary-fallback"
            echo "diagnosticUploadConfigured=$([[ -n \"${DUO_DIAGNOSTIC_UPLOAD_URL:-}\" ]] && echo true || echo false)"
            echo
            sha256sum "$DEST"
          } > "$OUT/BUILD-INFO.txt"

          cat "$OUT/BUILD-INFO.txt"

      - name: Upload Alpha3 APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-3.0.0-alpha3
          path: |
            fold7-gen3-alpha3/DuoOpen-ZFold7-3.0.0-alpha3-debug.apk
            fold7-gen3-alpha3/APK-SHA256.txt
            fold7-gen3-alpha3/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
