name: Build Gen12.2 Route Retention Fence

on:
  workflow_dispatch:
  push:
    branches:
      - build/gen12-2-route-retention-fence-20261008
    paths:
      - ".github/workflows/build-gen12-2-route-retention-fence.yml"
      - "tools/apply_gen12_2_route_retention_fence.py"
      - "tools/gen12_2_route_retention_forensics.md"

permissions:
  contents: read

concurrency:
  group: build-gen12-2-route-retention-fence
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gen12.2 candidate
        uses: actions/checkout@v4
        with:
          ref: build/gen12-2-route-retention-fence-20261008
          fetch-depth: 0

      - name: Checkout same source for Gen12.1 reconstruction baseline
        uses: actions/checkout@v4
        with:
          ref: build/gen12-2-route-retention-fence-20261008
          path: baseline
          fetch-depth: 0

      - name: Reconstruct exact Gen12.1 runtime in candidate and baseline
        shell: bash
        run: |
          set -euo pipefail
          apply_gen12() {
            local repo="$1"
            python3 "$repo/service_packs/gen7_shizuku_onboarding_v1/apply_service_pack_v1.py" "$repo"
            python3 "$repo/tools/apply_gen7_runtime_regression_beta2.py" --repo "$repo"
            python3 "$repo/tools/apply_gen8_anchored_transition.py" --repo "$repo"
            python3 "$repo/tools/apply_gen9_predictive_inner_wake.py" --repo "$repo"
            python3 "$repo/tools/apply_gen9_guarded_prewake.py" --repo "$repo"
            python3 "$repo/tools/apply_gen10_live_mirror_close.py" --repo "$repo"
            python3 "$repo/tools/apply_gen10_1_handoff_guard.py" --repo "$repo"
            python3 "$repo/tools/apply_gen10_2_secure_fail_open.py" --repo "$repo"
            python3 "$repo/tools/apply_gen10_3_hybrid_animation.py" --repo "$repo"
            python3 "$repo/tools/apply_gen10_4_io_coalescing.py" --repo "$repo"
            python3 "$repo/tools/apply_gen10_5_mirror_warmup_retention.py" --repo "$repo"
            python3 "$repo/tools/apply_gen10_6_oneui9_android17_compat.py" --repo "$repo"
            python3 "$repo/tools/apply_gen10_6_api37_private_api_lint_contract.py" --repo "$repo"
            python3 "$repo/tools/apply_gen10_7_oneui9_display_angle.py" --repo "$repo"
            python3 "$repo/tools/apply_gen11_product_ui.py" --repo "$repo"
            python3 "$repo/tools/apply_gen12_route_lane_resilience.py" --repo "$repo"
            python3 "$repo/tools/apply_gen12_1_wallpaper_lifecycle.py" --repo "$repo"
            python3 "$repo/tools/apply_gen12_1_wallpaper_metadata_receipt.py" --repo "$repo"
            python3 "$repo/tools/apply_gen12_1_wallpaper_ui_io.py" --repo "$repo"
            python3 "$repo/tools/apply_gen12_1_ui_smoke_scroll.py" --repo "$repo"
          }
          apply_gen12 "$GITHUB_WORKSPACE/baseline"
          apply_gen12 "$GITHUB_WORKSPACE"
          grep -F 'versionCode = 57' baseline/app/build.gradle.kts
          grep -F 'versionCode = 57' app/build.gradle.kts
          grep -F 'GEN12_ROUTE_LANE_RESILIENCE' app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt

      - name: Apply Gen12.2 forensic latency fix
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen12_2_route_retention_fence.py --repo .
          git diff --check
          grep -F 'versionCode = 58' app/build.gradle.kts
          grep -F 'versionName = "5.6.2-gen12-2-route-retention-fence-zfold7"' app/build.gradle.kts
          grep -F 'GEN12_2_ROUTE_RETENTION_FENCE' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          grep -F 'const val COVER_ROUTE_RETENTION_MS = 750L' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          grep -F 'rapidCloseReversalCancelsOldOpeningRelease' app/src/test/java/com/duoopen/overlay/Fold7RouteReleaseFenceTest.kt

      - name: Enforce narrow runtime delta
        shell: bash
        run: |
          set -euo pipefail
          cmp baseline/app/src/full/java/com/duoopen/shell/DuoShellService.kt app/src/full/java/com/duoopen/shell/DuoShellService.kt
          cmp baseline/app/src/full/java/com/duoopen/shell/ShizukuBridge.kt app/src/full/java/com/duoopen/shell/ShizukuBridge.kt
          cmp baseline/app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt
          cmp baseline/app/src/full/java/com/duoopen/overlay/PanelEngine.kt app/src/full/java/com/duoopen/overlay/PanelEngine.kt
          cmp baseline/app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt
          test ! -e baseline/app/src/full/java/com/duoopen/overlay/Fold7RouteReleaseFence.kt
          test ! -e baseline/app/src/test/java/com/duoopen/overlay/Fold7RouteReleaseFenceTest.kt
          diff -u baseline/app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt > gen12-2-coordinator.diff || true
          test -s gen12-2-coordinator.diff

      - name: Static replay assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          # Forensic timing model from supplied field capture:
          # old opening teardown may still be running at ~622 ms; Gen12.2 does
          # not permit it to begin until the route has been stable for 750 ms.
          retention_ms = 750
          observed_opening_tail_ms = 622
          assert retention_ms > observed_opening_tail_ms

          # New close at 355 ms (representative gen66 -> gen71 race) invalidates
          # the prior ticket before its due time.
          release_due_ms = retention_ms
          reversal_ms = 355
          assert reversal_ms < release_due_ms
          print("GEN12.2 FORENSIC REPLAY: PASS")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Ensure Android 17 SDK is installed
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-37.0"

      - name: Run unit tests lint and assemble
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest lintFullDebug assembleFullDebug --stacktrace

      - name: Package failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -u
          mkdir -p gen12-2-failure
          git diff > gen12-2-failure/APPLIED-GEN12-2.diff || true
          cp gen12-2-coordinator.diff gen12-2-failure/COORDINATOR-DELTA.diff 2>/dev/null || true
          cp tools/gen12_2_route_retention_forensics.md gen12-2-failure/FORENSICS.md 2>/dev/null || true
          cp app/build/intermediates/lint_intermediate_text_report/fullDebug/lintReportFullDebug/lint-results-fullDebug.txt gen12-2-failure/LINT.txt 2>/dev/null || true
          {
            echo 'status=CI_FAILED'
            echo 'physicalFold7Validation=NOT_RUN'
            echo 'sourceCapture=duoopen-debug-1791438725678.zip'
          } > gen12-2-failure/FAILURE-INFO.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-5.6.2-gen12-2-route-retention-failure
          path: gen12-2-failure/
          if-no-files-found: warn
          retention-days: 14

      - name: Package Gen12.2 validation candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gen12-2-build
          APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          OUTPUT="gen12-2-build/DuoOpen-ZFold7-5.6.2-gen12-2-route-retention-fence-debug.apk"
          cp "$APK" "$OUTPUT"
          sha256sum "$OUTPUT" > gen12-2-build/APK-SHA256.txt
          git diff > gen12-2-build/APPLIED-GEN12-2.diff
          cp gen12-2-coordinator.diff gen12-2-build/COORDINATOR-DELTA.diff
          cp tools/gen12_2_route_retention_forensics.md gen12-2-build/FORENSICS.md
          {
            echo 'sourceFieldBundle=duoopen-debug-1791438725678.zip'
            echo 'sourceBuild=5.6.1-gen12-1-wallpaper-lifecycle-zfold7 code57'
            echo 'confirmedPrimaryDefect=destructive secondary-release can outlive its opening generation and erase a newer close route'
            echo 'confirmedSensorPath=not primary bottleneck'
            echo 'mitigation=750ms hidden route retention + generation/connection cancellation fence'
            echo 'unitLintAssemble=PASS'
            echo 'physicalFold7Validation=REQUIRED'
          } > gen12-2-build/FORENSIC-EVIDENCE-SUMMARY.txt

      - name: Upload Gen12.2 candidate
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-5.6.2-gen12-2-route-retention-fence
          path: gen12-2-build/
          if-no-files-found: error
          retention-days: 14
