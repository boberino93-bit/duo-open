name: Apply Fold7 Gen2 Batch C Fix 3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-gen2-batch-c-fix3.yml"
      - "tools/apply_gen2_batch_c_fix3.py"
      - "GEN2_IMPORT_SUPPORT/APPLY_GEN2_BATCH_C_FIX3_NOW.txt"

permissions:
  contents: write

concurrency:
  group: apply-fold7-gen2-batch-c-fix3
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tested Batch B and both legacy hinge callers
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'fun startAnglesSequenced(' app/src/full/java/com/duoopen/shell/ShizukuBridge.kt
          grep -F 'p.writeLong(parsedLine.pollSequence)' app/src/full/java/com/duoopen/shell/DuoShellService.kt
          grep -F 'HingeAngleSource(context, ::onHingeAngle)' app/src/main/java/com/duoopen/wallpaper/DuoWallpaperService.kt
          grep -F 'context.applicationContext' app/src/main/java/com/duoopen/ui/DuoApp.kt
          if grep -Fq 'duo-fold7-angle-control' app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt; then
            echo 'ERROR: Batch C appears to be already integrated.'
            exit 1
          fi

      - name: Apply Batch C Fix 3
        run: python3 tools/apply_gen2_batch_c_fix3.py

      - name: Validate generated diff and constructor compatibility
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'class HingeAngleSource private constructor(' app/src/main/java/com/duoopen/fold/HingeAngleSource.kt
          grep -F 'sensorHandler: Handler?' app/src/main/java/com/duoopen/fold/HingeAngleSource.kt
          grep -F 'deliveryHandler: Handler?' app/src/main/java/com/duoopen/fold/HingeAngleSource.kt
          grep -F 'Looper.myLooper() != target.looper' app/src/main/java/com/duoopen/fold/HingeAngleSource.kt
          grep -F 'HingeAngleSource(context, ::onHingeAngle)' app/src/main/java/com/duoopen/wallpaper/DuoWallpaperService.kt
          grep -F 'context.applicationContext' app/src/main/java/com/duoopen/ui/DuoApp.kt
          grep -F 'duo-fold7-angle-control' app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt
          grep -F 'angleControlThread?.quitSafely()' app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build and test Batch C Fix 3
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

      - name: Commit tested Batch C Fix 3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/duoopen/fold/HingeAngleSource.kt \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt
          git diff --cached --quiet && { echo 'No generated changes to commit.'; exit 0; }
          git commit -m "Fold7 Gen2 Batch C: isolate hinge sensor callback thread"
          git push origin HEAD:main
