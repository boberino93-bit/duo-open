name: Apply Fold7 Gen2 Batch B

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-gen2-batch-b.yml"
      - "tools/apply_gen2_batch_b.py"
      - "GEN2_IMPORT_SUPPORT/APPLY_GEN2_BATCH_B_NOW.txt"

permissions:
  contents: write

concurrency:
  group: apply-fold7-gen2-batch-b
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify expected imported Gen2 base
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/full/java/com/duoopen/overlay/Fold7EarlyWakeIngress.kt
          test -f app/src/full/java/com/duoopen/shell/Fold7AnglePipelineGen2.kt
          grep -F 'versionName = "1.3.25-zfold7-debug-export"' app/build.gradle.kts
          grep -F 'private val onAngle: (Float, Long, Long) -> Unit' app/src/full/java/com/duoopen/shell/ShizukuBridge.kt
          grep -F 'private class AngleReader(private val action: String, private val callback: IBinder)' app/src/full/java/com/duoopen/shell/DuoShellService.kt

      - name: Apply Batch B sequence identity
        run: python3 tools/apply_gen2_batch_b.py

      - name: Validate generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'fun startAnglesSequenced(' app/src/full/java/com/duoopen/shell/ShizukuBridge.kt
          grep -F 'p.writeLong(parsedLine.pollSequence)' app/src/full/java/com/duoopen/shell/DuoShellService.kt
          grep -F 'action.startsWith("$actionPrefix:")' app/src/full/java/com/duoopen/shell/DuoShellService.kt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build and test Batch B
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

      - name: Commit tested Batch B
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/full/java/com/duoopen/shell/ShizukuBridge.kt \
            app/src/full/java/com/duoopen/shell/DuoShellService.kt
          git diff --cached --quiet && { echo 'No generated changes to commit.'; exit 0; }
          git commit -m "Fold7 Gen2 Batch B: add angle poll sequence identity"
          git push origin HEAD:main
