name: S1U Presentation Hold Window V1

on:
  push:
    branches:
      - build/s1u-presentation-hold-window-20261006
    paths:
      - ".github/workflows/s1u-presentation-hold-window-v1.yml"
      - "tools/apply_s1u_presentation_hold_window_v1.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s1u-presentation-hold-window-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct Beta2 through validated wake stack
        run: |
          set -euo pipefail
          python3 service_packs/gen7_shizuku_onboarding_v1/apply_service_pack_v1.py .
          python3 tools/apply_gen7_runtime_regression_beta2.py --repo . --check
          python3 tools/apply_gen7_runtime_regression_beta2.py --self-test
          python3 tools/apply_gen7_runtime_regression_beta2.py --repo .
          for x in a b c; do
            python3 tools/apply_runtime_optimization_cycle_${x}.py --self-test
            python3 tools/apply_runtime_optimization_cycle_${x}.py --repo . --check
            python3 tools/apply_runtime_optimization_cycle_${x}.py --repo .
          done
          python3 tools/apply_inner_wake_probe_v1.py --self-test
          python3 tools/apply_inner_wake_probe_v1.py --repo . --check
          python3 tools/apply_inner_wake_probe_v1.py --repo .
          python3 tools/prepare_inner_physical_bridge_v1_transformer.py --self-test
          python3 tools/prepare_inner_physical_bridge_v1_transformer.py --repo . --check
          python3 tools/prepare_inner_physical_bridge_v1_transformer.py --repo .
          python3 tools/apply_inner_physical_bridge_v1_protocol_compat.py --self-test
          python3 tools/apply_inner_physical_bridge_v1_protocol_compat.py --repo . --phase pre
          python3 tools/apply_inner_physical_bridge_v1.py --self-test
          python3 tools/apply_inner_physical_bridge_v1.py --repo . --check
          python3 tools/apply_inner_physical_bridge_v1.py --repo .
          python3 tools/apply_inner_physical_bridge_v1_service_fixups.py --self-test
          python3 tools/apply_inner_physical_bridge_v1_service_fixups.py --repo . --check
          python3 tools/apply_inner_physical_bridge_v1_service_fixups.py --repo .
          python3 tools/apply_inner_physical_bridge_v1_protocol_compat.py --repo . --phase post
          python3 tools/apply_inner_physical_bridge_v1_fixups.py --self-test
          python3 tools/apply_inner_physical_bridge_v1_fixups.py --repo . --check
          python3 tools/apply_inner_physical_bridge_v1_fixups.py --repo .
          python3 tools/apply_inner_physical_bridge_v2.py --self-test
          python3 tools/apply_inner_physical_bridge_v2.py --repo . --check
          python3 tools/apply_inner_physical_bridge_v2.py --repo .
          python3 tools/apply_fold7_display_status_v3.py --self-test
          python3 tools/apply_fold7_display_status_v3.py --repo . --check
          python3 tools/apply_fold7_display_status_v3.py --repo .
          python3 tools/apply_hall_open_latch_v3.py --self-test
          python3 tools/apply_hall_open_latch_v3.py --repo . --check
          python3 tools/apply_hall_open_latch_v3.py --repo .
          python3 tools/apply_inner_physical_bridge_v4.py --self-test
          python3 tools/apply_inner_physical_bridge_v4.py --repo . --check
          python3 tools/apply_inner_physical_bridge_v4.py --repo .

      - name: Reapply S1 through S1P
        run: |
          set -euo pipefail
          python3 tools/apply_stabilization_s1_ingress_telemetry.py --self-test
          python3 tools/apply_stabilization_s1_ingress_telemetry.py --repo . --check
          python3 tools/apply_stabilization_s1_ingress_telemetry.py --repo .
          python3 tools/apply_stabilization_s1b_sf_power_truth.py --repo . --check
          python3 tools/apply_stabilization_s1b_sf_power_truth.py --repo .
          python3 tools/apply_stabilization_s1e_logical_layout_truth.py --repo . --check
          python3 tools/apply_stabilization_s1e_logical_layout_truth.py --repo .
          python3 tools/apply_stabilization_s1f_layout_map_truth.py --repo . --check
          python3 tools/apply_stabilization_s1f_layout_map_truth.py --repo .
          python3 tools/apply_stabilization_s1g_forensic_superset.py --repo . --check
          python3 tools/apply_stabilization_s1g_forensic_superset.py --repo .
          python3 tools/apply_stabilization_s1h_visual_forensics.py --self-test
          python3 tools/apply_stabilization_s1h_visual_forensics.py --repo . --check
          python3 tools/apply_stabilization_s1h_visual_forensics.py --repo .
          python3 tools/apply_stabilization_s1i_correlated_forensics_v3.py --self-test
          python3 tools/apply_stabilization_s1i_correlated_forensics_v3.py --repo . --check
          python3 tools/apply_stabilization_s1i_correlated_forensics_v3.py --repo .
          python3 tools/apply_stabilization_s1j_opening_handoff_truth.py --self-test
          python3 tools/apply_stabilization_s1j_opening_handoff_truth.py --repo . --check
          python3 tools/apply_stabilization_s1j_opening_handoff_truth.py --repo .
          python3 tools/apply_opening_remap_handoff_v1.py --self-test
          python3 tools/apply_opening_remap_handoff_v1.py --repo . --check
          python3 tools/apply_opening_remap_handoff_v1.py --repo .
          python3 tools/apply_speculative_inner_prewake_v1_v2.py --self-test
          python3 tools/apply_speculative_inner_prewake_v1_v2.py --repo . --check
          python3 tools/apply_speculative_inner_prewake_v1_v2.py --repo .
          python3 tools/apply_s1n_safe_prewake_v2.py --self-test
          python3 tools/apply_s1n_safe_prewake_v2.py --repo . --check
          python3 tools/apply_s1n_safe_prewake_v2.py --repo .
          python3 tools/apply_s1o_hall_prewake_protocol_v1.py --self-test
          python3 tools/apply_s1o_hall_prewake_protocol_v1.py --repo . --check
          python3 tools/apply_s1o_hall_prewake_protocol_v1.py --repo .
          python3 tools/apply_s1p_hall_optical_proxy_v1.py --self-test
          python3 tools/apply_s1p_hall_optical_proxy_v1.py --repo . --check
          python3 tools/apply_s1p_hall_optical_proxy_v1.py --repo .

      - name: Reapply S1Q through S1T
        run: |
          set -euo pipefail
          python3 tools/apply_s1q_animation_coherence_v3.py --self-test
          python3 tools/apply_s1q_animation_coherence_v3.py --repo . --check
          python3 tools/apply_s1q_animation_coherence_v3.py --repo .
          python3 tools/apply_s1r_hinge_reacquisition_v1.py --self-test
          python3 tools/apply_s1r_hinge_reacquisition_v1.py --repo . --check
          python3 tools/apply_s1r_hinge_reacquisition_v1.py --repo .
          python3 tools/apply_s1s_beta_convergence_v2.py --self-test
          python3 tools/apply_s1s_beta_convergence_v2.py --repo . --check
          python3 tools/apply_s1s_beta_convergence_v2.py --repo .
          python3 tools/apply_s1t_cycle_aware_terminal_fence_v1.py --self-test
          python3 tools/apply_s1t_cycle_aware_terminal_fence_v1.py --repo . --check
          python3 tools/apply_s1t_cycle_aware_terminal_fence_v1.py --repo .

      - name: Apply S1U bounded presentation hold window
        run: |
          set -euo pipefail
          python3 tools/apply_s1u_presentation_hold_window_v1.py --self-test
          python3 tools/apply_s1u_presentation_hold_window_v1.py --repo . --check
          python3 tools/apply_s1u_presentation_hold_window_v1.py --repo .
          git diff --check
          grep -F 'versionCode = 55' app/build.gradle.kts
          grep -F 'versionName = "5.1.0-beta2-zfold7-s1u"' app/build.gradle.kts
          grep -F 'S1U_PRESENTATION_HOLD_WINDOW_V1' app/src/full/java/com/duoopen/overlay/Fold7InnerPresentationGate.kt
          grep -F 'INNER_PRESENTATION_MAX_HOLD_MS = 6_500L' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          grep -F 'defaultGateCoversObservedLateSamsungWindow' app/src/test/java/com/duoopen/overlay/Fold7InnerPresentationGateTest.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Full regression tests and APK build
        env:
          ORG_GRADLE_PROJECT_DUO_DIAGNOSTIC_UPLOAD_URL: ${{ vars.DUO_DIAGNOSTIC_UPLOAD_URL }}
          ORG_GRADLE_PROJECT_DUO_DIAGNOSTIC_INGEST_KEY: ${{ secrets.DUO_DIAGNOSTIC_INGEST_KEY }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

      - name: Package S1U physical validation APK
        run: |
          set -euo pipefail
          OUT=s1u-presentation-hold-window-v1
          mkdir -p "$OUT"
          APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" "$OUT/DuoOpen-ZFold7-5.1.0-beta2-s1u-presentation-hold-window-v1-debug.apk"
          sha256sum "$OUT/DuoOpen-ZFold7-5.1.0-beta2-s1u-presentation-hold-window-v1-debug.apk" > "$OUT/APK-SHA256.txt"
          git diff -- app > "$OUT/APPLIED-ANDROID-SOURCE.diff"
          sha256sum "$OUT/APPLIED-ANDROID-SOURCE.diff" > "$OUT/APPLIED-ANDROID-SOURCE-SHA256.txt"
          {
            echo "sourceHead=${GITHUB_SHA}"
            echo "authorizationCase=AUTH-DUO-APK-20261006-1823-01"
            echo "phase=S1U_PRESENTATION_HOLD_WINDOW_V1"
            echo "versionCode=55"
            echo "versionName=5.1.0-beta2-zfold7-s1u"
            echo "positiveReadinessStableMs=160"
            echo "boundedEmergencyReleaseMs=6500"
            echo "fieldBasis=observed Samsung INNER publication approximately 5.7-6.0s"
            echo "architectureChange=NONE"
            echo "productionMerge=NOT_AUTHORIZED"
            echo "physicalFold7Validation=REQUIRED"
          } > "$OUT/BUILD-INFO.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-S1U-Presentation-Hold-Window-V1
          path: s1u-presentation-hold-window-v1/
          if-no-files-found: error
          retention-days: 30
