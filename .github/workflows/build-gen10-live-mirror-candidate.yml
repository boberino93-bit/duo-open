name: Build Isolated Gen10 Live Mirror Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-gen10-live-mirror-candidate.yml"

permissions:
  contents: read

concurrency:
  group: build-gen10-live-mirror-candidate
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout isolated Gen10 candidate branch
        uses: actions/checkout@v4
        with:
          ref: gen10-live-mirror-close
          fetch-depth: 0

      - name: Verify baseline and candidate tools
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 42' app/build.gradle.kts
          grep -F 'versionName = "5.0.0-beta1-zfold7"' app/build.gradle.kts
          test -f tools/apply_gen8_anchored_transition.py
          test -f tools/apply_gen9_predictive_inner_wake.py
          test -f tools/apply_gen9_guarded_prewake.py
          test -f tools/apply_gen10_live_mirror_close.py
          grep -F 'GEN7_RUNTIME_REGRESSION_BETA2' tools/apply_gen7_runtime_regression_beta2.py

      - name: Reapply validated Shizuku onboarding predecessor
        shell: bash
        run: |
          set -euo pipefail
          python3 service_packs/gen7_shizuku_onboarding_v1/apply_service_pack_v1.py .

      - name: Reapply validated Gen7 Beta2 runtime service pack
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen7_runtime_regression_beta2.py --repo .
          grep -F 'versionCode = 43' app/build.gradle.kts

      - name: Reapply validated Gen8 anchored transition
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen8_anchored_transition.py --repo .
          grep -F 'versionCode = 44' app/build.gradle.kts
          grep -F 'liveFrameEpoch.owns(loopEpoch)' app/src/full/java/com/duoopen/overlay/Fold7CoverVisualHost.kt

      - name: Reapply validated Gen9 responsiveness overhaul
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen9_predictive_inner_wake.py --repo .
          grep -F 'versionCode = 45' app/build.gradle.kts

      - name: Reapply validated Gen9.1 guarded prewake
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen9_guarded_prewake.py --repo .
          grep -F 'versionCode = 46' app/build.gradle.kts
          grep -F 'previousId == corroboratedClosedStateId' app/src/full/java/com/duoopen/overlay/Fold7DeviceStateObserver.kt

      - name: Apply Gen10 live-mirror-first closing path
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen10_live_mirror_close.py --repo .
          git diff --check
          grep -F 'versionCode = 47' app/build.gradle.kts
          grep -F 'versionName = "5.4.0-gen10-live-mirror-zfold7"' app/build.gradle.kts
          grep -F 'GEN10 LIVE RIGHT PANE' app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt
          grep -F 'GEN10_LIVE_MIRROR_DELEGATED' app/src/full/java/com/duoopen/overlay/Fold7Gen3VisualCoordinator.kt
          grep -F 'syncMirrorHost(' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          ! grep -F 'continuity frozen frame unavailable; falling back to live mirror' app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test and build full debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

      - name: Package failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -u
          mkdir -p gen10-live-mirror-failure
          git diff -- app > gen10-live-mirror-failure/APPLIED-SOURCE.diff || true
          {
            echo "candidateBranch=gen10-live-mirror-close"
            echo "candidateHead=$(git rev-parse HEAD)"
            echo "status=CI_FAILED_BEFORE_TESTED_ARTIFACT"
            echo "physicalFold7Validation=NOT_RUN"
          } > gen10-live-mirror-failure/FAILURE-INFO.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-5.4.0-gen10-live-mirror-failure-diagnostics
          path: gen10-live-mirror-failure/
          if-no-files-found: warn
          retention-days: 14

      - name: Package tested Gen10 artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gen10-live-mirror-build
          APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          OUTPUT="gen10-live-mirror-build/DuoOpen-ZFold7-5.4.0-gen10-live-mirror-debug.apk"
          cp "$APK" "$OUTPUT"
          sha256sum "$OUTPUT" > gen10-live-mirror-build/APK-SHA256.txt
          git diff -- app > gen10-live-mirror-build/APPLIED-SOURCE.diff
          {
            echo "version=5.4.0-gen10-live-mirror-zfold7"
            echo "versionCode=47"
            echo "candidateBranch=gen10-live-mirror-close"
            echo "candidateHead=$(git rev-parse HEAD)"
            echo "baseLineage=Gen7 onboarding -> Gen7 Beta2 -> Gen8 anchor -> Gen9 responsiveness -> Gen9.1 guarded prewake -> Gen10 live mirror"
            echo "change1=continuity ShowMirror again creates the existing DisplayMirrorHost"
            echo "change2=DisplayMirrorHost attempts AOSP mirrorDisplay/setGeometry before any frozen bitmap"
            echo "change3=frozen right-pane bitmap is failure-only fallback when live mirror cannot bind"
            echo "change4=Gen3 closing screenshot/shader renderer is disabled during normal closing"
            echo "change5=topology edges retry live host binding after Samsung cover remaps"
            echo "gen8OwnershipInvariant=PRESERVED"
            echo "gen9GuardedPrewake=PRESERVED"
            echo "physicalFold7Validation=NOT_RUN"
            echo "tests=testFullDebugUnitTest"
            echo "build=assembleFullDebug"
          } > gen10-live-mirror-build/BUILD-INFO.txt

      - name: Upload tested APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-5.4.0-gen10-live-mirror
          path: |
            gen10-live-mirror-build/DuoOpen-ZFold7-5.4.0-gen10-live-mirror-debug.apk
            gen10-live-mirror-build/APK-SHA256.txt
            gen10-live-mirror-build/BUILD-INFO.txt
            gen10-live-mirror-build/APPLIED-SOURCE.diff
          if-no-files-found: error
          retention-days: 30
