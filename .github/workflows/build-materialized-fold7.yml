name: Build Materialized Fold7

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-materialized-fold7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout clean materialized baseline
        uses: actions/checkout@v4
        with:
          ref: generated/fold7-1.3.16-baseline
          fetch-depth: 0

      - name: Overlay 1.3.19 stability source from main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            main:refs/remotes/origin/main

          OVERLAY_MAIN_SHA="$(
            git rev-parse refs/remotes/origin/main
          )"

          echo "materialized_base=$(git rev-parse HEAD)"
          echo "overlay_main=${OVERLAY_MAIN_SHA}"

          # Deliberately DO NOT overlay WallpaperAngleFeed.kt or
          # DuoShellService.kt. 1.3.19 restores those files exactly from
          # the stable materialized baseline.
          FILES=(
            "app/build.gradle.kts"
            "app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt"
          )

          for path in "${FILES[@]}"; do
            echo "Overlaying ${path}"
            git show \
              "refs/remotes/origin/main:${path}" \
              > "${path}"
          done

          echo
          echo "Overlay diff:"
          git diff --stat

          echo
          echo "Overlay source check:"
          git diff --check

      - name: Show build identity
        shell: bash
        run: |
          set -euo pipefail

          echo "workflow_ref=${GITHUB_REF}"
          echo "workflow_sha=${GITHUB_SHA}"
          echo "materialized_base=$(git rev-parse HEAD)"
          echo "overlay_main=$(git rev-parse refs/remotes/origin/main)"

          echo
          grep -E \
            'version(Code|Name)' \
            app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Validate Fold7 1.3.19 source
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="app/build.gradle.kts"
          SERVICE="app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt"
          HOST="app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt"
          PANEL="app/src/full/java/com/duoopen/overlay/PanelEngine.kt"
          ANGLES="app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt"
          SHELL="app/src/full/java/com/duoopen/shell/DuoShellService.kt"
          BRIDGE="app/src/full/java/com/duoopen/shell/ShizukuBridge.kt"
          PROTOCOL="app/src/full/java/com/duoopen/shell/ShellProtocol.kt"

          for file in \
            "$GRADLE" \
            "$SERVICE" \
            "$HOST" \
            "$PANEL" \
            "$ANGLES" \
            "$SHELL" \
            "$BRIDGE" \
            "$PROTOCOL"
          do
            if [ ! -f "$file" ]; then
              echo "ERROR: missing required materialized file: $file"
              exit 1
            fi
          done

          echo
          echo "Checking version..."

          grep -F \
            'versionCode = 23' \
            "$GRADLE"

          grep -F \
            'versionName = "1.3.19-zfold7-stability"' \
            "$GRADLE"

          echo
          echo "Checking materialized Fold7 continuity architecture..."

          grep -F \
            'physical-resolve reason=' \
            "$SERVICE"

          grep -F \
            'COVER_WAKE_TRAVEL_DEG' \
            "$SERVICE"

          grep -F \
            'REQUEST_DISPLAY_POWER = 10' \
            "$PROTOCOL"

          grep -F \
            'requestDisplayPowerInternal' \
            "$SHELL"

          grep -F \
            'fun requestDisplayPower(' \
            "$BRIDGE"

          grep -F \
            'DisplayMirrorHost' \
            "$SERVICE"

          grep -F \
            'setGeometry' \
            "$HOST"

          echo
          echo "Checking automatic geometry-continuity arm..."

          grep -F \
            'continuityAutoArmAttempted' \
            "$SERVICE"

          grep -F \
            'if (!continuityAutoArmAttempted)' \
            "$SERVICE"

          grep -F \
            'armGeometryContinuity()' \
            "$SERVICE"

          echo
          echo "Checking 1.3.19 stability fixes..."

          # Safe 1.3.18 improvement retained.
          grep -F \
            'host seeded hinge=' \
            "$SERVICE"

          # Samsung display callbacks are coalesced before topology resolution.
          grep -F \
            'display callbacks coalesced reason=' \
            "$SERVICE"

          grep -F \
            'DISPLAY_SYNC_DEBOUNCE_MS' \
            "$SERVICE"

          # The angle source is deliberately the stable, default-display-only
          # implementation from the materialized baseline.
          grep -F \
            'dm.getDisplay(Display.DEFAULT_DISPLAY)' \
            "$ANGLES"

          # The stable reader only accepts visible FoldInteractive responses.
          grep -F \
            'isVisible=true' \
            "$SHELL"

          # Reject the experimental 1.3.18 multi-anchor / hidden-angle logic.
          if grep -F \
            'AnchorBinding' \
            "$ANGLES"
          then
            echo "ERROR: 1.3.18 multi-anchor logic is present."
            exit 1
          fi

          if grep -F \
            'hiddenTrusted' \
            "$SHELL"
          then
            echo "ERROR: 1.3.18 hidden-angle bootstrap logic is present."
            exit 1
          fi

          # The watchdog must not directly schedule a mirror geometry refresh.
          if grep -F \
            'cover-power:$reason' \
            "$SERVICE"
          then
            echo "ERROR: watchdog-driven mirror refresh is still present."
            exit 1
          fi

          echo
          echo "Checking source formatting..."

          git diff --check

          echo
          echo "Fold7 1.3.19 source validation passed."

      - name: Compile and run unit tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

      - name: Prepare 1.3.19 field-test APK
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="fold7-build"
          mkdir -p "$OUTPUT_DIR"

          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Full debug APK was not found."
            exit 1
          fi

          OUTPUT_APK="$OUTPUT_DIR/DuoOpen-ZFold7-1.3.19-stability-debug.apk"

          cp \
            "$APK" \
            "$OUTPUT_APK"

          sha256sum \
            "$OUTPUT_APK" \
            > "$OUTPUT_DIR/APK-SHA256-1.3.19.txt"

          MATERIALIZED_BASE="$(
            git rev-parse HEAD
          )"

          OVERLAY_MAIN="$(
            git rev-parse refs/remotes/origin/main
          )"

          {
            echo "version=1.3.19-zfold7-stability"
            echo "versionCode=23"
            echo
            echo "target=Samsung Galaxy Z Fold7"
            echo "innerGeometry=1968x2184"
            echo "coverGeometry=1080x2520"
            echo
            echo "materializedBase=${MATERIALIZED_BASE}"
            echo "overlayMain=${OVERLAY_MAIN}"
            echo "historicalReplay=false"
            echo
            echo "1.3.19 stability pass:"
            echo "- left-pane mirror geometry unchanged"
            echo "- stable baseline WallpaperAngleFeed restored exactly"
            echo "- stable baseline DuoShellService restored exactly"
            echo "- no dual-panel wallpaper anchors"
            echo "- no hidden FoldInteractive angle bootstrap"
            echo "- display topology callbacks coalesced"
            echo "- watchdog no longer drives mirror geometry refresh"
            echo "- mirror host seeded with latest hinge angle"
            echo
            echo "APK:"
            sha256sum "$OUTPUT_APK"
          } > "$OUTPUT_DIR/BUILD-INFO-1.3.19.txt"

          cat "$OUTPUT_DIR/BUILD-INFO-1.3.19.txt"

      - name: Upload 1.3.19 field-test APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-1.3.19-stability
          path: |
            fold7-build/DuoOpen-ZFold7-1.3.19-stability-debug.apk
            fold7-build/APK-SHA256-1.3.19.txt
            fold7-build/BUILD-INFO-1.3.19.txt
          if-no-files-found: error
          retention-days: 30
