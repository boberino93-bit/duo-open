name: Build Materialized Fold7 1.3.20 Realtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-materialized-fold7.yml"

permissions:
  contents: read

concurrency:
  group: build-materialized-fold7-1320-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout clean materialized baseline
        uses: actions/checkout@v4
        with:
          ref: generated/fold7-1.3.16-baseline
          fetch-depth: 0

      - name: Overlay latest stable Fold7 controller
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            main:refs/remotes/origin/main

          echo "materialized_base=$(git rev-parse HEAD)"
          echo "overlay_main=$(git rev-parse refs/remotes/origin/main)"

          git show \
            "refs/remotes/origin/main:app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt" \
            > app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt

      - name: Apply 1.3.20 realtime architecture
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding="utf-8")

          def sub_once(value: str, pattern: str, repl: str, label: str, flags=re.DOTALL) -> str:
              out, count = re.subn(pattern, lambda _: repl, value, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return out

          def must_not_contain(value: str, needle: str, label: str) -> None:
              if needle in value:
                  raise SystemExit(f"{label}: unexpected token remains: {needle}")

          gradle_path = "app/build.gradle.kts"
          gradle = read(gradle_path)
          gradle = sub_once(
              gradle,
              r'versionCode\s*=\s*\d+',
              'versionCode = 24',
              "versionCode",
          )
          gradle = sub_once(
              gradle,
              r'versionName\s*=\s*"[^"]+"',
              'versionName = "1.3.20-zfold7-realtime"',
              "versionName",
          )
          write(gradle_path, gradle)

          service_path = "app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt"
          service = read(service_path)

          service = sub_once(
              service,
              r'''    private var lastCoverLogicalId\s*=\s*-1''',
              '''    private var lastCoverLogicalId =
                  -1

              private var coverRoutePrimeAttempted =
                  false''',
              "cover route prime state",
          )

          for event in ("added", "removed", "changed"):
              service = sub_once(
                  service,
                  rf'''
          \s*scheduleDisplayProbe\(
          \s*"display-{event}:\$displayId"
          \s*\)
          ''',
                  "\n",
                  f"remove automatic display-{event} probe",
              )

          service = sub_once(
              service,
              r'''        instance = this
          ''',
              '''        instance = this

                  PersistentRuntimeService.ensureRunning(
                      this
                  )
          ''',
              "start persistent runtime",
          )

          service = sub_once(
              service,
              r'''
          \s*scheduleDisplayProbe\(
          \s*"shizuku-ready",
          \s*delayMs = 800L,
          \s*\)
          ''',
              '''
                              primeCoverRoute(
                                  "shizuku-ready"
                              )
          ''',
              "replace Shizuku-ready deep probe",
          )

          service = sub_once(
              service,
              r'''
          \s*scheduleDisplayProbe\(
          \s*"service-connected",
          \s*delayMs = 1_000L,
          \s*\)
          ''',
              "\n",
              "remove service-connected deep probe",
          )

          prime_method = r'''    private fun primeCoverRoute(
                  reason: String,
              ) {
                  if (
                      coverRoutePrimeAttempted ||
                      !ShizukuBridge.ready
                  ) {
                      return
                  }

                  coverRoutePrimeAttempted =
                      true

                  scope.launch(
                      Dispatchers.IO
                  ) {
                      val result =
                          ShizukuBridge.resolveCoverDisplay()

                      val target =
                          result?.getInt(
                              "targetDisplayId",
                              -1,
                          ) ?: -1

                      val ok =
                          result?.getBoolean(
                              "ok",
                              false,
                          ) == true

                      handler.post {
                          if (target >= 0) {
                              lastCoverLogicalId =
                                  target
                          }
                      }

                      DuoDiagnostics.event(
                          "cover-route",
                          "prime reason=$reason target=$target ok=$ok",
                      )
                  }
              }

          '''

          service = sub_once(
              service,
              r'''    private fun assertCoverPower\(''',
              prime_method + '''    private fun assertCoverPower(''',
              "insert cover route priming method",
          )

          service = sub_once(
              service,
              r'''        if \(
          \s*angle >=
          \s*openReferenceAngle -
          \s*COVER_RELEASE_OPEN_DEG
          \s*\) \{
          \s*releaseCoverPowerHold\(
          \s*"returned-open"
          \s*\)
          \s*return
          \s*\}
          ''',
              '''        val openingSample =
                      !previous.isNaN() &&
                          angle - previous >=
                              COVER_SAMPLE_EPSILON_DEG

                  if (
                      openingSample &&
                      angle >=
                          COVER_RELEASE_OPEN_MIN_DEG
                  ) {
                      releaseCoverPowerHold(
                          "returned-open"
                      )
                      return
                  }
          ''',
              "absolute near-flat returned-open release",
          )

          service = service.replace(
              'releaseOpenDeg=$COVER_RELEASE_OPEN_DEG',
              'releaseOpenMinDeg=$COVER_RELEASE_OPEN_MIN_DEG',
          )

          must_not_contain(
              service,
              "releaseOpenDeg=$COVER_RELEASE_OPEN_DEG",
              "release threshold diagnostic",
          )

          release_start = service.index(
              "    private fun releaseCoverPowerHold("
          )
          release_end = service.index(
              "    private fun armGeometryContinuity(",
              release_start,
          )

          release_section = service[
              release_start:release_end
          ]

          release_section = sub_once(
              release_section,
              r'''ShizukuBridge\.resetSecondaryDisplay\(\)''',
              '''ShizukuBridge.resetSecondaryDisplay(
                          releaseTarget
                      )''',
              "route-aware release reset",
          )

          service = (
              service[:release_start] +
              release_section +
              service[release_end:]
          )

          arm_start = service.index(
              "    private fun armGeometryContinuity("
          )
          arm_end = service.index(
              "    private fun handleContinuityHinge(",
              arm_start,
          )

          arm_section = service[
              arm_start:arm_end
          ]

          arm_section = sub_once(
              arm_section,
              r'''ShizukuBridge\.resetSecondaryDisplay\(\)''',
              '''ShizukuBridge.resetSecondaryDisplay(
                          -1
                      )''',
              "route-aware arm reset",
          )

          service = (
              service[:arm_start] +
              arm_section +
              service[arm_end:]
          )

          start = service.index(
              "    fun runSecondaryDisplayExperiment("
          )
          end = service.index(
              "    private fun scheduleMirrorRefresh(",
              start,
          )

          secondary = service[start:end]

          secondary = sub_once(
              secondary,
              r'''        scope\.launch\(Dispatchers\.IO\) \{''',
              '''        val targetHint =
                      resolveCoverLogicalId()

                  scope.launch(Dispatchers.IO) {''',
              "capture target hint",
          )

          secondary = sub_once(
              secondary,
              r'''ShizukuBridge\.enableSecondaryDisplay\(\)''',
              '''ShizukuBridge.enableSecondaryDisplay(
                              targetHint
                          )''',
              "route-aware enable",
          )

          secondary = sub_once(
              secondary,
              r'''ShizukuBridge\.resetSecondaryDisplay\(\)''',
              '''ShizukuBridge.resetSecondaryDisplay(
                              targetHint
                          )''',
              "route-aware reset",
          )

          secondary = sub_once(
              secondary,
              r'''            if \(
          \s*enable &&
          \s*target >= 0
          \s*\) \{
          \s*lastCoverLogicalId =
          \s*target

          \s*if \(coverPowerHold\) \{
          .*?
          \s*\}
          \s*\}
          ''',
              '''            if (
                          enable &&
                          target >= 0
                      ) {
                          lastCoverLogicalId =
                              target
                      }
          ''',
              "remove duplicate post-enable power assertion",
          )

          secondary = secondary.replace(
              '''                    enable ->
                                  "The enable command returned without an error, but " +
                                      "display $target is not exposed as active yet."''',
              '''                    enable ->
                                  "Fast enable accepted for display $target; " +
                                      "waiting for the Fold7 topology callback."''',
          )

          secondary = sub_once(
              secondary,
              r'''            if \(
          \s*enable &&
          \s*ok &&
          \s*visibleAfter
          \s*\) \{''',
              '''            if (
                          enable &&
                          ok
                      ) {''',
              "make enable completion asynchronous",
          )

          secondary = sub_once(
              secondary,
              r'''            DuoDiagnostics\.event\(
          \s*"dual-shell",
          \s*"afterDisplays=" \+
          .*?
          \s*\)

          \s*DuoDiagnostics\.event\(
          \s*"dual-shell",
          \s*"afterPhysical=" \+
          .*?
          \s*\)

          ''',
              '',
              "remove automatic afterDisplays/afterPhysical logging",
          )

          secondary = sub_once(
              secondary,
              r'''            scheduleDisplayProbe\(
          \s*if \(enable\) \{
          \s*"service-dual-enable"
          \s*\} else \{
          \s*"service-dual-reset"
          \s*\},
          \s*delayMs = 750L,
          \s*\)
          ''',
              '',
              "remove post-enable display probe",
          )

          service = (
              service[:start] +
              secondary +
              service[end:]
          )

          service = sub_once(
              service,
              r'''        private const val DISPLAY_SYNC_DEBOUNCE_MS\s*=\s*48L

          \s*private const val MIRROR_REBIND_DEBOUNCE_MS\s*=\s*80L''',
              '''        private const val DISPLAY_SYNC_DEBOUNCE_MS =
                      24L

                  private const val MIRROR_REBIND_DEBOUNCE_MS =
                      16L''',
              "reduce topology/rebind debounce",
          )

          service = sub_once(
              service,
              r'''        private const val COVER_RELEASE_OPEN_DEG\s*=\s*1\.5f''',
              '''        private const val COVER_RELEASE_OPEN_MIN_DEG =
                      175.0f''',
              "absolute near-flat release constant",
          )

          must_not_contain(
              service,
              "COVER_RELEASE_OPEN_DEG",
              "old relative release threshold",
          )

          write(
              service_path,
              service,
          )

          bridge_path = (
              "app/src/full/java/com/duoopen/shell/"
              "ShizukuBridge.kt"
          )

          bridge = read(
              bridge_path
          )

          bridge = bridge.replace(
              ".daemon(false)",
              ".daemon(true)",
              1,
          )

          must_not_contain(
              bridge,
              ".daemon(false)",
              "Shizuku daemon mode",
          )

          bridge = sub_once(
              bridge,
              r'''    /\*\* Blocking; call off the main thread\. \*/
              fun enableSecondaryDisplay\(\): Bundle\? =
                  call\(
                      ShellProtocol\.ENABLE_SECONDARY_DISPLAY
                  \)

              /\*\* Blocking; call off the main thread\. \*/
              fun resetSecondaryDisplay\(\): Bundle\? =
                  call\(
                      ShellProtocol\.RESET_SECONDARY_DISPLAY
                  \)
          ''',
              '''    /** Blocking; call off the main thread. */
              fun resolveCoverDisplay(): Bundle? =
                  call(
                      ShellProtocol.RESOLVE_COVER_DISPLAY
                  )

              /** Blocking; call off the main thread. */
              fun enableSecondaryDisplay(
                  displayIdHint: Int,
              ): Bundle? =
                  call(
                      ShellProtocol.ENABLE_SECONDARY_DISPLAY
                  ) { parcel ->
                      parcel.writeInt(
                          displayIdHint
                      )
                  }

              /** Blocking; call off the main thread. */
              fun resetSecondaryDisplay(
                  displayIdHint: Int,
              ): Bundle? =
                  call(
                      ShellProtocol.RESET_SECONDARY_DISPLAY
                  ) { parcel ->
                      parcel.writeInt(
                          displayIdHint
                      )
                  }
          ''',
              "route-aware Shizuku bridge calls",
          )

          write(
              bridge_path,
              bridge,
          )

          protocol_path = (
              "app/src/full/java/com/duoopen/shell/"
              "ShellProtocol.kt"
          )

          write(
              protocol_path,
              r'''package com.duoopen.shell

          object ShellProtocol {
              const val TOKEN = "com.duoopen.shell.DuoShellService"
              const val CALLBACK_TOKEN = "com.duoopen.shell.AngleCallback"

              const val PING = 1
              const val CAPTURE = 2
              const val START_ANGLES = 3
              const val STOP_ANGLES = 4
              const val ANGLE_STATUS = 5
              const val DISPLAY_PROBE = 6
              const val ENABLE_SECONDARY_DISPLAY = 7
              const val RESET_SECONDARY_DISPLAY = 8
              const val MIRROR_DISPLAY = 9
              const val REQUEST_DISPLAY_POWER = 10
              const val RESOLVE_COVER_DISPLAY = 11

              const val CB_ANGLE = 1
          }
          ''',
          )

          shell_path = (
              "app/src/full/java/com/duoopen/shell/"
              "DuoShellService.kt"
          )

          shell = read(
              shell_path
          )

          shell = sub_once(
              shell,
              r'''    private var liveMirror: SurfaceControl\? = null''',
              '''    private var liveMirror: SurfaceControl? = null

              @Volatile
              private var cachedCoverDisplayId =
                  -1''',
              "shell cover route cache",
          )

          shell = sub_once(
              shell,
              r'''            ShellProtocol\.ENABLE_SECONDARY_DISPLAY -> \{.*?            ShellProtocol\.MIRROR_DISPLAY -> \{''',
              '''            ShellProtocol.ENABLE_SECONDARY_DISPLAY -> {
                          val targetHint =
                              if (
                                  data.dataAvail() >=
                                      Integer.BYTES
                              ) {
                                  data.readInt()
                              } else {
                                  -1
                              }

                          val identity =
                              clearCallingIdentity()

                          val result =
                              try {
                                  secondaryDisplayCommand(
                                      enable = true,
                                      targetHint = targetHint,
                                  )
                              } catch (t: Throwable) {
                                  Bundle().apply {
                                      putBoolean("ok", false)
                                      putString(
                                          "error",
                                          "${t.javaClass.simpleName}: ${t.message}",
                                      )
                                  }
                              } finally {
                                  restoreCallingIdentity(identity)
                              }

                          out.writeNoException()
                          out.writeBundle(result)
                      }

                      ShellProtocol.RESET_SECONDARY_DISPLAY -> {
                          val targetHint =
                              if (
                                  data.dataAvail() >=
                                      Integer.BYTES
                              ) {
                                  data.readInt()
                              } else {
                                  -1
                              }

                          val identity =
                              clearCallingIdentity()

                          val result =
                              try {
                                  secondaryDisplayCommand(
                                      enable = false,
                                      targetHint = targetHint,
                                  )
                              } catch (t: Throwable) {
                                  Bundle().apply {
                                      putBoolean("ok", false)
                                      putString(
                                          "error",
                                          "${t.javaClass.simpleName}: ${t.message}",
                                      )
                                  }
                              } finally {
                                  restoreCallingIdentity(identity)
                              }

                          out.writeNoException()
                          out.writeBundle(result)
                      }

                      ShellProtocol.RESOLVE_COVER_DISPLAY -> {
                          val identity =
                              clearCallingIdentity()

                          val result =
                              try {
                                  resolveCoverDisplay()
                              } catch (t: Throwable) {
                                  Bundle().apply {
                                      putBoolean("ok", false)
                                      putInt(
                                          "targetDisplayId",
                                          -1,
                                      )
                                      putString(
                                          "error",
                                          "${t.javaClass.simpleName}: ${t.message}",
                                      )
                                  }
                              } finally {
                                  restoreCallingIdentity(identity)
                              }

                          out.writeNoException()
                          out.writeBundle(result)
                      }

                      ShellProtocol.MIRROR_DISPLAY -> {''',
              "secondary-display binder transactions",
          )

          new_secondary = r'''    // ---- Fold7 cover-route / realtime secondary display --------------------

              private fun resolveCoverDisplay(): Bundle {
                  val targetId =
                      resolveFold7CoverDisplayId(
                          targetHint = -1
                      )

                  return Bundle().apply {
                      putBoolean(
                          "ok",
                          targetId >= 0,
                      )
                      putInt(
                          "targetDisplayId",
                          targetId,
                      )
                      putInt(
                          "targetWidth",
                          1080,
                      )
                      putInt(
                          "targetHeight",
                          2520,
                      )

                      if (targetId < 0) {
                          putString(
                              "error",
                              "The physical Fold7 cover route (1080x2520) was not found.",
                          )
                      }
                  }
              }

              private fun resolveFold7CoverDisplayId(
                  targetHint: Int,
              ): Int {
                  if (targetHint >= 0) {
                      cachedCoverDisplayId =
                          targetHint

                      return targetHint
                  }

                  if (cachedCoverDisplayId >= 0) {
                      return cachedCoverDisplayId
                  }

                  val windowDisplays =
                      runProbe(
                          "dumpsys window displays | " +
                              "grep -E '^[[:space:]]*Display: mDisplayId=|" +
                              "^[[:space:]]*init='"
                      )

                  val target =
                      Regex(
                          "Display: mDisplayId=(\\d+).*?init=(\\d+)x(\\d+)",
                          setOf(
                              RegexOption.DOT_MATCHES_ALL
                          ),
                      ).findAll(
                          windowDisplays
                      ).mapNotNull { match ->
                          val id =
                              match.groupValues[1]
                                  .toIntOrNull()
                                  ?: return@mapNotNull null

                          val width =
                              match.groupValues[2]
                                  .toIntOrNull()
                                  ?: return@mapNotNull null

                          val height =
                              match.groupValues[3]
                                  .toIntOrNull()
                                  ?: return@mapNotNull null

                          Triple(
                              id,
                              width,
                              height,
                          )
                      }.firstOrNull { (_, width, height) ->
                          width == 1080 &&
                              height == 2520
                      }

                  val targetId =
                      target?.first
                          ?: -1

                  if (targetId >= 0) {
                      cachedCoverDisplayId =
                          targetId
                  }

                  return targetId
              }

              private fun secondaryDisplayCommand(
                  enable: Boolean,
                  targetHint: Int,
              ): Bundle {
                  val t0 =
                      SystemClock.elapsedRealtime()

                  val targetId =
                      resolveFold7CoverDisplayId(
                          targetHint
                      )

                  if (targetId < 0) {
                      return Bundle().apply {
                          putBoolean("ok", false)
                          putInt(
                              "targetDisplayId",
                              -1,
                          )
                          putInt(
                              "targetWidth",
                              1080,
                          )
                          putInt(
                              "targetHeight",
                              2520,
                          )
                          putString(
                              "error",
                              "The physical Fold7 cover route (1080x2520) was not found.",
                          )
                      }
                  }

                  if (!enable) {
                      val command =
                          "cmd display power-reset $targetId"

                      val output =
                          runProbe(command)

                      val failed =
                          output.contains(
                              "Exception",
                              ignoreCase = true,
                          ) ||
                              output.contains(
                                  "error",
                                  ignoreCase = true,
                              ) ||
                              output.contains(
                                  "not possible",
                                  ignoreCase = true,
                              )

                      return Bundle().apply {
                          putBoolean("ok", !failed)
                          putBoolean("enable", false)
                          putInt("targetDisplayId", targetId)
                          putInt("targetWidth", 1080)
                          putInt("targetHeight", 2520)
                          putBoolean("visibleAfter", false)
                          putString("command", command)
                          putString("commandOutput", output)
                          putLong(
                              "latencyMs",
                              SystemClock.elapsedRealtime() -
                                  t0,
                          )
                      }
                  }

                  var routeEnabled =
                      false

                  var routeError:
                      String? =
                      null

                  runCatching {
                      enableConnectedDisplayInternal(
                          targetId
                      )

                      routeEnabled =
                          true
                  }.onFailure { error ->
                      routeError =
                          "${error.javaClass.simpleName}: ${error.message}"
                  }

                  val powered =
                      runCatching {
                          requestDisplayPowerInternal(
                              targetId,
                              android.view.Display.STATE_ON,
                          )
                      }.getOrDefault(
                          false
                      )

                  return Bundle().apply {
                      putBoolean(
                          "ok",
                          routeEnabled ||
                              powered,
                      )
                      putBoolean("enable", true)
                      putInt("targetDisplayId", targetId)
                      putInt("targetWidth", 1080)
                      putInt("targetHeight", 2520)
                      putBoolean("visibleAfter", false)
                      putBoolean("routeEnabled", routeEnabled)
                      putBoolean("immediatePowerOn", powered)
                      putString(
                          "command",
                          "IDisplayManager.enableConnectedDisplay + requestDisplayPower(ON)",
                      )
                      putString(
                          "commandOutput",
                          routeError
                              ?: "binder-fast-path",
                      )
                      putLong(
                          "latencyMs",
                          SystemClock.elapsedRealtime() -
                              t0,
                      )
                  }
              }

              // ---- live logical-display mirror ---------------------------------------'''

          shell = sub_once(
              shell,
              r'''    // ---- one-shot Fold7 secondary display experiment -+\n.*?    // ---- live logical-display mirror -+''',
              new_secondary,
              "replace slow secondary-display implementation",
          )

          must_not_contain(
              shell,
              "Thread.sleep(600L)",
              "600ms secondary-display sleep",
          )

          must_not_contain(
              shell,
              "Thread.sleep(40L)",
              "40ms secondary-display sleep",
          )

          write(
              shell_path,
              shell,
          )

          app_path = (
              "app/src/main/java/com/duoopen/"
              "DuoApplication.kt"
          )

          write(
              app_path,
              r'''package com.duoopen

          import android.app.ActivityManager
          import android.app.Application
          import com.duoopen.debug.DuoDiagnostics
          import com.duoopen.settings.DuoSettings

          class DuoApplication : Application() {
              override fun onCreate() {
                  super.onCreate()

                  DuoDiagnostics.init(this)
                  logPreviousProcessExit()
                  DuoSettings.init(this)
                  com.duoopen.overlay.OverlayFeature.initProcess(this)
              }

              private fun logPreviousProcessExit() {
                  val manager =
                      getSystemService(
                          ActivityManager::class.java
                      ) ?: return

                  val previous =
                      runCatching {
                          manager
                              .getHistoricalProcessExitReasons(
                                  packageName,
                                  0,
                                  3,
                              )
                              .firstOrNull()
                      }.getOrNull()
                          ?: return

                  val ageMs =
                      (
                          System.currentTimeMillis() -
                              previous.timestamp
                          ).coerceAtLeast(
                          0L
                      )

                  DuoDiagnostics.event(
                      "process-exit",
                      "previous reason=${previous.reason} " +
                          "status=${previous.status} " +
                          "importance=${previous.importance} " +
                          "ageMs=$ageMs " +
                          "description=${previous.description ?: "(none)"}",
                  )
              }
          }
          ''',
          )

          runtime_path = Path(
              "app/src/full/java/com/duoopen/overlay/PersistentRuntimeService.kt"
          )

          runtime_path.write_text(
              r'''package com.duoopen.overlay

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import androidx.core.content.ContextCompat
          import com.duoopen.R
          import com.duoopen.debug.DuoDiagnostics

          class PersistentRuntimeService :
              Service() {

              override fun onCreate() {
                  super.onCreate()

                  val manager =
                      getSystemService(
                          NotificationManager::class.java
                      )

                  manager.createNotificationChannel(
                      NotificationChannel(
                          CHANNEL_ID,
                          "Duo Open continuity",
                          NotificationManager.IMPORTANCE_LOW,
                      ).apply {
                          description =
                              "Keeps Fold7 display continuity ready during fold transitions."
                          setShowBadge(false)
                      }
                  )

                  val notification =
                      Notification.Builder(
                          this,
                          CHANNEL_ID,
                      )
                          .setSmallIcon(
                              R.mipmap.ic_launcher
                          )
                          .setContentTitle(
                              "Duo Open is ready"
                          )
                          .setContentText(
                              "Fold7 continuity controller is running."
                          )
                          .setCategory(
                              Notification.CATEGORY_SERVICE
                          )
                          .setOngoing(true)
                          .build()

                  if (
                      Build.VERSION.SDK_INT >=
                          34
                  ) {
                      startForeground(
                          NOTIFICATION_ID,
                          notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE,
                      )
                  } else {
                      startForeground(
                          NOTIFICATION_ID,
                          notification,
                      )
                  }

                  DuoDiagnostics.event(
                      "runtime",
                      "foreground continuity runtime started",
                  )
              }

              override fun onStartCommand(
                  intent: Intent?,
                  flags: Int,
                  startId: Int,
              ): Int =
                  START_STICKY

              override fun onBind(
                  intent: Intent?,
              ): IBinder? =
                  null

              override fun onDestroy() {
                  DuoDiagnostics.event(
                      "runtime",
                      "foreground continuity runtime destroyed",
                  )

                  super.onDestroy()
              }

              companion object {
                  private const val CHANNEL_ID =
                      "duoopen_fold7_continuity"

                  private const val NOTIFICATION_ID =
                      1320

                  fun ensureRunning(
                      context: Context,
                  ) {
                      runCatching {
                          ContextCompat.startForegroundService(
                              context,
                              Intent(
                                  context,
                                  PersistentRuntimeService::class.java,
                              ),
                          )
                      }.onFailure { error ->
                          DuoDiagnostics.event(
                              "runtime",
                              "foreground start failed",
                              error,
                          )
                      }
                  }
              }
          }
          ''',
              encoding="utf-8",
          )

          manifest_path = "app/src/full/AndroidManifest.xml"

          write(
              manifest_path,
              r'''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />

              <queries>
                  <package android:name="moe.shizuku.privileged.api" />
              </queries>

              <application>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />

                  <service
                      android:name=".overlay.PersistentRuntimeService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Samsung Galaxy Z Fold7 hinge-driven display continuity controller" />
                  </service>

                  <service
                      android:name=".overlay.FoldOverlayService"
                      android:exported="true"
                      android:label="@string/accessibility_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/duo_accessibility" />
                  </service>
              </application>
          </manifest>
          ''',
          )

          print("1.3.20 realtime transformation complete")
          PY

          echo
          git diff --stat
          git diff --check

      - name: Validate Fold7 1.3.20 realtime source
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="app/build.gradle.kts"
          SERVICE="app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt"
          HOST="app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt"
          ANGLES="app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt"
          SHELL="app/src/full/java/com/duoopen/shell/DuoShellService.kt"
          BRIDGE="app/src/full/java/com/duoopen/shell/ShizukuBridge.kt"
          PROTOCOL="app/src/full/java/com/duoopen/shell/ShellProtocol.kt"
          RUNTIME="app/src/full/java/com/duoopen/overlay/PersistentRuntimeService.kt"
          MANIFEST="app/src/full/AndroidManifest.xml"
          APP="app/src/main/java/com/duoopen/DuoApplication.kt"

          for file in \
            "$GRADLE" \
            "$SERVICE" \
            "$HOST" \
            "$ANGLES" \
            "$SHELL" \
            "$BRIDGE" \
            "$PROTOCOL" \
            "$RUNTIME" \
            "$MANIFEST" \
            "$APP"
          do
            test -f "$file" || {
              echo "ERROR: missing $file"
              exit 1
            }
          done

          grep -F 'versionCode = 24' "$GRADLE"
          grep -F 'versionName = "1.3.20-zfold7-realtime"' "$GRADLE"

          # Preserve the working mirror architecture and left-pane crop.
          grep -F 'DisplayMirrorHost' "$SERVICE"
          grep -F 'setGeometry' "$HOST"
          grep -F 'paneWidth' "$HOST"

          # The mirror may only be released when physically near-flat.
          grep -F 'COVER_RELEASE_OPEN_MIN_DEG' "$SERVICE"
          grep -F '175.0f' "$SERVICE"
          grep -F 'openingSample' "$SERVICE"

          if grep -F 'COVER_RELEASE_OPEN_DEG' "$SERVICE"
          then
            echo "ERROR: relative returned-open threshold remains."
            exit 1
          fi

          # The definition may remain for manual diagnostics, but no automatic
          # caller may launch a deep display probe during a fold.
          PROBE_CALLS="$(
            grep -c 'scheduleDisplayProbe(' "$SERVICE" || true
          )"

          if [ "$PROBE_CALLS" -ne 1 ]; then
            echo "ERROR: automatic deep display probes remain ($PROBE_CALLS references)."
            exit 1
          fi

          # Enable path must be direct binder work with no deliberate waits.
          if grep -F 'Thread.sleep(600L)' "$SHELL"
          then
            echo "ERROR: old 600 ms display-enable wait remains."
            exit 1
          fi

          if grep -F 'Thread.sleep(40L)' "$SHELL"
          then
            echo "ERROR: old 40 ms display-enable wait remains."
            exit 1
          fi

          grep -F 'binder-fast-path' "$SHELL"
          grep -F 'enableConnectedDisplayInternal' "$SHELL"
          grep -F 'RESOLVE_COVER_DISPLAY = 11' "$PROTOCOL"
          grep -F 'resolveCoverDisplay()' "$BRIDGE"

          # Persistent privileged and app runtimes.
          grep -F '.daemon(true)' "$BRIDGE"
          grep -F 'PersistentRuntimeService.ensureRunning' "$SERVICE"
          grep -F 'START_STICKY' "$RUNTIME"
          grep -F 'FOREGROUND_SERVICE_SPECIAL_USE' "$MANIFEST"
          grep -F 'PROPERTY_SPECIAL_USE_FGS_SUBTYPE' "$MANIFEST"

          # A later restart reports Android's own previous-exit classification.
          grep -F 'getHistoricalProcessExitReasons' "$APP"
          grep -F '"process-exit"' "$APP"

          # Keep the stable angle source for this test.
          grep -F 'dm.getDisplay(Display.DEFAULT_DISPLAY)' "$ANGLES"
          grep -F 'isVisible=true' "$SHELL"

          if grep -F 'AnchorBinding' "$ANGLES"
          then
            echo "ERROR: experimental multi-anchor angle source returned."
            exit 1
          fi

          git diff --check

          echo "Fold7 1.3.20 realtime validation passed."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile and run unit tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

      - name: Prepare 1.3.20 field-test APK
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="fold7-build"
          mkdir -p "$OUTPUT_DIR"

          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          test -n "$APK" || {
            echo "ERROR: Full debug APK was not found."
            exit 1
          }

          OUTPUT_APK="$OUTPUT_DIR/DuoOpen-ZFold7-1.3.20-realtime-debug.apk"

          cp \
            "$APK" \
            "$OUTPUT_APK"

          sha256sum \
            "$OUTPUT_APK" \
            > "$OUTPUT_DIR/APK-SHA256-1.3.20.txt"

          {
            echo "version=1.3.20-zfold7-realtime"
            echo "versionCode=24"
            echo
            echo "target=Samsung Galaxy Z Fold7"
            echo "innerGeometry=1968x2184"
            echo "coverGeometry=1080x2520"
            echo
            echo "materializedBase=$(git rev-parse HEAD)"
            echo "overlayMain=$(git rev-parse refs/remotes/origin/main)"
            echo
            echo "1.3.20 realtime pass:"
            echo "- absolute near-flat release at >=175 degrees"
            echo "- no automatic dumpsys display probes in the fold hot path"
            echo "- cover route pre-resolved and cached before motion"
            echo "- direct IDisplayManager cover enable/power fast path"
            echo "- no 40 ms / 600 ms enable sleeps"
            echo "- topology debounce 24 ms; mirror rebind debounce 16 ms"
            echo "- Shizuku UserService daemon=true"
            echo "- foreground START_STICKY app runtime"
            echo "- ApplicationExitInfo previous-exit diagnostics"
            echo "- left-pane SurfaceControl geometry unchanged"
            echo "- stable visible-only/default-display angle source retained"
            echo

            sha256sum \
              "$OUTPUT_APK"
          } > "$OUTPUT_DIR/BUILD-INFO-1.3.20.txt"

          cat "$OUTPUT_DIR/BUILD-INFO-1.3.20.txt"

      - name: Upload 1.3.20 field-test APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-1.3.20-realtime
          path: |
            fold7-build/DuoOpen-ZFold7-1.3.20-realtime-debug.apk
            fold7-build/APK-SHA256-1.3.20.txt
            fold7-build/BUILD-INFO-1.3.20.txt
          if-no-files-found: error
          retention-days: 30
