name: Build Materialized Fold7 1.3.22 Cover Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-materialized-fold7.yml"

permissions:
  contents: read

concurrency:
  group: build-materialized-fold7-1322-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout clean materialized baseline
        uses: actions/checkout@v4
        with:
          ref: generated/fold7-1.3.16-baseline
          fetch-depth: 0

      - name: Fetch pinned validated transforms and inspect main corruption
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            main:refs/remotes/origin/main

          # Pin the exact successful 1.3.21 source/workflow (run #11).
          git show \
            e754d77dec07d61a4d01cf280e69c6ced3b48820:app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt \
            > app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt

          git show \
            e754d77dec07d61a4d01cf280e69c6ced3b48820:.github/workflows/build-materialized-fold7.yml \
            > /tmp/build-materialized-fold7-1.3.21.yml

          git show \
            aea6952c729cd2ed498f7728308d30a3ff4bd82f:.github/workflows/build-materialized-fold7.yml \
            > /tmp/build-materialized-fold7-1.3.20.yml

          # Main is currently corrupt here: DuoShellService.kt is literally the
          # same Gradle text as app/build.gradle.kts. Never import that file.
          git show \
            refs/remotes/origin/main:app/src/full/java/com/duoopen/shell/DuoShellService.kt \
            > /tmp/main-DuoShellService.kt

          git show \
            refs/remotes/origin/main:app/build.gradle.kts \
            > /tmp/main-app-build.gradle.kts

          if cmp -s /tmp/main-DuoShellService.kt /tmp/main-app-build.gradle.kts; then
            echo "::warning::main DuoShellService.kt matches app/build.gradle.kts byte-for-byte; ignoring corrupted main shell source."
          else
            echo "::warning::main DuoShellService.kt no longer exactly matches app/build.gradle.kts; build still uses the clean pinned baseline."
          fi

          grep -F 'package com.duoopen.shell' \
            app/src/full/java/com/duoopen/shell/DuoShellService.kt

          if grep -Fq 'plugins {' \
            app/src/full/java/com/duoopen/shell/DuoShellService.kt; then
            echo "ERROR: baseline DuoShellService.kt contains Gradle configuration."
            exit 1
          fi

          echo "materialized_base=$(git rev-parse HEAD)"
          echo "pinned_1321=e754d77dec07d61a4d01cf280e69c6ced3b48820"

      - name: Reproduce validated 1.3.20 source
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYBASE'
          from pathlib import Path
          import textwrap

          workflow = Path(
              "/tmp/build-materialized-fold7-1.3.20.yml"
          ).read_text(encoding="utf-8")

          marker = "- name: Apply 1.3.20 realtime architecture"
          step = workflow.find(marker)
          if step < 0:
              raise SystemExit("validated 1.3.20 transform step not found")

          token = "python3 - <<'PY'\n"
          start = workflow.find(token, step)
          if start < 0:
              raise SystemExit("1.3.20 Python transform not found")
          start += len(token)

          end = workflow.find("\n          PY", start)
          if end < 0:
              raise SystemExit("1.3.20 Python transform terminator not found")

          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, "fold7_1320_transform.py", "exec"), {})
          PYBASE

          grep -F 'versionCode = 24' app/build.gradle.kts
          grep -F 'versionName = "1.3.20-zfold7-realtime"' app/build.gradle.kts

      - name: Replay exact successful 1.3.21 transform
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY21'
          from pathlib import Path
          import textwrap

          workflow = Path(
              "/tmp/build-materialized-fold7-1.3.21.yml"
          ).read_text(encoding="utf-8")

          marker = "- name: Apply 1.3.21 intentional-motion and physical-panel safety"
          step = workflow.find(marker)
          if step < 0:
              raise SystemExit("validated 1.3.21 transform step not found")

          token = "python3 - <<'PY'\n"
          start = workflow.find(token, step)
          if start < 0:
              raise SystemExit("1.3.21 Python transform not found")
          start += len(token)

          end = workflow.find("\n          PY", start)
          if end < 0:
              raise SystemExit("1.3.21 Python transform terminator not found")

          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, "fold7_1321_transform.py", "exec"), {})
          PY21

          grep -F 'versionCode = 25' app/build.gradle.kts
          grep -F 'versionName = "1.3.21-zfold7-state-machine"' app/build.gradle.kts
          grep -F 'package com.duoopen.shell' app/src/full/java/com/duoopen/shell/DuoShellService.kt

      - name: Apply 1.3.22 cover recovery and inner-open latch
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY22'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, value: str) -> None:
              Path(path).write_text(value, encoding="utf-8")

          def replace_once(value: str, old: str, new: str, label: str) -> str:
              count = value.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly one match, found {count}"
                  )
              return value.replace(old, new, 1)

          # Build identity.
          gradle_path = "app/build.gradle.kts"
          gradle = read(gradle_path)
          gradle = replace_once(
              gradle,
              "versionCode = 25",
              "versionCode = 26",
              "versionCode",
          )
          gradle = replace_once(
              gradle,
              'versionName = "1.3.21-zfold7-state-machine"',
              'versionName = "1.3.22-zfold7-cover-recovery"',
              "versionName",
          )
          write(gradle_path, gradle)

          # FoldOverlayService: inactive-cover prewarm.
          service_path = (
              "app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt"
          )
          service = read(service_path)

          handle_start = service.index(
              "    private fun handleContinuityHinge("
          )
          handle_end = service.index(
              "    fun runSecondaryDisplayExperiment(",
              handle_start,
          )

          new_handle = '''    private fun handleContinuityHinge(
                  angle: Float,
              ) {
                  val previous =
                      lastContinuityAngle
          
                  lastContinuityAngle =
                      angle
          
                  if (!continuityArmed) {
                      return
                  }
          
                  if (openReferenceAngle.isNaN()) {
                      openReferenceAngle =
                          angle
          
                      DuoDiagnostics.event(
                          "cover-power",
                          "baseline=$angle mode=armed",
                      )
          
                      return
                  }
          
                  val closingSample =
                      !previous.isNaN() &&
                          previous - angle >=
                              COVER_SAMPLE_EPSILON_DEG
          
                  val openingSample =
                      !previous.isNaN() &&
                          angle - previous >=
                              COVER_SAMPLE_EPSILON_DEG
          
                  if (
                      openingSample &&
                      previous <=
                          COVER_CLOSED_READY_MAX_DEG
                  ) {
                      DuoDiagnostics.event(
                          "cover-power",
                          "closed-open-start angle=$angle previous=$previous serviceHot=true",
                      )
                  }
          
                  if (!coverPowerHold) {
                      if (angle > openReferenceAngle) {
                          openReferenceAngle =
                              angle
                      }
          
                      /*
                       * CLOSED -> OPEN: the native cover is already the active
                       * screen. Keep the runtime, Shizuku daemon and angle feed
                       * hot while shut; the local cover effect reacts to the
                       * first real opening sample without a shell wake command.
                       *
                       * OPEN -> CLOSED: do not expose anything on the front in
                       * the upper half. Pre-warm the secondary cover around 150°
                       * so it is ready, but keep the live mirror hidden until
                       * the hinge reaches the quarter-fold point (~135°).
                       */
                      if (
                          closingSample &&
                          angle <= COVER_CLOSE_PREWARM_DEG &&
                          angle > COVER_NATIVE_HANDOFF_MAX_DEG
                      ) {
                          /*
                           * The cover is still inactive here. 1.3.21 required it
                           * to already be active before requesting privileged
                           * enable, making prewarm impossible. Mark the hold and
                           * let the shell resolve the fresh inactive 1080x2520
                           * route for this one bounded enable attempt.
                           */
                          coverPowerHold =
                              true
          
                          mirrorRequested =
                              false
          
                          _secondaryDisplayStatus.value =
                              "Closing: requesting validated cover prewarm; visual starts after one-quarter fold travel."
          
                          DuoDiagnostics.event(
                              "cover-power",
                              "closing-prewarm-request angle=$angle " +
                                  "visualStart=$COVER_CLOSE_VISUAL_START_DEG",
                          )
          
                          runSecondaryDisplayExperiment(
                              enable = true,
                              reason = "closing-prewarm",
                          )
                      }
          
                      return
                  }
          
                  if (
                      closingSample &&
                      !mirrorRequested &&
                      angle <= COVER_CLOSE_VISUAL_START_DEG
                  ) {
                      mirrorRequested =
                          true
          
                      DuoDiagnostics.event(
                          "cover-power",
                          "closing-visual-start angle=$angle",
                      )
          
                      syncMirrorHost(
                          "closing-quarter-visual"
                      )
                  }
          
                  if (
                      openingSample &&
                      mirrorRequested &&
                      angle >= COVER_CLOSE_VISUAL_END_DEG
                  ) {
                      mirrorRequested =
                          false
          
                      mirrorHost?.detach()
                      mirrorHost =
                          null
          
                      mirrorHostCreatedUptime =
                          0L
          
                      scope.launch(
                          Dispatchers.IO
                      ) {
                          ShizukuBridge.stopDisplayMirror()
                      }
          
                      DuoDiagnostics.event(
                          "cover-power",
                          "opening-cover-visual-hidden angle=$angle",
                      )
                  }
          
                  if (
                      openingSample &&
                      angle >= COVER_RELEASE_OPEN_MIN_DEG
                  ) {
                      handler.removeCallbacks(
                          openReleaseRunnable
                      )
          
                      handler.postDelayed(
                          openReleaseRunnable,
                          COVER_RELEASE_DWELL_MS,
                      )
                  } else if (
                      angle < COVER_RELEASE_CANCEL_DEG
                  ) {
                      handler.removeCallbacks(
                          openReleaseRunnable
                      )
                  }
          
                  val cover =
                      displayManager.displays
                          .firstOrNull { candidate ->
                              val mode = candidate.mode
                              mode.physicalWidth == 1080 &&
                                  mode.physicalHeight == 2520
                          }
          
                  val inner =
                      displayManager.displays
                          .firstOrNull { candidate ->
                              val mode = candidate.mode
                              mode.physicalWidth == 1968 &&
                                  mode.physicalHeight == 2184
                          }
          
                  val nativeCover =
                      cover?.displayId == Display.DEFAULT_DISPLAY &&
                          cover.state != Display.STATE_OFF &&
                          cover.state != Display.STATE_UNKNOWN &&
                          (
                              inner == null ||
                                  inner.state == Display.STATE_OFF ||
                                  inner.state == Display.STATE_UNKNOWN
                              )
          
                  if (
                      nativeCover &&
                      angle <= COVER_NATIVE_HANDOFF_MAX_DEG
                  ) {
                      handler.removeCallbacks(
                          openReleaseRunnable
                      )
          
                      releaseCoverPowerHold(
                          "native-cover-handoff"
                      )
                  }
              }
          
          '''

          service = (
              service[:handle_start]
              + new_handle
              + service[handle_end:]
          )

          service = replace_once(
              service,
              '''        val targetHint =
                      resolveCurrentSecondaryCoverLogicalId()

                  if (
                      enable &&
                      targetHint < 0
                  ) {
                      _secondaryDisplayStatus.value =
                          "Fold7 cover route is changing; unsafe enable skipped."

                      DuoDiagnostics.event(
                          "dual-shell",
                          "skip enable reason=$reason; no stable secondary cover route",
                      )

                      return
                  }
          ''',
              '''        val targetHint =
                      if (enable) {
                          -1
                      } else {
                          resolveCurrentSecondaryCoverLogicalId()
                      }
          ''',
              "enable uses fresh inactive route",
          )

          service = replace_once(
              service,
              '''            if (
                          enable &&
                          target >= 0 &&
                          target ==
                              resolveCurrentSecondaryCoverLogicalId()
                      ) {
                          lastCoverLogicalId =
                              target
                      }
          ''',
              '''            if (enable) {
                          DuoDiagnostics.event(
                              "cover-power",
                              "prewarm-result target=$target ok=$ok",
                          )

                          if (!ok) {
                              handler.post {
                                  coverPowerHold =
                                      false

                                  mirrorRequested =
                                      false

                                  mirrorHost?.detach()
                                  mirrorHost =
                                      null

                                  mirrorHostCreatedUptime =
                                      0L
                              }
                          }
                      }
          ''',
              "never retain remapped logical target",
          )

          write(service_path, service)

          # DuoShellService: replace only the Fold7 route/power section.
          # Main's corrupted file is never read here.
          shell_path = (
              "app/src/full/java/com/duoopen/shell/DuoShellService.kt"
          )
          shell = read(shell_path)

          if not shell.lstrip().startswith("package com.duoopen.shell"):
              raise SystemExit("DuoShellService.kt is not Kotlin shell source")
          if "plugins {" in shell:
              raise SystemExit("DuoShellService.kt contains Gradle configuration")

          secondary_start = shell.index(
              "    // ---- Fold7 physical-panel-safe continuity"
          )
          secondary_end = shell.index(
              "    // ---- live logical-display mirror",
              secondary_start,
          )

          safe_secondary = r'''    // ---- Fold7 physical-panel-safe continuity ----------------------------

              private fun displayInfoForLogicalId(
                  logicalDisplayId: Int,
              ): Any? {
                  if (logicalDisplayId < 0) return null

                  return runCatching {
                      Class.forName(
                          "android.hardware.display.IDisplayManager"
                      ).getMethod(
                          "getDisplayInfo",
                          Integer.TYPE,
                      ).invoke(
                          displayManagerService(),
                          logicalDisplayId,
                      )
                  }.getOrNull()
              }

              private fun currentCoverLogicalId(
                  targetHint: Int,
              ): Int {
                  if (
                      targetHint < 0 ||
                      targetHint == Display.DEFAULT_DISPLAY
                  ) {
                      return -1
                  }

                  val info =
                      displayInfoForLogicalId(targetHint)
                          ?: return -1

                  val width =
                      runCatching {
                          info.javaClass
                              .getField("logicalWidth")
                              .getInt(info)
                      }.getOrDefault(-1)

                  val height =
                      runCatching {
                          info.javaClass
                              .getField("logicalHeight")
                              .getInt(info)
                      }.getOrDefault(-1)

                  return if (width == 1080 && height == 2520) {
                      targetHint
                  } else {
                      -1
                  }
              }

              /**
               * Resolve the cover while it is still inactive. This is fresh on
               * every enable attempt. No logical display id is retained.
               */
              private fun resolveInactiveCoverLogicalId(
                  targetHint: Int,
              ): Int {
                  val hinted =
                      currentCoverLogicalId(targetHint)

                  if (hinted >= 0) return hinted

                  val windowDisplays =
                      runProbe(
                          "dumpsys window displays | " +
                              "grep -E '^[[:space:]]*Display: mDisplayId=|" +
                              "^[[:space:]]*init='"
                      )

                  val candidates =
                      Regex(
                          "Display: mDisplayId=(\\d+).*?init=(\\d+)x(\\d+)",
                          setOf(RegexOption.DOT_MATCHES_ALL),
                      ).findAll(windowDisplays)
                          .mapNotNull { match ->
                              val id =
                                  match.groupValues[1]
                                      .toIntOrNull()
                                      ?: return@mapNotNull null

                              val width =
                                  match.groupValues[2]
                                      .toIntOrNull()
                                      ?: return@mapNotNull null

                              val height =
                                  match.groupValues[3]
                                      .toIntOrNull()
                                      ?: return@mapNotNull null

                              if (
                                  id == Display.DEFAULT_DISPLAY ||
                                  width != 1080 ||
                                  height != 2520
                              ) {
                                  return@mapNotNull null
                              }

                              id
                          }
                          .toList()

                  val binderValidated =
                      candidates.firstOrNull { id ->
                          currentCoverLogicalId(id) == id
                      }

                  if (binderValidated != null) {
                      return binderValidated
                  }

                  // Samsung can hide an inactive route from getDisplayInfo while
                  // still advertising it in fresh window topology.
                  return candidates.firstOrNull()
                      ?: -1
              }

              private fun physicalDisplayIdFromLogical(
                  logicalDisplayId: Int,
              ): Long {
                  val info =
                      displayInfoForLogicalId(logicalDisplayId)
                          ?: return -1L

                  val width =
                      runCatching {
                          info.javaClass
                              .getField("logicalWidth")
                              .getInt(info)
                      }.getOrDefault(-1)

                  val height =
                      runCatching {
                          info.javaClass
                              .getField("logicalHeight")
                              .getInt(info)
                      }.getOrDefault(-1)

                  if (width != 1080 || height != 2520) return -1L

                  val address =
                      runCatching {
                          info.javaClass
                              .getField("address")
                              .get(info)
                      }.getOrNull()
                          ?: return -1L

                  return runCatching {
                      address.javaClass
                          .getMethod("getPhysicalDisplayId")
                          .invoke(address) as Long
                  }.getOrElse { -1L }
              }

              private fun resolveFold7CoverPhysicalDisplayId(
                  targetHint: Int = -1,
              ): Long {
                  if (cachedCoverPhysicalDisplayId >= 0L) {
                      return cachedCoverPhysicalDisplayId
                  }

                  val fromAddress =
                      physicalDisplayIdFromLogical(targetHint)

                  if (fromAddress >= 0L) {
                      cachedCoverPhysicalDisplayId = fromAddress
                      return fromAddress
                  }

                  val displayDump =
                      runProbe(
                          "dumpsys display | " +
                              "grep -E -i 'DisplayDeviceInfo|mPhysicalDisplayId=' | " +
                              "head -n 320"
                      )

                  val forward =
                      Regex(
                          """DisplayDeviceInfo\\{[^\\n]*uniqueId=\"local:(\\d+)\"[^\\n]*1080 x 2520"""
                      ).find(displayDump)
                          ?.groupValues?.getOrNull(1)?.toLongOrNull()

                  val reverse =
                      Regex(
                          """DisplayDeviceInfo\\{[^\\n]*1080 x 2520[^\\n]*uniqueId=\"local:(\\d+)\""""
                      ).find(displayDump)
                          ?.groupValues?.getOrNull(1)?.toLongOrNull()

                  val physicalId = forward ?: reverse ?: -1L

                  if (physicalId >= 0L) {
                      cachedCoverPhysicalDisplayId = physicalId
                  }

                  return physicalId
              }

              private fun resolveCoverDisplay(): Bundle {
                  val targetId =
                      resolveInactiveCoverLogicalId(-1)

                  val physicalId =
                      resolveFold7CoverPhysicalDisplayId(targetId)

                  return Bundle().apply {
                      putBoolean("ok", targetId >= 0 || physicalId >= 0L)
                      putLong("physicalDisplayId", physicalId)
                      putInt("targetDisplayId", targetId)
                      putInt("targetWidth", 1080)
                      putInt("targetHeight", 2520)
                      if (targetId < 0 && physicalId < 0L) {
                          putString("error", "The Fold7 cover route was not found.")
                      }
                  }
              }

              private fun setCoverPhysicalPowerNormal(): Pair<Boolean, String?> {
                  val physicalId = cachedCoverPhysicalDisplayId

                  if (physicalId < 0L) {
                      return false to "cover physical display id unavailable"
                  }

                  return runCatching {
                      org.lsposed.hiddenapibypass.HiddenApiBypass
                          .addHiddenApiExemptions(
                              "Landroid/view/SurfaceControl;"
                          )

                      val token =
                          SurfaceControl::class.java
                              .getDeclaredMethod(
                                  "getPhysicalDisplayToken",
                                  java.lang.Long.TYPE,
                              )
                              .invoke(null, physicalId) as? IBinder
                              ?: throw IllegalStateException(
                                  "no SurfaceControl token for physical display $physicalId"
                              )

                      SurfaceControl::class.java
                          .getDeclaredMethod(
                              "setDisplayPowerMode",
                              IBinder::class.java,
                              Integer.TYPE,
                          )
                          .invoke(null, token, 2)

                      true to null
                  }.getOrElse { error ->
                      false to "${error.javaClass.simpleName}: ${error.message}"
                  }
              }

              private fun secondaryDisplayCommand(
                  enable: Boolean,
                  targetHint: Int,
              ): Bundle {
                  val t0 = SystemClock.elapsedRealtime()

                  if (!enable) {
                      val safeTarget = currentCoverLogicalId(targetHint)

                      if (safeTarget < 0) {
                          return Bundle().apply {
                              putBoolean("ok", true)
                              putBoolean("enable", false)
                              putInt("targetDisplayId", -1)
                              putInt("targetWidth", 1080)
                              putInt("targetHeight", 2520)
                              putBoolean("visibleAfter", false)
                              putString("command", "validated release skipped")
                              putString(
                                  "commandOutput",
                                  "hint no longer identifies secondary 1080x2520 cover",
                              )
                              putLong(
                                  "latencyMs",
                                  SystemClock.elapsedRealtime() - t0,
                              )
                          }
                      }

                      val command = "cmd display power-reset $safeTarget"
                      val output = runProbe(command)
                      val failed =
                          output.contains("Exception", ignoreCase = true) ||
                              output.contains("error", ignoreCase = true) ||
                              output.contains("not possible", ignoreCase = true)

                      return Bundle().apply {
                          putBoolean("ok", !failed)
                          putBoolean("enable", false)
                          putInt("targetDisplayId", safeTarget)
                          putInt("targetWidth", 1080)
                          putInt("targetHeight", 2520)
                          putBoolean("visibleAfter", false)
                          putString("command", command)
                          putString("commandOutput", output)
                          putLong(
                              "latencyMs",
                              SystemClock.elapsedRealtime() - t0,
                          )
                      }
                  }

                  val targetId =
                      resolveInactiveCoverLogicalId(targetHint)

                  if (
                      targetId < 0 ||
                      targetId == Display.DEFAULT_DISPLAY
                  ) {
                      return Bundle().apply {
                          putBoolean("ok", false)
                          putBoolean("enable", true)
                          putInt("targetDisplayId", -1)
                          putInt("targetWidth", 1080)
                          putInt("targetHeight", 2520)
                          putBoolean("visibleAfter", false)
                          putString(
                              "error",
                              "No fresh non-default 1080x2520 cover route was available.",
                          )
                          putString("command", "fresh-route-validation")
                          putString("commandOutput", "skipped")
                      }
                  }

                  resolveFold7CoverPhysicalDisplayId(targetId)

                  var routeEnabled = false
                  var routeError: String? = null

                  runCatching {
                      enableConnectedDisplayInternal(targetId)
                      routeEnabled = true
                  }.onFailure { error ->
                      routeError = "${error.javaClass.simpleName}: ${error.message}"
                  }

                  // Exactly one bounded logical power request. No cache and no
                  // watchdog can reuse this logical id after Samsung remaps it.
                  val logicalPowered =
                      runCatching {
                          requestDisplayPowerInternal(
                              targetId,
                              Display.STATE_ON,
                          )
                      }.getOrDefault(false)

                  val (
                      physicalPowered,
                      physicalPowerError,
                  ) = setCoverPhysicalPowerNormal()

                  return Bundle().apply {
                      putBoolean(
                          "ok",
                          routeEnabled || logicalPowered || physicalPowered,
                      )
                      putBoolean("enable", true)
                      putInt("targetDisplayId", targetId)
                      putLong("physicalDisplayId", cachedCoverPhysicalDisplayId)
                      putInt("targetWidth", 1080)
                      putInt("targetHeight", 2520)
                      putBoolean("visibleAfter", false)
                      putBoolean("routeEnabled", routeEnabled)
                      putBoolean("logicalPowered", logicalPowered)
                      putBoolean("physicalPowered", physicalPowered)
                      putString(
                          "command",
                          "fresh 1080x2520 route + one-shot enable/power",
                      )
                      putString(
                          "commandOutput",
                          listOfNotNull(
                              routeError,
                              physicalPowerError,
                          ).joinToString(" | ")
                              .ifEmpty { "bounded-prewarm-fast-path" },
                      )
                      putLong(
                          "latencyMs",
                          SystemClock.elapsedRealtime() - t0,
                      )
                  }
              }

          '''

          shell = (
              shell[:secondary_start]
              + safe_secondary
              + shell[secondary_end:]
          )
          write(shell_path, shell)

          # PanelEngine: preserve the smooth inner animation and latch the
          # fully-open endpoint so a flat snapshot layer cannot flash.
          panel_path = (
              "app/src/full/java/com/duoopen/overlay/PanelEngine.kt"
          )
          panel = read(panel_path)

          panel = replace_once(
              panel,
              "    private var liveLoop = false\n",
              "    private var liveLoop = false\n\n" +
                  "    private var innerOpenLatched = false\n",
              "inner open latch state",
          )

          panel = replace_once(
              panel,
              "        lastRawHingeAngle =\n" +
                  "            angle\n\n",
              "        lastRawHingeAngle =\n" +
                  "            angle\n\n" +
                  "        if (innerPanel) {\n" +
                  "            if (angle >= INNER_OPEN_LATCH_DEG) {\n" +
                  "                if (!innerOpenLatched) {\n" +
                  "                    com.duoopen.debug.DuoDiagnostics.event(\n" +
                  "                        \"inner-open\",\n" +
                  "                        \"latched angle=$angle; removing flat overlay without fade\",\n" +
                  "                    )\n" +
                  "                }\n\n" +
                  "                innerOpenLatched = true\n" +
                  "                restArmed = true\n" +
                  "                panelSwitched = false\n" +
                  "                if (phase != Phase.IDLE) removeOverlay()\n" +
                  "                return\n" +
                  "            }\n\n" +
                  "            if (innerOpenLatched) {\n" +
                  "                if (angle > INNER_OPEN_REARM_DEG) return\n" +
                  "                innerOpenLatched = false\n" +
                  "                restArmed = true\n" +
                  "                panelSwitched = false\n" +
                  "                com.duoopen.debug.DuoDiagnostics.event(\n" +
                  "                    \"inner-open\",\n" +
                  "                    \"rearmed angle=$angle after deliberate close\",\n" +
                  "                )\n" +
                  "            }\n" +
                  "        }\n\n",
              "inner open latch hinge guard",
          )

          panel = replace_once(
              panel,
              "        val angle = hinge.lastAngle\n" +
                  "        if (angle.isNaN()) return\n" +
                  "        val tilt = tiltFor(angle)\n",
              "        val angle = hinge.lastAngle\n" +
                  "        if (angle.isNaN()) return\n\n" +
                  "        if (innerPanel) {\n" +
                  "            if (angle >= INNER_OPEN_LATCH_DEG) {\n" +
                  "                innerOpenLatched = true\n" +
                  "                restArmed = true\n" +
                  "                panelSwitched = false\n" +
                  "                if (phase != Phase.IDLE) removeOverlay()\n" +
                  "                return\n" +
                  "            }\n\n" +
                  "            if (innerOpenLatched) {\n" +
                  "                if (angle > INNER_OPEN_REARM_DEG) return\n" +
                  "                innerOpenLatched = false\n" +
                  "                restArmed = true\n" +
                  "                panelSwitched = false\n" +
                  "            }\n" +
                  "        }\n\n" +
                  "        val tilt = tiltFor(angle)\n",
              "inner open latch evaluate guard",
          )

          panel = replace_once(
              panel,
              "        const val COVER_OPEN_IMMEDIATE_TILT = 0.15f\n",
              "        const val COVER_OPEN_IMMEDIATE_TILT = 0.15f\n" +
                  "        const val INNER_OPEN_LATCH_DEG = 172f\n" +
                  "        const val INNER_OPEN_REARM_DEG = 166f\n",
              "inner open latch thresholds",
          )

          write(panel_path, panel)
          print("1.3.22 Fold7 cover recovery + inner endpoint pass applied")
          PY22

          git diff --stat
          git diff --check

      - name: Validate Fold7 1.3.22 source
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="app/build.gradle.kts"
          SERVICE="app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt"
          SHELL="app/src/full/java/com/duoopen/shell/DuoShellService.kt"
          PANEL="app/src/full/java/com/duoopen/overlay/PanelEngine.kt"
          HOST="app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt"
          SHADER="app/src/main/java/com/duoopen/fold/DuoShader.kt"
          HINGE="app/src/main/java/com/duoopen/fold/HingeAngleSource.kt"
          ANGLE_FEED="app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt"
          BRIDGE="app/src/full/java/com/duoopen/shell/ShizukuBridge.kt"
          RUNTIME="app/src/full/java/com/duoopen/overlay/PersistentRuntimeService.kt"

          grep -F 'versionCode = 26' "$GRADLE"
          grep -F 'versionName = "1.3.22-zfold7-cover-recovery"' "$GRADLE"

          echo "Checking shell integrity..."
          grep -F 'package com.duoopen.shell' "$SHELL"

          if grep -Fq 'plugins {' "$SHELL"; then
            echo "ERROR: DuoShellService.kt contains Gradle build configuration."
            exit 1
          fi

          echo "Checking cover recovery..."
          grep -F 'closing-prewarm-request' "$SERVICE"
          grep -F 'prewarm-result' "$SERVICE"
          grep -F 'resolveInactiveCoverLogicalId' "$SHELL"
          grep -F 'requestDisplayPowerInternal' "$SHELL"
          grep -F 'fresh 1080x2520 route + one-shot enable/power' "$SHELL"
          grep -F 'bounded-prewarm-fast-path' "$SHELL"

          echo "Checking no remap-prone watchdog/cache returned..."

          if grep -Fq 'cachedCoverDisplayId' "$SHELL"; then
            echo "ERROR: logical cover-id cache returned."
            exit 1
          fi

          if grep -Fq 'ShizukuBridge.requestDisplayPower(' "$SERVICE"; then
            echo "ERROR: app-side logical display power request returned."
            exit 1
          fi

          grep -F 'validated release skipped' "$SHELL"
          grep -F 'cmd display power-reset $safeTarget' "$SHELL"

          echo "Checking inner endpoint latch..."
          grep -F 'innerOpenLatched' "$PANEL"
          grep -F 'INNER_OPEN_LATCH_DEG = 172f' "$PANEL"
          grep -F 'INNER_OPEN_REARM_DEG = 166f' "$PANEL"
          grep -F 'removing flat overlay without fade' "$PANEL"

          echo "Checking preserved 1.3.21 improvements..."
          grep -F 'COVER_CLOSE_PREWARM_DEG' "$SERVICE"
          grep -F '150.0f' "$SERVICE"
          grep -F 'COVER_CLOSE_VISUAL_START_DEG' "$SERVICE"
          grep -F '135.0f' "$SERVICE"
          grep -F 'canonicalPaneWidth' "$HOST"
          grep -F 'sourceLeft' "$HOST"
          grep -F 'COVER_VISUAL_MAX_HINGE = 135f' "$SHADER"
          grep -F 'coarseMidpointAfterContinuousEndpoint' "$HINGE"
          grep -F 'scheduleEndpointBridge' "$ANGLE_FEED"
          grep -F '.daemon(true)' "$BRIDGE"
          grep -F 'START_STICKY' "$RUNTIME"

          git diff --check

          echo "Fold7 1.3.22 source validation passed."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile and run unit tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

      - name: Prepare 1.3.22 field-test APK and generated source snapshot
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="fold7-build"
          SOURCE_DIR="$OUTPUT_DIR/generated-source"

          mkdir -p "$SOURCE_DIR"

          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          test -n "$APK" || {
            echo "ERROR: Full debug APK was not found."
            exit 1
          }

          OUTPUT_APK="$OUTPUT_DIR/DuoOpen-ZFold7-1.3.22-cover-recovery-debug.apk"

          cp \
            "$APK" \
            "$OUTPUT_APK"

          cp \
            app/src/full/java/com/duoopen/shell/DuoShellService.kt \
            "$SOURCE_DIR/DuoShellService.kt"

          cp \
            app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt \
            "$SOURCE_DIR/FoldOverlayService.kt"

          cp \
            app/src/full/java/com/duoopen/overlay/PanelEngine.kt \
            "$SOURCE_DIR/PanelEngine.kt"

          cp \
            app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt \
            "$SOURCE_DIR/DisplayMirrorHost.kt"

          sha256sum \
            "$OUTPUT_APK" \
            > "$OUTPUT_DIR/APK-SHA256-1.3.22.txt"

          {
            echo "version=1.3.22-zfold7-cover-recovery"
            echo "versionCode=26"
            echo "target=Samsung Galaxy Z Fold7"
            echo "innerGeometry=1968x2184"
            echo "coverGeometry=1080x2520"
            echo "pinned1321=e754d77dec07d61a4d01cf280e69c6ced3b48820"
            echo
            echo "1.3.22 changes:"
            echo "- exact successful 1.3.21 transform replayed from pinned commit"
            echo "- corrupted main DuoShellService.kt ignored"
            echo "- clean generated DuoShellService.kt included in artifact for repo repair"
            echo "- inactive 1080x2520 route resolved fresh for each cover prewarm"
            echo "- one bounded enable + logical power-on; no logical-id cache/watchdog"
            echo "- front visual remains scheduled near 135 degrees"
            echo "- inner fully-open latch at 172 degrees; rearm below 166 degrees"
            echo "- flat inner overlay removed immediately instead of whole-screen fade"
            echo "- aspect-locked 936x2184 -> 1080x2520 mirror preserved"
            echo

            sha256sum \
              "$OUTPUT_APK"
          } > "$OUTPUT_DIR/BUILD-INFO-1.3.22.txt"

          cat \
            "$OUTPUT_DIR/BUILD-INFO-1.3.22.txt"

