name: Build Materialized Fold7

on:
  workflow_dispatch:

  push:
    branches:
      - generated/fold7-1.3.16-baseline

permissions:
  contents: read

concurrency:
  group: build-materialized-fold7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout materialized source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show build identity
        shell: bash
        run: |
          set -euo pipefail

          echo "ref=${GITHUB_REF}"
          echo "sha=${GITHUB_SHA}"

          git log -1 \
            --oneline

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Validate materialized Fold7 source
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="app/build.gradle.kts"
          SERVICE="app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt"
          HOST="app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt"
          PANEL="app/src/full/java/com/duoopen/overlay/PanelEngine.kt"
          ANGLES="app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt"
          SHELL="app/src/full/java/com/duoopen/shell/DuoShellService.kt"
          BRIDGE="app/src/full/java/com/duoopen/shell/ShizukuBridge.kt"
          PROTOCOL="app/src/full/java/com/duoopen/shell/ShellProtocol.kt"

          test -f "$GRADLE"
          test -f "$SERVICE"
          test -f "$HOST"
          test -f "$PANEL"
          test -f "$ANGLES"
          test -f "$SHELL"
          test -f "$BRIDGE"
          test -f "$PROTOCOL"

          echo
          echo "Checking version..."
          grep -F \
            'versionCode = 22' \
            "$GRADLE"

          grep -F \
            'versionName = "1.3.18-zfold7-opening-sync"' \
            "$GRADLE"

          echo
          echo "Checking materialized continuity architecture..."

          grep -F \
            'physical-resolve reason=' \
            "$SERVICE"

          grep -F \
            'COVER_WAKE_TRAVEL_DEG' \
            "$SERVICE"

          grep -F \
            'REQUEST_DISPLAY_POWER = 10' \
            "$PROTOCOL"

          grep -F \
            'requestDisplayPowerInternal' \
            "$SHELL"

          grep -F \
            'fun requestDisplayPower(' \
            "$BRIDGE"

          grep -F \
            'DisplayMirrorHost' \
            "$SERVICE"

          grep -F \
            'setGeometry' \
            "$HOST"

          echo
          echo "Checking automatic geometry-continuity arm..."

          grep -F \
            'continuityAutoArmAttempted' \
            "$SERVICE"

          grep -F \
            'if (!continuityAutoArmAttempted)' \
            "$SERVICE"

          grep -F \
            'armGeometryContinuity()' \
            "$SERVICE"

          echo
          echo "Checking 1.3.18 opening-sync fixes..."

          grep -F \
            'host seeded hinge=' \
            "$SERVICE"

          grep -F \
            'private fun ensureAnchors()' \
            "$ANGLES"

          grep -F \
            'hiddenTrusted' \
            "$SHELL"

          grep -F \
            'hiddenAccepted' \
            "$SHELL"

          if grep -F 'cover-power:$reason' "$SERVICE"; then
            echo "ERROR: watchdog-driven mirror refresh is still present."
            exit 1
          fi

          echo
          echo "Checking source formatting..."

          git diff --check

          echo
          echo "Materialized Fold7 source validation passed."

      - name: Compile and run unit tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

      - name: Prepare field-test APK
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="fold7-build"
          mkdir -p "$OUTPUT_DIR"

          APK="$(
            find \
              app/build/outputs/apk/full/debug \
              -type f \
              -name '*.apk' \
              | head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: Full debug APK was not found."
            exit 1
          fi

          OUTPUT_APK="$OUTPUT_DIR/DuoOpen-ZFold7-1.3.18-opening-sync-debug.apk"

          cp \
            "$APK" \
            "$OUTPUT_APK"

          sha256sum \
            "$OUTPUT_APK" \
            > "$OUTPUT_DIR/APK-SHA256-1.3.18.txt"

          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "version=1.3.18-zfold7-opening-sync"
            echo "versionCode=22"
            echo
            echo "target=Samsung Galaxy Z Fold7"
            echo "innerGeometry=1968x2184"
            echo "coverGeometry=1080x2520"
            echo
            echo "source=materialized"
            echo "historicalReplay=false"
            echo "geometryContinuityAutoArm=true"
            echo "openingAngleMultiAnchor=true"
            echo "hiddenFoldInteractiveBootstrap=true"
            echo "watchdogMirrorRefresh=false"
            echo
            echo "Expected test behavior:"
            echo "- Accessibility service starts"
            echo "- Shizuku reaches Ready"
            echo "- geometry continuity arms automatically once"
            echo "- angle reader maintains Fold7 cover + inner wallpaper anchors when possible"
            echo "- hidden FoldInteractive responses may bootstrap continuous angles near closed"
            echo "- opening animation should begin much earlier if Samsung supplies those angles"
            echo "- cover-power watchdog no longer re-applies mirror geometry every 100 ms"
            echo "- left-pane mirror geometry remains unchanged"
            echo
            echo "APK:"
            sha256sum "$OUTPUT_APK"

          } > "$OUTPUT_DIR/BUILD-INFO-1.3.18.txt"

          echo
          cat "$OUTPUT_DIR/BUILD-INFO-1.3.18.txt"

      - name: Upload field-test APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-1.3.18-opening-sync
          path: |
            fold7-build/DuoOpen-ZFold7-1.3.18-opening-sync-debug.apk
            fold7-build/APK-SHA256-1.3.18.txt
            fold7-build/BUILD-INFO-1.3.18.txt
          if-no-files-found: error
          retention-days: 30
