name: Build Materialized Fold7 1.3.23 Explicit State Machine

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-materialized-fold7.yml"
      - "app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt"
      - "app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt"
      - "app/src/test/java/com/duoopen/overlay/Fold7ContinuityControllerTest.kt"
      - "tools/apply_fold7_1323.py"

permissions:
  contents: read

concurrency:
  group: build-materialized-fold7-1323-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout clean materialized baseline
        uses: actions/checkout@v4
        with:
          ref: generated/fold7-1.3.16-baseline
          fetch-depth: 0

      - name: Fetch pinned validated transforms and 1.3.23 source
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main:refs/remotes/origin/main

          git show \
            e754d77dec07d61a4d01cf280e69c6ced3b48820:app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt \
            > app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt

          git show \
            aea6952c729cd2ed498f7728308d30a3ff4bd82f:.github/workflows/build-materialized-fold7.yml \
            > /tmp/build-materialized-fold7-1.3.20.yml

          git show \
            e754d77dec07d61a4d01cf280e69c6ced3b48820:.github/workflows/build-materialized-fold7.yml \
            > /tmp/build-materialized-fold7-1.3.21.yml

          mkdir -p \
            app/src/full/java/com/duoopen/overlay \
            app/src/test/java/com/duoopen/overlay \
            tools

          git show \
            refs/remotes/origin/main:app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt \
            > app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt

          git show \
            refs/remotes/origin/main:app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt \
            > app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt

          git show \
            refs/remotes/origin/main:app/src/test/java/com/duoopen/overlay/Fold7ContinuityControllerTest.kt \
            > app/src/test/java/com/duoopen/overlay/Fold7ContinuityControllerTest.kt

          git show \
            refs/remotes/origin/main:tools/apply_fold7_1323.py \
            > tools/apply_fold7_1323.py

          python3 -m py_compile tools/apply_fold7_1323.py

          echo "materialized_base=$(git rev-parse HEAD)"
          echo "pinned_1321=e754d77dec07d61a4d01cf280e69c6ced3b48820"
          echo "integration_main=$(git rev-parse refs/remotes/origin/main)"

      - name: Reproduce validated 1.3.20 source
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PYBASE'
          from pathlib import Path
          import textwrap

          workflow = Path(
              "/tmp/build-materialized-fold7-1.3.20.yml"
          ).read_text(encoding="utf-8")

          marker = "- name: Apply 1.3.20 realtime architecture"
          step = workflow.find(marker)
          if step < 0:
              raise SystemExit("validated 1.3.20 transform step not found")

          token = "python3 - <<'PY'\n"
          start = workflow.find(token, step)
          if start < 0:
              raise SystemExit("1.3.20 Python transform not found")
          start += len(token)

          end = workflow.find("\n          PY", start)
          if end < 0:
              raise SystemExit("1.3.20 Python transform terminator not found")

          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, "fold7_1320_transform.py", "exec"), {})
          PYBASE

          grep -F 'versionCode = 24' app/build.gradle.kts
          grep -F 'versionName = "1.3.20-zfold7-realtime"' app/build.gradle.kts

      - name: Replay exact successful 1.3.21 transform
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY21'
          from pathlib import Path
          import textwrap

          workflow = Path(
              "/tmp/build-materialized-fold7-1.3.21.yml"
          ).read_text(encoding="utf-8")

          marker = "- name: Apply 1.3.21 intentional-motion and physical-panel safety"
          step = workflow.find(marker)
          if step < 0:
              raise SystemExit("validated 1.3.21 transform step not found")

          token = "python3 - <<'PY'\n"
          start = workflow.find(token, step)
          if start < 0:
              raise SystemExit("1.3.21 Python transform not found")
          start += len(token)

          end = workflow.find("\n          PY", start)
          if end < 0:
              raise SystemExit("1.3.21 Python transform terminator not found")

          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, "fold7_1321_transform.py", "exec"), {})
          PY21

          grep -F 'versionCode = 25' app/build.gradle.kts
          grep -F 'versionName = "1.3.21-zfold7-state-machine"' app/build.gradle.kts

      - name: Apply source-controlled 1.3.23 architecture
        shell: bash
        run: |
          set -euo pipefail

          python3 tools/apply_fold7_1323.py

          git diff --stat
          git diff --check

      - name: Validate Fold7 1.3.23 safety properties
        shell: bash
        run: |
          set -euo pipefail

          GRADLE="app/build.gradle.kts"
          SERVICE="app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt"
          CONTROLLER="app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt"
          COORDINATOR="app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt"
          TEST="app/src/test/java/com/duoopen/overlay/Fold7ContinuityControllerTest.kt"
          SHELL="app/src/full/java/com/duoopen/shell/DuoShellService.kt"
          BRIDGE="app/src/full/java/com/duoopen/shell/ShizukuBridge.kt"
          HOST="app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt"
          PANEL="app/src/full/java/com/duoopen/overlay/PanelEngine.kt"
          SHADER="app/src/main/java/com/duoopen/fold/DuoShader.kt"
          HINGE="app/src/main/java/com/duoopen/fold/HingeAngleSource.kt"
          ANGLE_FEED="app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt"
          RUNTIME="app/src/full/java/com/duoopen/overlay/PersistentRuntimeService.kt"

          for file in \
            "$GRADLE" "$SERVICE" "$CONTROLLER" "$COORDINATOR" "$TEST" \
            "$SHELL" "$BRIDGE" "$HOST" "$PANEL" "$SHADER" \
            "$HINGE" "$ANGLE_FEED" "$RUNTIME"
          do
            test -f "$file" || { echo "ERROR: missing $file"; exit 1; }
          done

          grep -F 'versionCode = 27' "$GRADLE"
          grep -F 'versionName = "1.3.23-zfold7-explicit-state-machine"' "$GRADLE"
          grep -F 'testImplementation("junit:junit:4.13.2")' "$GRADLE"

          echo "Checking explicit continuity states..."
          grep -F 'OPEN_INNER' "$CONTROLLER"
          grep -F 'CLOSING_INTENT' "$CONTROLLER"
          grep -F 'COVER_PREWARMING' "$CONTROLLER"
          grep -F 'COVER_READY_HIDDEN' "$CONTROLLER"
          grep -F 'COVER_VISUAL' "$CONTROLLER"
          grep -F 'NATIVE_COVER' "$CONTROLLER"
          grep -F 'OPENING_FROM_CLOSED' "$CONTROLLER"
          grep -F 'INNER_HANDOFF' "$CONTROLLER"

          echo "Checking prewarm/visibility separation..."
          grep -F 'BeginPrewarm' "$CONTROLLER"
          grep -F 'ShowMirror' "$CONTROLLER"
          grep -F 'prewarm-ready-hidden' "$CONTROLLER"
          grep -F 'continuity.onHinge(angle)' "$SERVICE"
          grep -F 'continuity.onTopologyChanged' "$SERVICE"

          HANDLE_CALLS="$(grep -c 'handleContinuityHinge(' "$SERVICE" || true)"
          if [ "$HANDLE_CALLS" -gt 1 ]; then
            echo "ERROR: legacy hinge controller still has an active caller."
            exit 1
          fi

          echo "Checking logical-id safety..."
          grep -F 'resolveFreshCoverLogicalId' "$SHELL"
          grep -F 'cachedCoverPhysicalDisplayId' "$SHELL"
          grep -F 'routeStillCover' "$SHELL"
          grep -F 'fresh-route one-shot Fold7 prewarm' "$SHELL"

          if grep -Fq 'cachedCoverDisplayId' "$SHELL"; then
            echo "ERROR: cached logical cover display id returned."
            exit 1
          fi

          if grep -Fq 'Thread.sleep(600L)' "$SHELL"; then
            echo "ERROR: old 600ms shell delay returned."
            exit 1
          fi

          if grep -Fq 'Thread.sleep(40L)' "$SHELL"; then
            echo "ERROR: old 40ms shell delay returned."
            exit 1
          fi

          echo "Checking Fold7 visual calibration..."
          grep -F 'FOLD7_COVER_CLOSED_VISUAL_HINGE = 0.5f' "$SHADER"
          grep -F 'COVER_VISUAL_MAX_HINGE = 135f' "$SHADER"
          grep -F 'INNER_OPEN_LATCH_DEG = 172f' "$PANEL"
          grep -F 'INNER_OPEN_REARM_DEG = 166f' "$PANEL"

          echo "Checking preserved successful architecture..."
          grep -F 'canonicalPaneWidth' "$HOST"
          grep -F 'sourceLeft' "$HOST"
          grep -F 'coarseMidpointAfterContinuousEndpoint' "$HINGE"
          grep -F 'scheduleEndpointBridge' "$ANGLE_FEED"
          grep -F '.daemon(true)' "$BRIDGE"
          grep -F 'START_STICKY' "$RUNTIME"

          git diff --check
          echo "Fold7 1.3.23 source validation passed."

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Compile and run tests
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew \
            testFullDebugUnitTest \
            assembleFullDebug \
            --stacktrace

      - name: Prepare 1.3.23 field-test APK and generated source
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT_DIR="fold7-build"
          SOURCE_DIR="$OUTPUT_DIR/generated-source"
          mkdir -p "$SOURCE_DIR"

          APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK" || { echo "ERROR: Full debug APK was not found."; exit 1; }

          OUTPUT_APK="$OUTPUT_DIR/DuoOpen-ZFold7-1.3.23-explicit-state-machine-debug.apk"
          cp "$APK" "$OUTPUT_APK"

          cp app/src/full/java/com/duoopen/overlay/Fold7ContinuityController.kt "$SOURCE_DIR/"
          cp app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt "$SOURCE_DIR/"
          cp app/src/full/java/com/duoopen/overlay/FoldOverlayService.kt "$SOURCE_DIR/"
          cp app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt "$SOURCE_DIR/"
          cp app/src/full/java/com/duoopen/overlay/PanelEngine.kt "$SOURCE_DIR/"
          cp app/src/full/java/com/duoopen/shell/DuoShellService.kt "$SOURCE_DIR/"
          cp app/src/full/java/com/duoopen/shell/ShizukuBridge.kt "$SOURCE_DIR/"
          cp app/src/full/java/com/duoopen/shell/ShellProtocol.kt "$SOURCE_DIR/"
          cp app/src/full/java/com/duoopen/shell/WallpaperAngleFeed.kt "$SOURCE_DIR/"
          cp app/src/main/java/com/duoopen/fold/HingeAngleSource.kt "$SOURCE_DIR/"
          cp app/src/main/java/com/duoopen/fold/DuoShader.kt "$SOURCE_DIR/"

          sha256sum "$OUTPUT_APK" > "$OUTPUT_DIR/APK-SHA256-1.3.23.txt"

          {
            echo "version=1.3.23-zfold7-explicit-state-machine"
            echo "versionCode=27"
            echo "target=Samsung Galaxy Z Fold7"
            echo "innerGeometry=1968x2184"
            echo "coverGeometry=1080x2520"
            echo "pinned1321=e754d77dec07d61a4d01cf280e69c6ced3b48820"
            echo
            echo "1.3.23 architecture:"
            echo "- explicit continuity state machine"
            echo "- deliberate-close intent detector"
            echo "- prewarm and mirror visibility separated"
            echo "- native closed->open path requires no shell wake"
            echo "- fresh logical route resolution per shell operation"
            echo "- stable physical cover identity cached separately"
            echo "- one-shot power only after immediate route revalidation"
            echo "- Fold7 cover visual origin at 0.5 degrees"
            echo "- visible cover mirror threshold at 135 degrees"
            echo "- fully-open inner latch at 172 degrees; rearm at 166"
            echo "- 3:7 hinge-side-preserving mirror projection preserved"
            echo "- stale async prewarm completion is released"
            echo "- mirror host construction is guarded by coordinator"
            echo
            sha256sum "$OUTPUT_APK"
          } > "$OUTPUT_DIR/BUILD-INFO-1.3.23.txt"

          cat "$OUTPUT_DIR/BUILD-INFO-1.3.23.txt"

      - name: Upload 1.3.23 field-test APK and generated source
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-1.3.23-explicit-state-machine
          path: |
            fold7-build/DuoOpen-ZFold7-1.3.23-explicit-state-machine-debug.apk
            fold7-build/APK-SHA256-1.3.23.txt
            fold7-build/BUILD-INFO-1.3.23.txt
            fold7-build/generated-source/*
          if-no-files-found: error
          retention-days: 30
