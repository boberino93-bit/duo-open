name: Validate Gen12.4 Angle Authority Model

on:
  workflow_dispatch:
  push:
    branches:
      - build/gen12-4-angle-authority-20261008
    paths:
      - ".github/workflows/build-gen12-4-angle-authority-model.yml"
      - "tools/apply_gen12_4_angle_authority_model.py"
      - "tools/apply_gen12_4_angle_authority_model_fix1.py"
      - "tools/gen12_4_angle_authority_design.md"

permissions:
  contents: read

concurrency:
  group: validate-gen12-4-angle-authority-model
  cancel-in-progress: true

jobs:
  model-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: build/gen12-4-angle-authority-20261008
          fetch-depth: 0

      - name: Reconstruct exact Gen12.3 runtime baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 service_packs/gen7_shizuku_onboarding_v1/apply_service_pack_v1.py .
          python3 tools/apply_gen7_runtime_regression_beta2.py --repo .
          python3 tools/apply_gen8_anchored_transition.py --repo .
          python3 tools/apply_gen9_predictive_inner_wake.py --repo .
          python3 tools/apply_gen9_guarded_prewake.py --repo .
          python3 tools/apply_gen10_live_mirror_close.py --repo .
          python3 tools/apply_gen10_1_handoff_guard.py --repo .
          python3 tools/apply_gen10_2_secure_fail_open.py --repo .
          python3 tools/apply_gen10_3_hybrid_animation.py --repo .
          python3 tools/apply_gen10_4_io_coalescing.py --repo .
          python3 tools/apply_gen10_5_mirror_warmup_retention.py --repo .
          python3 tools/apply_gen10_6_oneui9_android17_compat.py --repo .
          python3 tools/apply_gen10_6_api37_private_api_lint_contract.py --repo .
          python3 tools/apply_gen10_7_oneui9_display_angle.py --repo .
          python3 tools/apply_gen11_product_ui.py --repo .
          python3 tools/apply_gen12_route_lane_resilience.py --repo .
          python3 tools/apply_gen12_1_wallpaper_lifecycle.py --repo .
          python3 tools/apply_gen12_1_wallpaper_metadata_receipt.py --repo .
          python3 tools/apply_gen12_1_wallpaper_ui_io.py --repo .
          python3 tools/apply_gen12_1_ui_smoke_scroll.py --repo .
          python3 tools/apply_gen12_2_route_retention_fence.py --repo .
          python3 tools/apply_gen12_3_angle_feed_resilience_fix1.py --repo .
          grep -F 'versionCode = 59' app/build.gradle.kts
          grep -F 'versionName = "5.6.3-gen12-3-angle-feed-resilience-zfold7"' app/build.gradle.kts
          test ! -e app/src/full/java/com/duoopen/shell/Fold7AngleTargetArbiter.kt
          test ! -e app/src/test/java/com/duoopen/shell/Fold7AngleTargetArbiterTest.kt
          find app -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/gen12-3-app.sha256

      - name: Apply Gen12.4 authority model
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen12_4_angle_authority_model_fix1.py --repo .
          git diff --check
          grep -F 'GEN12_4_ANGLE_AUTHORITY' app/src/full/java/com/duoopen/shell/Fold7AngleTargetArbiter.kt
          grep -F 'readerRestartRequiresRepeatedAllTargetFailure' app/src/test/java/com/duoopen/shell/Fold7AngleTargetArbiterTest.kt
          grep -F 'noCandidateDoesNotManufactureReaderFailure' app/src/test/java/com/duoopen/shell/Fold7AngleTargetArbiterTest.kt
          grep -F 'summaryAlwaysIncludesAllAuthorityFields' app/src/test/java/com/duoopen/shell/Fold7AngleTargetArbiterTest.kt

      - name: Enforce model-only delta
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/gen12-3-app.sha256
          test -s app/src/full/java/com/duoopen/shell/Fold7AngleTargetArbiter.kt
          test -s app/src/test/java/com/duoopen/shell/Fold7AngleTargetArbiterTest.kt
          diff -u /dev/null app/src/full/java/com/duoopen/shell/Fold7AngleTargetArbiter.kt > gen12-4-model.diff || true
          diff -u /dev/null app/src/test/java/com/duoopen/shell/Fold7AngleTargetArbiterTest.kt >> gen12-4-model.diff || true
          test -s gen12-4-model.diff
          grep -F 'versionCode = 59' app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Ensure Android 17 SDK is installed
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0"
          test -d "$ANDROID_HOME/platforms/android-37.0"

      - name: Run unit tests lint and assemble
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest lintFullDebug assembleFullDebug --stacktrace

      - name: Package model validation evidence
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p gen12-4-model-validation
          cp gen12-4-model.diff gen12-4-model-validation/MODEL-DELTA.diff 2>/dev/null || true
          cp tools/gen12_4_angle_authority_design.md gen12-4-model-validation/DESIGN.md 2>/dev/null || true
          cp app/src/full/java/com/duoopen/shell/Fold7AngleTargetArbiter.kt gen12-4-model-validation/Fold7AngleTargetArbiter.kt 2>/dev/null || true
          cp app/src/test/java/com/duoopen/shell/Fold7AngleTargetArbiterTest.kt gen12-4-model-validation/Fold7AngleTargetArbiterTest.kt 2>/dev/null || true

      - name: Upload model validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-Gen12.4-angle-authority-model-validation
          path: gen12-4-model-validation/
          if-no-files-found: warn
          retention-days: 14
