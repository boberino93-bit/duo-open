name: Build Gen10.3 Hybrid Animation Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - build/gen10-3-hybrid-animation-20261007
    paths:
      - ".github/workflows/build-gen10-3-hybrid-animation-candidate.yml"
      - "tools/apply_gen10_3_hybrid_animation.py"

permissions:
  contents: read

concurrency:
  group: build-gen10-3-hybrid-animation-candidate
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout isolated Gen10.3 candidate branch
        uses: actions/checkout@v4
        with:
          ref: build/gen10-3-hybrid-animation-20261007
          fetch-depth: 0

      - name: Verify baseline and candidate tools
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'versionCode = 42' app/build.gradle.kts
          grep -F 'versionName = "5.0.0-beta1-zfold7"' app/build.gradle.kts
          test -f tools/apply_gen8_anchored_transition.py
          test -f tools/apply_gen9_predictive_inner_wake.py
          test -f tools/apply_gen9_guarded_prewake.py
          test -f tools/apply_gen10_live_mirror_close.py
          test -f tools/apply_gen10_1_handoff_guard.py
          test -f tools/apply_gen10_2_secure_fail_open.py
          test -f tools/apply_gen10_3_hybrid_animation.py
          grep -F 'GEN7_RUNTIME_REGRESSION_BETA2' tools/apply_gen7_runtime_regression_beta2.py

      - name: Reapply validated Shizuku onboarding predecessor
        shell: bash
        run: |
          set -euo pipefail
          python3 service_packs/gen7_shizuku_onboarding_v1/apply_service_pack_v1.py .

      - name: Reapply validated Gen7 Beta2 runtime service pack
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen7_runtime_regression_beta2.py --repo .
          grep -F 'versionCode = 43' app/build.gradle.kts

      - name: Reapply validated Gen8 anchored transition
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen8_anchored_transition.py --repo .
          grep -F 'versionCode = 44' app/build.gradle.kts

      - name: Reapply validated Gen9 responsiveness overhaul
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen9_predictive_inner_wake.py --repo .
          grep -F 'versionCode = 45' app/build.gradle.kts

      - name: Reapply validated Gen9.1 guarded prewake
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen9_guarded_prewake.py --repo .
          grep -F 'versionCode = 46' app/build.gradle.kts

      - name: Apply validated Gen10 live-mirror closing path
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen10_live_mirror_close.py --repo .
          grep -F 'versionCode = 47' app/build.gradle.kts
          grep -F 'GEN10_LIVE_MIRROR_DELEGATED' app/src/full/java/com/duoopen/overlay/Fold7Gen3VisualCoordinator.kt

      - name: Apply validated Gen10.1 terminal-handoff guards
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen10_1_handoff_guard.py --repo .
          grep -F 'versionCode = 48' app/build.gradle.kts
          grep -F 'GEN10_1_HANDOFF_GUARD' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt

      - name: Apply validated Gen10.2 protected-content fail-open guards
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen10_2_secure_fail_open.py --repo .
          grep -F 'versionCode = 49' app/build.gradle.kts
          grep -F 'capture-protected-or-black' app/src/full/java/com/duoopen/overlay/PanelEngine.kt
          grep -F 'Protected/uncapturable content: native display passthrough.' app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt

      - name: Apply Gen10.3 hybrid close animation and hinge tracking
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_gen10_3_hybrid_animation.py --repo .
          git diff --check
          grep -F 'versionCode = 50' app/build.gradle.kts
          grep -F 'versionName = "5.4.3-gen10-hybrid-animation-zfold7"' app/build.gradle.kts
          grep -F 'GEN10_3_HYBRID_ANIMATION' app/src/full/java/com/duoopen/overlay/Fold7Gen3VisualCoordinator.kt
          grep -F 'gen10-3-hybrid-animation' app/src/full/java/com/duoopen/overlay/Fold7Gen3VisualCoordinator.kt
          grep -F 'mirrorHost?.onHinge(angle)' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          grep -F 'stable geometry refresh suppressed' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          grep -F 'CLOSING_TAU_S' app/src/full/java/com/duoopen/overlay/Fold7CoverVisualHost.kt
          grep -F 'capture-protected-or-black' app/src/full/java/com/duoopen/overlay/PanelEngine.kt
          grep -F 'Protected/uncapturable content: native display passthrough.' app/src/full/java/com/duoopen/overlay/DisplayMirrorHost.kt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test and build full debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

      - name: Package failure diagnostics
        if: failure()
        shell: bash
        run: |
          set -u
          mkdir -p gen10-3-hybrid-animation-failure
          git diff -- app > gen10-3-hybrid-animation-failure/APPLIED-SOURCE.diff || true
          {
            echo "candidateBranch=build/gen10-3-hybrid-animation-20261007"
            echo "candidateHead=$(git rev-parse HEAD)"
            echo "status=CI_FAILED_BEFORE_TESTED_ARTIFACT"
            echo "sourceFieldLog=duoopen-debug-1791397398207.zip"
            echo "physicalFold7Validation=NOT_RUN"
          } > gen10-3-hybrid-animation-failure/FAILURE-INFO.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-5.4.3-gen10-hybrid-animation-failure-diagnostics
          path: gen10-3-hybrid-animation-failure/
          if-no-files-found: warn
          retention-days: 14

      - name: Package tested Gen10.3 artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gen10-3-hybrid-animation-build
          APK="$(find app/build/outputs/apk/full/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          OUTPUT="gen10-3-hybrid-animation-build/DuoOpen-ZFold7-5.4.3-gen10-hybrid-animation-debug.apk"
          cp "$APK" "$OUTPUT"
          sha256sum "$OUTPUT" > gen10-3-hybrid-animation-build/APK-SHA256.txt
          git diff -- app > gen10-3-hybrid-animation-build/APPLIED-SOURCE.diff
          {
            echo "version=5.4.3-gen10-hybrid-animation-zfold7"
            echo "versionCode=50"
            echo "candidateBranch=build/gen10-3-hybrid-animation-20261007"
            echo "candidateHead=$(git rev-parse HEAD)"
            echo "baseLineage=Gen7 onboarding -> Gen7 Beta2 -> Gen8 anchor -> Gen9 responsiveness -> Gen9.1 guarded prewake -> Gen10 live mirror -> Gen10.1 handoff guard -> Gen10.2 secure fail-open -> Gen10.3 hybrid animation"
            echo "sourceFieldLog=duoopen-debug-1791397398207.zip"
            echo "confirmedFinding1=Gen10 removed the closing Gen3 shader by construction"
            echo "confirmedFinding2=live mirror hinge state was seeded once and then froze while physical hinge continued"
            echo "change1=restore exact-cycle closing shader only when a valid current-cycle capturable frame exists"
            echo "change2=retain Gen10 live mirror beneath animated close and preserve Gen10.2 native secure fail-open"
            echo "change3=forward every authoritative hinge sample to the live mirror host"
            echo "change4=suppress redundant stable topology geometry transactions"
            echo "change5=reduce closing shader follower tau from 22ms to 20ms without forcing display mode"
            echo "secureFlagBypass=NO"
            echo "forcedRefreshModeChange=NO"
            echo "physicalFold7Validation=NOT_RUN"
            echo "tests=testFullDebugUnitTest"
            echo "build=assembleFullDebug"
          } > gen10-3-hybrid-animation-build/BUILD-INFO.txt

      - name: Upload tested APK and evidence
        uses: actions/upload-artifact@v4
        with:
          name: DuoOpen-ZFold7-5.4.3-gen10-hybrid-animation
          path: |
            gen10-3-hybrid-animation-build/DuoOpen-ZFold7-5.4.3-gen10-hybrid-animation-debug.apk
            gen10-3-hybrid-animation-build/APK-SHA256.txt
            gen10-3-hybrid-animation-build/BUILD-INFO.txt
            gen10-3-hybrid-animation-build/APPLIED-SOURCE.diff
          if-no-files-found: error
          retention-days: 30
