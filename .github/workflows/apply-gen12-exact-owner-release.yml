name: Apply Gen12 Exact Owner Release Fence

on:
  push:
    branches:
      - build/gen12-route-lane-resilience-20261008
    paths:
      - ".github/workflows/apply-gen12-exact-owner-release.yml"
      - "tools/apply_gen12_exact_owner_release.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-gen12-exact-owner-release
  cancel-in-progress: false

jobs:
  apply-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gen12 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic owner fence
        run: python3 tools/apply_gen12_exact_owner_release.py

      - name: Validate exact-owner diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'beginReleaseOwned(' app/src/full/java/com/duoopen/shell/DuoShellService.kt
          grep -F 'transitionGeneration = transitionGeneration' app/src/full/java/com/duoopen/shell/ShizukuBridge.kt
          grep -F 'return stale-before-rpc' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          grep -F 'closeCycleId = expectedOwner.closeCycleId' app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run unit tests and assemble debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testFullDebugUnitTest assembleFullDebug --stacktrace

      - name: Commit tested owner fence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/full/java/com/duoopen/shell/ShizukuBridge.kt \
            app/src/full/java/com/duoopen/shell/DuoShellService.kt \
            app/src/full/java/com/duoopen/overlay/Fold7ContinuityCoordinator.kt
          git diff --cached --quiet && { echo 'No generated changes to commit.'; exit 0; }
          git commit -m "fix: fence Gen4 return by exact route owner"
          git push origin HEAD:build/gen12-route-lane-resilience-20261008
